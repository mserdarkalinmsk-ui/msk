.funnel-list small { display: block; color: var(--risk); font-size: 12px; margin-top: 2px; }
@media (max-width: 760px) { .funnel-list li { grid-template-columns: minmax(0, 1fr); gap: 6px; } .funnel-bar { width: 100%; min-width: 0; } .ruler-zone em { font-size: 10px; } .ruler-marks small { display: none; } }
.rt-grid { grid-template-columns: repeat(var(--n), minmax(72px, 1fr)); min-width: calc(var(--n) * 72px); }
.rt-node span { font-size: 11.5px; }
.stage-card .card-body { animation: stageIn .25s ease; }
@keyframes stageIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .stage-card .card-body { animation: none; } }
.build { float: right; opacity: .7; }
@media (min-width: 900px) { .rt-scroll { overflow-x: hidden; } .rt-grid { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); min-width: 0; } }

/* ---------- guided reader ---------- */
.rd { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 18px; align-items: start; }
.rd-side { position: sticky; top: calc(var(--top) + 12px); }
.rd-prog { padding: 4px 4px 12px; font-size: 12.5px; color: var(--muted); }
.rd-prog b { color: var(--navy); }
.rd-prog i { display: block; height: 6px; margin-top: 6px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.rd-prog u { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .35s ease; }
.rd-nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: relative; }
.rd-nav::before { content: ""; position: absolute; left: 21px; top: 18px; bottom: 18px; width: 2px; background: var(--line); }
.rd-nav button { position: relative; width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: 12px; background: none; color: var(--ink-2); font: 500 13.5px/1.3 var(--font); text-align: left; cursor: pointer; transition: background .15s, border-color .15s; }
.rd-nav button:hover { background: var(--panel); border-color: var(--line); }
.rd-nav em { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 11.5px var(--font); font-style: normal; background: var(--panel); border: 2px solid var(--line-2); color: var(--muted); }
.rd-nav button.read em { background: var(--good); border-color: var(--good); color: #fff; }
.rd-nav button[aria-selected="true"] { background: var(--panel); border-color: var(--accent-line); color: var(--navy); font-weight: 600; box-shadow: var(--shadow); }
.rd-nav button[aria-selected="true"] em { border-color: var(--accent); background: var(--accent); color: #fff; }
.rd-panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px 16px; box-shadow: var(--shadow); animation: stageIn .22s ease; }
.rd-panel header small { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.rd-panel h3 { margin: 2px 0 12px; font-size: 19px; color: var(--navy); }
.rd-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rd-lines li { display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; }
.rd-lines p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
.rd-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; margin: 9px 7px 0; background: var(--line-2); }
.rd-kind { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 2px; }
.rd-lines li.rule { background: color-mix(in srgb, var(--risk) 6%, transparent); }
.rd-lines li.rule .rd-kind { background: var(--risk); color: #fff; }
.rd-lines li.tip { background: color-mix(in srgb, var(--c3) 7%, transparent); }
.rd-lines li.tip .rd-kind { background: var(--c3); color: #fff; }
.rd-panel footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
@media (max-width: 860px) { .rd { grid-template-columns: minmax(0, 1fr); } .rd-side { position: static; } .rd-nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; } .rd-nav::before { display: none; } }

/* ---------- performance: own layers for the fixed backdrop, skip off-screen work ---------- */
body::before, body::after { transform: translateZ(0); backface-visibility: hidden; }
.foot, .mq, .pj-bottom, .next-step, .tabpanel:not(:first-child) { content-visibility: auto; contain-intrinsic-size: auto 300px; }
.rd-text p { margin: 0; font-size: 15px; line-height: 1.85; color: var(--ink); max-width: 78ch; }
.rd-text mark { padding: 2px 6px 2px 4px; border-radius: 6px; color: inherit; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.rd-text mark i { display: inline-grid; place-items: center; width: 17px; height: 17px; margin-right: 6px; border-radius: 5px; font: 700 10.5px/1 var(--font); font-style: normal; color: #fff; vertical-align: 1px; }
.rd-text .rd-rule { background: color-mix(in srgb, var(--risk) 9%, transparent); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--risk) 35%, transparent); }
.rd-text .rd-rule i { background: var(--risk); }
.rd-text .rd-tip { background: color-mix(in srgb, var(--c3) 11%, transparent); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--c3) 40%, transparent); }
.rd-text .rd-tip i { background: var(--c3); }
.rd-legend { display: flex; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--muted); }
/* In-place updates must not look like a page load. */
html.quiet *, html.quiet *::before, html.quiet *::after { animation: none !important; transition: none !important; }
.content > div.still, .still .tabpanel, .still .stage-card .card-body, .still .rd-panel, .still .decision-hero h2, .still .donut .arc { animation: none !important; }
/* Page changes: a short, subtle fade only (no slide, no long blank moment). */
@keyframes quickIn { from { opacity: .35; } to { opacity: 1; } }
.content > div { animation: quickIn .16s ease-out both; }
.tabpanel, .rd-panel, .stage-card .card-body { animation: quickIn .14s ease-out both; }
.page-head.compact { padding-bottom: 0; margin-bottom: 14px; align-items: center; }

/* ---------- procurement hub ---------- */

.hub-path { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 22px; border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 8%, var(--panel)), var(--panel) 60%); border: 1px solid color-mix(in srgb, var(--c) 25%, var(--line)); color: inherit; text-decoration: none; transition: transform .2s, box-shadow .2s; }

.hub-n { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 700; font-size: 17px; box-shadow: 0 8px 18px -8px var(--c); }

.hub-meta { font-size: 12.5px; color: var(--muted); }

.hub-strip { margin-top: 18px; padding: 18px 22px 8px; }
.hub-strip b { display: block; color: var(--navy); font-size: 16px; }
/* ---------- essentials ---------- */
.ess-top { display: flex; align-items: center; gap: 18px; padding: 16px 20px; margin-bottom: 16px; }
.ess-top > div:nth-child(2) { flex: 1; } .ess-top p { margin: 2px 0 0; }
.ess-ring { --p: 0; flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--sunken) 0); }
.ess-ring span { width: 50px; height: 50px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 12px; color: var(--muted); }
.ess-ring b { font-size: 17px; color: var(--navy); }
.ess-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.ess { display: flex; flex-direction: column; padding: 18px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); transition: box-shadow .2s, transform .2s; }
.ess:hover { box-shadow: 0 14px 30px -20px var(--c); transform: translateY(-2px); }
.ess header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ess-cat { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.ess-fig { font-size: 13px; font-weight: 700; color: var(--navy); background: color-mix(in srgb, var(--c) 12%, var(--panel)); padding: 3px 9px; border-radius: 8px; white-space: nowrap; }
.ess h3 { margin: 10px 0 6px; font-size: 17px; color: var(--navy); }
.ess p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink-2); flex: 1; }
.ess footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.ess footer a { font-size: 12.5px; color: var(--c); text-decoration: none; font-weight: 600; }
.ess-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font: 600 12.5px var(--font); color: var(--ink-2); cursor: pointer; }
.ess-btn:hover { border-color: var(--good); color: var(--good); }
.ess.known { background: color-mix(in srgb, var(--good) 5%, var(--panel)); }
.ess.known .ess-btn { background: var(--good); border-color: var(--good); color: #fff; }
/* ---------- my case ---------- */
.case-layout { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
.case-form { position: sticky; top: calc(var(--top) + 12px); }
.case-out { gap: 16px; }
.case-hero { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; padding: 22px 24px; border-radius: 18px; color: #fff; background: linear-gradient(120deg, var(--navy), color-mix(in srgb, var(--navy) 55%, var(--c))); box-shadow: 0 18px 40px -24px var(--navy); }
.case-hero small { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }

.case-kpis span { font-size: 11.5px; opacity: .8; }
.case-kpis .bad { background: color-mix(in srgb, var(--risk) 55%, transparent); }
.chain { list-style: none; margin: 0; padding: 16px 20px; display: grid; gap: 0; }
.chain li { position: relative; display: flex; gap: 14px; padding-bottom: 16px; }
.chain li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
.chain li > span { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 700; font-size: 13px; }
.chain b { font-size: 14.5px; color: var(--navy); } .chain p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
.lg { display: inline-block; padding: 0 6px; border-radius: 5px; font-weight: 600; font-size: 11px; }
.lg.src, .g-track i.src { background: var(--c1); color: #fff; }

.g-track { position: relative; height: 22px; border-radius: 6px; background: var(--panel-2); }
.g-track i { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; }
.g-track i.assumed { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--c1) 35%, var(--panel)) 0 6px, color-mix(in srgb, var(--c1) 22%, var(--panel)) 6px 12px); }
.radar { padding: 14px 20px 18px; display: grid; gap: 8px; }
.rk { padding: 10px 14px; border-radius: 12px; border-left: 4px solid var(--info); background: var(--info-soft); }
.rk.warn { border-color: var(--warn); background: var(--warn-soft); } .rk.risk { border-color: var(--risk); background: var(--risk-soft); }
.rk b { font-size: 14px; } .rk p { margin: 2px 0 0; font-size: 13.5px; color: var(--ink-2); }
.case-stages { padding: 14px 20px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.cs { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); text-decoration: none; color: var(--ink); font-size: 13px; }
.cs em { font-style: normal; font-weight: 700; color: var(--muted); font-size: 12px; } .cs small { grid-column: 2; font-size: 11px; color: var(--muted); }
.cs.key { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 7%, var(--panel)); } .cs.key small { color: var(--c1); font-weight: 600; }
.cs.skip { opacity: .5; border-style: dashed; }
.case-empty { border-style: dashed; }
/* case bar on stage pages + case-aware track */
.case-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; margin-bottom: 12px; border-radius: 14px; background: var(--navy); color: #fff; text-decoration: none; }
.case-bar small { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; font-weight: 600; }
.case-bar b { font-size: 14px; } .case-bar > span:nth-child(2) { flex: 1; min-width: 0; }
.case-bar-note { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.14); white-space: nowrap; }
.case-bar u { text-decoration: none; font-weight: 600; font-size: 13px; }
.case-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c2); box-shadow: 0 0 0 4px rgba(255,255,255,.15); flex: none; }
.case-bar.empty { background: var(--panel); color: var(--ink); border: 1px dashed var(--accent-line); } .case-bar.empty small { color: var(--accent); opacity: 1; } .case-bar.empty u { color: var(--accent); }
.rt-node.skip em { border-style: dashed; opacity: .45; } .rt-node.skip span { opacity: .45; text-decoration: line-through; text-decoration-color: var(--line-2); }
.rt-node.key:not(.on) em::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--c3); border: 2px solid var(--panel); }
@media (max-width: 980px) { .hub-paths, .case-layout { grid-template-columns: minmax(0, 1fr); } .case-form { position: static; } .g-row { grid-template-columns: minmax(0, 1fr); gap: 4px; } .case-bar-note { display: none; } }
@media print { .case-form, .case-bar, .top, .crumbs, .foot, .mq, .next-step { display: none !important; } .case-layout { display: block; } .case-hero { color: #000; background: none; border: 1px solid #999; } .case-hero h2 { color: #000; } }
.case-layout > .card, .case-out > :first-child { margin-top: 0; }
.next-act { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 16px; background: color-mix(in srgb, var(--c2) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c2) 30%, var(--line)); }
.next-act > span { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--c2); color: #fff; font-weight: 700; }
.next-act > div { flex: 1; } .next-act small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c2); }
.next-act b { display: block; font-size: 16px; color: var(--navy); margin-top: 2px; } .next-act p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); line-height: 1.55; }
.next-act em { flex: none; font-style: normal; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.next-act em.on { background: var(--c1); border-color: var(--c1); color: #fff; }
@media (max-width: 700px) { .next-act { flex-wrap: wrap; } }
.card.case-form { position: sticky; } @media (max-width: 980px) { .card.case-form { position: static; } }
/* Focused reader panel: one lead idea, calm body, obligations gathered in one box. */
.rd-text { display: grid; gap: 14px; }
.rd-text p { margin: 0; font-size: 15px; line-height: 1.75; color: var(--ink-2); max-width: 72ch; }
.rd-text .rd-lead { font-size: 18px; line-height: 1.55; color: var(--navy); font-weight: 500; letter-spacing: -.005em; }
.rd-rules { border-radius: 14px; padding: 14px 16px; background: var(--panel-2); border: 1px solid var(--line); }
.rd-rules small, .rd-tipbox small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); margin-bottom: 8px; }
.rd-rules ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.rd-rules li { position: relative; padding-left: 28px; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
.rd-rules li::before { content: "✓"; position: absolute; left: 0; top: 2px; width: 19px; height: 19px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--navy); }
.rd-tipbox { border-left: 3px solid var(--c3); padding: 4px 0 4px 14px; }
.rd-tipbox small { color: var(--c3); } .rd-tipbox p { font-size: 14px; }

/* ---------- essentials learning flow ---------- */
.lf { display: grid; gap: 16px; }

.lf-card { display: grid; grid-template-columns: 240px minmax(0, 1fr); border-radius: 22px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 50px -36px var(--navy); }
.lf-left { display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: 26px 24px; color: #fff; background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, var(--navy))); }

.lf-btns button { min-width: 96px; padding: 9px 18px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); font: 600 14px var(--font); color: var(--ink); cursor: pointer; }
.lf-btns button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.lf-btns button.right { background: var(--good); border-color: var(--good); color: #fff; } .lf-btns button.wrong { background: var(--risk); border-color: var(--risk); color: #fff; }
.lf-fb { margin: 12px 0 0; font-size: 14px; line-height: 1.55; } .lf-fb.good { color: var(--good); } .lf-fb.bad { color: var(--risk); }

@media (max-width: 760px) { .lf-card { grid-template-columns: minmax(0, 1fr); } .lf-left { flex-direction: row; align-items: center; } .lf-fig { font-size: 22px; } .lf-main { padding: 20px; } }
.case-bar.empty { text-align: left; }
.rd-items small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }

/* ---------- quick reference ---------- */

.hub-ref:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.hub-ref > span { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--navy); color: #fff; font-weight: 700; font-size: 18px; }
.hub-ref div { flex: 1; } .hub-ref b { display: block; color: var(--navy); font-size: 15.5px; } .hub-ref small { color: var(--muted); font-size: 13px; } .hub-ref u { text-decoration: none; color: var(--accent); font-weight: 600; }
.ct-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }

/* ---------- detail side sheet ---------- */

.sh-quotes li { padding-left: 12px; border-left: 3px solid var(--accent-line); }
.sh-quotes p { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ink); } .sh-quotes small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
.sh-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; } .sh-links a { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent-line); }
button.mem-fact { position: relative; text-align: left; font: inherit; color: inherit; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; }
button.mem-fact:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-2px); }
button.mem-fact i { display: block; margin-top: 8px; font-style: normal; font-size: 12px; font-weight: 600; color: var(--accent); }
@media print { .sheet { display: none !important; } }

/* ---------- route finder + lanes ---------- */
.rf { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 0; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); box-shadow: 0 24px 50px -38px var(--navy); }
.rf-in { padding: 24px; color: #fff; background: linear-gradient(150deg, var(--navy), color-mix(in srgb, var(--navy) 65%, var(--c1))); display: grid; gap: 14px; align-content: start; }
.rf-in .eyebrow { color: rgba(255,255,255,.7); } .rf-in h3 { margin: -6px 0 0; color: #fff; font-size: 20px; }
.rf-amount span, .rf-segs span { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; opacity: .8; margin-bottom: 6px; }
.rf-amount div { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25); }
.rf-amount em { font-style: normal; font-size: 24px; font-weight: 700; opacity: .8; }
.rf-amount input { flex: 1; min-width: 0; border: 0; background: none; color: #fff; font: 700 28px var(--font); outline: none; padding: 4px 0; font-variant-numeric: tabular-nums; }
.rf-amount input::placeholder { color: rgba(255,255,255,.4); }
.rf-segs { display: grid; gap: 12px; } .rf-segs > div { display: flex; flex-wrap: wrap; gap: 6px; } .rf-segs > div > span { width: 100%; margin: 0; }
.rf-seg input { position: absolute; opacity: 0; pointer-events: none; }
.rf-seg b { display: inline-block; padding: 7px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid rgba(255,255,255,.3); cursor: pointer; transition: background .15s; }
.rf-seg input:checked + b { background: #fff; color: var(--navy); border-color: #fff; }
.rf-seg input:focus-visible + b { outline: 2px solid #fff; outline-offset: 2px; }
.rf-out { padding: 10px 24px 22px; display: grid; gap: 4px; align-content: start; }
.rf-res { padding: 14px 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.rf-res small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.rf-res > b { display: block; font-size: 20px; color: var(--navy); margin: 2px 0 8px; }
.rf-chain, .lane-who > div { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rf-chain span, .lane-who span { padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--panel); border: 1px solid var(--line); color: var(--ink); }
.rf-chain i, .lane-who i { font-style: normal; color: var(--muted); font-size: 12px; }
.rf-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; } .rf-tags span { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); }
.rf-tags .on { background: var(--c1); color: #fff; } .rf-tags .warn { background: var(--warn-soft); color: var(--warn); } .rf-tags .risk { background: var(--risk-soft); color: var(--risk); }
.rf-res a { font-size: 13.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
.rf-hint { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
.lane { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); transition: transform .25s, box-shadow .25s, opacity .25s; }
.lane header { display: flex; gap: 12px; align-items: center; }
.lane-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--c); font-size: 17px; box-shadow: 0 8px 16px -8px var(--c); }
.lane header b { display: block; font-size: 16.5px; color: var(--navy); } .lane header small { font-size: 13px; font-weight: 600; color: var(--c); }
.lane > p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--ink-2); }
.lane small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.lane-who small, .lane-ctl small { display: block; margin-bottom: 6px; }
.lane-ctl p { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink); }
.lane details { border-top: 1px solid var(--line); padding-top: 8px; }
.lane summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--c); }
.lane ol, .lane ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; } .lane li b { display: block; color: var(--ink); } .lane li span { color: var(--muted); }
.lane.hit { transform: translateY(-4px); box-shadow: 0 0 0 2px var(--c), 0 24px 44px -24px var(--c); }
.lane.dim { opacity: .5; }
.specials { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.special { display: flex; gap: 14px; padding: 16px; border-radius: 16px; background: color-mix(in srgb, var(--c) 7%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 25%, var(--line)); }
.special > span { flex: none; width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--c); color: #fff; font-weight: 800; font-size: 14px; }
.special b { display: block; color: var(--navy); font-size: 14.5px; } .special p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
@media (max-width: 960px) { .rf, .lanes, .specials { grid-template-columns: minmax(0, 1fr); } }

/* ---------- self-test ---------- */
.hub-sec { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 16px; } .hub-sec .hub-ref { margin-top: 0; }
.hub-ref > span { font-size: 14px; }
.qz-bar { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; }
.qz-bar button { height: 10px; border: 0; border-radius: 5px; cursor: pointer; background: var(--sunken); padding: 0; transition: transform .15s; }
.qz-bar button:hover { transform: scaleY(1.4); }
.qz-bar button.ok { background: var(--good); } .qz-bar button.ko { background: var(--risk); }
.qz-bar button.on { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--navy); }
.qz-meta { display: flex; justify-content: space-between; margin: 8px 0 16px; font-size: 13px; color: var(--muted); } .qz-meta b { color: var(--good); }
.qz-card { --lc: var(--c1); position: relative; padding: 28px 30px 22px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 50px -38px var(--navy); border-top: 5px solid var(--lc); }
.qz-card.l2 { --lc: var(--c2); } .qz-card.l3 { --lc: var(--c3); } .qz-card.l4 { --lc: var(--c4); } .qz-card.l5 { --lc: var(--risk); }
.qz-card header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.qz-lvl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--lc); padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--lc) 12%, var(--panel)); }
.qz-num { font-size: 13px; color: var(--muted); font-weight: 600; }
.qz-scn { padding: 14px 16px; border-radius: 14px; background: var(--panel-2); border-left: 4px solid var(--lc); margin-bottom: 14px; }
.qz-scn small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); } .qz-scn p { margin: 4px 0 0; font-size: 15px; line-height: 1.6; }
.qz-card h2 { margin: 0 0 16px; font-size: 21px; line-height: 1.4; color: var(--navy); letter-spacing: -.01em; }
.qz-opts { display: grid; gap: 8px; } .qz-opts.tf { grid-template-columns: repeat(2, minmax(0, 160px)); }
.qz-opts button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line-2); background: var(--panel); font: 500 15px/1.45 var(--font); color: var(--ink); cursor: pointer; transition: border-color .15s, background .15s, transform .15s; }
.qz-opts button:hover:not(:disabled) { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 6%, var(--panel)); transform: translateX(3px); }
.qz-opts button em { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font: 700 12px var(--font); font-style: normal; background: var(--sunken); color: var(--muted); }
.qz-opts.tf button { justify-content: center; font-weight: 700; } .qz-opts.tf button em { display: none; }
.qz-opts button.right { border-color: var(--good); background: var(--good-soft); } .qz-opts button.right em { background: var(--good); color: #fff; }
.qz-opts button.wrong { border-color: var(--risk); background: var(--risk-soft); } .qz-opts button.wrong em { background: var(--risk); color: #fff; }
.qz-opts button:disabled { cursor: default; } .qz-opts button:disabled:not(.right):not(.wrong) { opacity: .55; }
.qz-order { display: grid; gap: 12px; } .qz-seq { display: grid; gap: 6px; min-height: 40px; padding: 10px; border-radius: 14px; border: 1px dashed var(--line-2); }
.qz-seq span { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--lc) 8%, var(--panel)); font-size: 14px; }
.qz-seq em { font-style: normal; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--lc); color: #fff; font-weight: 700; font-size: 12px; }
.qz-hintbtn { margin-top: 12px; border: 0; background: none; color: var(--accent); font: 600 13.5px var(--font); cursor: pointer; padding: 0; }
.qz-hint { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--ink); font-size: 14px; }
.qz-fb { margin-top: 16px; padding: 14px 16px; border-radius: 14px; } .qz-fb.good { background: var(--good-soft); } .qz-fb.bad { background: var(--risk-soft); }
.qz-fb b { font-size: 15px; } .qz-fb.good b { color: var(--good); } .qz-fb.bad b { color: var(--risk); }
.qz-fb p { margin: 4px 0 6px; font-size: 14.5px; line-height: 1.6; } .qz-fb a { font-size: 13.5px; font-weight: 600; color: var(--accent); text-decoration: none; }
.qz-card footer { display: flex; justify-content: space-between; margin-top: 20px; }
.qz-end { display: flex; gap: 28px; align-items: center; padding: 28px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 16px; }
.qz-end h2 { margin: 0 0 14px; color: var(--navy); }
.qz-ring { --p: 0; flex: none; width: 140px; height: 140px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--sunken) 0); }
.qz-ring span { width: 112px; height: 112px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; align-content: center; font-size: 13px; color: var(--muted); } .qz-ring b { font-size: 30px; color: var(--navy); }
.qz-end > div:last-child { flex: 1; } .qz-lv { display: grid; gap: 8px; }
.qz-lv div { display: grid; grid-template-columns: 190px minmax(0, 1fr) 40px; gap: 10px; align-items: center; font-size: 13px; }
.qz-lv i { height: 8px; border-radius: 8px; background: var(--sunken); overflow: hidden; } .qz-lv u { display: block; height: 100%; background: var(--good); }
.qz-miss { padding: 14px 20px 18px; display: grid; gap: 12px; } .qz-miss div { padding-left: 12px; border-left: 3px solid var(--risk); }
.qz-miss b { font-size: 14.5px; } .qz-miss p { margin: 4px 0; font-size: 14px; color: var(--ink-2); } .qz-miss a { font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
@media (max-width: 760px) { .hub-sec { grid-template-columns: minmax(0, 1fr); } .qz-end { flex-direction: column; } .qz-lv div { grid-template-columns: minmax(0, 1fr) 80px 36px; } .qz-card { padding: 20px; } .qz-opts.tf { grid-template-columns: 1fr 1fr; } }
.qz-mscn { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; font-style: italic; }

/* ---------- stage brief ---------- */
.sb-top h2 { margin: 2px 0 6px; font-size: 26px; letter-spacing: -.02em; }
.sb-top p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 820px; line-height: 1.55; }
.sb-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
.sb-rule { padding: 18px 20px; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #1b3a7a, #24529e); box-shadow: 0 14px 30px -18px #1b3a7a; }
.sb-rule small { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; font-weight: 700; }
.sb-rule b { display: block; margin-top: 6px; font-size: 18px; line-height: 1.4; }
.sb-flow { list-style: none; margin: 14px 0 0; padding: 0; position: relative; }
.sb-flow::before { content: ""; position: absolute; left: 15px; top: 16px; bottom: 16px; width: 2px; background: var(--line); }
.sb-flow li { position: relative; display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 10px 0; }
.sb-flow em { font-style: normal; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c); font-weight: 700; font-size: 13px; position: relative; box-shadow: 0 0 0 4px var(--panel); }
.sb-flow small { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.sb-flow small i { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sb-flow p { margin: 3px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink); }
.sb-facts { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: color-mix(in srgb, var(--accent, #2d6bd8) 3%, var(--panel)); align-self: start; }
.sb-facts h4, .sb-must h4, .sb-warn h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.sb-fact { border-top: 1px solid var(--line); }
.sb-fact:first-of-type { border-top: 0; }
.sb-fact summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 10px; padding: 10px 2px; }
.sb-fact summary::-webkit-details-marker { display: none; }
.sb-fact summary::after { content: "+"; color: var(--muted); font-weight: 600; }
.sb-fact[open] summary::after { content: "–"; }
.sb-fact summary b { font-size: 18px; color: #1b3a7a; white-space: nowrap; }
.sb-fact summary span { font-size: 13.5px; color: var(--ink-2); }
.sb-fact p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.55; color: var(--ink); padding: 10px 12px; border-radius: 10px; background: var(--panel); border-left: 3px solid #2d6bd8; }
.sb-more { border: 0; background: none; padding: 0 0 10px; color: #2d6bd8; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.sb-bottom { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 18px; margin-top: 16px; }
.sb-must { border: 1px solid color-mix(in srgb, #c0392b 25%, var(--line)); border-radius: 14px; padding: 14px 16px; }
.sb-must h4 { display: flex; align-items: center; gap: 8px; color: #b03a2e; }
.sb-must h4 span { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #c0392b; color: #fff; font-size: 12px; }
.sb-must h4 small { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--muted); }
.sb-must ul { list-style: none; margin: 0; padding: 0; }
.sb-must li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; padding: 9px 0; border-top: 1px dashed var(--line); }
.sb-must li p { margin: 0; font-size: 14px; line-height: 1.5; }
.sb-src { border: 0; background: color-mix(in srgb, #2d6bd8 8%, var(--panel)); color: #2d6bd8; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 11.5px; cursor: pointer; white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.sb-all summary { cursor: pointer; font-size: 13px; font-weight: 600; color: #2d6bd8; padding-top: 8px; }
.sb-warn { border-radius: 14px; padding: 14px 16px; background: color-mix(in srgb, #d98a1a 9%, var(--panel)); border: 1px solid color-mix(in srgb, #d98a1a 30%, var(--line)); align-self: start; }
.sb-warn h4 { color: #a5630c; }
.sb-warn p { margin: 0; font-size: 14px; line-height: 1.55; }
@media (max-width: 900px) { .sb-grid, .sb-bottom { grid-template-columns: 1fr; } .sb-must li { grid-template-columns: 1fr; } }

/* item icons + recall mode */
.rd-ih { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rd-recall { border: 1px solid var(--line); background: var(--panel); color: #2d6bd8; font: inherit; font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: 999px; cursor: pointer; }
.rd-recall:hover { border-color: #2d6bd8; }
.rd-items li.has-ic > span { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #2d6bd8; background: linear-gradient(145deg, color-mix(in srgb, #2d6bd8 14%, var(--panel)), color-mix(in srgb, #2d6bd8 5%, var(--panel))); }
.rd-items li.has-ic > span svg { width: 21px; height: 21px; }
.rd-items li.has-ic > span i { position: absolute; right: -5px; bottom: -5px; font-style: normal; font-size: 10px; font-weight: 700; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: #1b3a7a; color: #fff; box-shadow: 0 0 0 2px var(--panel); }
.rd-items li { transition: transform .15s, box-shadow .15s, border-color .15s; }
.rd-items li:hover { transform: translateY(-2px); box-shadow: 0 10px 22px -16px #1b3a7a; border-color: color-mix(in srgb, #2d6bd8 35%, var(--line)); }
.rd-items.recall li { cursor: pointer; }
.rd-items.recall li:not(.shown) p { filter: blur(6px); user-select: none; opacity: .6; }
.rd-items.recall li:not(.shown)::after { content: "Tap to reveal"; position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: #2d6bd8; font-weight: 600; }
.rd-items li { position: relative; }
.rd-items.recall li.shown { border-color: #1f9d6b; }

/* key rules tab, print summary, recall rating */
.sb-bottom { margin-top: 0; }
.sb-side { display: grid; gap: 14px; align-self: start; }
.sb-good { border-radius: 14px; padding: 14px 16px; background: color-mix(in srgb, #1f9d6b 8%, var(--panel)); border: 1px solid color-mix(in srgb, #1f9d6b 28%, var(--line)); }
.sb-good h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #167a53; }
.sb-good p { margin: 0; font-size: 14px; line-height: 1.55; }
.sh-print { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font: inherit; font-size: 11.5px; padding: 4px 10px; color: #2d6bd8; cursor: pointer; margin-left: auto; }
.sh-chips { align-items: center; }
.rd-rate { display: flex; gap: 6px; margin-top: 8px; }
.rd-rate button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; font: inherit; font-size: 11.5px; padding: 3px 9px; cursor: pointer; }
.rd-items li.rated .rd-rate { display: none; }
.rd-items li[data-rated="later"] { border-color: #d98a1a !important; }
.rd-items.recall li.shown::after { content: none; }
#printSum { display: none; }
@media print {
  html.print-sum body > *:not(#printSum) { display: none !important; }
  html.print-sum #printSum { display: block; font-size: 11pt; }
  html.print-sum #printSum .sb-grid, html.print-sum #printSum .sb-bottom { grid-template-columns: 1.4fr 1fr; gap: 12px; }
  html.print-sum #printSum * { box-shadow: none !important; opacity: 1 !important; animation: none !important; color-adjust: exact; }
  html.print-sum #printSum .sb-rule { background: none; color: #000; border: 2px solid #1b3a7a; }
  html.print-sum #printSum .sb-must { margin-top: 12px; break-inside: auto; }
}
button.hub-ref { font: inherit; text-align: left; cursor: pointer; width: 100%; }
.rv { list-style: none; margin: 0; padding: 0; }
.rv li { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.rv summary { cursor: pointer; font-weight: 600; }
.rv p { margin: 8px 0; font-size: 14px; color: var(--ink-2); }
.rv a { font-size: 13px; color: #2d6bd8; }

/* ---------- stage hero ---------- */

 "grantNotes": {
  "Grant vs procurement": "Use the purpose and economic substance of the arrangement as the starting point. A grant finances an action/project or operating expenditure that the grantee carries out while advancing Organisation objectives. Procurement, by contrast, purchases goods/services/works for an Organisation need. Co-financing is also a characteristic feature of grants and helps distinguish them from service contracts.",
  "Project-related grant": "This route finances a defined project or specified action. The call/agreement should make the action objectives, implementation period, budget, co-financing, reporting and expected results sufficiently precise to test eligibility and later verify proper use of funds.",
  "Operational grant": "This finances the grantee’s operating expenditure rather than a single project/action. Operational grant agreements should not normally exceed twelve consecutive months, so duration should be checked at design stage.",
  "Transparency": "At €15,000 or above, the principle is a public call for proposals. Exceptions to publication are interpreted strictly. Publication should reach the intended audience; publication on the Organisation website is an absolute prerequisite, but may need to be supplemented by other channels.",
  "Non-retroactivity": "The financed action should not already be completed. The implementation period must be defined precisely in the grant agreement, and costs are tied to the permitted implementation period. The guide presents implementation after signature as the best-practice scenario.",
  "Co-financing": "The Council should not normally finance the entire action or operation. The grantee contribution may come from own or third-party resources and may include human resources, contributions in kind or income generated by the action/project. The level or method should be clear in the call and agreement.",
  "Non-cumulative awards": "Avoid double financing and overfunding. The same action should not be financed twice by Council grants, and the same cost should not be financed by overlapping funding sources. Different complementary sources are possible, but total financing must not exceed agreed budgeted expenditure.",
  "No profit": "The grant is not intended to generate profit for the grantee. Budget design, reporting and final financial verification should therefore be consistent with the no-profit principle and with the agreed eligible-cost structure.",
  "Non-discrimination": "Applicants in comparable situations must be treated consistently. Differences in treatment require an objective and reasonable justification connected to a legitimate objective and proportionate means. The same discipline applies to submission conditions, clarifications and evaluation.",
  "Coordinator": "The Commitments Officer formally appoints a Co-ordinator to organise and steer the procedure, including planning, receipt and evaluation of applications. The relevant appointment template is G3.1. The Co-ordinator prepares key draft reports but does not replace the Evaluation Committee or the Commitments Officer in their reserved decisions.",
  "Evaluation Committee": "The Committee evaluates proposals. At least one staff member must be included; the Procurement Guide recommends, where possible, a majority of staff members. External members must provide conflict-of-interest undertakings and, where applicable, confidentiality declarations.",
  "Exclusion criteria": "Exclusion grounds must be defined in the call. Applicants generally certify by declaration that they are not in an exclusion situation. If exclusion applies, the proposal does not proceed to eligibility and award assessment.",
  "Eligibility criteria": "Eligibility criteria test the applicant’s capacity to implement the action, for example financial, human-resource or experience capacity. They must be precise, objective, proportionate, relevant and verifiable, and should establish a clear pass threshold. Failure means the proposal does not proceed to award scoring.",
  "Award criteria": "Award criteria assess the proposal itself, only after exclusion and eligibility gates are passed. Each criterion should be relevant and verifiable; weighting must be stated in the call and remain unchanged throughout the procedure. Supporting documents used to verify criteria should also be identified.",
  "Call content": "The call should state objectives, co-financing, submission arrangements and deadline, questions channel, indicative outcome/signing dates, implementation timetable, exclusion/eligibility/award criteria and their supporting documents, number/value of grants, and the intended grant-agreement/payment architecture.",
  "Publication": "Publication must be capable of reaching the target public. The Organisation website is mandatory, but additional channels may be needed. Questions and answers should be published in a manner that ensures equal access to information for all potential applicants.",
  "Opening": "Proposals must not be opened before the submission deadline. The Co-ordinator must not open them alone; the guide requires the presence of a member of the Evaluation Committee. Opening is documented in Template G11.1 and each proposal is assigned an identification number.",
  "Clarifications": "Clarifications may address administrative omissions or technical errors without allowing substantive alteration of the proposal. The requested information should be specific, time-limited and applied transparently. Additions that change the substance of the proposal should not be accepted.",
  "Individual evaluation": "Eligible proposals are assessed by Evaluation Committee members against the published award criteria/sub-criteria using the prescribed evaluation format. The published criteria and weightings are fixed and cannot be changed during evaluation.",
  "Consensus report": "Individual assessments are consolidated into a reasoned consensus report. The Commitments Officer can require further reasoning or documentation if the report is not sufficiently reasoned and documented before taking the award decision.",
  "Commitments Officer decision": "The Commitments Officer verifies that selected projects pursue the call objectives, that cost and content appear reasonable, that funds are available and that the consensus report is properly reasoned and documented. The award decision is recorded using the relevant template.",
  "Notifications": "Successful applicants are informed in writing. Unsuccessful applicants must be informed in writing no later than 15 calendar days after successful applicants are informed; the letter must explain the route and deadline for enquiries, respecting the minimum seven-day enquiry period.",
  "Model agreement": "Use the relevant Council of Europe model agreement. Donor requirements, national-law issues, guarantees or special clauses may require adaptation; the Procurement Guide recommends DLAPIL involvement where model terms need to be changed.",
  "Reporting": "The agreement should define narrative and financial reporting obligations and may attach model reports. Reporting should allow the Organisation to verify progress, eligible expenditure and proper use of the grant.",
  "Payment terms": "The agreement should specify the financing/payment architecture, including the first payment, any interim payments and the balance. Any guarantee arrangements or special payment conditions should be made explicit.",
  "Amendment rules": "Amendments require clear written agreement of both parties and may be done through signed documentation or an unambiguous written exchange. They must not distort the initial grant procedure or create unequal treatment, and the total grant amount must not be increased by amendment.",
  "Procedure file": "Keep the complete audit trail from appointment of the Co-ordinator through validation of supporting documents proving proper use of the grant. The initiating department is responsible for retaining the procedure record.",
  "Templates": "Use the G-series templates aligned with Rule 1374. Before finalising, complete all required fields and remove drafting comments, blue highlights and bracketed options intended only as preparation instructions.",
  "Close-out": "Close-out should confirm final reporting, supporting-document validation, any reductions/recoveries, completion of obligations and complete record-keeping. The file should allow later reconstruction of the award and implementation decisions."
 },
 "grantBestPractice": {

  "Filing": "Archive progressively throughout the procedure rather than reconstructing the file at close-out."

      example: "A project team wants to pay an NGO to run its own awareness campaign that also promotes Council of Europe values. Because the NGO pursues its own objectives and only costs are covered, this is a grant, not procurement. The correct action is to use a grant agreement under Rule No. 1374, not a tender.",
      title: "Principles, Legal Bases & Ethics",

      check: "Your annual declaration of interests is filed and no conflict of interest, gift or privileged contact with potential bidders exists.",
      sections: [
        ["Legal bases",{"lead":"Three instruments set the rules for every Council of Europe purchase, and DLAPIL templates replace the older model contracts.","items":[["Financial Regulations, Articles 40 to 43","Set out the three types of contract, the three main procedures and the role of the Tenders Board."],["Rule No. 1395 of 20 June 2019","Details each procedure, from preparing the tender file to signing the contract. An annotated version is on the Tenders Board's web page."],["Instructions No. 59 and No. 60","Cover consultants' contracts and outsourcing contracts respectively and remain relevant as background."]],"must":["Buyer entities should use the DLAPIL templates instead of the model contracts in Instructions No. 59 and No. 60, and should not use the model invoice."]}],
        ["The six principles",{"lead":"Six principles from Rule No. 1395 guide every procurement procedure: competition is the norm and direct award the exception.","items":[["Periodic competition","Competitive procedures are launched at regular intervals so that other suppliers also have the chance to compete."],["Objectivity","The buyer entity acts without partiality, bias or outside influence, with neutral tender documents and impartial scoring."],["Transparency","Criteria and rules are available to all tenderers, results are published and reasons for the award are given on request."],["Non-exclusivity","The Council avoids recurring, exclusive relationships with suppliers and contracts of excessive length."],["Equal treatment","All tenderers follow the same rules and receive the same information at each stage."],["Non-discrimination","Tenderers in a comparable situation are not treated differently because they belong to a particular group, especially in the conditions for taking part."]]}],
        ["Grants v. procurement",{"lead":"Buying for the Organisation's own needs is procurement; financing a grantee's own project is a grant.","items":[["Procurement contract","Used whenever the Organisation buys works, goods or services for its own needs, whatever the contractor's status. The price includes a profit margin and there are no reporting requirements."],["Grant agreement","Used when the Organisation gives financial assistance to a grantee for the grantee's own project (Article 43 bis of the Financial Regulations and Rule No. 1374). It covers part of the grantee's costs and requires extensive reporting."]]}],
        ["Values and ethics",{"lead":"Everyone involved in procurement follows the Code of Conduct and the Purchasing Code of Ethics (25 October 2005), and the Council has a no-gift policy.","items":[["Avoid conflicts of interest","Do not take part in a procedure where your own interests could conflict with the Council's."],["Keep tenders confidential","Do not disclose the content of offers."],["Keep professional relationships","Maintain professional, respectful and trusting relationships with suppliers."],["Apply objective criteria","Select suppliers on objective and impartial criteria."],["Refuse all benefits","Refuse any benefit, gift or solicitation from suppliers, whatever its value."]],"must":["Secretariat members involved in procurement must submit a declaration of interests every year by the end of January, or within one month of a change (Rule No. 1282)."]}],
        ["Fraud and reporting",{"lead":"Suspected fraud, corruption or other wrongdoing is reported at once under the Speak Up Policy.","must":["Staff must report suspected fraud, corruption or other wrongdoing immediately to the DIO.","Staff must not give potential bidders privileged technical or financial information before the call is public.","Buyer entities must not write specifications restrictively to discourage competition."]}],
        ["Audits and risks",{"lead":"Four kinds of auditor examine procurement, and non-compliance creates institutional, financial, ethical, reputational and operational risks.","items":[["DIO","Internal audit checks compliance and performance."],["External auditor","Certifies the accounts and may carry out performance audits."],["European Union","Audits actions it funds."],["Donor-mandated auditors","Third-party auditors appointed by donors."]],"must":["The Ordinary Budget must cover any ineligible expenditure that donors reclaim after a non-compliant procedure."],"tip":"Auditors look at transparency, competition, thresholds, reasons for direct awards, validation workflows, declarations of interest and archiving, so keep these well documented."}]

        ["Exclusion and eligibility",{"lead":"Admissible bids are then checked against the exclusion and eligibility criteria, which are pass or fail.","must":["The buyer entity must exclude any bid that fails an exclusion criterion or whose act of engagement is not signed.","With EU funds, the buyer entity must check the EU sanctions list using the WebFOCUS report.","A bid that fails an eligibility criterion is ineligible, and exceeding another criterion does not compensate unless the tender file says so."],"tip":"Where risk requires, ask the selected supplier for criminal record and tax certificates before signing."}],

        ["Clarifications",{"lead":"Under Article 17.2 of Rule No. 1395, offers may be clarified only with non-essential information that does not change their main features or distort competition.","must":["Clarification requests must be made in writing, kept on record and reported to the CCM or Tenders Board with the results.","A clarification that would significantly change a bid requires a negotiation round."]}],

    else if (ground !== "none") { key = "direct-exc"; route = "Direct award on exceptional grounds"; }
    else if (intl) { key = "international"; route = "International public call for tenders"; }
    else { key = "competitive"; route = "Competitive bidding procedure"; }
    const contract = need === "variable" ? "Framework agreement" : need === "recurring" ? "Framework contract" : "One-off contract";

    // Approval chain, in order.
    const approvals = [];
    if (key === "direct-low") approvals.push(["Buyer entity", "Awards directly on the basis of the supplier's expertise and value for money; keeps the justification on file.", "src"]);
    else {
      if (lcr) approvals.push(["DLAPIL · Legal Compliance Review", "Mandatory for extrabudgetary funding between €55,000 and €184,000, before the CCM. Processed within 5 working days of a complete request.", "src"]);
      if (key === "direct-exc") approvals.push(intl ? ["Tenders Board", "The CCM submits the direct-award request (specification, total cost, justification) to the Tenders Board.", "src"] : ["CCM", "Decides on the memorandum: specification, estimated total cost and the exceptional ground relied on.", "src"]);
      if (key === "competitive") approvals.push(["CCM", "Approves the tender documents in writing before launch, and later the award.", "src"]);
      if (key === "international") approvals.push(["CCM → Tenders Board", "The CCM sends the tender documents with an explanatory note; the Tenders Board authorises the launch (members have at least 48 hours) and later decides on the award.", "src"]);
    }

    // Timeline in working days: [label, days, basis]. Reverse-scheduled from the deadline when given.
    const steps = [["Define the need & market analysis", 10, "assumed"]];
    if (key !== "direct-low") steps.push([key === "direct-exc" ? "Memorandum & justification" : "Tender file & act of engagement", key === "international" ? 20 : 10, "assumed"]);
    if (lcr) steps.push(["Legal Compliance Review (DLAPIL)", 5, "src"]);
    if (key === "competitive" || key === "direct-exc") steps.push(["CCM approval", 5, "assumed"]);
    if (key === "international") steps.push(["Tenders Board launch approval", 10, "assumed"]);
    if (key === "competitive") steps.push(["Invitation & submission period", 10, "assumed"]);
    if (key === "international") steps.push(["Publication (minimum three weeks)", 15, "src"]);
    if (key === "competitive" || key === "international") steps.push(["Opening & evaluation", 10, "assumed"], [key === "international" ? "Tenders Board award decision" : "CCM award approval", key === "international" ? 10 : 5, "assumed"]);
    steps.push(["Contract review & signature", key === "direct-low" ? 3 : 10, "assumed"]);
    const total = steps.reduce((a, x) => a + x[1], 0);
    const deadline = input.deadline ? new Date(input.deadline) : null;
    let cursor = deadline ? addWorkdays(deadline, -total) : new Date(today);
    const start = new Date(cursor);
    const timeline = steps.map(([label, days, basis]) => { const from = new Date(cursor); cursor = addWorkdays(cursor, days); return { label, days, basis, from, to: new Date(cursor) }; });
    const late = deadline && start < today;

    const docs = {
      "direct-low": [["Need description", "What, quantity, period and estimated value."], ["Offer / quotation", "From the selected supplier."], ["Value-for-money note", "Why this supplier and price are appropriate."], ["Purchase order / contract", "Signed before the service starts."], ["Delivery acceptance & invoice", "Before payment."]],
      "direct-exc": [["Memorandum", "Specification, estimated total cost and the exceptional ground."], ...(lcr ? [["LCR request & DLAPIL visa", "Request form titled “Request for LCR”, with the memorandum."]] : []), [intl ? "Tenders Board decision" : "CCM decision", "Written approval of the direct award."], ["Negotiated offer", "From the supplier retained."], ["Signed contract", "Reviewed and signed by the authorised signatory."]],
      competitive: [["Tender file", "Rules, criteria and requirements."], ["Act of engagement", "Supplier details and financial offer."], ["Technical specifications", "Where separate from the tender file."], ["List of invited suppliers", "At least three potential suppliers."], ...(lcr ? [["LCR request & DLAPIL visa", "Before the CCM approval."]] : []), ["CCM approval of the documents", "Written, before launch."], ["Opening record & analysis table", "Admissibility, exclusion, eligibility and award scoring."], ["Award approval", "CCM decision on the proposed award."], ["Notification letters", "Unsuccessful tenderers informed within 15 days of notifying the winner."], ["Signed contract", "After contract review."]],
      international: [["Tender file & act of engagement", "With appendices."], ["Explanatory note / memo to the Tenders Board", "Template on the Tenders Board website."], ["Tenders Board launch authorisation", "Before publication."], ["Publication on the e-procurement platform", "Deadline of at least three weeks."], ["Opening record & analysis table", "Admissibility, exclusion, eligibility and award scoring."], ["Tenders Board award decision", "Validates the results and the award."], ["Notification letters", "Unsuccessful tenderers informed within 15 days of notifying the winner."], ["Signed contract", "After contract review."]],
    }[key];

    const risks = [];
    if (!intl && value >= 0.85 * LIMITS.international) risks.push(["risk", "Close to €184,000", "If the value may exceed the threshold (extensions, amendments, higher bids), the guide recommends an international public call. The Tenders Board cannot approve a launch retroactively."]);
    if (need !== "oneoff" && contract !== "Framework agreement" && value <= low) risks.push(["warn", "Recurring need at low value", "Assess the whole foreseeable need over the full period: splitting a recurring need to stay below a threshold is not allowed."]);
    if (need === "variable" && !intl) risks.push(["warn", "Framework agreement below €184,000", "Framework agreements need a mini-competition for each call-off and are rarely recommended below €184,000."]);
    if (key === "direct-exc") risks.push(["warn", "Exceptional direct award", "Only for unforeseen urgency not attributable to the buyer, technical requirements, or considerations of fact or law. Document the ground precisely."]);
    if (lcr) risks.push(["info", "Legal Compliance Review is mandatory", "Extrabudgetary funding between €55,000 and €184,000: no CCM approval before the DLAPIL visa."]);
    if (late) risks.push(["risk", "Behind schedule", `To meet the deadline the procedure should have started by ${start.toISOString().slice(0, 10)}. Consider a later deadline or a reduced scope.`]);
    const pub = timeline.find((t) => /Publication|Invitation/.test(t.label));
    if (pub && [6, 7].includes(pub.from.getMonth())) risks.push(["warn", "Publication during the summer break", "The guide advises against launching calls for tenders during the summer break."]);
    if (key !== "direct-low") risks.push(["info", "Offer validity", "Offers are valid for 180 calendar days from the submission deadline; plan evaluation and award within that period."]);

    // E-procurement platform (Ch. 6.1): mandatory for international calls from 1 Jan 2026, above €55,000 from 1 Apr 2026,
    // and for all tenders above the low-value limits from 1 Jan 2027. Judged on the planned launch date.
    const launch = (timeline.find((t) => /Publication|Invitation/.test(t.label)) || timeline[0]).from;
    const eDate = key === "international" ? "2026-01-01" : value >= LIMITS.legalReview ? "2026-04-01" : value > low ? "2027-01-01" : null;
    const eproc = key === "direct-low" || key === "direct-exc" || !eDate ? { mandatory: false, text: "Not a tender: the e-procurement platform is not required." }
      : launch >= new Date(eDate) ? { mandatory: true, text: `Mandatory: tenders of this type launched from ${eDate} go through the Council of Europe e-procurement platform.` }
      : { mandatory: false, text: `Becomes mandatory for this type of tender from ${eDate}; using it already is recommended.` };
    if (eproc.mandatory) risks.unshift(["info", "E-procurement platform mandatory", eproc.text]);
    const first = {
      "direct-low": ["Document the need and get an offer", "Describe what you need and its total value, obtain the offer from the supplier with the right expertise and note why it is good value."],
      "direct-exc": [lcr ? "Prepare the memorandum and request the Legal Compliance Review" : `Prepare the memorandum to the ${intl ? "Tenders Board (via the CCM)" : "CCM"}`, "State the specification, the estimated total cost and precisely which exceptional ground applies, with the evidence."],
      competitive: ["Draft the tender file and act of engagement", `Use the DLAPIL templates, fix the exclusion, eligibility and weighted award criteria, and list at least three potential suppliers${lcr ? "; then send everything to DLAPIL for the Legal Compliance Review" : ""}.`],
      international: ["Prepare the tender file and the memo to the Tenders Board", "Use the DLAPIL templates and the Tenders Board memo template; plan a submission period of at least three weeks on the e-procurement platform."],
    }[key];
    const nextAction = { title: first[0], text: first[1], by: timeline[0].to };
    // Relevance of each of the 15 guide stages for this route.
    const skipFor = { "direct-low": ["Tender Design", "Terms & Specifications", "Open & Evaluate", "Negotiate & Award"], "direct-exc": ["Tender Design", "Open & Evaluate"], competitive: [], international: [] }[key];
    const keyFor = { "direct-low": ["Thresholds & Procedure", "Contract Signing"], "direct-exc": ["Thresholds & Procedure", "Authorise & Launch", "Negotiate & Award"], competitive: ["Tender Design", "Authorise & Launch", "Open & Evaluate"], international: ["Tender Design", "Authorise & Launch", "Open & Evaluate", "Negotiate & Award"] }[key];
    return { key, route, contract, value, eproc, nextAction, approvals, timeline, total, start, deadline, late, docs, risks, skip: skipFor, keyStages: keyFor, lcr, intl };
  }

  /* ---------- grant case planner (Rule 1374) ---------- */
  function grantCase(input, today = new Date()) {
    const budget = num(input.budget), n = Math.max(1, Math.round(num(input.grantees) || 1)), eu = input.funding === "eu";
    const kind = input.kind || "project", exc = input.ground && input.ground !== "none", months = num(input.months);
    const A = eu ? "B" : "A", fund = eu ? "EU funds" : "Ordinary Budget / Voluntary Contributions";
    let key, route;
    if (budget < LIMITS.grant) { key = "direct"; route = "Direct award (below €15,000)"; }
    else if (exc) { key = "direct-exc"; route = "Exceptional direct award (Article 2.1.3)"; }
    else { key = "call"; route = "Call for proposals"; }
    const roles = key === "call"
      ? [["Commitments Officer", "Approves the call, appoints the Co-ordinator (G3.1) and the Evaluation Committee (G13.1), decides on the award (G14.6) and signs the agreement.", "src"], ["Co-ordinator", "Runs the procedure: publication, questions, opening (G11.1), draft eligibility report and the follow-up table (G3.1TAB).", "src"], ["Evaluation Committee", "Adopts the exclusion and eligibility report (G14.1), scores the proposals 0–5 (G14.3) and signs the consensus report (G14.4). At least one staff member; conflict-of-interest declarations (G13.4).", "src"], ["DLAPIL (recommended)", "Legal opinion on the draft call before publication — strongly recommended where financial guarantees are stipulated.", "src"]]
      : [["Commitments Officer", key === "direct" ? "Adopts the direct-award decision with Template G9.2A, which also appoints the Co-ordinator, then signs the agreement." : "Takes a duly justified decision with reference to Article 2.1.3 using Template G9.2B, attached to the request for commitment of funds.", "src"]];
    const steps = key === "call"
      ? [["Objectives & appoint Co-ordinator (G3.1)", 5, "assumed"], [`Draft call & application form (G8.1${A}, G8.2${A})`, 10, "assumed"], ["DLAPIL legal opinion & approval", 5, "assumed"], ["Publication & questions", 20, "assumed"], ["Opening & eligibility report (G11.1, G14.1)", 5, "assumed"], ["Scoring & consensus report (G14.3, G14.4)", 10, "assumed"], ["Commitments Officer decision (G14.6)", 5, "assumed"], ["Inform applicants (G14.8, G14.9)", 10, "src"], [`Sign grant agreement (G17.2${A})`, 5, "assumed"]]
      : [[key === "direct" ? "Decision on direct award (G9.2A)" : "Justified decision (G9.2B)", 5, "assumed"], [`Prepare & sign grant agreement (G17.2${A})`, 5, "assumed"]];
    const total = steps.reduce((a, x) => a + x[1], 0), deadline = input.deadline ? new Date(input.deadline) : null;
    let cursor = deadline ? addWorkdays(deadline, -total) : new Date(today); const start = new Date(cursor);
    const timeline = steps.map(([label, days, basis]) => { const from = new Date(cursor); cursor = addWorkdays(cursor, days); return { label, days, basis, from, to: new Date(cursor) }; });
    const late = deadline && start < today;
    const docs = key === "call"
      ? [["G3.1", "Decision appointing the Co-ordinator"], [`G8.1${A}`, `Call for proposals (${fund})`], [`G8.2${A}`, "Application form"], ["G8.3", "Call quality control checklist"], ["G13.1", "Decision appointing the Evaluation Committee"], ["G13.4", "Declarations of absence of conflict of interests"], ["G11.1", "Report on opening of proposals"], ["G14.1", "Exclusion and eligibility report"], ["G14.3 / G14.4", "Individual assessments and consensus report"], ["G14.6", "Commitments Officer award decision"], ["G14.8 / G14.9", "Letters to successful and unsuccessful applicants"], [`G17.2${A} + G17.2D`, "Grant agreement with the estimated budget annex"]]
      : [[key === "direct" ? "G9.2A" : "G9.2B", key === "direct" ? "Decision on direct award below €15,000" : "Justified decision on direct award from €15,000"], [`G17.2${A}`, "Grant agreement"], ["G17.2D", "Annex II, estimated budget"], ["G3.1TAB", "Co-ordinator follow-up table"]];
    const risks = [];
    if (key === "direct" && budget >= 0.8 * LIMITS.grant) risks.push(["warn", "Close to €15,000", "The threshold is the total budget of the procedure, not each grant. If several grants or a larger amount are foreseeable, a call for proposals is required."]);
    if (n > 1 && budget / n < LIMITS.grant && budget >= LIMITS.grant) risks.push(["info", "Count the whole procedure", `${n} grants of about ${euro(budget / n)} each make ${euro(budget)} in total: a call for proposals applies.`]);
    if (key === "direct-exc") risks.push(["risk", "Exceptions are strict", "Only an unforeseeable emergency, grantee characteristics making a call impossible, or an action leaving no scope for a call. Reference Article 2.1.3 precisely."]);
    if (kind === "operational" && months > 12) risks.push(["warn", "Operational grant longer than 12 months", "Operational grants should not normally give rise to agreements of more than twelve consecutive months."]);
    risks.push(["info", "Co-financing", "The Council must not finance the entire cost: the grantee contributes own or third-party resources (human resources, in kind or income generated)."]);
    risks.push(["info", "No retroactivity", "Costs cannot be incurred before the closing date for proposals; implementation should start after signature."]);
    risks.push(["info", "Indirect costs", "Indirect eligible costs are capped at 7% where foreseen."]);
    if (eu) risks.push(["info", "EU-funded templates", "Use the B variants (G8.1B, G8.2B, G17.2B) and the EU exclusion declarations (G4.1.2B, D or E)."]);
    if (late) risks.push(["risk", "Behind schedule", `To sign by the date entered, the procedure should have started by ${start.toISOString().slice(0, 10)}.`]);
    const skip = key === "call" ? [] : ["Criteria", "Call", "Submission", "Eligibility Check", "Evaluation", "Complaints"];
    const keyStages = key === "call" ? ["Call", "Eligibility Check", "Evaluation"] : ["Procedure", "Agreement"];
    const first = key === "call" ? ["Define the objectives and appoint the Co-ordinator", `Objectives are the first stage of any procedure. Then draft the call with G8.1${A}: co-financing level, criteria with weights, number of grantees and total value.`]
      : key === "direct" ? ["Adopt the direct-award decision (G9.2A)", "The Commitments Officer signs G9.2A, which also appoints the Co-ordinator; then prepare the grant agreement with its budget annex."]
      : ["Write the justification under Article 2.1.3 (G9.2B)", "Explain which exceptional circumstance applies and why a call is impossible; attach the decision to the request for commitment of funds."];
    return { key, route, budget, n, eu, roles, timeline, total, start, deadline, late, docs, risks, skip, keyStages, nextAction: { title: first[0], text: first[1], by: timeline[0].to } };
  }

  return { LIMITS, euro, grantCase, procurementCase, addWorkdays, procurement, budgetRevision, contractStrategy, grantProcedure, yearEnd, readiness, whatIf, pettyCash, grantCost, yearAllocation };
});

<script>
/* core.js */

  const slug = (s) => String(s).toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

    { title: "Commit", sub: "PO file & signatures", path: "po-file", sections: ["po-file", "foma"] },
    { title: "Pay", sub: "Delivery, invoice, payment", path: "payment-file", sections: ["payment-file", "petty-cash"] },
    { title: "Report & forecast", sub: "Position, variance, revision", path: "foma/reports", sections: ["foma-reports", "foma-forecast"] },
    { title: "Close the year", sub: "Cut-off and PO finalisation", path: "year-end", sections: ["year-end"] },
    { title: "File & audit", sub: "Evidence trail", path: "filing", sections: ["filing"] },
  ];
  // Each area has its own colour; views read it through --accent.
  FG.TONES = { home: 1, engines: 4, procurement: 1, grants: 4, "po-file": 5, foma: 5, "payment-file": 2, "petty-cash": 3, "foma-reports": 5, "foma-forecast": 3, "year-end": 3, filing: 2, scenarios: 4, roles: 1, links: 1, rules: 4, glossary: 5, projects: 1, tools: 3, vat: 6, events: 4, "foma-po": 2, "foma-pay": 2, "foma-mission": 5, "foma-claim": 5 };

  /* ---------- store: localStorage when available, memory otherwise ---------- */

  /* ---------- UI fragments shared by views ---------- */

        return `<label class="check ${t[i] ? "done" : ""}"><input type="checkbox" data-i="${i}" ${t[i] ? "checked" : ""}><div><b>${esc(a)}</b>${b ? `<small>${esc(b)}</small>` : ""}</div></label>`;

    },
