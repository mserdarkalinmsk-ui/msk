  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 16px rgba(15, 23, 42, .05);
  --shadow-lg: 0 24px 64px rgba(15, 23, 42, .18);
  --r: 10px; --r-sm: 7px; --r-lg: 14px;
  --side: 256px; --top: 56px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1017; --panel: #121923; --panel-2: #161f2b; --sunken: #0e151e;
    --ink: #e6edf5; --ink-2: #c3cedb; --muted: #8a9aae; --faint: #5f6f84;
    --line: #223041; --line-2: #2f4157;
    --accent: #6d8ff5; --accent-ink: #0b1017; --accent-soft: #1a2640; --accent-line: #2c3f6b;
    --good: #3fc28c; --good-soft: #10291f; --warn: #e3a646; --warn-soft: #2d2210; --risk: #f07272; --risk-soft: #331718; --info: #4cc0e6; --info-soft: #0f2732;
    --c1: #6d8ff5; --c2: #3fc28c; --c3: #e3a646; --c4: #a98bf0; --c5: #4cc0e6; --c6: #f07272;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 64px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1017; --panel: #121923; --panel-2: #161f2b; --sunken: #0e151e;
  --ink: #e6edf5; --ink-2: #c3cedb; --muted: #8a9aae; --faint: #5f6f84;
  --line: #223041; --line-2: #2f4157;
  --accent: #6d8ff5; --accent-ink: #0b1017; --accent-soft: #1a2640; --accent-line: #2c3f6b;
  --good: #3fc28c; --good-soft: #10291f; --warn: #e3a646; --warn-soft: #2d2210; --risk: #f07272; --risk-soft: #331718; --info: #4cc0e6; --info-soft: #0f2732;
  --c1: #6d8ff5; --c2: #3fc28c; --c3: #e3a646; --c4: #a98bf0; --c5: #4cc0e6; --c6: #f07272;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 64px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; letter-spacing: -.01em; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 18px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, table td.n, .kpi b { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; border-radius: var(--r-sm); background: var(--ink); color: var(--panel); text-decoration: none; }
.skip:focus { top: 12px; }

/* Shell */
.app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.brand { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 18px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); flex: none; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand b { display: block; font-size: 14px; }
.brand small { display: block; font-size: 11px; color: var(--muted); }
.nav { padding: 10px 10px 24px; flex: 1; }
.nav-group { margin-top: 14px; }
.nav-group > span { display: block; padding: 0 10px 6px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a i { width: 18px; text-align: center; font-style: normal; color: var(--faint); font-size: 13px; }
.nav a[aria-current="page"] i { color: var(--accent); }
.side-foot { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.icon-btn.menu-btn { display: none; }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs b { color: var(--ink); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.search-btn { display: flex; align-items: center; gap: 8px; height: 34px; min-width: 240px; padding: 0 10px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); color: var(--muted); cursor: pointer; }
.search-btn kbd, kbd { margin-left: auto; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; font: 11px var(--mono); color: var(--muted); background: var(--panel-2); }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); cursor: pointer; color: var(--ink-2); position: relative; }
.icon-btn:hover, .search-btn:hover { border-color: var(--line-2); color: var(--ink); }
.badge-dot { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; display: grid; place-items: center; }
.content { width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 24px 64px; }
.content:focus { outline: none; }

/* Page header */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.eyebrow { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.page-head h1 { font-size: 24px; font-weight: 700; }
.page-head p { margin-top: 6px; color: var(--muted); max-width: 760px; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Primitives */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.card-head h2, .card-head h3 { font-size: 15px; font-weight: 650; }
.card-head small, .sub { color: var(--muted); font-size: 12.5px; }
.card-body { padding: 16px 20px; }
.stack { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.split-l { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; align-items: start; }
.sticky { position: sticky; top: calc(var(--top) + 16px); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mt { margin-top: 12px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); color: var(--ink); font-weight: 550; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.risk { background: var(--risk-soft); color: var(--risk); }
.tag.info { background: var(--info-soft); color: var(--info); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }

.callout { display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel-2); font-size: 13px; }
.callout b { display: block; margin-bottom: 2px; }
.callout > i { font-style: normal; font-weight: 700; flex: none; }
.callout.warn { background: var(--warn-soft); border-color: transparent; color: var(--ink); }
.callout.warn > i { color: var(--warn); }
.callout.good { background: var(--good-soft); border-color: transparent; }
.callout.good > i { color: var(--good); }
.callout.risk { background: var(--risk-soft); border-color: transparent; }
.callout.risk > i { color: var(--risk); }
.callout.info { background: var(--info-soft); border-color: transparent; }
.callout.info > i { color: var(--info); }

/* Forms */
.field { display: grid; gap: 6px; }
.field > span, .field > label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12px; }
.input, select.input, textarea.input { width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--panel); }
textarea.input { height: auto; min-height: 80px; padding: 8px 10px; resize: vertical; }
.input:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 3px; border-radius: var(--r-sm); background: var(--sunken); }
.seg button { height: 28px; padding: 0 12px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-2); font-size: 12.5px; font-weight: 550; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.form { display: grid; gap: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; }
.check input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.check b { display: block; font-size: 13px; font-weight: 600; }
.check small { display: block; color: var(--muted); font-size: 12.5px; }
.check.done { background: var(--good-soft); border-color: transparent; }
.checklist { display: grid; gap: 8px; }

/* Progress */
.bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.good > i { background: var(--good); } .bar.warn > i { background: var(--warn); } .bar.risk > i { background: var(--risk); }
.progress-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.kpi { background: var(--panel); padding: 14px 16px; min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: 12px; }
.kpi b { display: block; margin-top: 4px; font-size: 20px; font-weight: 700; letter-spacing: -.02em; overflow-wrap: anywhere; }
.kpi b.text { font-size: 14.5px; letter-spacing: 0; line-height: 1.35; }
.kpi span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.hero-main { padding: 24px; }
.hero-main h1 { font-size: 26px; }
.hero-main p { color: var(--muted); margin-top: 8px; max-width: 620px; }
.tasks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
.task { display: grid; gap: 4px; align-content: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel-2); text-decoration: none; color: var(--ink); }
.task:hover { border-color: var(--accent-line); background: var(--accent-soft); }
.task i { font-style: normal; width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); color: var(--accent); font-size: 13px; margin-bottom: 4px; }
.task b { font-size: 13px; font-weight: 600; }
.task small { color: var(--muted); font-size: 12px; line-height: 1.4; }
.modules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.module { display: flex; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--panel); text-decoration: none; color: var(--ink); box-shadow: var(--shadow); }
.module:hover { border-color: var(--accent-line); }
.module .ico { flex: none; width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; }
.module b { display: block; font-size: 14px; }
.module small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.module .tag { margin-top: 8px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 28px 0 12px; }
.section-title h2 { font-size: 16px; font-weight: 650; }

/* Lifecycle stepper */
.stepper { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.step { flex: none; display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 6px; border: 1px solid var(--line); border-radius: 17px; background: var(--panel); color: var(--ink-2); font-size: 12.5px; font-weight: 550; cursor: pointer; text-decoration: none; }
.step em { font-style: normal; width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; background: var(--sunken); color: var(--muted); font-size: 11px; font-weight: 700; }
.step.done em { background: var(--good-soft); color: var(--good); }
.step[aria-current="step"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.step[aria-current="step"] em { background: var(--accent); color: var(--accent-ink); }
.uci { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.uci > div { background: var(--panel); padding: 12px 14px; }
.uci small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); margin-bottom: 4px; }
.uci > div:nth-child(2) small { color: var(--good); }
.uci > div:nth-child(3) small { color: var(--warn); }
.accordion details { border-top: 1px solid var(--line); }
.accordion details:first-child { border-top: 0; }
.accordion summary { display: flex; align-items: center; gap: 8px; padding: 12px 0; cursor: pointer; font-weight: 600; list-style: none; }
.accordion summary::-webkit-details-marker { display: none; }
.accordion summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; font-size: 18px; line-height: 1; }
.accordion details[open] summary::after { content: "−"; }
.accordion details > div { padding: 0 0 14px; color: var(--ink-2); }
.stage-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
.stage-nav .btn { white-space: normal; height: auto; min-height: 34px; padding-top: 6px; padding-bottom: 6px; text-align: center; min-width: 0; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--panel-2); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t tr:last-child td { border-bottom: 0; }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tr.hl td { background: var(--accent-soft); }
table.t td small { display: block; color: var(--muted); font-size: 12px; }
table.t tfoot td { font-weight: 700; background: var(--panel-2); border-top: 1px solid var(--line-2); }
.visa td.c { text-align: center; }
.visa button { width: 26px; height: 26px; border-radius: 6px; border: 1px dashed var(--line-2); background: transparent; color: var(--faint); cursor: pointer; font-weight: 700; }
.visa button.req { border-style: solid; border-color: var(--accent-line); color: var(--accent); }
.visa button.ok { background: var(--good); border-color: var(--good); color: #fff; }

/* Decision result */
.decision { overflow: hidden; }
.decision-hero { padding: 20px; border-bottom: 1px solid var(--line); background: var(--panel-2); border-left: 4px solid var(--good); }
.decision-hero.warn { border-left-color: var(--warn); }
.decision-hero.risk { border-left-color: var(--risk); }
.decision-hero .eyebrow { color: var(--muted); }
.decision-hero h2 { font-size: 24px; font-weight: 750; }
.decision-hero p { margin-top: 6px; color: var(--ink-2); }
.decision-hero .row { margin-top: 12px; }
.decision-body { padding: 16px 20px 20px; display: grid; gap: 18px; }
.block h3 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.reasons { display: grid; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.reasons > div { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); font-size: 13px; }
.reasons > div:first-child { border-top: 0; }
.reasons b { font-weight: 600; }
.reasons span { color: var(--ink-2); }
.docs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.docs > div { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); font-size: 13px; }
.docs b { display: block; font-weight: 600; }
.docs span { color: var(--muted); font-size: 12.5px; }
.actions-list { display: grid; gap: 8px; counter-reset: a; }
.actions-list > div { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; align-items: start; font-size: 13px; }
.actions-list > div::before { counter-increment: a; content: counter(a); width: 24px; height: 24px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 12px; }
.actions-list b { display: block; font-weight: 600; }
.actions-list span { color: var(--muted); }
.score { display: flex; align-items: center; gap: 14px; }
.ring { --p: 0; width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunken) 0); }
.ring b { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.score.good .ring { background: conic-gradient(var(--good) calc(var(--p) * 1%), var(--sunken) 0); }
.score.warn .ring { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--sunken) 0); }
.score.risk .ring { background: conic-gradient(var(--risk) calc(var(--p) * 1%), var(--sunken) 0); }
.score h4 { font-size: 14px; }
.score p { color: var(--muted); font-size: 13px; }
.scale { position: relative; margin: 6px 0 22px; }
.scale .track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--good) 0 3%, var(--accent) 3% 30%, var(--warn) 30% 100%); opacity: .35; }
.scale .pin { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.scale .labels { position: absolute; inset: 14px 0 auto; font-size: 11.5px; color: var(--muted); }
.scale .labels span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.scale .labels span:first-child { transform: none; }
.scale .labels span:last-child { transform: translateX(-100%); }
.fit { display: grid; gap: 8px; }
.fit > div { display: grid; grid-template-columns: 160px minmax(0, 1fr) 54px; gap: 10px; align-items: center; font-size: 13px; }
.fit em { font-style: normal; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Flow (role handover) */
.flow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.flow button { display: grid; gap: 2px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); cursor: pointer; }
.flow button small { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .06em; }
.flow button b { font-size: 13px; }
.flow button span { font-size: 12px; color: var(--muted); }
.flow button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.detail-grid > div { padding: 12px 14px; border-radius: var(--r); background: var(--panel-2); border: 1px solid var(--line); font-size: 13px; }
.detail-grid small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }

/* Timeline */
.timeline { display: grid; gap: 0; }
.tl { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.tl-dot { display: flex; flex-direction: column; align-items: center; }
.tl-dot button { width: 28px; height: 28px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--panel); color: var(--muted); font-size: 11px; font-weight: 700; cursor: pointer; }
.tl-dot button.ok { background: var(--good); border-color: var(--good); color: #fff; }
.tl-dot::after { content: ""; flex: 1; width: 2px; background: var(--line); margin: 2px 0; }
.tl:last-child .tl-dot::after { display: none; }
.tl-body { padding-bottom: 14px; }
.tl-body summary { cursor: pointer; font-weight: 600; padding: 4px 0; list-style: none; }
.tl-body summary::-webkit-details-marker { display: none; }
.tl-body summary small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.tl-body p, .tl-body ul { color: var(--ink-2); font-size: 13px; margin-top: 4px; }

.pairs { display: grid; gap: 8px; }
.pairs > div { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13px; }
.pairs > div > div { background: var(--panel); padding: 10px 12px; }
.pairs .do::before { content: "✓ Do"; display: block; font-size: 11px; font-weight: 700; color: var(--good); margin-bottom: 2px; }
.pairs .dont::before { content: "✕ Avoid"; display: block; font-size: 11px; font-weight: 700; color: var(--risk); margin-bottom: 2px; }

/* Lists & cards */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.tile { display: grid; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); text-align: left; color: var(--ink); text-decoration: none; cursor: pointer; }
.tile:hover { border-color: var(--accent-line); }
.tile b { font-size: 13.5px; }
.tile small { color: var(--muted); font-size: 12.5px; }
.tree { font-size: 13px; }
.tree details { margin-left: 4px; }
.tree summary { cursor: pointer; padding: 5px 0; font-weight: 600; }
.tree ul { list-style: none; padding-left: 18px; border-left: 1px dashed var(--line-2); margin-left: 6px; }
.tree li { padding: 3px 0; color: var(--ink-2); }
.tree li::before { content: "▫ "; color: var(--faint); }

/* Scenario */
.scenario { padding: 16px 18px; }
.scenario h3 { font-size: 15px; margin: 6px 0 2px; }
.scenario .q { color: var(--ink-2); }
.opts { display: grid; gap: 6px; margin-top: 10px; }
.opts button { text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--panel); cursor: pointer; font-size: 13px; }
.opts button:hover:not(:disabled) { border-color: var(--accent-line); }
.opts button.right { background: var(--good-soft); border-color: var(--good); }
.opts button.wrong { background: var(--risk-soft); border-color: var(--risk); }
.opts button:disabled { cursor: default; }
.feedback { margin-top: 10px; }

/* Analysis */
.upload { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.drop { position: relative; display: grid; gap: 4px; padding: 14px; border: 1.5px dashed var(--line-2); border-radius: var(--r); background: var(--panel-2); cursor: pointer; }
.drop:hover, .drop.drag { border-color: var(--accent); background: var(--accent-soft); }
.drop.ok { border-style: solid; border-color: var(--good); background: var(--good-soft); }
.drop.err { border-style: solid; border-color: var(--risk); background: var(--risk-soft); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.drop b { font-size: 13px; }
.drop small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); cursor: pointer; font-size: 12.5px; font-weight: 550; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.chip .x { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 0 0 0 2px; }
.hbar { display: grid; grid-template-columns: 170px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 13px; padding: 5px 0; }
.hbar .track { position: relative; height: 10px; border-radius: 5px; background: var(--sunken); overflow: hidden; }
.hbar .track i { position: absolute; inset: 0 auto 0 0; border-radius: inherit; }
.hbar .track i.s { background: var(--accent); }
.hbar .track i.c { background: color-mix(in srgb, var(--accent) 40%, transparent); }
.hbar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.hbar.over em { color: var(--risk); font-weight: 700; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.project-row { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)) auto; gap: 12px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; }
.project-row:first-child { border-top: 0; }
.project-row small { display: block; color: var(--muted); font-size: 12px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 14px; margin-bottom: 4px; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(15, 23, 42, .4); display: none; }
.overlay.open { display: block; }
.palette { position: fixed; z-index: 70; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); display: none; overflow: hidden; }
.palette.open { display: block; }
.palette input { width: 100%; height: 52px; padding: 0 18px; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-size: 15px; outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 52vh; overflow-y: auto; }
.palette li a { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 9px 12px; border-radius: var(--r-sm); text-decoration: none; color: var(--ink); }
.palette li a small { grid-column: 1; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette li a .tag { grid-row: 1 / span 2; grid-column: 2; align-self: center; }
.palette li a[aria-selected="true"], .palette li a:hover { background: var(--accent-soft); }
.palette .hint { padding: 8px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; gap: 14px; }
.drawer { position: fixed; z-index: 70; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 18px; height: var(--top); border-bottom: 1px solid var(--line); flex: none; }
.drawer-body { padding: 18px; overflow-y: auto; display: grid; gap: 14px; align-content: start; }
.case-item { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); }
.case-item header { display: flex; justify-content: space-between; gap: 8px; }
.case-item b { font-size: 13.5px; }
.case-item small { color: var(--muted); font-size: 12px; }
.toast { position: fixed; z-index: 80; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: var(--r); background: var(--ink); color: var(--panel); font-size: 13px; transition: .2s; box-shadow: var(--shadow-lg); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal { position: fixed; z-index: 70; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); display: none; }
.modal.open { display: block; }

/* Responsive */
@media (max-width: 1100px) {
  .split, .split-l, .hero { grid-template-columns: minmax(0, 1fr); }
  .sticky { position: static; }
  .tasks, .g4, .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .modules, .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .project-row { grid-template-columns: minmax(0, 1fr) repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 65; left: 0; top: 0; width: min(300px, 86vw); transform: translateX(-100%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
  .side.open { transform: none; }
  .icon-btn.menu-btn { display: grid; }
  .top { padding: 0 16px; }
  .search-btn { min-width: 0; width: 34px; padding: 0; justify-content: center; }
  .search-btn span, .search-btn kbd { display: none; }
  .content { padding: 16px 16px 48px; }
  .page-head { flex-direction: column; align-items: flex-start; }
  .g2, .docs, .detail-grid, .upload, .uci { grid-template-columns: minmax(0, 1fr); }
  .flow { grid-auto-flow: row; }
  .reasons > div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .hbar { grid-template-columns: 110px minmax(0, 1fr) 52px; }
  .fit > div { grid-template-columns: 120px minmax(0, 1fr) 44px; }
  .pairs > div { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .tasks, .modules, .g3, .g4, .kpis { grid-template-columns: minmax(0, 1fr); }
  .project-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .page-head h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
@media print {
  .side, .top, .overlay, .drawer, .palette, .toast, .no-print { display: none !important; }
  .app { display: block; }
  body { background: #fff; color: #000; }
  .card { box-shadow: none; break-inside: avoid; }
  .content { max-width: none; padding: 0; }
}

/* ---------- Colour & motion layer ---------- */
:root[data-tone="2"] { --accent: var(--c2); --accent-soft: var(--good-soft); --accent-line: color-mix(in srgb, var(--c2) 40%, transparent); }
:root[data-tone="3"] { --accent: var(--c3); --accent-soft: var(--warn-soft); --accent-line: color-mix(in srgb, var(--c3) 40%, transparent); }
:root[data-tone="4"] { --accent: var(--c4); --accent-soft: color-mix(in srgb, var(--c4) 13%, var(--panel)); --accent-line: color-mix(in srgb, var(--c4) 40%, transparent); }
:root[data-tone="5"] { --accent: var(--c5); --accent-soft: var(--info-soft); --accent-line: color-mix(in srgb, var(--c5) 40%, transparent); }
:root[data-tone="6"] { --accent: var(--c6); --accent-soft: var(--risk-soft); --accent-line: color-mix(in srgb, var(--c6) 40%, transparent); }
:root[data-tone] .btn.primary { color: #fff; }
.content > div { animation: viewIn .28s ease both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px); } }
.page-head { position: relative; padding: 20px 22px; border-radius: var(--r-lg); border: 1px solid var(--accent-line); background: radial-gradient(120% 140% at 0% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 55%), linear-gradient(135deg, var(--accent-soft), var(--panel) 70%); overflow: hidden; }
.page-head::after { content: ""; position: absolute; right: -40px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); pointer-events: none; }
.page-head > * { position: relative; z-index: 1; }
.hero-main { background: radial-gradient(90% 120% at 100% 0%, color-mix(in srgb, var(--c4) 16%, transparent), transparent 60%), radial-gradient(80% 120% at 0% 100%, color-mix(in srgb, var(--c2) 13%, transparent), transparent 60%), var(--panel); }
.hero-main h1 { background: linear-gradient(90deg, var(--ink), var(--c1) 60%, var(--c4)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.task, .module, .tile, .card.scenario, .flow button, .journey a { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease; }
.task { --tone: var(--accent); border-top: 3px solid var(--tone); }
.task i { background: color-mix(in srgb, var(--tone) 14%, var(--panel)); color: var(--tone); border-color: transparent; }
.task:hover, .module:hover, .tile:hover, .journey a:hover { transform: translateY(-3px); box-shadow: 0 12px 28px color-mix(in srgb, var(--tone, var(--accent)) 22%, transparent); border-color: color-mix(in srgb, var(--tone, var(--accent)) 45%, transparent); background: var(--panel); }
.module { --tone: var(--accent); }
.module .ico { background: linear-gradient(135deg, var(--tone), color-mix(in srgb, var(--tone) 55%, #fff)); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--tone) 35%, transparent); }
.nav a i { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--sunken); }
.nav a[aria-current="page"] i { background: var(--accent); color: #fff; }
.nav-group > span { color: var(--muted); }
.journey { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; counter-reset: j; }
.journey li { position: relative; --tone: var(--accent); }
.journey a { display: grid; gap: 2px; height: 100%; padding: 12px; border-radius: var(--r); border: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--tone) 10%, var(--panel)), var(--panel)); text-decoration: none; color: var(--ink); }
.journey em { font-style: normal; width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; background: var(--tone); color: #fff; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
.journey b { font-size: 13px; }
.journey small { color: var(--muted); font-size: 11.5px; }
.journey li:not(:last-child)::after { content: "›"; position: absolute; right: -8px; top: 50%; transform: translateY(-50%); color: var(--faint); font-size: 16px; z-index: 1; }
.next-step { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; padding: 14px 18px; border-radius: var(--r-lg); background: linear-gradient(90deg, var(--accent-soft), var(--panel)); border: 1px solid var(--accent-line); font-size: 13px; color: var(--muted); }
.next-step a { display: grid; text-align: right; text-decoration: none; color: var(--accent); padding: 6px 12px; border-radius: var(--r-sm); transition: background .15s; }
.next-step a:hover { background: var(--panel); }
.next-step small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.decision-hero { background: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--good) 16%, transparent), transparent 60%), var(--panel-2); }
.decision-hero.warn { background: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--warn) 18%, transparent), transparent 60%), var(--panel-2); }
.decision-hero.risk { background: radial-gradient(120% 160% at 100% 0%, color-mix(in srgb, var(--risk) 16%, transparent), transparent 60%), var(--panel-2); }
.decision-hero h2 { animation: pop .35s ease both; }
@keyframes pop { from { opacity: .3; transform: scale(.97); } }
.bar > i, .hbar .track i { transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.bar > i { background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--c4))); }
.kpi { position: relative; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); opacity: .7; }
.kpis .kpi:nth-child(2)::before { background: var(--c2); } .kpis .kpi:nth-child(3)::before { background: var(--c3); } .kpis .kpi:nth-child(4)::before { background: var(--c4); }
.step[aria-current="step"] { box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 25%, transparent); }
.check { transition: background .15s, border-color .15s, transform .1s; }
.check:hover { border-color: var(--accent-line); }
.check:active { transform: scale(.995); }
.opts button { transition: background .15s, border-color .15s, transform .1s; }
.opts button:hover:not(:disabled) { transform: translateX(3px); }
@media (max-width: 1100px) { .journey { grid-template-columns: repeat(4, minmax(0, 1fr)); } .journey li::after { display: none; } }
@media (max-width: 560px) { .journey { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .next-step { flex-direction: column; align-items: stretch; } .next-step a { text-align: left; } }
.hero-main .journey { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hero-main .journey li:nth-child(4n)::after { display: none; }

/* Reference layer */
abbr[title] { text-decoration: underline dotted color-mix(in srgb, var(--accent) 70%, transparent); text-underline-offset: 3px; cursor: help; }
mark.amt { background: color-mix(in srgb, var(--accent) 12%, transparent); color: inherit; padding: 0 3px; border-radius: 4px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.glossary { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.glossary .term { font-size: 17px; color: var(--accent); }
.dtree { display: grid; gap: 18px; justify-items: center; }
.tn { padding: 10px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: var(--panel); text-align: center; min-width: 180px; opacity: .55; transition: .25s; }
.tn b { display: block; } .tn small { color: var(--muted); font-size: 12px; }
.tn.on { opacity: 1; border-color: var(--accent); box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 25%, transparent); transform: translateY(-2px); }
.tn.root { background: var(--accent-soft); }
.tn.good.on { border-color: var(--good); } .tn.warn.on { border-color: var(--warn); } .tn.risk.on { border-color: var(--risk); }
.tbranches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; position: relative; }
.tb { display: grid; gap: 8px; justify-items: center; align-content: start; padding-top: 22px; position: relative; }
.tb::before { content: ""; position: absolute; top: -18px; left: 50%; width: 2px; height: 36px; background: var(--line-2); }
.tb.on::before { background: var(--accent); width: 3px; }
.tb > span { font-size: 12px; font-weight: 700; color: var(--muted); background: var(--sunken); padding: 2px 8px; border-radius: 10px; }
.tb.on > span { background: var(--accent); color: #fff; }
@media (max-width: 860px) { .tbranches { grid-template-columns: minmax(0, 1fr); } .tn { min-width: 0; width: 100%; } }

/* Home hubs: the four entry points of the guide */
.hubs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.hub { --tone: var(--accent); position: relative; display: grid; align-content: start; gap: 6px; min-height: 230px; padding: 20px; border-radius: 18px; text-decoration: none; color: var(--ink); border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent); background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--tone) 30%, transparent), transparent 60%), linear-gradient(160deg, color-mix(in srgb, var(--tone) 16%, var(--panel)), var(--panel)); box-shadow: var(--shadow); overflow: hidden; transition: transform .2s ease, box-shadow .2s ease; }
.hub:hover { transform: translateY(-4px); box-shadow: 0 18px 40px color-mix(in srgb, var(--tone) 28%, transparent); }
.hub small { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hub i { font-style: normal; width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; margin: 10px 0 8px; font-size: 22px; color: #fff; background: linear-gradient(135deg, var(--tone), color-mix(in srgb, var(--tone) 55%, #fff)); box-shadow: 0 8px 20px color-mix(in srgb, var(--tone) 40%, transparent); }
.hub b { font-size: 24px; font-weight: 800; letter-spacing: -.02em; text-transform: uppercase; }
.hub em { font-style: normal; font-size: 12.5px; font-weight: 700; color: var(--tone); }
.hub span { font-size: 13px; color: var(--ink-2); padding-right: 44px; }
.hub u { position: absolute; right: 18px; bottom: 18px; width: 38px; height: 38px; border-radius: 19px; display: grid; place-items: center; text-decoration: none; background: var(--panel); box-shadow: var(--shadow); font-weight: 700; transition: transform .2s; }
.hub:hover u { transform: translateX(3px); background: var(--tone); color: #fff; }
@media (max-width: 1100px) { .hubs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .hubs { grid-template-columns: minmax(0, 1fr); } .hub { min-height: 0; } }

/* =====================================================================
   Corporate futuristic theme (approved option 9). Overrides the base
   tokens and components above; layout and behaviour are unchanged.
   ===================================================================== */
:root {
  --font: "Space Grotesk", "Inter", -apple-system, "Segoe UI", Arial, sans-serif;
  --bg: #f6f8fb; --panel: #ffffff; --panel-2: #f8fafd; --sunken: #eef2f7;
  --ink: #14213d; --ink-2: #33415c; --muted: #5b6680; --faint: #8a94aa;
  --line: #e1e7f0; --line-2: #cfd8e5;
  --navy: #1e3a6e; --accent: #2f6fd6; --accent-soft: #e9f0fc; --accent-line: #c5d6f3;
  --c1: #2f6fd6; --c2: #16938a; --c3: #c98a1a; --c4: #5b4bb7; --c5: #1a8fb0; --c6: #c74444;
  --good: #16856f; --warn: #b07816; --risk: #c43d3d; --info: #1a7fa8;
  --glass: rgba(255, 255, 255, .78);
  --shadow: 0 1px 2px rgba(20, 40, 80, .04), 0 12px 32px -18px rgba(20, 40, 80, .22);
  --shadow-lg: 0 30px 70px -30px rgba(20, 40, 80, .35);
  --r: 12px; --r-sm: 9px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --navy: #8fb0ff; --glass: rgba(18, 25, 35, .78); --c1: #6d9cf0; --c2: #3cc0b3; --c3: #e3ad4d; --c4: #9b8cf0; } }
:root[data-theme="dark"] { --navy: #8fb0ff; --glass: rgba(18, 25, 35, .78); --c1: #6d9cf0; --c2: #3cc0b3; --c3: #e3ad4d; --c4: #9b8cf0; }

body { font-family: var(--font); letter-spacing: -.003em; }
/* Ambient background: drifting soft light and a receding grid, fixed behind everything. */
body::before, body::after { content: ""; position: fixed; z-index: -1; pointer-events: none; }
body::before { inset: -20%; background: radial-gradient(30% 35% at 15% 10%, color-mix(in srgb, var(--c1) 16%, transparent), transparent 70%), radial-gradient(28% 32% at 90% 20%, color-mix(in srgb, var(--c2) 13%, transparent), transparent 70%), radial-gradient(30% 35% at 60% 100%, color-mix(in srgb, var(--c4) 9%, transparent), transparent 70%); animation: fxDrift 22s ease-in-out infinite alternate; }
body::after { left: -50%; right: -50%; bottom: -35%; height: 70%; background-image: linear-gradient(color-mix(in srgb, var(--navy) 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--navy) 7%, transparent) 1px, transparent 1px); background-size: 60px 60px; transform: perspective(520px) rotateX(62deg); mask-image: linear-gradient(to top, #000 5%, transparent 80%); -webkit-mask-image: linear-gradient(to top, #000 5%, transparent 80%); animation: fxGrid 7s linear infinite; }
@keyframes fxDrift { to { transform: translate(4%, 3%) scale(1.08); } }
@keyframes fxGrid { to { background-position: 0 60px; } }
@property --fxa { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes fxSpin { to { --fxa: 360deg; } }

/* Shell */
.side { background: var(--glass); backdrop-filter: blur(18px) saturate(140%); border-right: 1px solid var(--line); }
.brand-mark { background: var(--navy); color: #fff; border-radius: 11px; width: 32px; height: 32px; box-shadow: 0 6px 16px color-mix(in srgb, var(--navy) 30%, transparent); }
.brand b { letter-spacing: .04em; text-transform: uppercase; font-size: 13px; }
.brand small, .nav-group > span, .eyebrow, kbd, .kpi small, .block h3, table.t th, .fx-num, .fx-bar, .fx-status, .tag { font-family: var(--mono); }
.brand small { letter-spacing: .12em; text-transform: uppercase; font-size: 9.5px; }
.nav-group > span { letter-spacing: .14em; font-size: 10px; }
.nav a { border-radius: 10px; font-weight: 500; }
.nav a[aria-current="page"] { background: #fff; color: var(--accent); box-shadow: var(--shadow); }
:root[data-theme="dark"] .nav a[aria-current="page"] { background: var(--panel-2); }
.top { background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(16px); }
.search-btn, .icon-btn { border-radius: 12px; background: var(--glass); backdrop-filter: blur(10px); }
.badge-dot { background: var(--navy); color: #fff; }

/* Page header: open layout with an animated gradient title instead of a coloured box. */
.page-head { background: none; border: 0; padding: 8px 0 4px; overflow: visible; }
.page-head::after { display: none; }
.page-head h1 { font-size: 34px; font-weight: 700; letter-spacing: -.03em; background: linear-gradient(90deg, var(--ink) 0 40%, var(--accent), var(--c2), var(--ink)); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxFlow 9s linear infinite; }
@keyframes fxFlow { to { background-position: -250% 0; } }
.eyebrow { letter-spacing: .16em; font-size: 11px; font-weight: 500; }

/* Surfaces */
.card, .module, .tile, .kpis, .task, .journey a { background: var(--glass); backdrop-filter: blur(14px); border-color: color-mix(in srgb, var(--line) 80%, #fff); }
.card:not(.sticky) { position: relative; }
.kpi { background: transparent; }
.kpis { gap: 0; } .kpi + .kpi { border-left: 1px solid var(--line); }
.kpi b { font-weight: 700; letter-spacing: -.03em; }
.btn { border-radius: 10px; font-weight: 600; transition: transform .15s, box-shadow .15s, background .15s; }
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; box-shadow: 0 8px 20px -8px color-mix(in srgb, var(--navy) 60%, transparent); }
:root[data-tone] .btn.primary { background: var(--accent); border-color: var(--accent); }
.tag { letter-spacing: .02em; font-weight: 500; }
.module .ico, .task i { box-shadow: 0 8px 18px -6px var(--tone, var(--accent)); }
/* Hover: lift plus a rotating light along the border, as on the home cards. */
.module, .tile, .task { position: relative; overflow: hidden; }
.module::before, .tile::before, .task::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: conic-gradient(from var(--fxa), transparent 0 70%, var(--tone, var(--accent)) 86%, transparent); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; opacity: 0; transition: opacity .3s; animation: fxSpin 4s linear infinite; pointer-events: none; }
.module:hover::before, .tile:hover::before, .task:hover::before { opacity: 1; }
.step[aria-current="step"] em { background: var(--accent); }
.decision-hero h2 { letter-spacing: -.03em; }
.content > div { animation: fxIn .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes fxIn { from { opacity: 0; transform: translateY(10px); } }

/* Home */
.fx-hero { padding: 26px 4px 6px; }
.fx-status { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--glass); color: var(--navy); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.fx-status b { width: 7px; height: 7px; border-radius: 50%; background: var(--c2); box-shadow: 0 0 8px var(--c2); animation: fxPulse 1.6s infinite; }
@keyframes fxPulse { 50% { opacity: .3; } }
.fx-hero h1 { margin: 22px 0 14px; font-size: clamp(40px, 6vw, 74px); line-height: .96; letter-spacing: -.045em; font-weight: 700; color: var(--ink); }
.fx-hero h1 span { background: linear-gradient(90deg, var(--navy), var(--c1), var(--c2), var(--navy)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: fxFlow 8s linear infinite; }
.fx-hero p { max-width: 640px; font-size: 17px; color: var(--muted); }
.fx-hubs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; margin: 40px 0 20px; perspective: 1200px; }
.fx-hub { position: relative; display: grid; align-content: start; gap: 10px; min-height: 360px; padding: 26px; border-radius: 26px; overflow: hidden; text-decoration: none; color: var(--ink); background: linear-gradient(160deg, color-mix(in srgb, var(--panel) 94%, transparent), color-mix(in srgb, var(--panel) 62%, transparent)); border: 1px solid color-mix(in srgb, var(--panel) 90%, var(--line)); backdrop-filter: blur(14px); box-shadow: var(--shadow); transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s, border-color .35s; animation: fxRise .8s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes fxRise { from { opacity: 0; transform: translateY(40px) rotateX(12deg); } }
.fx-hub::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; background: conic-gradient(from var(--fxa), transparent 0 70%, var(--c) 86%, transparent); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; animation: fxSpin 5s linear infinite; pointer-events: none; }
.fx-hub::after { content: ""; position: absolute; width: 260px; height: 260px; right: -90px; top: -90px; border-radius: 50%; background: radial-gradient(circle, var(--c), transparent 65%); opacity: .12; transition: .4s; pointer-events: none; }
.fx-hub:hover { transform: translateY(-8px); border-color: var(--c); box-shadow: 0 30px 60px -28px var(--c); }
.fx-hub:hover::after { opacity: .3; transform: scale(1.3); }
.fx-num { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--c); }
.fx-ico { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; margin: 10px 0; font-size: 28px; color: #fff; background: var(--c); box-shadow: 0 12px 30px -6px var(--c); }
.fx-hub h2 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.fx-hub em { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--c); }
.fx-hub p { color: var(--muted); font-size: 14.5px; line-height: 1.5; }
.fx-meter { margin-top: auto; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.fx-meter i { display: block; height: 100%; width: var(--w); background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 40%, #fff)); animation: fxLoad 1.6s cubic-bezier(.2, .8, .2, 1) .4s both; }
@keyframes fxLoad { from { width: 0; } }
.fx-bar { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px solid color-mix(in srgb, var(--ink) 8%, transparent); font-size: 12px; color: var(--muted); }
.fx-bar u { text-decoration: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--c); color: var(--c); transition: .3s; }
.fx-hub:hover .fx-bar u { background: var(--c); color: #fff; transform: translateX(4px); }
@media (max-width: 1100px) { .fx-hubs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .fx-hubs { grid-template-columns: minmax(0, 1fr); } .fx-hub { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { body::before, body::after, .fx-hub, .fx-hub::before, .page-head h1, .fx-hero h1 span { animation: none !important; } }
@media print { body::before, body::after { display: none; } }

.brand small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* Threshold scale: alternate label rows so close thresholds never overlap. */
.scale { margin-bottom: 40px; }
.scale .labels span:nth-child(even) { top: 18px; }

/* ---------- Visual tools: tabs, process map, charts ---------- */
.tablist { position: relative; display: flex; gap: 4px; overflow-x: auto; padding: 4px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(12px); scrollbar-width: none; }
.tablist button { position: relative; z-index: 1; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border: 0; border-radius: 10px; background: none; color: var(--muted); font-weight: 600; cursor: pointer; transition: color .2s; }
.tablist button[aria-selected="true"] { color: #fff; }
.tablist button em { font-style: normal; font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 9px; background: var(--sunken); color: var(--muted); }
.tablist button[aria-selected="true"] em { background: rgba(255, 255, 255, .22); color: #fff; }
.tab-ink { position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 10px; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, var(--c2))); box-shadow: 0 8px 18px -8px var(--accent); transition: left .35s cubic-bezier(.2, .8, .2, 1), width .35s cubic-bezier(.2, .8, .2, 1); }
.tabpanel { padding-top: 16px; animation: fxIn .35s cubic-bezier(.2, .8, .2, 1) both; }
.decision-body .tabpanel { padding-top: 12px; }

.pmap { padding: 18px 20px; }
.pmap-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.pmap-head b { display: block; font-size: 15px; }
.pmap-ring { --p: 0; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--sunken) 0); }
.pmap-ring span { width: 42px; height: 42px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font: 600 12px var(--mono); }
.pmap-phases { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.pmap-phase { position: relative; display: grid; align-content: start; gap: 6px; padding: 10px; border-radius: 14px; background: color-mix(in srgb, var(--c) 6%, transparent); border-top: 3px solid var(--c); }
.pmap-phase:not(:last-child)::after { content: "›"; position: absolute; right: -9px; top: 6px; color: var(--faint); font-size: 18px; }
.pmap-phase small { font: 500 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--c); margin-bottom: 2px; }
.pnode { position: relative; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-size: 12.5px; font-weight: 500; background: var(--panel); border: 1px solid var(--line); overflow: hidden; transition: transform .2s, box-shadow .2s, border-color .2s; }
.pnode::after { content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: var(--pr); background: var(--good); }
.pnode em { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 10.5px var(--mono); font-style: normal; background: var(--sunken); color: var(--muted); }
.pnode span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pnode:hover { transform: translateY(-2px); border-color: var(--c); }
.pnode.done em { background: var(--good); color: #fff; }
.pnode.part em { background: color-mix(in srgb, var(--good) 25%, var(--panel)); color: var(--good); }
.pnode.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); color: var(--ink); box-shadow: 0 10px 22px -12px var(--c); }
.pnode.on em { background: var(--c); color: #fff; box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); animation: fxPulse 2s infinite; }
.stage-title { display: flex; gap: 16px; align-items: flex-start; }
.stage-no { flex: none; font: 700 44px/1 var(--font); letter-spacing: -.05em; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 30%, transparent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stage-title h2 { font-size: 22px; letter-spacing: -.02em; margin: 2px 0 4px; }
.uci > div { transition: transform .2s; } .uci > div:hover { transform: translateY(-2px); }
@media (max-width: 1100px) { .pmap-phases { grid-template-columns: repeat(3, minmax(0, 1fr)); } .pmap-phase::after { display: none; } }
@media (max-width: 560px) { .pmap-phases { grid-template-columns: minmax(0, 1fr); } }

.viz-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.donut { display: flex; align-items: center; gap: 20px; margin-top: 8px; }
.donut svg { width: 160px; flex: none; }
.donut .arc { transition: stroke-dasharray .8s cubic-bezier(.2, .8, .2, 1); animation: fxArc 1.2s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes fxArc { from { stroke-dasharray: 0 400; } }
.donut .d-main { font: 700 22px var(--font); fill: var(--ink); }
.donut .d-sub { font: 500 10px var(--mono); fill: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.donut ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; flex: 1; }
.donut li { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; font-size: 13.5px; }
.donut li i { width: 12px; height: 12px; border-radius: 4px; }
.donut li b { font-variant-numeric: tabular-nums; }
.pace { width: 100%; height: auto; margin-top: 6px; overflow: visible; }
.pace .grid { stroke: var(--line); stroke-dasharray: 3 4; }
.pace text { font: 500 10px var(--mono); fill: var(--muted); }
.pace .ideal { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 5; }
.pace .actual { fill: none; stroke: var(--c1); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 600; animation: fxDraw 1.4s ease both; }
.pace .proj { stroke: var(--c2); stroke-width: 2.5; stroke-dasharray: 6 5; }
.pace .proj.bad, .pace .dot2.bad { stroke: var(--risk); fill: var(--risk); }
.pace .today { stroke: var(--line-2); }
.pace .dot { fill: var(--c1); stroke: var(--panel); stroke-width: 3; }
.pace .dot2 { fill: var(--c2); }
.pace .lbl { fill: var(--ink-2); font-weight: 600; }
@keyframes fxDraw { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
@media (max-width: 860px) { .viz-row { grid-template-columns: minmax(0, 1fr); } .donut { flex-direction: column; align-items: stretch; } .donut svg { margin: auto; } }

/* ---------- no-sidebar shell ---------- */
.app.no-side { grid-template-columns: minmax(0, 1fr); }
.app.no-side .top { display: flex; align-items: center; gap: 16px; }
.app.no-side .top .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; padding: 0; border: 0; }
.app.no-side .top .top-actions { margin-left: auto; }
.app.no-side .crumbs { max-width: 1240px; width: 100%; margin: 14px auto 0; padding: 0 28px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; }
.app.no-side .content { max-width: 1240px; width: 100%; margin: 0 auto; }
.foot { max-width: 1240px; width: 100%; margin: 24px auto 0; padding: 16px 28px 28px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 640px) { .app.no-side .crumbs, .foot { padding: 0 16px; } .app.no-side .top .brand small { display: none; } }

/* ---------- Projects: phase chevrons + module columns ---------- */
.pj-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap; margin-bottom: 22px; }
.pj-kpis { display: flex; gap: 10px; flex-wrap: wrap; }
.pj-kpis div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 16px; min-width: 120px; }
.pj-kpis small, .pj-chev small, .pj-mod em, .pj-badge, .pj-flow, .pj-box h3 { font-family: var(--mono); }
.pj-kpis small { font-size: 10.5px; letter-spacing: .1em; color: var(--muted); }
.pj-kpis b { display: block; font-size: 22px; color: var(--navy); }
.pj-chev, .pj-cols { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 6px; }
.pj-chev div { background: var(--c); color: #fff; padding: 14px 22px 14px 34px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%, 18px 50%); }
.pj-chev div:first-child { clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); border-radius: 10px 0 0 10px; padding-left: 22px; }
.pj-chev div:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 18px 50%); border-radius: 0 10px 10px 0; }
.pj-chev small { font-size: 11px; letter-spacing: .14em; opacity: .8; }
.pj-chev b { display: block; font-size: 17px; }
.pj-chev span { font-size: 12.5px; opacity: .88; }
.pj-cols { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 16px 16px; padding: 18px 0 6px; }
.pj-col { padding: 0 16px; border-right: 1px dashed var(--line); display: grid; gap: 10px; align-content: start; }
.pj-col:nth-child(3) { border: 0; }
.pj-col.two { grid-template-columns: 1fr 1fr; }
.pj-mod { display: block; border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 10px; padding: 12px 14px; color: inherit; text-decoration: none; background: var(--panel); transition: box-shadow .2s, transform .2s; }
.pj-mod:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--c) 70%, transparent); }
.pj-mod.key { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--panel)), var(--panel)); }
.pj-r { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pj-mod b { font-size: 14.5px; }
.pj-mod em { font-style: normal; font-size: 10.5px; color: var(--muted); }
.pj-mod small { display: block; margin-top: 4px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.pj-badge { font-size: 10px; letter-spacing: .08em; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); padding: 2px 6px; border-radius: 5px; }
.pj-bar { display: block; height: 3px; margin-top: 8px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.pj-bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; }
.pj-flow { grid-column: 1 / -1; margin: 14px 16px 10px; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.pj-flow i { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--line-2) 0 6px, transparent 6px 12px); }
.pj-bottom { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-top: 16px; }
.pj-box { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; }
.pj-box h3 { margin: 0 0 10px; font-size: 11px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
.pj-rules { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pj-rules a { border-radius: 10px; background: var(--panel-2); padding: 10px 12px; text-decoration: none; }
.pj-rules b { display: block; color: var(--navy); font-size: 17px; }
.pj-rules span { font-size: 12px; color: var(--muted); }
.pj-links a { display: block; padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--navy); text-decoration: none; font-size: 13.5px; }
.pj-links a:last-child { border: 0; }
@media (max-width: 900px) {
  .pj-chev, .pj-cols, .pj-bottom { grid-template-columns: minmax(0, 1fr); }
  .pj-chev div, .pj-chev div:first-child, .pj-chev div:last-child { clip-path: none; border-radius: 10px; padding-left: 22px; }
  .pj-cols { border-top: 1px solid var(--line); border-radius: 16px; margin-top: 10px; }
  .pj-col { border-right: 0; border-bottom: 1px dashed var(--line); padding-bottom: 12px; }
  .pj-col.two, .pj-rules { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .pj-flow { flex-wrap: wrap; }
}
@media (max-width: 520px) { .pj-col.two { grid-template-columns: minmax(0, 1fr); } }

/* ---------- performance: no continuous repaints, no live blur ---------- */
*, *::before, *::after { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
body::before, body::after { animation: none !important; will-change: auto; }
.page-head h1, .fx-hero h1 span { animation: none !important; background-position: 0 0; }
.module::before, .tile::before, .task::before, .fx-hub::before { animation-play-state: paused; }
.module:hover::before, .tile:hover::before, .task:hover::before, .fx-hub:hover::before { animation-play-state: running; }
.top { background: color-mix(in srgb, var(--bg) 94%, transparent); }
.card, .module, .tile, .kpis, .task, .journey a, .tablist, .search-btn, .icon-btn { background: var(--panel); }

/* ---------- typography system: Inter only, one scale, one heading colour ---------- */
:root, :root[data-theme] { --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; --mono: var(--font); }
body { font-family: var(--font); font-size: 14px; line-height: 1.55; letter-spacing: 0; }
table.t td, .pj-kpis b, .pj-rules b, .kpi b, .stage-no, .tablist em { font-variant-numeric: tabular-nums; }
h1, h2, h3, h4 { font-family: var(--font); color: var(--navy); letter-spacing: -.015em; }
.page-head h1, .pj-head h1 { font-size: 32px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15; background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--navy); animation: none; }
h2, .stage-title h2 { font-size: 20px; font-weight: 650; }
h3, .card-head h3 { font-size: 15px; font-weight: 600; color: var(--ink); letter-spacing: -.005em; }
.page-head p, .lead { font-size: 15px; line-height: 1.6; color: var(--ink-2); }
small, .small { font-size: 12.5px; }
/* Labels: sentence-like small caps in Inter instead of spaced monospace. */
.eyebrow, .brand small, .kpi small, .block h3, table.t th, .fx-num, .fx-bar, .fx-status, .pmap-phase small, .pj-kpis small, .pj-chev small, .pj-box h3, .pj-flow, .donut .d-sub, .uci small { font-family: var(--font); font-weight: 600; font-size: 11.5px; letter-spacing: .06em; }
.tag, .pj-badge, .pj-mod em, .tablist button em, .fx-hub em, .pnode em, kbd { font-family: var(--font); letter-spacing: .02em; }
.brand b { font-size: 13.5px; letter-spacing: .02em; text-transform: none; }
.brand small { letter-spacing: .04em; text-transform: none; font-weight: 500; color: var(--muted); }
.fx-hero h1 { font-family: var(--font); letter-spacing: -.035em; color: var(--navy); }
.fx-hero h1 span { background: none; -webkit-background-clip: border-box; background-clip: border-box; color: var(--c1); }
.fx-hub h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; text-transform: none; }
.stage-no { font-family: var(--font); }
.pj-kpis b, .pj-rules b, .kpi b { font-weight: 700; letter-spacing: -.01em; }
/* End-of-module self-check: one compact collapsible row. */
.mq { margin-top: 28px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.mq summary { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; list-style: none; }
.mq summary::-webkit-details-marker { display: none; }
.mq summary > span:nth-child(2) { flex: 1; }
.mq summary b { display: block; font-size: 14px; }
.mq summary small { color: var(--muted); }
.mq-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.mq-body { padding: 4px 16px 16px; display: grid; gap: 14px; border-top: 1px solid var(--line); }
.mq-q { padding-top: 12px; }
.mq-q b { font-size: 13.5px; font-weight: 600; }
.mq-q .opts { margin-top: 8px; }
.mq-q p { margin: 2px 0 0; }
.mq-q .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.mq-q .opts button { width: auto; flex: 0 1 auto; padding: 6px 12px; font-size: 13px; border-radius: 999px; }

/* ---------- route track (lifecycle map) ---------- */
.rt { padding: 18px 22px 20px; }
.rt-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.rt-head b { display: block; font-size: 16px; color: var(--navy); margin-top: 2px; }
.rt-tools { display: flex; align-items: center; gap: 8px; }
.rt-arrow { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; color: var(--navy); text-decoration: none; font-weight: 600; background: var(--panel); transition: background .15s, border-color .15s; }
.rt-arrow:hover { border-color: var(--accent); background: var(--accent-soft); }
.rt-arrow.off { opacity: .35; }
.rt-scroll { overflow-x: auto; padding-bottom: 4px; }
.rt-grid { display: grid; grid-template-columns: repeat(var(--n), minmax(84px, 1fr)); min-width: calc(var(--n) * 84px); row-gap: 0; }
.rt-phase { margin: 0 3px 18px; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--c) 9%, var(--panel)); border-top: 3px solid var(--c); min-width: 0; }
.rt-phase small { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.rt-phase b { display: block; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt-phase.on { background: var(--c); }
.rt-phase.on small, .rt-phase.on b { color: #fff; }
.rt-line { position: relative; height: 0; }
.rt-line::before, .rt-line i { content: ""; position: absolute; top: 16px; left: calc(50% / var(--n)); height: 4px; border-radius: 4px; }
.rt-line::before { right: calc(50% / var(--n)); background: var(--sunken); }
.rt-line i { background: linear-gradient(90deg, var(--c1), var(--c2)); transition: width .4s ease; }
.rt-node { position: relative; display: grid; justify-items: center; gap: 8px; padding: 0 4px; text-decoration: none; color: var(--ink-2); text-align: center; }
.rt-node em { position: relative; z-index: 1; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 600 13px var(--font); font-style: normal; background: var(--panel); border: 2px solid var(--line-2); color: var(--muted); transition: transform .15s, border-color .15s; }
.rt-node span { font-size: 12px; line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rt-node u { position: absolute; top: 40px; height: 3px; left: calc(50% - 14px); max-width: 28px; background: var(--good); border-radius: 3px; text-decoration: none; }
.rt-node:hover em { transform: translateY(-2px); border-color: var(--c); color: var(--c); }
.rt-node.past em { border-color: var(--c); color: var(--c); }
.rt-node.done em { background: var(--good); border-color: var(--good); color: #fff; }
.rt-node.on em { width: 36px; height: 36px; background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 20%, transparent), 0 8px 18px -6px var(--c); }
.rt-node.on span { color: var(--navy); font-weight: 700; }

/* ---------- stage header: title + Understand → Do → Control flow ---------- */
.sh-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.sh-phase { font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.sh-src { font-size: 11.5px; padding: 4px 10px; border-radius: 999px; color: var(--muted); border: 1px solid var(--line); }
.sh h2 { margin: 0 0 4px; font-size: 24px; letter-spacing: -.02em; }
.sh p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 860px; }
.ucf { list-style: none; margin: 18px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: none; }
.ucf li { position: relative; padding: 16px 16px 16px 60px; border-radius: 14px; background: linear-gradient(180deg, color-mix(in srgb, var(--c) 7%, var(--panel)), var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 22%, var(--line)); }
.ucf li:not(:last-child)::after { content: "→"; position: absolute; right: -13px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); z-index: 1; }
.ucf-ico { position: absolute; left: 16px; top: 16px; width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: var(--c); font-size: 13px; box-shadow: 0 6px 14px -6px var(--c); }
.ucf small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--c); }
.ucf p { margin: 4px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
@media (max-width: 860px) { .ucf { grid-template-columns: minmax(0, 1fr); } .ucf li:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -13px; transform: translateX(-50%); } }
.rt-phase { display: flex; flex-direction: column; justify-content: flex-start; }
.rt-phase b { white-space: normal; font-size: 12.5px; line-height: 1.25; overflow: visible; }

/* ---------- memory aids: rule of thumb, key facts, worked example ---------- */
.mem { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.mem-rule { flex: 2 1 320px; padding: 14px 18px; border-radius: 14px; color: #fff; background: linear-gradient(120deg, var(--navy), color-mix(in srgb, var(--navy) 70%, var(--c1))); box-shadow: 0 10px 24px -14px var(--navy); }
.mem-rule small { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.mem-rule b { display: block; font-size: 17px; line-height: 1.35; margin-top: 2px; }
.mem-fact { flex: 1 1 150px; padding: 12px 14px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); }
.mem-fact b { display: block; font-size: 20px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.mem-fact span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.example { display: flex; gap: 12px; padding: 14px 16px; margin-bottom: 14px; border-radius: 14px; border: 1px dashed color-mix(in srgb, var(--c2) 45%, var(--line)); background: color-mix(in srgb, var(--c2) 6%, var(--panel)); }
.example > span { color: var(--c2); font-size: 14px; margin-top: 2px; }
.example small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c2); }
.example p { margin: 3px 0 0; font-size: 14px; line-height: 1.55; }

/* ---------- threshold ruler ---------- */
.ruler { padding: 34px 6px 4px; }
.ruler-track { position: relative; height: 34px; border-radius: 10px; background: var(--sunken); }
.ruler-zone { position: absolute; top: 0; bottom: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, var(--panel)); border-right: 2px solid var(--panel); overflow: hidden; transition: background .25s; }
.ruler-zone:first-child { border-radius: 10px 0 0 10px; } .ruler-zone:last-of-type { border-radius: 0 10px 10px 0; border-right: 0; }
.ruler-zone em { font-style: normal; font-size: 11.5px; font-weight: 600; color: var(--c); white-space: nowrap; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ruler-zone.on { background: var(--c); } .ruler-zone.on em { color: #fff; }
.ruler-pin { position: absolute; top: -30px; bottom: -6px; width: 2px; background: var(--navy); transform: translateX(-1px); transition: left .3s ease; }
.ruler-pin b { position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 12px; white-space: nowrap; padding: 2px 8px; border-radius: 6px; background: var(--navy); color: #fff; }
.ruler-marks { position: relative; height: 40px; margin-top: 6px; }
.ruler-marks span { position: absolute; transform: translateX(-50%); text-align: center; white-space: nowrap; }
.ruler-marks span::before { content: ""; display: block; width: 1px; height: 6px; margin: 0 auto 2px; background: var(--line-2); }
.ruler-marks b { display: block; font-size: 12px; color: var(--navy); font-variant-numeric: tabular-nums; }
.ruler-marks small { display: block; font-size: 11px; color: var(--muted); }
/* ---------- gate funnel ---------- */
.funnel-list { list-style: none; margin: 0; padding: 16px 20px 20px; display: grid; gap: 10px; }
.funnel-list li { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 16px; align-items: center; }
.funnel-bar { width: var(--w); min-width: 190px; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; color: #fff; background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 75%, #fff)); box-shadow: 0 8px 18px -12px var(--c); }
.funnel-bar span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.25); font-size: 12px; font-weight: 700; flex: none; }
.funnel-bar b { font-size: 14px; flex: 1; }
.funnel-bar em { font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; opacity: .85; }
.funnel-list p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }
