    return "";
  }
  const readForm = (form, defaults) => { const v = { ...defaults }; Object.keys(defaults).forEach((k) => { const el = form.elements[k]; if (!el) return; v[k] = el.type === "checkbox" ? (el.checked ? "1" : "") : el.value; }); return v; };

  function enginePage(e, key, compute, formHtml, footer) {
    return {
      html: `${ui.head(`${e.group || "Readiness"} · decision engine`, e.title, e.lead, `<a class="btn" href="#/engines">All engines</a><button class="btn" data-reset>Reset</button>`)}
        <div class="split-l"><form class="card sticky" data-engine novalidate><div class="card-head"><h3>Case details</h3></div><div class="card-body form">${formHtml}</div></form><div id="result"></div></div>`,
      mount(root) {
        const form = root.querySelector("[data-engine]"), out = root.querySelector("#result");
        const run = () => { const r = compute(form); FG.lastDecision = { ...r, engine: e.id }; out.innerHTML = FG.renderDecision(r, { footer: e.more ? `<a class="btn" href="#/${e.more[1]}">${esc(e.more[0])} →</a>` : "" }); FG.placeInk(out); };
        form.addEventListener("input", run); // "input" already recomputes; "change" (fired on blur) only rebuilds the form when a field shows or hides others,
        // so clicking a result button right after typing never hits a replaced element.
        form.addEventListener("change", (ev) => { if (ev.target.dataset.rerender !== undefined) FG.refresh(); });
        form.addEventListener("submit", (ev) => ev.preventDefault());
        root.querySelector("[data-reset]").onclick = () => { FG.store.set(key, null); FG.refresh(); };
        run();
      },
    };
  }

  ENGINES.forEach((e) => {
    route(`engines/${e.id}`, {
      section: "engines", crumbs: () => [["Decision engines", "engines"], [e.title, `engines/${e.id}`]],
      render() {
        const key = `engine:${e.id}`, v = { ...e.defaults, ...(FG.store.get(key) || {}) };
        const conditional = e.rerender || [];
        const html = e.fields.map((f) => field(f, v)).join("");
        const page = enginePage(e, key, (form) => { const val = readForm(form, v); FG.store.set(key, val); return e.fn({ ...val, publicPrices: !!val.publicPrices }); }, html);
        const mount = page.mount;
        page.mount = (root) => { conditional.forEach((k) => { const el = root.querySelector(`[name=${k}]`); if (el) el.dataset.rerender = ""; }); mount(root); };
        return page;
      },
    });
    FG.addIndex(`${e.title} engine`, e.lead, `engines/${e.id}`, "Engine");
  });

  READINESS.forEach((e) => {
    route(`engines/${e.id}`, {
      section: "engines", crumbs: () => [["Decision engines", "engines"], [e.title, `engines/${e.id}`]],
      render() {
        const key = `engine:${e.id}`, v = FG.store.get(key) || {};
        const html = `<div class="checklist">${e.controls.map(([k, t, d]) => `<label class="check"><input type="checkbox" name="${k}" ${v[k] ? "checked" : ""}><div><b>${esc(t)}</b><small>${esc(d)}</small></div></label>`).join("")}</div>`;
        return enginePage(e, key, (form) => {
          const checked = {}; e.controls.forEach(([k]) => { checked[k] = form.elements[k].checked; });
          FG.store.set(key, checked);
          return E.readiness(e.title, e.controls.map(([k, t]) => [k, t]), checked);
        }, html);
      },
    });
    FG.addIndex(e.title, e.lead, `engines/${e.id}`, "Engine");
  });

  const WHATIF = { id: "what-if", title: "What-if simulator", lead: "Change a Joint Programme Budget Heading and see how the formal route changes. Direct contractual changes always override the percentage route.", more: ["Budget Revision engine", "engines/budget-revision"] };
  route("engines/what-if", {
    section: "engines", crumbs: () => [["Decision engines", "engines"], ["What-if simulator", "engines/what-if"]],
    render() {
      const key = "engine:what-if", v = { current: 100000, proposed: 124000, change: "none", ...(FG.store.get(key) || {}) };
      const html = `${ui.number("current", v.current, "Current Budget Heading (€)")}
        <label class="field"><span>Proposed Budget Heading (€)</span><input class="input" type="range" name="slider" min="0" max="${Math.max(200000, v.current * 2)}" step="500" value="${v.proposed}" aria-label="Proposed heading slider"><input class="input" type="number" name="proposed" value="${v.proposed}" min="0" step="any"></label>
        ${ui.select("change", [["none", "No — budget movement only"], ["total", "Total project cost changes"], ["extension", "Project extension"], ["scope", "Scope / purpose / objectives change"]], v.change, "Direct contractual change")}`;
      const page = enginePage(WHATIF, key, (form) => {
        const val = { current: form.elements.current.value, proposed: form.elements.proposed.value, change: form.elements.change.value };
        FG.store.set(key, val); return E.whatIf(val);
      }, html);
      const mount = page.mount;
      page.mount = (root) => {
        const s = root.querySelector("[name=slider]"), p = root.querySelector("[name=proposed]");
        s.addEventListener("input", () => { p.value = s.value; });
        p.addEventListener("input", () => { s.value = p.value; });
        mount(root);
      };
      return page;
    },
  });
  FG.addIndex("What-if simulator", WHATIF.lead, "engines/what-if", "Engine", "notification addendum 25% heading");
})();

</script>
<script>
/* views-analysis.js */
/* Scenario practice. */
(function () {
  "use strict";
  const { C, esc, euro, pct, ui, route, fmtDate } = FG;

  /* ---------- scenario practice ---------- */
  const CAT = { procurement: ["Procurement", "procurement/thresholds-and-procedure"], forecast: ["Forecast", "foma/forecast"], grant: ["Grant", "grants/procedure"], yearend: ["Year-end", "year-end"], payment: ["PO & payment", "payment-file"], reporting: ["Reporting", "foma/reports"], mission: ["Mission", "foma/mission-order"], filing: ["Filing", "filing"] };
  // Stable option order per scenario so the right answer is not always in the same place.
  const order = (n, i) => { const idx = [...Array(n).keys()]; let seed = i * 7919 + 17; for (let k = n - 1; k > 0; k--) { seed = (seed * 1103515245 + 12345) % 2147483648; const j = seed % (k + 1); [idx[k], idx[j]] = [idx[j], idx[k]]; } return idx; };
  route("scenarios", {
    crumbs: () => [["Scenario practice", "scenarios"]],
    render() {
      const qs = new URLSearchParams(location.hash.split("?")[1] || "");
      if (qs.get("cat")) FG.store.set("sc:cat", qs.get("cat"));
      const level = FG.store.get("sc:level", "basic"), cat = FG.store.get("sc:cat", "all"), answers = FG.store.get("scenarioAnswers", {});
      const list = C.scenarios.map((x, i) => ({ ...x, i })).filter((x) => (level === "all" || x.level === level) && (cat === "all" || x.cat === cat));
      const done = list.filter((x) => answers[x.i]), ok = done.filter((x) => answers[x.i].ok).length;
      return { html: `${ui.head("Practice · decide · learn", "Scenario practice", "Realistic decisions across procurement, finance, grants, reporting, year-end, missions and filing. Answers are kept in this browser.", `<button class="btn" data-reset-sc>Reset answers</button>`)}
        <div class="row">${ui.seg("level", [["basic", "Basic"], ["advanced", "Advanced"], ["all", "All levels"]], level)}<div class="chips">${[["all", "All topics"], ...Object.entries(CAT).map(([k, v]) => [k, v[0]])].map(([k, l]) => `<button class="chip" data-cat="${k}" aria-pressed="${k === cat}">${esc(l)}</button>`).join("")}</div></div>
        <div class="card card-pad mt"><div class="progress-head"><span>${done.length} of ${list.length} answered · ${ok} correct</span><span>${done.length ? pct((ok / done.length) * 100) : "—"} score</span></div>${ui.bar((done.length / Math.max(1, list.length)) * 100, "good")}</div>
        <div class="grid g2 mt">${list.map((x) => { const a = answers[x.i], o = order(x.opts.length, x.i);
          return `<article class="card scenario"><div class="row">${ui.tag(CAT[x.cat][0], "accent")}${ui.tag(x.level)}</div><h3>${esc(x.title)}</h3><p class="q">${esc(x.q)}</p>
            <div class="opts">${o.map((k) => `<button type="button" data-sc="${x.i}" data-opt="${k}" ${a ? "disabled" : ""} class="${a ? (k === x.correct ? "right" : k === a.choice ? "wrong" : "") : ""}">${esc(x.opts[k])}</button>`).join("")}</div>
            ${a ? `<div class="feedback">${ui.callout(a.ok ? "good" : "risk", a.ok ? "Correct" : "Not quite", x.feedback)}<a class="btn ghost sm mt" href="#/${CAT[x.cat][1]}">Review the rule →</a></div>` : ""}</article>`; }).join("")}</div>`,
        onSeg(name, v) { if (name === "level") { FG.store.set("sc:level", v); FG.refresh(); } },
        mount(root) {
          root.addEventListener("click", (e) => {
            const b = e.target.closest("[data-sc]");
            if (b) { const i = +b.dataset.sc, k = +b.dataset.opt, all = FG.store.get("scenarioAnswers", {}); all[i] = { choice: k, ok: k === C.scenarios[i].correct }; FG.store.set("scenarioAnswers", all); FG.refresh(); }
            const c = e.target.closest("[data-cat]"); if (c) { FG.store.set("sc:cat", c.dataset.cat); if (location.hash.includes("?")) FG.go("scenarios"); else FG.refresh(); }
            if (e.target.closest("[data-reset-sc]") && confirm("Clear all scenario answers?")) { FG.store.set("scenarioAnswers", {}); FG.refresh(); }
          });
        } };
    },
  });
  C.scenarios.forEach((x) => FG.addIndex(x.title, `Scenario · ${x.q}`, "scenarios", "Scenario", x.feedback));
})();

</script>
<script>
/* views-reference.js */
/* Reference layer: glossary with inline tooltips, rulebook with an interactive decision tree, stage quizzes. */
(function () {
  "use strict";
  const { C, esc, euro, ui, route } = FG;
  const E = window.FG_ENGINES;

  // Definitions are taken from how the guide itself uses each term.
  FG.GLOSSARY = [
    ["ACCM", "Finance support role", "Checks financial and file completeness, supports the budgetary commitment and creates the PO or mission order when the file is ready."],
    ["AoE", "Act of Engagement", "Contractual document signed by the supplier/consultant, used with the Order Form (e.g. for direct awards)."],
    ["AWP", "Activities Work Plan", "Approved plan of activities. Once approved, it allows limited flexibility above the activity budget; it should cover the implementation period and be reviewed periodically."],
    ["CCA", "Prepaid expense", "The part of a split 2026–2027 service charged to the next year under the year-end allocation table."],
    ["CCM", "Commitments Officer", "Exercises expenditure and procurement approval within the applicable delegation; validates POs, authorises negotiation in competitive bidding, approves petty cash before spending."],
    ["DLAPIL", "Legal compliance review", "Provides the Legal Compliance Review required before CCM approval for extrabudgetary or mixed funding from €55,000 to below €184,000, and advises on changes to legal contractual clauses."],
    ["DMS", "Document Management System", "Where the project file is organised: contract documents, activities, POs, signed and editable versions together."],
    ["FA", "Framework agreement", "Pool of preselected suppliers; each specific need is awarded through a mini-competition (call-off). Generally up to 4 years."],
    ["FC", "Framework contract", "Recurring need with definable units and fixed unit prices; orders are placed with order forms. Generally up to 4 years."],
    ["FIMS", "Financial system", "System where expenditure is recorded; check “Amount billed” / “Invoices” on the Fiche PO before finalising a PO."],
    ["JP", "Joint Programme", "Jointly funded programme. A Budget Heading variation above ±25%, or a change in total cost, duration or scope, requires an Addendum."],
    ["OB", "Ordinary Budget", "Organisation's regular budget. Petty cash limit for OB-related expenses is €50."],
    ["PO", "Purchase order", "Financial commitment. No activity should start until the PO is opened, signatures are collected and the provider holds the countersigned documents."],
    ["ToR", "Terms of Reference", "Specification of the requirement: context, objective, deliverables, timing and technical requirements."],
    ["VC", "Voluntary Contribution", "Voluntary funding; budget revisions follow the VC route, with donor acceptance where funding is earmarked."],
    ["XB", "Extrabudgetary funding", "Funding outside the Ordinary Budget. From €55,000 it adds a Legal Compliance Review before CCM approval."],
    ["Addendum", "Formal contract amendment", "Contractual revision of a JP budget/agreement requiring external acceptance before implementation."],
    ["Notification", "Formal notification route", "JP budget change route where every relevant Budget Heading stays within ±25% and no contractual element changes."],
    ["Budget Heading", "Budget subtotal", "Grouping of budget lines (e.g. 1 Human resources, 2 Travel). The ±25% test is applied at this level, not to the project total."],
    ["Tenders Board", "Governance body", "Authorises launch, negotiation and award for international public calls for tenders (≥ €184,000)."],
  ];
  const TERMS = FG.GLOSSARY.filter(([t]) => t.length <= 6 && /^[A-Z]+$/.test(t));
  const termRe = new RegExp(`\\b(${TERMS.map(([t]) => t).join("|")})\\b|(€\\s?\\d[\\d,.]*(?:\\s?k)?|[±≥≤<>]?\\s?\\d+(?:\\.\\d+)?\\s?%)`, "g");
  const defs = Object.fromEntries(FG.GLOSSARY.map(([t, n, d]) => [t, `${n} — ${d}`]));

  // Mark acronyms (tooltip + link to glossary) and amounts in rendered guidance text.
  FG.enrich = function (root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: (n) => (!n.parentElement.closest("input,select,textarea,button,a,abbr,mark,script,style,.kpi,table.t thead,h1,.nav,.no-enrich,.opts,.scale,.donut,.pace,.fx-hero,.fx-hubs,.mem,.qz-card,.qz-end,.qz-miss,.rf,.lanes,.specials,.sh-fig,.lf-left,.lf-q,.lf-dots,.ess-fig,.ess-ring,.case-hero,.case-kpis,.g-lab,.hub-path,.ucf,.ruler,.pj-kpis,.pj-flow,.pj-chev,.progress-head,.tag,.tn,.tb") && termRe.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT),
    });
    const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
    const seen = new Set();
    for (const node of nodes) {
      const frag = document.createDocumentFragment(); let last = 0; const text = node.nodeValue;
      text.replace(termRe, (m, term, amount, i) => {
        frag.append(text.slice(last, i)); last = i + m.length;
        if (term) {
          if (seen.has(term)) { frag.append(m); return m; }
          seen.add(term);
          const a = document.createElement("abbr"); a.title = defs[term]; a.textContent = m; a.tabIndex = 0; frag.append(a);
        } else { const k = document.createElement("mark"); k.className = "amt"; k.textContent = m; frag.append(k); }
        return m;
      });
      termRe.lastIndex = 0;
      frag.append(text.slice(last)); node.replaceWith(frag);
    }
  };

  // Inline quiz built from the scenario bank; answers are shared with the Scenario practice page.
  FG.ui.quiz = function (cat, n = 3) {
    const answers = FG.store.get("scenarioAnswers", {});
    const list = C.scenarios.map((x, i) => ({ ...x, i })).filter((x) => x.cat === cat).sort((a, b) => (a.level === b.level ? 0 : a.level === "basic" ? -1 : 1)).slice(0, n);
    if (!list.length) return "";
    const ok = list.filter((x) => answers[x.i] && answers[x.i].ok).length;
    const open = FG.quizOpen === cat ? " open" : "";
    return `<details class="mq no-enrich no-print"${open}><summary><span class="mq-ico" aria-hidden="true">?</span><span><b>Check yourself</b><small>${list.length} short questions on this module</small></span>${ui.tag(`${ok}/${list.length} correct`, ok === list.length ? "good" : "")}</summary>
      <div class="mq-body">${list.map((x, n) => { const a = answers[x.i];
      return `<div class="mq-q"><b>${n + 1}. ${esc(x.title)}</b><p class="small muted">${esc(x.q)}</p><div class="opts">${x.opts.map((o, k) => `<button type="button" data-qz="${x.i}" data-cat="${cat}" data-opt="${k}" ${a ? "disabled" : ""} class="${a ? (k === x.correct ? "right" : k === a.choice ? "wrong" : "") : ""}">${esc(o)}</button>`).join("")}</div>${a ? `<p class="small muted">${a.ok ? "✓" : "✕"} ${esc(x.feedback)}</p>` : ""}</div>`; }).join("")}
      <a class="small" href="#/scenarios">More practice scenarios →</a></div></details>`;
  };
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-qz]"); if (!b) return;
    const i = +b.dataset.qz, k = +b.dataset.opt, all = FG.store.get("scenarioAnswers", {});
    all[i] = { choice: k, ok: k === C.scenarios[i].correct }; FG.store.set("scenarioAnswers", all); FG.quizOpen = b.dataset.cat; FG.refresh();
  });

  /* ---------- glossary ---------- */
  route("glossary", {
    crumbs: () => [["Glossary", "glossary"]],
    render() {
      const q = FG.store.get("gl:q", "");
      const list = FG.GLOSSARY.filter(([t, n, d]) => !q || `${t} ${n} ${d}`.toLowerCase().includes(q.toLowerCase())).sort((a, b) => a[0].localeCompare(b[0]));
      return { html: `${ui.head("Reference", "Glossary", "Terms and abbreviations used across the guide. Underlined terms in any page show this definition on hover.", `<input class="input" style="width:240px" type="search" data-gq placeholder="Find a term" aria-label="Find a term" value="${esc(q)}">`)}
        <div class="glossary">${list.map(([t, n, d]) => `<article class="card card-pad no-enrich" id="g-${esc(t)}"><div class="row"><b class="term">${esc(t)}</b><span class="muted">${esc(n)}</span></div><p class="mt">${esc(d)}</p></article>`).join("") || `<div class="empty"><b>No term found</b></div>`}</div>`,
        mount(root) { const i = root.querySelector("[data-gq]"); i.addEventListener("input", () => { FG.store.set("gl:q", i.value); FG.refresh(); const n = document.querySelector("[data-gq]"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); } };
    },
  });
  FG.GLOSSARY.forEach(([t, n, d]) => FG.addIndex(`${t} — ${n}`, d, "glossary", "Term"));

  /* ---------- rulebook ---------- */
  const RULES = [
    ["Procurement", "procurement/thresholds-and-procedure", [
      ["Direct award", "≤ €2,000 goods / general services / works · ≤ €6,000 intellectual services", "Ch. 4.5–4.6"],
      ["Competitive bidding", "Above the low-value limit and below €184,000; invite at least three potential suppliers", "Ch. 4.5–4.6"],
      ["International public call", "≥ €184,000 total foreseeable need; Tenders Board launch and award. Use it if there is even a slight risk of reaching the threshold", "Ch. 4.5–4.6"],
      ["Legal Compliance Review", "Extrabudgetary or mixed funding, €55,000 to < €184,000 — before CCM approval; does not replace the procedure", "Ch. 4.5–4.6"],
      ["Public prices", "Below €10,000 within competitive bidding: compare public prices of 3+ suppliers and archive screenshots", "Ch. 4.5–4.6"],
      ["Aggregation", "Value = full need over the period: duration, renewals, lots, options, order forms and call-offs. No splitting", "Ch. 4.5"],
      ["Framework duration", "Framework contracts and agreements generally ≤ 4 years, 5 only exceptionally", "Ch. 3.1–3.4"],
      ["Negotiation", "CCM authorises in competitive bidding, Tenders Board in an international call; specifications must not change significantly", "Ch. 4.9.7 & 4.9.9"]]],
    ["Grants", "grants/procedure", [
      ["Direct award", "Total procedure budget below €15,000 — template G9.2A", "Rule 1374"],
      ["Competitive call", "€15,000 or more — call for proposals, Evaluation Committee, decision and notifications", "Rule 1374"],
      ["Exceptional direct award", "At or above €15,000 only under strictly interpreted exceptions — template G9.2B", "Rule 1374"],
      ["Threshold basis", "Total budget of the grant-award procedure, never the amount per grantee", "Rule 1374"],
      ["Indirect costs", "Only where foreseen in the call/agreement, maximum 7%", "Art. 6–7"],
      ["Operational grants", "Should not normally exceed twelve consecutive months", "Rule 1374"]]],
    ["Budget revision", "engines/budget-revision", [
      ["JP — Notification", "Every relevant Budget Heading within ±25% and no contractual change", "Forecast guidance"],
      ["JP — Addendum", "Any Budget Heading above ±25%, or a change in total cost, duration or scope", "Forecast guidance"],
      ["Units & new lines", "Exceeded approved units, a changed unit basis or a new budget line need formal review", "Forecast guidance"],
      ["VC", "Earmarked funding requires donor acceptance; otherwise internal / programming confirmation", "Forecast guidance"]]],
    ["Payments & year-end", "year-end", [
      ["Start of work", "No activity before the PO is opened, signatures collected and countersigned documents sent", "PO file"],
      ["Payment", "Only after delivery/acceptance is evidenced and the invoice matches the contractual basis", "Payment file"],
      ["2026 expenditure", "Only goods delivered / services rendered by 31 December 2026", "2026 closing"],
      ["PO finalisation", "Once all expenditure is recorded in FIMS — payment itself is not required first", "2026 closing"],
      ["Petty cash", "€100 projects · €50 OB · CCM approval before spending · no splitting", "Petty cash"]]],
  ];
  // Decision tree drawn as connected nodes; the path for the entered case lights up.
  function tree(v) {
    const amount = Number(v.amount) || 0, low = v.type === "intellectual" ? 6000 : 2000, xb = v.funding === "xb";
    const path = amount <= low ? "direct" : amount >= 184000 ? "intl" : xb && amount >= 55000 ? "cbl" : "cb";
    const node = (id, title, sub, cls = "") => `<div class="tn ${cls} ${path === id ? "on" : ""}"><b>${title}</b><small>${sub}</small></div>`;
    return `<div class="dtree" role="img" aria-label="Procurement decision tree; current route highlighted">
      <div class="tn root on"><b>${amount ? euro(amount) : "Total foreseeable value"}</b><small>${v.type === "intellectual" ? "Intellectual services" : "Goods / general services / works"} · ${xb ? "XB / mixed" : "Ordinary Budget"}</small></div>
      <div class="tbranches">
        <div class="tb ${path === "direct" ? "on" : ""}"><span>≤ ${euro(low)}</span>${node("direct", "Direct Award", "CCM validation · document value for money", "good")}</div>
        <div class="tb ${path === "cb" || path === "cbl" ? "on" : ""}"><span>${euro(low)} – €184,000</span>${node("cb", "Competitive Bidding", "≥ 3 suppliers invited")}${xb ? node("cbl", "+ Legal Compliance Review", "from €55,000, before CCM approval", "warn") : ""}</div>
        <div class="tb ${path === "intl" ? "on" : ""}"><span>≥ €184,000</span>${node("intl", "International Public Call", "Tenders Board · e-procurement", "risk")}</div>
      </div></div>`;
  }
  route("rules", {
    crumbs: () => [["Rules at a glance", "rules"]],
    render() {
      const v = FG.store.get("tree", { amount: 72000, type: "general", funding: "xb" });
      return { html: `${ui.head("Reference", "Rules at a glance", "Every threshold and route in the guide on one page, with its source. Open a module for the full guidance.", `<button class="btn" onclick="print()">Print</button>`)}
        <section class="card"><div class="card-head"><div><h3>Procurement procedure — decision tree</h3><small>Enter the case; the applicable branch lights up.</small></div><a class="btn sm" href="#/engines/procurement">Full engine</a></div><div class="card-body stack">
          <form class="grid g3" data-tree>${ui.number("amount", v.amount, "Total foreseeable value (€, excl. VAT)")}${ui.select("type", [["general", "Goods / general services / works"], ["intellectual", "Intellectual services"]], v.type, "Purchase type")}${ui.select("funding", [["ordinary", "Ordinary Budget"], ["xb", "Extrabudgetary / mixed"]], v.funding, "Funding")}</form>
          <div id="treeOut">${tree(v)}</div></div></section>
        ${RULES.map(([title, path, rows]) => `<section class="card mt"><div class="card-head"><h3>${esc(title)}</h3><a class="btn sm" href="#/${path}">Open →</a></div><div class="card-body"><div class="table-wrap"><table class="t"><thead><tr><th>Rule</th><th>What applies</th><th>Source</th></tr></thead><tbody>${rows.map((r) => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="muted">${esc(r[2])}</td></tr>`).join("")}</tbody></table></div></div></section>`).join("")}`,
        mount(root) { const f = root.querySelector("[data-tree]"); f.addEventListener("input", () => { const val = Object.fromEntries(new FormData(f)); FG.store.set("tree", val); root.querySelector("#treeOut").innerHTML = tree(val); }); } };
    },
  });
  RULES.forEach(([t, , rows]) => rows.forEach((r) => FG.addIndex(`${r[0]} (${t})`, r[1], "rules", "Rule", r[2])));
  void E;
})();

</script>
<script>
/* views-modules.js */
/* VAT procedures and Events & GDD modules. Rules come from the guide's own content
   (procurement stage "VAT, Invoice & Payment", Event Management PO/payment packages, best practice). */
(function () {
  "use strict";
  const { C, esc, euro, ui, route } = FG;
  const stage = C.procurementStages.find((s) => s.name === "Contract Execution & Payment");
  const sec = Object.fromEntries(stage.sections);

  /* ---------- pure logic (exported for tests) ---------- */
  const CARD_SINGLE = 5000, CARD_MONTHLY = 30000;
  FG.logic = FG.logic || {};
  // Card payments are exceptions: ≤ €5,000 per purchase and ≤ €30,000 Organisation-wide per month.
  FG.logic.paymentMethod = function (amount, monthUsed) {
    amount = Math.max(0, Number(amount) || 0); monthUsed = Math.max(0, Number(monthUsed) || 0);
    if (!amount) return { tone: "warn", title: "Enter the amount", text: "Bank transfer to the contractual account is the standard route." };
    if (amount > CARD_SINGLE) return { tone: "risk", title: "Bank transfer", text: `${euro(amount)} is above the ${euro(CARD_SINGLE)} single card-purchase limit. Pay by transfer to the bank account stipulated in the contract.` };
    if (amount + monthUsed > CARD_MONTHLY) return { tone: "risk", title: "Bank transfer", text: `This purchase would take monthly card use to ${euro(amount + monthUsed)}, above the ${euro(CARD_MONTHLY)} Organisation-wide monthly limit.` };
    return { tone: "warn", title: "Card possible as an exception", text: `Within the ${euro(CARD_SINGLE)} single and ${euro(CARD_MONTHLY)} monthly limits (${euro(CARD_MONTHLY - monthUsed - amount)} left this month). Card payments remain exceptions — transfer is preferred.` };
  };
  // Default payment term: 60 days from receipt of invoice or execution, whichever is later.
  FG.logic.paymentDue = function (invoiceDate, executionDate, days = 60) {
    const a = invoiceDate ? new Date(invoiceDate) : null, b = executionDate ? new Date(executionDate) : null;
    const base = a && b ? (a > b ? a : b) : a || b; if (!base || isNaN(base)) return null;
    const due = new Date(base); due.setDate(due.getDate() + days);
    return { base, due, from: base === a ? "invoice receipt" : "execution" };
  };
  // Initial vs final event budget; every changed line needs a reason and CCM approval evidence when material.
  FG.logic.eventBudget = function (lines) {
    const rows = lines.filter((l) => l.item || Number(l.initial) || Number(l.final)).map((l) => {
      const initial = Number(l.initial) || 0, final = Number(l.final) || 0, diff = final - initial;
      return { ...l, initial, final, diff, pct: initial ? (diff / initial) * 100 : final ? 100 : 0 };
    });
    const initial = rows.reduce((a, r) => a + r.initial, 0), final = rows.reduce((a, r) => a + r.final, 0);
    return { rows, initial, final, diff: final - initial, pct: initial ? ((final - initial) / initial) * 100 : 0, changed: rows.filter((r) => r.diff !== 0) };
  };

  /* ---------- VAT procedures ---------- */
  const INVOICE_FIELDS = [["supplier", "Supplier identified", "Name and address match the contract / PO."], ["number", "Invoice number", "Unique invoice reference."], ["vat", "VAT number if applicable", "Supplier VAT number where the supplier is VAT-registered."], ["deliverables", "Deliverables described", "Matches the accepted contractual deliverables."], ["fees", "Fees / subtotals", "Applicable fee and subtotals shown."], ["total", "Total amount", "Equals the accepted amount; VAT treatment as agreed before signature."], ["modalities", "Payment modalities", "Bank details match the account stipulated in the contract."], ["addressee", "Addressed to the Council of Europe", "Correct addressee on the invoice."]];
  const VAT_STEPS = [
    ["Before signature", "Clarify VAT", "Establish the supplier's VAT status and place of taxation before signing and sending the contract / order form. Protocol is the point of contact for VAT questions.", ["Supplier VAT status confirmed", "Place of taxation identified", "Protocol consulted where unclear", "VAT treatment written into the contract / order form"]],
    ["PO submission", "Check exemption", "Check VAT exemption or tax rules before submitting the PO — never assume a supplier is always tax-exempt.", ["Exemption / tax rule checked for this supplier and service", "Amounts in the PO consistent with the agreed VAT treatment"]],
    ["Invoice", "Verify particulars", "The invoice must carry the particulars below and match the contract and accepted deliverables.", ["All invoice particulars present", "VAT on the invoice matches the agreed treatment"]],
    ["Payment", "Pay correctly", sec["Payment route"], ["Bank account matches the contract", "Payment date respects the agreed terms"]],
    ["Filing", "Keep the VAT trail", "File VAT correspondence and evidence in the DMS under Project Contract Documents → VAT, together with the invoice and payment evidence.", ["VAT correspondence filed", "Invoice and payment evidence filed together"]],
  ];
  route("vat", {
    crumbs: () => [["Projects", "projects"], ["VAT procedures", "vat"]],
    render() {
      const step = Math.min(FG.store.get("vat:step", 0), VAT_STEPS.length - 1), s = VAT_STEPS[step];
      const inv = FG.store.get("vat:invoice", {}), invDone = INVOICE_FIELDS.filter(([k]) => inv[k]).length;
      const pay = FG.store.get("vat:pay", { amount: "", month: "", invoiceDate: "", executionDate: "" });
      const m = FG.logic.paymentMethod(pay.amount, pay.month), due = FG.logic.paymentDue(pay.invoiceDate, pay.executionDate);
      return { html: `${FG.modHead("vat", "Projects · VAT", "VAT procedures", "VAT is a procurement planning issue as well as a payment issue: clarify it before signature, check it at PO and invoice, and keep the trail.", `<a class="btn" href="#/procurement/contract-execution-and-payment">Procurement stage 12</a><a class="btn primary" href="#/payment-file">Payment file</a>`)}
        ${ui.callout("warn", "Key rule", stage.warning)}
        <section class="card mt"><div class="card-head"><div><h3>VAT across the file</h3><small>Step ${step + 1} of ${VAT_STEPS.length}</small></div></div><div class="card-body stack">
          ${ui.flowHeader(VAT_STEPS, step, (x, j) => `<small>${j + 1} · ${esc(x[0].toUpperCase())}</small><b>${esc(x[1])}</b>`)}
          <p>${esc(s[2])}</p>${ui.checklist(`vat:step${step}`, s[3], `${s[1]} — checks`)}
        </div></section>
        <div class="grid g2 mt">
          <section class="card"><div class="card-head"><div><h3>Invoice particulars check</h3><small>${esc(sec["Invoice content"])}</small></div>${ui.tag(`${invDone}/${INVOICE_FIELDS.length}`, invDone === INVOICE_FIELDS.length ? "good" : "warn")}</div><div class="card-body stack">
            <div class="checklist" data-invoice>${INVOICE_FIELDS.map(([k, t, d]) => `<label class="check ${inv[k] ? "done" : ""}"><input type="checkbox" data-k="${k}" ${inv[k] ? "checked" : ""}><div><b>${esc(t)}</b><small>${esc(d)}</small></div></label>`).join("")}</div>
            ${invDone === INVOICE_FIELDS.length ? ui.callout("good", "Invoice can be processed", "All particulars are present. Attach acceptance evidence and continue with the payment file.") : ui.callout("risk", "Return to supplier", `Missing: ${INVOICE_FIELDS.filter(([k]) => !inv[k]).map((f) => f[1]).join(", ")}.`)}
            <button class="btn sm" data-inv-reset>New invoice</button></div></section>
          <section class="card"><div class="card-head"><div><h3>Payment method & due date</h3><small>Card: ≤ ${euro(CARD_SINGLE)} per purchase, ≤ ${euro(CARD_MONTHLY)} per month. Default term: 60 days.</small></div></div><div class="card-body stack">
            <form class="grid g2" data-pay>${ui.number("amount", pay.amount, "Amount (€)")}${ui.number("month", pay.month, "Card use this month so far (€)")}
              <label class="field"><span>Invoice received</span><input class="input" type="date" name="invoiceDate" value="${esc(pay.invoiceDate)}"></label><label class="field"><span>Execution / acceptance</span><input class="input" type="date" name="executionDate" value="${esc(pay.executionDate)}"></label></form>
            ${ui.callout(m.tone, m.title, m.text)}
            ${due ? ui.callout("info", `Payment due by ${FG.fmtDate(due.due)}`, `60 days from ${due.from} (${FG.fmtDate(due.base)}), the later of the two dates — unless the contract sets other negotiated terms.`) : `<p class="small muted">Enter the invoice and execution dates to compute the default due date.</p>`}
          </div></section>
        </div>`,
        mount(root) {
          root.addEventListener("click", (e) => {
            const f = e.target.closest("[data-flow]"); if (f) { FG.store.set("vat:step", +f.dataset.flow); FG.refresh(); }
            if (e.target.closest("[data-inv-reset]")) { FG.store.set("vat:invoice", {}); FG.refresh(); }
          });
          root.querySelector("[data-invoice]").addEventListener("change", (e) => { const v = FG.store.get("vat:invoice", {}); v[e.target.dataset.k] = e.target.checked ? 1 : 0; FG.store.set("vat:invoice", v); FG.refresh(); });
          const form = root.querySelector("[data-pay]");
          form.addEventListener("change", () => { FG.store.set("vat:pay", Object.fromEntries(new FormData(form))); FG.refresh(); });
        } };
    },
  });

  /* ---------- Events & GDD ---------- */
  const EV_STEPS = [
    ["Plan", "Work plan & call-off", "Define the event in the work plan, run the call-off and keep all financial offers, technical proposals and cancellation policies for the assessment.", C.poServices["Event Management"].support.slice(0, 4).map((d) => d[0])],
    ["Commit", "Event Management PO", "Submit the PO package. The selected financial proposal is signed by the CCM after the PO is opened; no service starts before the PO is issued.", C.poServices["Event Management"].signed.map((d) => d[0])],
    ["Deliver", "Run the event", "Collect delivery evidence as the event happens: signature list, agenda, accommodation, transfer and travel records, photos.", ["Signature list", "Agenda", "Accommodation / transfer / travel records", "Event photo"]],
    ["Reconcile", "Final budget", "Compare the final budget with the initial one. Keep e-mails on significant financial changes with CCM approval, and exchange-rate evidence where amounts were in another currency.", ["Final budget signed by Project Manager / Officer", "CCM approval e-mails for significant changes", "Exchange-rate document"]],
    ["Pay", "Payment file", "Build the Event Management payment package and send it to Finance.", C.payServices["Event Management"].support.map((d) => d[0])],
  ];
  route("events", {
    crumbs: () => [["Projects", "projects"], ["Events & GDD", "events"]],
    render() {
      const step = Math.min(FG.store.get("ev:step", 0), EV_STEPS.length - 1), s = EV_STEPS[step];
      const lines = FG.store.get("ev:budget", [{ item: "Venue", initial: 4000, final: 4000 }, { item: "Catering", initial: 2500, final: 3100 }, { item: "Interpretation", initial: 3000, final: 2600 }, { item: "Travel & accommodation", initial: 6000, final: 6400 }]);
      const b = FG.logic.eventBudget(lines);
      const fx = FG.store.get("ev:fx", { amount: "", currency: "TRY", rate: "", source: "" }), fxEur = Number(fx.amount) && Number(fx.rate) ? Number(fx.amount) / Number(fx.rate) : null;
      const links = C.usefulLinks.filter((l) => /EventS|GDD/.test(l.title));
      return { html: `${FG.modHead("events", "Projects · Events", "Events & GDD", "Event-related finance from the call-off to the payment file: the Event Management PO and payment packages, budget reconciliation and exchange-rate evidence.", links.map((l) => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)} ↗</a>`).join(""))}
        <section class="card"><div class="card-head"><div><h3>Event finance workflow</h3><small>Step ${step + 1} of ${EV_STEPS.length}</small></div></div><div class="card-body stack">
          ${ui.flowHeader(EV_STEPS, step, (x, j) => `<small>${j + 1} · ${esc(x[0].toUpperCase())}</small><b>${esc(x[1])}</b>`)}
          <p>${esc(s[2])}</p>${ui.checklist(`ev:step${step}`, s[3], "Documents for this step")}</div></section>
        <section class="card mt"><div class="card-head"><div><h3>Initial vs final event budget</h3><small>Every change needs a reason; significant financial changes need CCM approval evidence in the payment file.</small></div>${ui.tag(`${b.diff >= 0 ? "+" : ""}${euro(b.diff)} (${b.pct.toFixed(1)}%)`, b.diff > 0 ? "warn" : "good")}</div><div class="card-body stack">
          <div class="table-wrap"><table class="t" data-evb><thead><tr><th>Item</th><th class="n">Initial (€)</th><th class="n">Final (€)</th><th class="n">Change</th><th></th></tr></thead><tbody>
            ${b.rows.map((r, i) => `<tr><td><input class="input" data-i="${i}" data-f="item" value="${esc(r.item)}" aria-label="Item"></td><td><input class="input" type="number" min="0" data-i="${i}" data-f="initial" value="${r.initial}" aria-label="Initial amount"></td><td><input class="input" type="number" min="0" data-i="${i}" data-f="final" value="${r.final}" aria-label="Final amount"></td><td class="n" style="color:${r.diff > 0 ? "var(--warn)" : r.diff < 0 ? "var(--good)" : "inherit"}">${r.diff >= 0 ? "+" : ""}${euro(r.diff)}<small>${r.pct.toFixed(1)}%</small></td><td><button class="btn ghost sm" data-del="${i}" aria-label="Remove ${esc(r.item)}">×</button></td></tr>`).join("")}
          </tbody><tfoot><tr><td>Total</td><td class="n">${euro(b.initial)}</td><td class="n">${euro(b.final)}</td><td class="n">${b.diff >= 0 ? "+" : ""}${euro(b.diff)}</td><td></td></tr></tfoot></table></div>
          <div class="row"><button class="btn sm" data-add>＋ Add item</button><span class="spacer"></span></div>
          ${b.changed.length ? ui.callout("warn", `${b.changed.length} item(s) changed`, `Document the reason for: ${b.changed.map((r) => r.item || "unnamed item").join(", ")}. Attach CCM approval e-mails for significant changes and the final budget signed by the Project Manager / Officer.`) : ui.callout("good", "No change", "Final budget equals the initial budget.")}
        </div></section>
        <div class="grid g2 mt">
          <section class="card"><div class="card-head"><div><h3>Exchange-rate evidence</h3><small>For costs incurred in another currency.</small></div></div><form class="card-body form" data-fx>
            <div class="grid g3">${ui.number("amount", fx.amount, "Amount in local currency")}<label class="field"><span>Currency</span><input class="input" name="currency" value="${esc(fx.currency)}" maxlength="3"></label>${ui.number("rate", fx.rate, `Rate (${esc(fx.currency || "XXX")} per €1)`)}</div>
            <label class="field"><span>Rate source and date</span><input class="input" name="source" value="${esc(fx.source)}" placeholder="e.g. official rate of the month, date"></label>
            ${fxEur != null ? ui.callout(fx.source ? "good" : "warn", `${euro(fxEur, 2)}`, fx.source ? `Keep this rate (${fx.source}) as the exchange-rate document in the payment file.` : "Record the rate source and date — the payment file needs the exchange-rate evidence.") : `<p class="small muted">Enter amount and rate to convert.</p>`}</form></section>
          <section class="card"><div class="card-head"><h3>Best practice</h3></div><div class="card-body">${ui.pairs([...C.payBestPractice, ...C.poBestPractice].filter((x) => /event/i.test(x.join(" "))))}</div></section>
        </div>`,
        mount(root) {
          const save = (l) => { FG.store.set("ev:budget", l); FG.refresh(); };
          root.addEventListener("click", (e) => {
            const f = e.target.closest("[data-flow]"); if (f) { FG.store.set("ev:step", +f.dataset.flow); FG.refresh(); }
            if (e.target.closest("[data-add]")) save([...lines, { item: "", initial: 0, final: 0 }]);
            const d = e.target.closest("[data-del]"); if (d) save(lines.filter((_, i) => i !== +d.dataset.del));
          });
          root.querySelector("[data-evb]").addEventListener("change", (e) => { const i = +e.target.dataset.i; if (isNaN(i)) return; const l = lines.map((x) => ({ ...x })); l[i][e.target.dataset.f] = e.target.dataset.f === "item" ? e.target.value : Number(e.target.value) || 0; save(l); });
          const fxf = root.querySelector("[data-fx]"); fxf.addEventListener("change", () => { FG.store.set("ev:fx", Object.fromEntries(new FormData(fxf))); FG.refresh(); });
        } };
    },
  });
  FG.addIndex("VAT procedures", "VAT before signature, invoice particulars, card limits, payment terms", "vat", "Module", "vat tax exemption protocol invoice card 5000 30000 60 days");
  FG.addIndex("Events & GDD", "Event Management PO and payment, final budget, exchange rates", "events", "Module", "event conference call-off exchange rate gdd final budget");
})();

</script>
<script>FG.start();</script>
