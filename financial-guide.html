      ${tabs.map(([k, , html]) => `<div class="tabpanel" role="tabpanel" data-panel="${esc(k)}" ${k === cur ? "" : "hidden"}>${html}</div>`).join("")}</div>`;
  };
  FG.placeInk = (root) => root.querySelectorAll(".tablist").forEach((l) => { const a = l.querySelector('[aria-selected="true"]'), ink = l.querySelector(".tab-ink"); if (a && ink) { ink.style.left = a.offsetLeft + "px"; ink.style.width = a.offsetWidth + "px"; } });
  // Donut chart: segments [[label, value, colour]]; centre shows the first segment's share.
  FG.ui.donut = function (segments, centre, sub) {
    const total = segments.reduce((a, x) => a + Math.max(0, x[1]), 0) || 1, R = 52, C = 2 * Math.PI * R; let off = 0;
    const arcs = segments.map(([l, v, c]) => { const len = (Math.max(0, v) / total) * C, a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" class="arc"><title>${esc(l)}: ${esc(euro(v))}</title></circle>`; off += len; return a; }).join("");
    return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(segments.map((x) => `${x[0]} ${euro(x[1])}`).join(", "))}"><g transform="rotate(-90 70 70)"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--sunken)" stroke-width="16"/>${arcs}</g><text x="70" y="68" text-anchor="middle" class="d-main">${esc(centre)}</text><text x="70" y="86" text-anchor="middle" class="d-sub">${esc(sub)}</text></svg>
      <ul>${segments.map(([l, v, c]) => `<li><i style="background:${c}"></i><span>${esc(l)}</span><b>${esc(euro(v))}</b></li>`).join("")}</ul></div>`;
  };

  // Delegated behaviour for persisted checklists and segmented controls inside a view root.
  FG.bindCommon = function (root, onChange) {
    root.addEventListener("change", (e) => {
      const box = e.target.closest("[data-checklist] input[type=checkbox]");
      if (!box) return;
      const host = box.closest("[data-checklist]");
      FG.tick(host.dataset.checklist, box.dataset.i, box.checked);
      FG.refresh();
    });
    root.addEventListener("click", (e) => {
      const tab = e.target.closest("[data-tab]");
      if (tab) {
        const box = tab.closest("[data-tabs]"); FG.store.set("tab:" + box.dataset.tabs, tab.dataset.tab);
        box.querySelectorAll(":scope > .tablist [data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b === tab)));
        box.querySelectorAll(":scope > .tabpanel").forEach((p) => { p.hidden = p.dataset.panel !== tab.dataset.tab; });
        FG.placeInk(box); return;
      }
      const reset = e.target.closest("[data-reset-checklist]");
      if (reset) { FG.store.set("ticks:" + reset.closest("[data-checklist]").dataset.checklist, {}); FG.refresh(); return; }
      const seg = e.target.closest("[data-seg] button");
      if (seg) {
        const group = seg.closest("[data-seg]");
        $$("button", group).forEach((b) => b.setAttribute("aria-pressed", String(b === seg)));
        if (onChange) onChange(group.dataset.seg, seg.dataset.v);
      }
    });
  };

  /* ---------- decision result rendering (shared by all engines) ---------- */
  FG.renderDecision = function (r, opts = {}) {
    const ui = FG.ui;
    const scale = r.scale ? `<div class="block"><h3>Threshold position</h3><div class="scale" aria-hidden="true"><div class="track"></div><div class="pin" style="left:${Math.min(99, Math.max(1, (r.scale.value / r.scale.max) * 100))}%"></div><div class="labels">${r.scale.marks.map(([v, l]) => `<span style="left:${(v / r.scale.max) * 100}%;${v / r.scale.max < 0.12 ? "transform:none" : ""}">${esc(l)}</span>`).join("")}</div></div></div>` : "";
    const fit = r.fit ? `<div class="block"><h3>Model fit</h3><div class="fit">${r.fit.map(([n, s]) => `<div><span>${esc(n)}</span>${ui.bar((s / 12) * 100, n === r.route ? "good" : "")}<em>${s} pts</em></div>`).join("")}</div></div>` : "";
    const flags = r.flags ? `<div class="block"><h3>Control flags</h3><div class="row">${r.flags.map(([t, tone]) => ui.tag(t, tone === "neutral" ? "" : tone)).join("")}</div></div>` : "";
    const confidence = r.confidence && r.score != null ? `<div class="block"><h3>Decision confidence</h3><div class="score ${r.score >= 85 ? "good" : r.score >= 70 ? "warn" : "risk"}"><div class="ring" style="--p:${r.score}"><b>${r.score}%</b></div><div><h4>${esc(r.confidence[0])}</h4><p>${esc(r.confidence[1])}</p></div></div></div>` : "";
    return `<section class="card decision" aria-live="polite">
      <div class="decision-hero ${r.tone}"><div class="eyebrow">${esc(r.kicker)}</div><h2>${esc(r.route)}</h2><p>${esc(r.summary)}</p>
        <div class="row">${r.meta.map(([k, v]) => ui.tag(`${k}: ${v}`)).join("")}<span class="spacer"></span></div></div>
      <div class="decision-body">${ui.kpis(r.kpis)}${scale}${fit}
        ${FG.ui.tabs("decision", [
          ["why", "Why this result", `<div class="reasons">${r.reasons.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>`, r.reasons.length],
          ["controls", "Controls & confidence", (flags + confidence) || "", null],
          ["files", "File pack", r.docs ? `<div class="docs">${r.docs.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>` : "", r.docs ? r.docs.length : null],
          ["next", "Next actions", `<div class="actions-list">${r.actions.map(([a, b]) => `<div><div><b>${esc(a)}</b><span>${esc(b)}</span></div></div>`).join("")}</div>`, r.actions.length],
        ])}
        ${opts.footer || ""}
      </div></section>`;
  };

  // Path → scenario category: a compact self-check appears only at the end of each module.
  FG.QUIZ_AT = {};
  /* ---------- advanced visuals ---------- */
  // Threshold ruler: piecewise-log scale so small and large thresholds are both readable.
  // zones: [[from, to, label, colourVar]], marks: [[value, label]], value: the case amount (optional).
  FG.ui.ruler = function ({ zones, marks, value, max }) {
    const stops = [0, ...marks.map(([v]) => v), max];
    const pos = (v) => { v = Math.max(0, Math.min(max, v)); for (let k = 1; k < stops.length; k++) if (v <= stops[k]) return ((k - 1) + (v - stops[k - 1]) / (stops[k] - stops[k - 1])) / (stops.length - 1) * 100; return 100; };
    const hit = value > 0 ? zones.find(([a, b]) => value > a && value <= b) || zones[zones.length - 1] : null;
    return `<div class="ruler no-enrich" role="img" aria-label="Threshold ruler${hit ? `: ${esc(euro(value))} falls in ${esc(hit[2])}` : ""}">
      <div class="ruler-track">${zones.map(([a, b, l, c]) => `<span class="ruler-zone${hit && hit[2] === l ? " on" : ""}" style="left:${pos(a)}%;width:${pos(b) - pos(a)}%;--c:var(${c})"><em>${esc(l)}</em></span>`).join("")}
        ${value > 0 ? `<i class="ruler-pin" style="left:${pos(value)}%"><b>${esc(euro(value))}</b></i>` : ""}</div>
      <div class="ruler-marks">${marks.map(([v, l]) => `<span style="left:${pos(v)}%"><b>${esc(euro(v))}</b>${l ? `<small>${esc(l)}</small>` : ""}</span>`).join("")}</div></div>`;
  };
  // Gate funnel: each gate narrows the field; shows what is tested and what happens on failure.
  FG.ui.funnel = function (title, gates) {
    return `<section class="card funnel no-enrich"><div class="card-head"><div><h3>${esc(title)}</h3><small>Each gate must be passed before the next one is applied.</small></div></div>
      <ol class="funnel-list">${gates.map(([t, test, fail, kind], k) => `<li style="--w:${100 - k * (55 / Math.max(1, gates.length - 1))}%;--c:var(--c${(k % 4) + 1})"><div class="funnel-bar"><span>${k + 1}</span><b>${esc(t)}</b><em>${esc(kind || "")}</em></div><p>${esc(test)}${fail ? `<small>If not: ${esc(fail)}</small>` : ""}</p></li>`).join("")}</ol></section>`;
  };

  /* ---------- router ---------- */
  FG.route = function (pattern, def) {
    const keys = [];
    const re = new RegExp("^" + pattern.replace(/:(\w+)/g, (_, k) => (keys.push(k), "([^/]+)")) + "$");
    FG.routes.push({ pattern, re, keys, ...def });
  };
  function match(path) {
    for (const r of FG.routes) {
      const m = path.match(r.re);
      if (m) return { route: r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) };
    }
    return null;
  }
  FG.path = () => (location.hash.replace(/^#\/?/, "") || "home").split("?")[0];
  FG.go = (path) => { location.hash = "#/" + path; };

  let current = null;
  // Identify an element by a stable attribute so it can be found again after a re-render.
  const KEYS = ["id", "name", "data-tab", "data-k", "data-rd-go", "data-flow", "data-opt", "data-cat", "data-s", "data-p", "data-c"];
  const sig = (el) => { const k = KEYS.find((a) => el.hasAttribute && el.hasAttribute(a)); return k ? `[${k}="${CSS.escape(el.getAttribute(k))}"]` : null; };
  function snapshot(root) {
    const a = document.activeElement, f = a && root.contains(a) ? sig(a) : null;
    return {
      focus: f, sel: f && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null,
      details: [...root.querySelectorAll("details")].map((d) => d.open),
      scrollers: [...root.querySelectorAll(".rt-scroll, .table-wrap, .tablist, .rd-nav")].map((x) => x.scrollLeft),
      panels: [...root.querySelectorAll("[data-rd]")].map((rd) => { const b = rd.querySelector('.rd-nav [aria-selected="true"]'); return b ? b.dataset.rdGo : null; }),
    };
  }
  function restore(root, m) {
    root.querySelectorAll("details").forEach((d, i) => { if (m.details[i] !== undefined) d.open = m.details[i]; });
    root.querySelectorAll(".rt-scroll, .table-wrap, .tablist, .rd-nav").forEach((x, i) => { if (m.scrollers[i]) x.scrollLeft = m.scrollers[i]; });
    root.querySelectorAll("[data-rd]").forEach((rd, i) => { const k = m.panels[i]; if (k != null) rd.querySelector(`.rd-nav [data-rd-go="${k}"]`)?.click(); });
    if (m.focus) { const el = root.querySelector(m.focus); if (el) { el.focus({ preventScroll: true }); if (m.sel && el.setSelectionRange) try { el.setSelectionRange(...m.sel); } catch (e) {} } }
  }
  FG.refresh = function (keepScroll = true) {
    const y = window.scrollY, path = FG.path(), hit = match(path) || match("home");
    const main = $("#content"), old = main.firstElementChild;
    // In-place refresh (an interaction on the same page): remember what the reader was doing so the
    // new render is indistinguishable from an update — no entry animation, same focus, same open panels.
    const inPlace = keepScroll && !!old, memo = inPlace ? snapshot(old) : null;
    const view = hit.route.render(hit.params) || {};
    const root = document.createElement("div");
    root.innerHTML = view.html || "";
    if (inPlace) { document.documentElement.classList.add("quiet"); root.classList.add("still"); }
    main.replaceChildren(root);
    current = { path, hit };
    const crumbs = [["Home", "home"], ...(hit.route.crumbs ? hit.route.crumbs(hit.params) : [])];
    $("#crumbs").innerHTML = crumbs.map(([t, p], i) => (i === crumbs.length - 1 ? `<b>${esc(t)}</b>` : `<a href="#/${p}">${esc(t)}</a><span aria-hidden="true">/</span>`)).join("");
    document.title = `${crumbs[crumbs.length - 1][0]} · Financial Guide`;
    const section = hit.route.section || path.split("/")[0];
    $$(".nav a").forEach((a) => { if (a.dataset.section === section) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    FG.bindCommon(root, view.onSeg);
    if (view.mount) view.mount(root);
    if (FG.enrich) FG.enrich(root);
    requestAnimationFrame(() => FG.placeInk(root));
    document.documentElement.dataset.tone = FG.TONES[section] || 1;
    const quizCat = FG.QUIZ_AT[path];
    if (quizCat && FG.ui.quiz) root.insertAdjacentHTML("beforeend", FG.ui.quiz(quizCat));
    const step = FG.JOURNEY.findIndex((j) => j.sections.includes(section));
    // Procurement and grants have their own route; the generic journey bar would compete with it.
    if (step >= 0 && FG.JOURNEY[step + 1] && !["procurement", "grants"].includes(section)) {
      const n = FG.JOURNEY[step + 1], bar = document.createElement("nav");
      bar.className = "next-step no-print"; bar.setAttribute("aria-label", "Next step in the journey");
      bar.innerHTML = `<span>Step ${step + 1} of ${FG.JOURNEY.length} · ${esc(FG.JOURNEY[step].title)}</span><a href="#/${n.path}"><small>Next step</small><b>${esc(n.title)} →</b></a>`;
      root.appendChild(bar);
    }
    if (memo) restore(root, memo);
    if (keepScroll) { window.scrollTo(0, y); requestAnimationFrame(() => window.scrollTo(0, y)); }
    if (inPlace) requestAnimationFrame(() => requestAnimationFrame(() => document.documentElement.classList.remove("quiet")));
  };
  window.addEventListener("hashchange", () => { document.querySelectorAll("body > .sb-mini").forEach((x) => x.remove()); if (FG.closeOverlays && document.querySelector(".sheet.open")) FG.closeOverlays();
    const changedPage = !current || FG.path().split("/")[0] !== current.path.split("/")[0];
    // Moving between stages of the same module keeps the reader where they are.
    FG.refresh(!changedPage);
    if (changedPage) { window.scrollTo(0, 0); $("#content").focus({ preventScroll: true }); }
  });

  /* ---------- search ---------- */
  FG.addIndex = (title, sub, path, kind, keywords = "") => FG.index.push({ title, sub, path, kind, hay: `${title} ${sub} ${keywords}`.toLowerCase() });
  function search(q) {
    const terms = q.toLowerCase().trim().split(/\s+/).filter(Boolean);
    if (!terms.length) return FG.index.filter((x) => x.kind === "Module" || x.kind === "Engine").slice(0, 14);
    return FG.index.map((x) => {
      let score = 0;
      for (const t of terms) { if (!x.hay.includes(t)) return null; score += x.title.toLowerCase().includes(t) ? 3 : 1; }
      return { x, score: score + (x.kind === "Module" ? 1 : 0) };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30).map((r) => r.x);
  }
  let results = [], sel = 0;
  function renderResults() {
    const list = $("#paletteList");
    list.innerHTML = results.length ? results.map((r, i) => `<li><a href="#/${esc(r.path)}" role="option" aria-selected="${i === sel}" data-i="${i}"><span>${esc(r.title)}</span><small>${esc(r.sub)}</small>${FG.ui.tag(r.kind)}</a></li>`).join("") : `<li class="empty"><b>No results</b>Try another word, such as “threshold”, “addendum” or “petty cash”.</li>`;
    const active = $(`[aria-selected="true"]`, list); if (active) active.scrollIntoView({ block: "nearest" });
  }
  FG.openPalette = function () {
    $("#palette").classList.add("open"); $("#overlay").classList.add("open");
    const input = $("#paletteInput"); input.value = ""; results = search(""); sel = 0; renderResults(); input.focus();
  };
  function closeOverlays() {
    ["#palette", "#overlay"].forEach((s) => $(s).classList.remove("open"));
    const sh = $("#sheet"); if (sh && !sh.hidden) { sh.classList.remove("open"); setTimeout(() => { sh.hidden = true; }, 200); if (FG.sheetFrom) FG.sheetFrom.focus({ preventScroll: true }); }
  }
  FG.closeOverlays = closeOverlays;
  // Side sheet for details: opens over the page without leaving it.
  FG.openSheet = function (kicker, title, html) {
    FG.sheetFrom = document.activeElement;
    $("#sheetKicker").textContent = kicker; $("#sheetTitle").textContent = title; $("#sheetBody").innerHTML = html;
    if (FG.enrich) FG.enrich($("#sheetBody"));
    const sh = $("#sheet"); sh.hidden = false; requestAnimationFrame(() => sh.classList.add("open")); $("#overlay").classList.add("open"); $("#sheetClose").focus();
  };

  const svg = (d) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    menu: svg('<path d="M4 6h16M4 12h16M4 18h16"/>'),
    case: svg('<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/>'),
    system: svg('<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'),
    light: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
    dark: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
    close: svg('<path d="M18 6 6 18M6 6l12 12"/>'),
  };
  FG.ICON = ICON;
  /* ---------- toast & theme ---------- */
  let toastTimer;
  FG.toast = (text) => { const t = $("#toast"); t.textContent = text; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200); };
  function applyTheme(theme) {
    if (theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", theme);
    const btn = $("#themeBtn"); if (btn) { btn.innerHTML = ICON[theme]; btn.setAttribute("aria-label", `Theme: ${theme}. Change theme`); }
  }

  /* ---------- shell ---------- */
  FG.start = function () {
    const groups = FG.nav;
    document.body.innerHTML = `<a class="skip" href="#content">Skip to content</a>
<div class="app no-side">
  <div class="main">
    <header class="top">
      <a class="brand" href="#/home"><span class="brand-mark" aria-hidden="true">FG</span><span><b>Financial Guide</b><small>Council of Europe</small></span></a>
      <div class="top-actions">
        <button class="search-btn" id="searchBtn" aria-label="Search the guide">${ICON.search}<span>Search the guide…</span><kbd>Ctrl K</kbd></button>
        <button class="icon-btn" id="themeBtn" aria-label="Change theme"></button>
      </div>
    </header>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <main class="content" id="content" tabindex="-1"></main>
    <footer class="foot">Guidance tool. It does not replace the applicable rules, the Procurement Guide or Finance validation. <span class="build">Version 2026-10-13 05:37</span></footer>
  </div>
</div>
<div class="overlay" id="overlay"></div>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search">
  <input id="paletteInput" type="search" placeholder="Search procedures, rules, documents, tools…" aria-label="Search" autocomplete="off" role="combobox" aria-controls="paletteList" aria-expanded="true">
  <ul id="paletteList" role="listbox"></ul>
  <div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
</div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="sheet-head"><div><small id="sheetKicker"></small><h2 id="sheetTitle"></h2></div><button class="icon-btn" id="sheetClose" aria-label="Close details">${ICON.close}</button></div><div class="sheet-body" id="sheetBody"></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>`;

    applyTheme(FG.store.get("theme", "system"));
    $("#themeBtn").onclick = () => { const order = ["system", "light", "dark"], next = order[(order.indexOf(FG.store.get("theme", "system")) + 1) % 3]; FG.store.set("theme", next); applyTheme(next); FG.toast(`Theme: ${next}`); };
    $("#searchBtn").onclick = FG.openPalette;
    $("#sheetClose").onclick = closeOverlays;
    $("#overlay").onclick = closeOverlays;
    $("#paletteInput").addEventListener("input", (e) => { results = search(e.target.value); sel = 0; renderResults(); });
    $("#paletteInput").addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + results.length) % Math.max(1, results.length); renderResults(); }
      if (e.key === "Enter" && results[sel]) { FG.go(results[sel].path); closeOverlays(); }
    });
    $("#paletteList").addEventListener("click", (e) => { if (e.target.closest("a")) closeOverlays(); });
    document.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); FG.openPalette(); }
      else if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); FG.openPalette(); }
      else if (e.key === "Escape") closeOverlays();
    });
    FG.refresh(false);
  };

})();

</script>
<script>
/* visuals.js */
/* Dynamic visuals: procedure clock (dates from your deadline) and approval chain (who signs at your value). */
(function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const DAY = 864e5;
  const iso = (d) => d.toISOString().slice(0, 10);
  const add = (d, n) => new Date(d.getTime() + n * DAY);
  const fmt = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const today = () => { const t = new Date(); return new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())); };
  const parse = (v, fb) => { const d = v ? new Date(v + "T00:00:00Z") : null; return d && !isNaN(d) ? d : fb; };
  FG.vis = {};

  /* ---------- procedure clock ---------- */
  function procEvents(D, S, intl) {
    const N = add(S, 15);
    return [
      intl && [add(D, -21), "Publish the call (latest)", "At least 3 weeks before the deadline (international call).", "prep"],
      [add(D, -2), "Last answer to questions", "No answers later than 48 hours before the deadline.", "prep"],
      [D, "Submission deadline", "Offers received after it are not admissible.", "key"],
      [S, "Contract signed", "Sign before notifying the unsuccessful bidders.", "key"],
      [N, "Unsuccessful bidders notified", "In writing, at the latest 15 days after the successful bidder is notified.", "after"],
      [add(N, 7), "Enquiry window closes", "Bidders may enquire within 7 days of notification.", "after"],
      [add(N, 37), "Complaint window (indicative)", "A complaint to the Tenders Board is due within 30 days of the reply to the enquiry; shown here from the end of the enquiry window.", "soft"],
      [add(D, 180), "Offers expire", "Offers stay valid for 180 calendar days from the deadline.", "limit"],
    ].filter(Boolean);
  }
  function grantEvents(D, S) {
    const N = add(S, 15);
    return [
      [D, "Submission deadline", "Proposals received after it are rejected.", "key"],
      [S, "Successful applicants notified", "Agreements follow the award decision.", "key"],
      [N, "Unsuccessful applicants informed", "At the latest 15 calendar days after the successful ones.", "after"],
      [add(N, 7), "Enquiry period ends (minimum)", "The letter states an enquiry period of at least 7 calendar days.", "after"],
      [add(N, 37), "Complaint deadline (indicative)", "30 calendar days from notification of the reply to the enquiry; shown from the end of the enquiry period.", "soft"],
      [add(N, 67), "Review Board meets (latest)", "Within 30 calendar days of receiving the complaint.", "soft"],
    ];
  }
  FG.vis.clock = function (base) {
    const isP = base !== "grants", st = FG.store.get("clock:" + base, {});
    const D = parse(st.d, add(today(), 30)), S = parse(st.s, add(D, 30));
    return `<section class="vc card" data-clock="${base}"><div class="vc-head"><div><span class="eyebrow">Procedure clock</span><b>Every deadline, calculated from your dates</b></div>
      <div class="vc-in"><label><span>Submission deadline</span><input type="date" data-ck="d" value="${iso(D)}"></label>
        <label><span>${isP ? "Contract signature" : "Award notification"}</span><input type="date" data-ck="s" value="${iso(S)}"></label>
        ${isP ? `<label class="rc-chk"><input type="checkbox" data-ck="i" ${st.i === false ? "" : "checked"}> International call</label>` : ""}</div></div>
      <div class="vc-body" data-ck-out></div>
      <p class="vc-note">Calendar days. Indicative dates depend on when the enquiry is answered; always check the letter you sent.</p></section>`;
  };
  function drawClock(box) {
    const base = box.dataset.clock, isP = base !== "grants", g = (k) => box.querySelector(`[data-ck="${k}"]`);
    const D = parse(g("d").value, today()), S = parse(g("s").value, add(D, 30)), intl = isP ? g("i").checked : false;
    FG.store.set("clock:" + base, { d: iso(D), s: iso(S), i: intl });
    const ev = (isP ? procEvents(D, S, intl) : grantEvents(D, S)).sort((a, b) => a[0] - b[0]);
    const t0 = ev[0][0].getTime(), t1 = ev[ev.length - 1][0].getTime(), span = Math.max(t1 - t0, DAY), now = today().getTime();
    const pos = (d) => ((d.getTime() - t0) / span) * 100;
    const warn = isP && S > add(D, 180) ? `<div class="vc-warn">Signature falls after the offers expire (${fmt(add(D, 180))}). Ask bidders to extend validity or sign earlier.</div>` : S < D ? `<div class="vc-warn">${isP ? "Signature" : "Notification"} is before the submission deadline. Check the dates.</div>` : "";
    box.querySelector("[data-ck-out]").innerHTML = `${warn}
      <div class="vc-track"><i class="vc-line"></i>${now >= t0 && now <= t1 ? `<i class="vc-today" style="left:${pos(today())}%"><span>Today</span></i>` : ""}
        ${ev.map(([d, t], k) => `<button type="button" class="vc-dot ${ev[k][3]}" style="left:${pos(d)}%" data-ck-k="${k}" title="${esc(t)}: ${fmt(d)}"></button>`).join("")}</div>
      <ol class="vc-list">${ev.map(([d, t, x, kind], k) => { const days = Math.round((d.getTime() - now) / DAY);
        return `<li class="${kind}" data-ck-row="${k}"><time><b>${fmt(d)}</b><small>${days === 0 ? "today" : days > 0 ? `in ${days} days` : `${-days} days ago`}</small></time><div><b>${esc(t)}</b><p>${esc(x)}</p></div></li>`; }).join("")}</ol>`;
  }

  /* ---------- approval chain ---------- */
  FG.vis.approvals = function () {
    const st = FG.store.get("chain", { v: 90000, x: true, e: false });
    return `<section class="va card" data-chain><div class="vc-head"><div><span class="eyebrow">Approval chain</span><b>Who has to approve at your value?</b></div>
      <div class="vc-in"><label><span>Estimated value (excl. VAT)</span><div class="rc-val"><b>€</b><input type="number" min="0" step="1000" data-ch="v" value="${st.v}"></div></label>
        <label class="rc-chk"><input type="checkbox" data-ch="x" ${st.x ? "checked" : ""}> Extrabudgetary</label>
        <label class="rc-chk"><input type="checkbox" data-ch="e" ${st.e ? "checked" : ""}> Exceptional direct award</label></div></div>
      <input type="range" class="va-range" min="0" max="100" step="0.5" data-ch="r" aria-label="Value scale">
      <div class="va-scale"><span>€0</span><span>€2k</span><span>€10k</span><span>€55k</span><span>€184k</span><span>€1m</span></div>
      <div data-ch-out></div></section>`;
  };
  // Piecewise scale so the thresholds sit at readable positions.
  const STOPS = [[0, 0], [2000, 18], [10000, 36], [55000, 56], [184000, 78], [1000000, 100]];
  const toPct = (v) => { for (let i = 1; i < STOPS.length; i++) { const [a, pa] = STOPS[i - 1], [b, pb] = STOPS[i]; if (v <= b) return pa + ((v - a) / (b - a)) * (pb - pa); } return 100; };
  const toVal = (p) => { for (let i = 1; i < STOPS.length; i++) { const [a, pa] = STOPS[i - 1], [b, pb] = STOPS[i]; if (p <= pb) return Math.round((a + ((p - pa) / (pb - pa)) * (b - a)) / 500) * 500; } return 1000000; };
  function drawChain(box, fromRange) {
    const g = (k) => box.querySelector(`[data-ch="${k}"]`);
    if (fromRange) g("v").value = toVal(+g("r").value); else g("r").value = toPct(+g("v").value || 0);
    const v = +g("v").value || 0, x = g("x").checked, e = g("e").checked;
    FG.store.set("chain", { v, x, e });
    const intl = v >= 184000, lcr = x && v >= 55000 && v < 184000, eproc = v > 55000;
    const route = e ? (intl ? "Exceptional direct award, Tenders Board" : "Exceptional direct award") : v <= 2000 ? "Direct award possible (€6,000 for intellectual services)" : intl ? "International public call for tenders" : "Competitive bidding";
    const steps = [
      ["Buyer entity", "Prepares the need, the tender file and the evaluation.", true],
      ["DLAPIL", "Legal Compliance Review, about 5 working days for a complete request.", lcr],
      ["CCM", e && !intl ? "Authorises the exceptional direct award on a justified memorandum." : "Authorises the launch and approves the award.", !intl],
      ["Tenders Board", "Competent from €184,000: approves the launch and the award.", intl],
    ];
    box.querySelector("[data-ch-out]").innerHTML = `<p class="va-route"><b>€${v.toLocaleString("en-GB")}</b> → ${esc(route)}${eproc ? ' <span class="va-tag">E-procurement</span>' : ""}</p>
      <ol class="va-chain">${steps.map(([n, d, on], k) => `<li class="${on ? "on" : "off"}" style="--c:var(--c${k + 1})"><em>${on ? k + 1 : "–"}</em><b>${n}</b><p>${on ? esc(d) : "Not required at this value"}</p></li>`).join("")}</ol>`;
  }

  document.addEventListener("input", (e) => {
    const c = e.target.closest("[data-clock]"); if (c) drawClock(c);
    const a = e.target.closest("[data-chain]"); if (a) drawChain(a, e.target.dataset.ch === "r");
  });
  document.addEventListener("change", (e) => { const c = e.target.closest("[data-clock]"); if (c && e.target.type === "checkbox") drawClock(c); });
  document.addEventListener("click", (e) => {
    const d = e.target.closest("[data-ck-k]"); if (!d) return;
    const row = d.closest("[data-clock]").querySelector(`[data-ck-row="${d.dataset.ckK}"]`);
    row.scrollIntoView({ block: "nearest", behavior: "smooth" }); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash");
  });
  new MutationObserver(() => {
    document.querySelectorAll("[data-clock]:not([data-ok])").forEach((b) => { b.dataset.ok = 1; drawClock(b); });
    document.querySelectorAll("[data-chain]:not([data-ok])").forEach((b) => { b.dataset.ok = 1; drawChain(b, false); });
  }).observe(document.documentElement, { childList: true, subtree: true });
})();

</script>
<script>
/* views-case.js */
/* Procurement hub: learn the essentials first, then plan your own case, then follow the stage-by-stage guide.
   Registered before the lifecycle guide so "procurement", "procurement/essentials" and "procurement/my-case"
   are matched ahead of "procurement/:stage". */
(function () {
  "use strict";

  /* ---------- procurement hub: interactive comparison of the three routes ---------- */
  const RC = [
    ["direct", "Direct award", "--c2", "Up to €2,000 · €6,000 for intellectual services", [["Competition", "None: one supplier is chosen"], ["Who decides", "CCM, on a justified memorandum"], ["Key document", "Justified memorandum"]]],
    ["comp", "Competitive bidding", "--c1", "Above the direct-award limit, below €184,000", [["Competition", "At least 3 suppliers invited (below €10,000: public prices of 3+ may be compared)"], ["Who decides", "CCM"], ["Extrabudgetary €55,000+", "Legal Compliance Review by DLAPIL (5 working days)"], ["E-procurement", "Mandatory above €55,000 since 1 April 2026"]]],
    ["intl", "International public call", "--c3", "€184,000 and above", [["Competition", "Open international call for tenders"], ["Who decides", "Tenders Board"], ["Publication", "At least 3 weeks"], ["After award", "Complaints within 30 days; offers valid 180 days"]]],
  ];
  FG.routeCompare = () => `<section class="rc card" data-rc>
      <div class="rc-head"><div><span class="eyebrow">Compare the routes</span><b>Which procedure applies to your purchase?</b></div>
        <div class="rc-in"><label><span>Estimated value (excl. VAT, whole period)</span><div class="rc-val"><b>€</b><input type="number" min="0" step="500" value="25000" data-rc-v aria-label="Estimated value in euros"></div></label>
          <div class="rc-seg" role="group" aria-label="Type of purchase"><button type="button" aria-pressed="true" data-rc-t="g">Goods, services, works</button><button type="button" aria-pressed="false" data-rc-t="i">Intellectual services</button></div>
          <label class="rc-chk"><input type="checkbox" data-rc-x> Extrabudgetary funding</label></div></div>
      <div class="rc-cols">${RC.map(([k, t, c, band, rows]) => `<article class="rc-col" data-rc-col="${k}" style="--c:var(${c})"><header><small>${band}</small><h4>${t}</h4></header><dl>${rows.map(([a, b]) => `<div${/Extrabudgetary/.test(a) ? ' data-rc-xrow' : ""}><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl><span class="rc-you">Your purchase</span></article>`).join("")}</div>
      <p class="rc-verdict" data-rc-out aria-live="polite"></p>
    </section>`;

  FG.grantCompare = () => `<section class="rc card" data-gc>
      <div class="rc-head"><div><span class="eyebrow">Compare the routes</span><b>Direct award or call for proposals?</b></div>
        <div class="rc-in"><label><span>Total estimated budget of the procedure</span><div class="rc-val"><b>€</b><input type="number" min="0" step="500" value="40000" data-gc-v aria-label="Total budget in euros"></div></label></div></div>
      <div class="rc-cols two">
        <article class="rc-col" data-gc-col="d" style="--c:var(--c2)"><header><small>Below €15,000</small><h4>Direct award</h4></header><dl><div><dt>Template</dt><dd>G9.2A</dd></div><div><dt>Competition</dt><dd>No published call is required</dd></div><div><dt>Who checks</dt><dd>Commitments Officer</dd></div></dl><span class="rc-you">Your grant</span></article>
        <article class="rc-col" data-gc-col="c" style="--c:var(--c1)"><header><small>€15,000 and above</small><h4>Call for proposals</h4></header><dl><div><dt>Competition</dt><dd>A published call for proposals is required</dd></div><div><dt>Evaluation</dt><dd>Evaluation Committee with at least 1 staff member; criteria scored 0–5</dd></div><div><dt>After award</dt><dd>Unsuccessful applicants informed within 15 calendar days; complaints within 30</dd></div></dl><span class="rc-you">Your grant</span></article>
      </div><p class="rc-verdict" data-gc-out aria-live="polite"></p></section>`;
  function gcUpdate(b) { const v = +b.querySelector("[data-gc-v]").value || 0, k = v < 15000 ? "d" : "c";
    b.querySelectorAll("[data-gc-col]").forEach((c) => c.classList.toggle("on", c.dataset.gcCol === k));
    b.querySelector("[data-gc-out]").innerHTML = `<b>€${v.toLocaleString("en-GB")} → ${k === "d" ? "Direct award (G9.2A)" : "Call for proposals"}.</b> <a href="#/grants/my-grant">Plan this grant in detail →</a>`; }
  document.addEventListener("input", (e) => { const b = e.target.closest("[data-gc]"); if (b) gcUpdate(b); });
  new MutationObserver(() => document.querySelectorAll("[data-gc]:not([data-gc-ok])").forEach((b) => { b.dataset.gcOk = 1; gcUpdate(b); })).observe(document.documentElement, { childList: true, subtree: true });
  function rcUpdate(box) {
    const v = +box.querySelector("[data-rc-v]").value || 0, intel = box.querySelector('[data-rc-t="i"]').getAttribute("aria-pressed") === "true", x = box.querySelector("[data-rc-x]").checked;
    const low = intel ? 6000 : 2000, k = v <= low ? "direct" : v < 184000 ? "comp" : "intl";
    box.querySelectorAll("[data-rc-col]").forEach((c) => c.classList.toggle("on", c.dataset.rcCol === k));
    box.querySelectorAll("[data-rc-xrow]").forEach((r) => r.classList.toggle("hit", x && k === "comp" && v >= 55000));
    const f = (n) => "€" + n.toLocaleString("en-GB");
    const extra = [k === "comp" && x && v >= 55000 ? "a Legal Compliance Review by DLAPIL" : "", v > 55000 ? "e-procurement" : ""].filter(Boolean);
    box.querySelector("[data-rc-out]").innerHTML = `<b>${f(v)} → ${k === "direct" ? "Direct award" : k === "comp" ? "Competitive bidding" : "International public call"}.</b> ${extra.length ? `Also required: ${extra.join(" and ")}.` : ""} <a href="#/procurement/my-case">Plan this case in detail →</a>`;
  }
  document.addEventListener("input", (e) => { const b = e.target.closest("[data-rc]"); if (b) rcUpdate(b); });
  document.addEventListener("click", (e) => { const t = e.target.closest("[data-rc-t]"); if (!t) return; const b = t.closest("[data-rc]"); b.querySelectorAll("[data-rc-t]").forEach((x) => x.setAttribute("aria-pressed", x === t)); rcUpdate(b); });
  new MutationObserver(() => document.querySelectorAll("[data-rc]:not([data-rc-ok])").forEach((b) => { b.dataset.rcOk = 1; rcUpdate(b); })).observe(document.documentElement, { childList: true, subtree: true });
  const { esc, euro, slug, ui, route } = FG;
  const E = window.FG_ENGINES;
  const L = E.LIMITS;
  const stageLink = (name) => `#/procurement/${slug(name)}`;
  const fmt = (d) => d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

  /* ---------- the twelve essentials (all from the Procurement Guide; €184,000 replaces €171,000) ---------- */
  const ESSENTIALS = [
    ["Value", "Three routes, set by value", "€2,000 / €6,000 · €184,000", "Up to €2,000 (goods, general services, works) or €6,000 (intellectual services): direct award. Above that: competitive bidding. From €184,000: international public call for tenders.", "Thresholds & Procedure", ["A \u20ac4,000 translation service (an intellectual service) can be awarded directly.", true, "Yes: the direct-award ceiling is \u20ac6,000 for intellectual services."]],
    ["Value", "Count the whole need — never split", "Full period", "The threshold is the total foreseeable value of the need, excluding VAT, over the whole period, including renewals, lots and call-offs. Artificial splitting is prohibited and is a fraud red flag.", "Thresholds & Procedure", ["Three yearly contracts of \u20ac70,000 for the same need can each follow competitive bidding.", false, "No: the whole need is \u20ac210,000 over the period, so it is an international public call."]],
    ["Competition", "Competition is the default", "3 suppliers", "Competitive bidding invites at least three potential suppliers. A direct award above the low-value limits is exceptional: unforeseen urgency not caused by the buyer, technical requirements, or considerations of fact or law.", "Market & Suppliers", ["Above the low-value limit, a direct award is allowed whenever the buyer prefers a supplier.", false, "No: only for unforeseen urgency not caused by the buyer, technical requirements, or fact or law."]],
    ["Approval", "No approval, no launch", "CCM · DLAPIL · TB", "The CCM approves the tender documents in writing. Extrabudgetary funding between €55,000 and €184,000 needs a DLAPIL Legal Compliance Review first (5 working days). International calls need Tenders Board authorisation — never retroactively.", "Authorise & Launch", ["The Tenders Board can approve the launch of an international call after it has been published.", false, "No: the Tenders Board cannot approve a launch retroactively."]],
    ["Fairness", "Criteria are fixed once published", "Locked", "Exclusion, eligibility and award criteria and their weightings cannot be changed or subdivided after publication. Price normally weighs at least 20 points.", "Tender Design", ["Award weightings may be adjusted after opening if the offers are very different.", false, "No: criteria and weightings are locked once the call is published."]],
    ["Fairness", "Same information for everyone", "Q&A", "Answer bidders only through the published question-and-answer procedure, so every bidder has the same information at the same time. Never share details of a future call in advance.", "Authorise & Launch", ["A bidder who phones with a question can be answered directly to save time.", false, "No: answers go through the published Q&A so every bidder gets the same information."]],
    ["Evaluation", "Gates before scores", "3 gates", "An offer is first checked for admissibility, then exclusion, then eligibility (pass or fail). Only the remaining offers are scored against the published award criteria, with a written justification.", "Open & Evaluate", ["An offer that fails an eligibility criterion is still scored on the award criteria.", false, "No: eligibility is pass or fail; only eligible offers are scored."]],
    ["Evaluation", "Clarify, never change an offer", "Art. 17.2", "You may ask a bidder to clarify, but the offer itself cannot change. A missing financial offer or an unsigned act of engagement cannot be fixed after opening.", "Open & Evaluate", ["A missing financial offer can be requested from the bidder after opening.", false, "No: you may clarify an offer, never complete or change it."]],
    ["Award", "Sign the winner, then inform the others", "15 days", "Sign with the selected supplier first, then notify unsuccessful bidders within 15 days, disclosing only the winner's name, country and amount.", "Negotiate & Award", ["Unsuccessful bidders are informed before the contract with the winner is signed.", false, "No: sign with the winner first, then inform the others within 15 days."]],
    ["Contract", "PO first, signature second, work third", "PO", "A purchase order must exist in FIMS before any contract is signed, and no supplier may start work before the Organisation has signed.", "Contract Signing", ["A supplier may start work once the CCM has approved the award, before the PO exists.", false, "No: PO first, signature second, work third."]],
    ["Contract", "Amend before expiry, watch the ceiling", "€184,000", "Amendments are made before the contract expires and never change its scope. A framework contract awarded by competitive bidding must never exceed €184,000.", "Contract Management", ["A framework contract awarded by competitive bidding may grow to \u20ac200,000 through amendments.", false, "No: it must never exceed \u20ac184,000."]],
    ["Integrity", "Declare, refuse, archive", "10 years", "Declare your interests every year by the end of January, accept no gifts, and keep the complete procurement file for 10 years — missing justifications are a recurring audit finding.", "Performance & Filing", ["The procurement file must be kept for 10 years.", true, "Yes: missing justifications are a recurring audit finding."]],
  ];
  const known = () => FG.store.get("pr:known", {});
  const knownCount = () => Object.keys(known()).length;


  /* ---------- learning flow: one rule at a time, confirmed by a true/false check ---------- */
  function learnPage(list, set, base, nextHref, nextLabel) {
    const kn = FG.store.get(set, {}), k = Object.keys(kn).length, ans = FG.store.get(set + ":ans", {});
    let i = FG.store.get(set + ":at", 0); if (i >= list.length) i = 0;
    const [cat, title, fig, text, stage, q] = list[i], a = ans[i];
    const done = k === list.length;
    return `<div class="lf">
      <div class="lf-dots" role="tablist">${list.map((x, j) => `<button type="button" data-lf="${j}" data-set="${set}" class="${kn[j] ? "ok" : ""}${j === i ? " on" : ""}" aria-label="Rule ${j + 1}: ${esc(x[1])}">${kn[j] ? "✓" : j + 1}</button>`).join("")}<span>${k} / ${list.length} learnt</span></div>
      <article class="lf-card" style="--c:var(--c${(i % 4) + 1})">
        <div class="lf-left"><span class="lf-cat">Rule ${i + 1} · ${esc(cat)}</span><div class="lf-fig">${esc(fig)}</div></div>
        <div class="lf-main"><h2>${esc(title)}</h2><p>${esc(text)}</p>
          <div class="lf-q"><small>Check yourself</small><b>${esc(q[0])}</b>
            <div class="lf-btns">${[["true", "True"], ["false", "False"]].map(([v, l]) => `<button type="button" data-lfa="${v}" data-i="${i}" data-set="${set}" class="${a ? (String(q[1]) === v ? "right" : a === v ? "wrong" : "") : ""}" ${a ? "disabled" : ""}>${l}</button>`).join("")}</div>
            ${a ? `<p class="lf-fb ${a === String(q[1]) ? "good" : "bad"}">${a === String(q[1]) ? "Correct. " : "Not quite. "}${esc(q[2])}${a !== String(q[1]) ? ` <button type="button" class="lf-retry" data-lfr="${i}" data-set="${set}">Try again</button>` : ""}</p>` : ""}</div>
          <footer><a href="#/${base}/${slug(stage)}">Read more in “${esc(stage)}” →</a>
            <span>${i ? `<button type="button" class="btn sm ghost" data-lf="${i - 1}" data-set="${set}">← Previous</button>` : ""}${i < list.length - 1 ? `<button type="button" class="btn sm primary" data-lf="${i + 1}" data-set="${set}">Next rule →</button>` : `<a class="btn sm primary" href="${nextHref}">${nextLabel} →</a>`}</span></footer></div>
      </article>
      ${done ? `<div class="lf-done"><b>All ${list.length} rules learnt.</b> <a href="${nextHref}">${nextLabel} →</a></div>` : ""}</div>`;
  }
  document.addEventListener("click", (e) => {
    const go = e.target.closest("[data-lf]"), ans = e.target.closest("[data-lfa]"), retry = e.target.closest("[data-lfr]");
    if (retry) { const all = FG.store.get(retry.dataset.set + ":ans", {}); delete all[retry.dataset.lfr]; FG.store.set(retry.dataset.set + ":ans", all); FG.refresh(); }
    if (go) { FG.store.set(go.dataset.set + ":at", +go.dataset.lf); FG.refresh(); }
    if (ans) {
      const set = ans.dataset.set, i = ans.dataset.i, all = FG.store.get(set + ":ans", {}); all[i] = ans.dataset.lfa; FG.store.set(set + ":ans", all);
      const list = set === "pr:known" ? ESSENTIALS : G_ESSENTIALS, right = String(list[i][5][1]) === ans.dataset.lfa;
      if (right) { const kn = FG.store.get(set, {}); kn[i] = 1; FG.store.set(set, kn); }
      FG.refresh();
    }
  });

  /* ---------- hub ---------- */
  route("procurement", {
    section: "procurement",
    crumbs: () => [["Projects", "projects"], ["Procurement", "procurement"]],
    render() {
      const k = knownCount(), c = FG.store.get("pcase", null), r = c && Number(c.value) ? E.procurementCase(c) : null;
      const stages = FG.C.procurementStages, last = FG.store.get("procurement:last", 0), visited = Object.keys(FG.store.get("procurement:visited", {})).length;
      const [qa, qn, qs] = quizProgress("procurement");
      const paths = [
        ["1", "Follow the guide", `${stages.length} stages in three phases, from preparing the need to filing.`, `procurement/${slug(stages[last].name)}`, `${visited} of ${stages.length} stages opened`, visited / stages.length, 1, visited ? `Continue at ${stages[last].name}` : "Open stage 1"],
        ["2", "Plan my case", r ? `${esc(c.what || "Your purchase")} · ${euro(r.value)} → ${r.route}` : "Answer a few questions: get your route, approvals, timeline, documents and risks.", "procurement/my-case", r ? `Start by ${fmt(r.start)}` : "Not started", r ? 1 : 0, 2, r ? "Open my case" : "Plan a case"],
        ["3", "Test yourself", "20 questions from easy to expert, with real cases and explanations.", "procurement/test", qa ? `${qs} of ${qn} correct · ${qa} answered` : `${qn} questions · 5 levels`, qn ? qa / qn : 0, 3, qa ? "Continue the test" : "Start the test"],
      ];

      return { html: `${ui.head("Projects · Procurement", "Procurement", "")}
        <section class="hub-paths">${paths.map(([n, t, d, p, meta, prog, c, cta]) => `<a class="hub-path" href="#/${p}" style="--c:var(--c${c})">
          <span class="hub-n">${n}</span><h2>${t}</h2><p>${d}</p>
          <div class="hub-meta"><span>${esc(meta)}</span><i><u style="width:${Math.round(prog * 100)}%"></u></i></div><b class="hub-cta">${esc(cta)} →</b></a>`).join("")}</section>
        <div class="hub-sec">${FG.reviewChip()}<a class="hub-ref" href="#/procurement/reference"><span>§</span><div><b>Quick reference</b><small>Contract types · limits & deadlines · roles · how-to</small></div><u>Open →</u></a><a class="hub-ref" href="#/procurement/essentials"><span>12</span><div><b>The essentials</b><small>Twelve rules to know, one at a time · ${k} learnt</small></div><u>Open →</u></a></div>
        ${FG.routeCompare()}` };

  /* ---------- procurement widgets ---------- */

        <div class="chips" data-ctx>${Object.entries(ctx).map(([k, v]) => `<button class="chip" data-k="${k}" aria-pressed="${k === pick}">${esc(v.label)}</button>`).join("")}</div>

          <section class="card"><div class="card-head"><h3>Who does what · ${esc(m.label)}</h3></div><div class="card-body stack">${m.roles.map(([r, d]) => `<div><b>${esc(r)}</b><p class="small muted">${esc(d)}</p></div>`).join("")}</div></section>
          <section class="card"><div class="card-head"><h3>Documents & evidence · ${esc(m.label)}</h3></div><div class="card-body stack">${m.docs.map(([r, d]) => `<div><b>${esc(r)}</b><p class="small muted">${esc(d)}</p></div>`).join("")}</div></section>
        </div>
        <div class="section-title"><h2>Procurement role directory</h2></div>
        <div class="grid g2">${Object.values(dir).map((r) => `<section class="card card-pad"><div class="row"><b>${esc(r.name)}</b>${ui.tag(r.tag, "accent")}</div><p class="small muted mt">${esc(r.summary)}</p>
          <p class="small mt"><b>When:</b> ${esc(r.when)}</p><ul class="small mt">${r.does.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
          <p class="small mt muted">Receives from: ${esc(r.receives)} · Hands to: ${esc(r.hands)}</p><div class="row mt">${(r.stages || []).map((s) => `<a class="tag" href="#/procurement/${slug(s)}">${esc(s)}</a>`).join("")}</div></section>`).join("")}</div>`,
        mount(root) { root.querySelector("[data-ctx]").addEventListener("click", (e) => { const b = e.target.closest("[data-k]"); if (b) { FG.store.set("roles:ctx", b.dataset.k); FG.refresh(); } }); } };
    },
  });
  Object.values(C.procurementRoles).forEach((r) => FG.addIndex(r.name, `Role · ${r.summary}`, "roles", "Role", r.does.join(" ")));

  /* ---------- links ---------- */
  route("links", {
    crumbs: () => [["Projects", "projects"], ["Useful links", "links"]],
    render() {
      const cat = FG.store.get("links:cat", "All"), q = FG.store.get("links:q", "");
      const cats = ["All", ...new Set(C.usefulLinks.map((l) => l.cat))];
      const list = C.usefulLinks.filter((l) => (cat === "All" || l.cat === cat) && (!q || `${l.title} ${l.desc} ${l.use}`.toLowerCase().includes(q.toLowerCase())));
      return { html: `${ui.head("Reference", "Links & guidelines", "Guidance, templates and internal tools project teams use most often.")}
        <div class="row"><div class="chips" data-cat>${cats.map((c) => `<button class="chip" data-c="${esc(c)}" aria-pressed="${c === cat}">${esc(c)}</button>`).join("")}</div><span class="spacer"></span><input class="input" style="max-width:280px" type="search" placeholder="Filter resources" aria-label="Filter resources" value="${esc(q)}" data-q></div>
        <div class="tiles mt">${list.map((l) => `<div class="tile"><div class="row"><b>${esc(l.title)}</b><span class="spacer"></span>${ui.tag(l.cat)}</div><small>${esc(l.desc)}</small><small><b>Use for:</b> ${esc(l.use)}</small>${l.url ? `<a class="btn sm" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : `<span class="tag warn">Link to be connected</span>`}</div>`).join("") || `<div class="empty"><b>No resources match</b>Clear the filter to see all ${C.usefulLinks.length} resources.</div>`}</div>`,
        mount(root) {
          root.querySelector("[data-cat]").addEventListener("click", (e) => { const b = e.target.closest("[data-c]"); if (b) { FG.store.set("links:cat", b.dataset.c); FG.refresh(); } });
          const qi = root.querySelector("[data-q]"); qi.addEventListener("input", () => { FG.store.set("links:q", qi.value); FG.refresh(); root.ownerDocument.querySelector("[data-q]").focus(); const n = root.ownerDocument.querySelector("[data-q]"); n.setSelectionRange(n.value.length, n.value.length); });
        } };
    },
  });
  C.usefulLinks.forEach((l) => FG.addIndex(l.title, `${l.cat} · ${l.desc}`, "links", "Link", l.use));
  MODULES.forEach(([, t, s, p]) => FG.addIndex(t, s, p, "Module"));
  TASKS.forEach(([, t, s, p]) => FG.addIndex(`I need to ${t.toLowerCase()}`, s, p, "Task"));
})();

</script>
<script>
/* views-operations.js */
/* Operational modules: PO file, payment file, year-end, petty cash, filing, FOMA workflows. */
(function () {
  "use strict";
  const { C, esc, euro, slug, ui, route } = FG;
  const E = window.FG_ENGINES;

  const pick = (key, list, fallback) => { const v = FG.store.get(key, fallback); return list.includes(v) ? v : fallback; };
  const onClick = (root, attr, fn) => root.addEventListener("click", (e) => { const b = e.target.closest(`[${attr}]`); if (b) fn(b.getAttribute(attr), b, e); });

  // Numbered timeline whose steps can be marked done; the open step is remembered.
  function timeline(id, steps, map) {
    const t = FG.ticks(id), done = steps.filter((_, i) => t[i]).length;
    return `<div class="progress-head"><span>${done} / ${steps.length} steps complete</span>${done ? `<button class="btn ghost sm" data-tl-reset="${esc(id)}">Reset</button>` : ""}</div>${ui.bar((done / steps.length) * 100, done === steps.length ? "good" : "")}
      <div class="timeline mt" data-timeline="${esc(id)}">${steps.map((s, i) => { const m = map(s, i); return `<div class="tl"><div class="tl-dot"><button type="button" class="${t[i] ? "ok" : ""}" data-tl="${i}" aria-pressed="${!!t[i]}" aria-label="Mark step ${i + 1} ${t[i] ? "not done" : "done"}">${t[i] ? "✓" : i + 1}</button></div>
        <details class="tl-body" ${i === 0 ? "open" : ""}><summary>${esc(m.title)}${m.sub ? `<small>${esc(m.sub)}</small>` : ""}</summary><p>${esc(m.text)}</p>${m.list ? `<ul>${m.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</details></div>`; }).join("")}</div>`;
  }
  function mountTimeline(root) {
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-tl]");
      if (b) { const id = b.closest("[data-timeline]").dataset.timeline; FG.tick(id, b.dataset.tl, !FG.ticks(id)[b.dataset.tl]); FG.refresh(); }
      const r = e.target.closest("[data-tl-reset]");
      if (r) { FG.store.set("ticks:" + r.dataset.tlReset, {}); FG.refresh(); }
    });
  }
  function contextPanel(key) {
    const m = C.moduleContexts[key]; if (!m) return "";
    return `<section class="card"><div class="card-head"><h3>Who does what</h3></div><div class="card-body stack">${m.roles.map(([r, d]) => `<div><b>${esc(r)}</b><p class="small muted">${esc(d)}</p></div>`).join("")}</div></section>`;
  }

  /* ---------- PO file ---------- */
  const SERVICES = Object.keys(C.poServices);
  const VISA_ROLES = ["Project Officer", "Content Manager", "Head of Unit", "Finance Officer", "CCM"];
  const VISA_ROWS = [
    ["Activities Work Plan (AWP)", "", [1, 1, 1, 1, 1]],
    ["Local / international consultant", "One-off contract, Order Form, Call-off, Grants", [1, 1, 0, 1, 1], ["Consultants"]],
    ["Imprest agreement", "Fixed assets for beneficiaries", [1, 1, 0, 1, 1]],
    ["Service contract / invoice", "With a service provider", [1, 0, 0, 1, 1], ["Event Management", "Other Services"]],
    ["Purchase of goods / works", "", [1, 0, 0, 1, 1]],
    ["Translation / interpretation", "", [1, 0, 0, 1, 1], ["Interpretation", "Translation"]],
    ["In-country / international mission", "", [1, 0, 0, 1, 1]],
    ["All unforeseen", "As per AWP", [1, 1, 1, 1, 1]],
  ];
  function servicePicker(key, service) {
    return `<div class="chips" data-service="${key}">${SERVICES.map((s) => `<button class="chip" data-s="${esc(s)}" aria-pressed="${s === service}">${esc(C.poServices[s].icon || "")} ${esc(s)}</button>`).join("")}</div>`;
  }
  function docList(id, title, items) {
    const t = FG.ticks(id);
    return `<div data-checklist="${esc(id)}"><h3 class="small" style="text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px">${esc(title)}</h3><div class="checklist">${items.map(([a, b], i) => `<label class="check ${t[i] ? "done" : ""}"><input type="checkbox" data-i="${i}" ${t[i] ? "checked" : ""}><div><b>${esc(a)}</b><small>${esc(b)}</small></div></label>`).join("")}</div></div>`;
  }
  Object.assign(FG.QUIZ_AT, { "payment-file": "payment", "year-end": "yearend", filing: "filing", "foma/reports": "reporting", "foma/forecast": "forecast", "foma/mission-order": "mission" });
  route("po-file", {
    crumbs: () => [["Projects", "projects"], ["PO file", "po-file"]],
    render() {
      const service = pick("service", SERVICES, SERVICES[0]), d = C.poServices[service];
      const signedId = `po:${service}:signed`, supportId = `po:${service}:support`;
      const all = d.signed.length + d.support.length, ticked = Object.keys(FG.ticks(signedId)).length + Object.keys(FG.ticks(supportId)).length;
      const visa = FG.ticks("visa"), required = VISA_ROWS.reduce((a, r) => a + r[2].filter(Boolean).length, 0), verified = Object.keys(visa).length;
      return { html: `${FG.modHead("po-file", "Purchase order · file builder", "How to prepare a PO file", "Build a complete, signature-ready and audit-ready PO file. Follow the steps, then choose the service type to get the exact document package from the Financial Documents Content List.", `<a class="btn" href="#/payment-file">Continue to payment →</a>`)}
        <div class="split">
          <div class="stack">
            <section class="card"><div class="card-head"><div><h3>Document builder</h3><small>Documents to be signed are separated from supporting evidence.</small></div>${ui.tag(`${ticked}/${all} ready`, ticked === all ? "good" : "")}</div><div class="card-body stack">
              ${servicePicker("po", service)}<p class="small muted">${esc(d.sub || "")}</p>
              <div class="grid g2">${docList(signedId, "To be signed", d.signed)}${docList(supportId, "Supporting documents", d.support)}</div></div></section>
            <section class="card"><div class="card-head"><div><h3>Visa / signature matrix</h3><small>Commitment and settlement of expenditure. The row for the selected service is highlighted; click a required cell to mark it verified.</small></div>${ui.tag(`${verified}/${required} visas`, verified === required ? "good" : "")}</div><div class="card-body stack">
              <div class="table-wrap"><table class="t visa"><thead><tr><th>Phase / expenditure type</th>${VISA_ROLES.map((r) => `<th class="c">${esc(r)}</th>`).join("")}</tr></thead><tbody>
              ${VISA_ROWS.map((r, i) => `<tr class="${(r[3] || []).includes(service) ? "hl" : ""}"><td><b>${esc(r[0])}</b>${r[1] ? `<small>${esc(r[1])}</small>` : ""}</td>${r[2].map((req, j) => `<td class="c">${req ? `<button type="button" class="req ${visa[`${i}-${j}`] ? "ok" : ""}" data-visa="${i}-${j}" aria-label="${esc(VISA_ROLES[j])} visa for ${esc(r[0])}: ${visa[`${i}-${j}`] ? "verified" : "required"}">✓</button>` : `<span class="muted" aria-label="Not required">·</span>`}</td>`).join("")}</tr>`).join("")}
              </tbody></table></div>
              <div class="table-wrap"><table class="t"><thead><tr><th>Project type (financial management)</th><th>CCM DPC</th><th>Financial Unit DPC</th></tr></thead><tbody><tr><td>Decentralised financial management</td><td>In situ</td><td>In situ</td></tr><tr><td>Non-decentralised financial management</td><td>In HQ</td><td>In situ or in HQ</td></tr></tbody></table></div>
              <details class="accordion"><summary>Operational notes</summary><div><ol class="small">
                <li>Once the AWP is approved, the reference allows limited flexibility above the activity budget without full re-approval.</li>
                <li>Material increases to a PO amount should be routed for prior CCM approval in line with the applicable authorisation rules.</li>
                <li>Contracts with substantive elements such as consultants and grants require Content Manager validation, or the relevant superior where applicable.</li>
                <li>The AWP should cover the relevant implementation period and be reviewed periodically.</li>
                <li>Contracts under decentralised management must follow the applicable CCM signature route.</li>
                <li>Procurements in the €55k–€184k band should follow the applicable legal/procurement review route.</li></ol></div></details>
            </div></section>
            <section class="card"><div class="card-head"><h3>Best practice & common mistakes</h3></div><div class="card-body">${ui.pairs(C.poBestPractice)}</div></section>
          </div>
          <aside class="stack sticky">
            <section class="card"><div class="card-head"><h3>PO process</h3></div><div class="card-body">${timeline("po:steps", C.poSteps, (s) => ({ title: s.t, text: s.x, list: s.l }))}</div></section>
            ${contextPanel("pofile")}
          </aside>
        </div>`,
        mount(root) {
          mountTimeline(root);
          onClick(root, "data-s", (v) => { FG.store.set("service", v); FG.refresh(); });
          onClick(root, "data-visa", (k) => { FG.tick("visa", k, !FG.ticks("visa")[k]); FG.refresh(); });
        } };
    },
  });

  /* ---------- payment file ---------- */
  route("payment-file", {
    crumbs: () => [["Projects", "projects"], ["Payment file", "payment-file"]],
    render() {
      const service = pick("service", SERVICES, SERVICES[0]), d = C.payServices[service] || { signed: [], support: [] };
      const row = VISA_ROWS.find((r) => (r[3] || []).includes(service)) || VISA_ROWS[3];
      return { html: `${FG.modHead("payment-file", "Payment · file builder", "How to prepare a payment file", "Continue the control trail created at PO stage: verify delivery, match the invoice to the contractual package and build the finance-ready payment file.", `<a class="btn" href="#/po-file">← PO file</a><a class="btn primary" href="#/engines/payment-readiness">Payment readiness check</a>`)}
        <div class="split">
          <div class="stack">
            <section class="card"><div class="card-head"><div><h3>Payment file builder</h3><small>Use the same service type as the PO.</small></div></div><div class="card-body stack">
              ${servicePicker("pay", service)}
              <div class="grid g2">${docList(`pay:${service}:signed`, "To be signed", d.signed)}${docList(`pay:${service}:support`, "Supporting documents", d.support)}</div></div></section>
            <section class="card"><div class="card-head"><h3>Visa / approval continuity</h3>${ui.tag("Inherited from PO", "accent")}</div><div class="card-body stack">
              <p>Route for <b>${esc(service)}</b> — ${esc(row[0])}:</p>
              <div class="row">${VISA_ROLES.filter((_, j) => row[2][j]).map((r, k, a) => `${ui.tag(r, "accent")}${k < a.length - 1 ? '<span class="muted">→</span>' : ""}`).join("")}</div>
              ${ui.callout("info", "Rule", "Continue with the route processed at PO stage. Re-check it only if the service/expenditure type changes, the contractual basis changes, or a material financial change requires fresh approval.")}</div></section>
            <section class="card"><div class="card-head"><h3>Best practice & common mistakes</h3></div><div class="card-body">${ui.pairs(C.payBestPractice)}</div></section>
          </div>
          <aside class="stack sticky">
            <section class="card"><div class="card-head"><h3>Payment process</h3></div><div class="card-body">${timeline("pay:steps", C.paySteps, (s) => ({ title: s.t, sub: s.s, text: s.text, list: s.list }))}</div></section>
            ${contextPanel("paymentfile")}
          </aside>
        </div>`,
        mount(root) { mountTimeline(root); onClick(root, "data-s", (v) => { FG.store.set("service", v); FG.refresh(); }); } };
    },
  });

  /* ---------- year-end ---------- */
  route("year-end", {
    crumbs: () => [["Projects", "projects"], ["Year-end closing", "year-end"]],
    render() {
      const phase = FG.store.get("eoy:phase", 0), p = C.eoyPhases[phase], meta = C.eoyPhaseMeta[phase] || {};
      const f = FG.store.get("eoy:fy", { delivery: "current", invoice: "yes", budget: "annual" }), r = E.yearAllocation(f);
      return { html: `${FG.modHead("year-end", "Project finance · 2026 closing", "Year-end closing", "Check delivery dates, complete payment files, follow up suppliers and finalise POs when the expenditure is fully recorded.", `<a class="btn primary" href="#/engines/year-end">Year-End Treatment engine</a>`)}
        <div class="grid g3">
          ${ui.callout("info", "Delivery by 31/12/2026", "Only goods delivered and services rendered by 31 December 2026 can be included in 2026 expenditure.", "📅")}
          ${ui.callout("info", "Both budget types", "The year-end accounting rules apply to annual budgets and special accounts.", "◫")}
          ${ui.callout("good", "Check before finalising", "Finalise a 2026 PO only when all expenditure is recorded in FIMS (Fiche PO: “Amount billed” / “Invoices”). You do not need to wait for payment.")}
        </div>
        <div class="split mt">
          <div class="stack">
            <section class="card"><div class="card-head"><h3>Closing phases</h3><small>Action, owner, control and evidence</small></div><div class="card-body stack">
              ${ui.flowHeader(C.eoyPhases, phase, (x) => `<small>${esc(x.m.toUpperCase())}</small><b>${esc(x.t)}</b>`)}
              <ul>${p.items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
              <div class="detail-grid"><div><small>Owner</small>${esc(meta.owner || "—")}</div><div><small>Control</small>${esc(meta.control || "—")}</div><div><small>Evidence</small>${esc(meta.evidence || "—")}</div><div><small>Documents</small>${esc((meta.docs || []).join(" · ") || "—")}</div></div>
            </div></section>
            <section class="card"><div class="card-head"><div><h3>Which financial year?</h3><small>2026 expenditure-allocation table. A guide for the closing check, not a replacement for Finance validation.</small></div></div><div class="card-body stack">
              <form class="grid g3" data-fy>
                ${ui.select("delivery", [["current", "Completed in 2026"], ["next", "Delivered / performed in 2027"], ["split", "Spans 2026 and 2027"]], f.delivery, "Delivery / service")}
                ${ui.select("invoice", [["yes", "Invoice received"], ["no", "Invoice not received"]], f.invoice, "Invoice at year-end")}
                ${ui.select("budget", [["annual", "Annual budget"], ["special", "Special account"]], f.budget, "Budget type")}
              </form>
              <div class="callout ${r.tone}" aria-live="polite"><i aria-hidden="true">${r.tone === "good" ? "✓" : r.tone === "info" ? "→" : "↔"}</i><div><b>${esc(r.title)}</b>${esc(r.text)}<p class="mt"><b>${esc(r.action)}</b></p></div></div>
            </div></section>
            <section class="grid g2">
              <div class="card card-pad"><div class="eyebrow" style="color:var(--good)">Project team — do</div><ul class="small mt"><li>Check open POs regularly.</li><li>Follow up suppliers for missing invoices and documents.</li><li>Send completed payment files to Finance without waiting for the last day.</li><li>Finalise POs as soon as possible once all expenditure is recorded.</li></ul></div>
              <div class="card card-pad"><div class="eyebrow" style="color:var(--risk)">Avoid</div><ul class="small mt"><li>Finalising a PO before checking Amount billed / Invoices in the Fiche PO.</li><li>Including 2027 delivery as 2026 expenditure.</li><li>Waiting for the supplier payment before finalising an otherwise complete PO.</li><li>Leaving missing invoices or blocked files until the final deadline.</li></ul></div>
            </section>
            <section class="card"><div class="card-head"><h3>Fixed assets — where relevant</h3></div><div class="card-body reasons" style="border:0"><div><b>Payment request</b><span>Tick “Fixed asset” and complete the required information.</span></div><div><b>Inventory</b><span>Update the relevant asset record after delivery.</span></div><div><b>Partial acceptance</b><span>For relevant IT work/developments, record partial acceptance and attach the acceptance certificate.</span></div></div></section>
          </div>
          <aside class="stack sticky">${ui.checklist("eoy", C.eoyChecklist, "2026 project-team checklist")}
            ${ui.callout("info", "Simple rule", "Complete → record → check → finalise. Payment itself does not need to be completed before PO finalisation. Detailed cut-off dates follow the official 2026 closing calendar.")}
            ${contextPanel("eoy")}</aside>
        </div>`,
        mount(root) {
          onClick(root, "data-flow", (i) => { FG.store.set("eoy:phase", +i); FG.refresh(); });
          const form = root.querySelector("[data-fy]");
          form.addEventListener("change", () => { FG.store.set("eoy:fy", Object.fromEntries(new FormData(form))); FG.refresh(); });
        } };
    },
  });

  /* ---------- petty cash ---------- */
  const PETTY_CHECKS = [["CCM approval", "Approval obtained before the expense is made."], ["Limit check", "Expense is within the applicable Projects / OB limit."], ["Purpose & coding", "Reason for the expense and coding are clear."], ["Receipt / invoice", "Readable supporting evidence is available."], ["File complete", "Approval and supporting evidence are kept together."]];
  route("petty-cash", {
    crumbs: () => [["Projects", "projects"], ["Petty cash", "petty-cash"]],
    render() {
      const f = FG.store.get("petty", { budget: "project", amount: "", approved: "" }), r = E.pettyCash({ budget: f.budget === "ob" ? "ob" : "project", amount: f.amount, approved: !!f.approved });
      return { html: `${FG.modHead("petty-cash", "Project finance · quick control", "Petty cash", "Use petty cash only for small-value operational needs, within the authorised limit, with a clear supporting file.")}
        ${ui.kpis([["Projects", euro(100), "Maximum per project-related expense"], ["Ordinary Budget (OB)", euro(50), "Maximum per OB-related expense"], ["Pre-spend approval", "CCM", "Required before any expense"], ["Exception route", "Small value", "Never split or repeat"]])}
        <div class="split mt"><div class="stack">
          <section class="card"><div class="card-head"><h3>Can I use petty cash?</h3></div><div class="card-body stack"><form class="grid g3" data-petty>
            ${ui.select("budget", [["project", "Projects — €100"], ["ob", "Ordinary Budget — €50"]], f.budget, "Budget type")}
            ${ui.number("amount", f.amount, "Expense amount (€)")}
            <label class="check" style="align-self:end"><input type="checkbox" name="approved" value="1" ${f.approved ? "checked" : ""}><div><b>CCM approval obtained</b><small>Tick only when received.</small></div></label>
          </form>${ui.callout(r.tone, r.title, r.text)}</div></section>
          <div class="grid g2">
            <div class="card card-pad"><div class="eyebrow" style="color:var(--good)">Appropriate use</div><ul class="small mt"><li>Small-value operational need</li><li>Within the applicable limit</li><li>CCM approval obtained before the expense</li><li>Clear purpose and coding</li><li>Readable receipt or invoice kept in the file</li></ul></div>
            <div class="card card-pad"><div class="eyebrow" style="color:var(--risk)">Do not use for</div><ul class="small mt"><li>Split or repeated purchases</li><li>Items that should follow the normal procurement route</li><li>Unsupported or personal expenses</li><li>Costs above the authorised petty cash limit</li><li>Any expense made before CCM approval</li></ul></div>
          </div></div>
          <aside class="sticky">${ui.checklist("petty", PETTY_CHECKS, "Petty cash file checklist")}</aside></div>`,
        mount(root) {
          const form = root.querySelector("[data-petty]");
          form.addEventListener("change", () => { const v = Object.fromEntries(new FormData(form)); FG.store.set("petty", { ...v, approved: v.approved ? 1 : "" }); FG.refresh(); });
        } };
    },
  });

  /* ---------- filing ---------- */
  const DMS = [
    ["1. Project contract documents", ["Signed project contractual documents (PDF and Word)", "Addendums (Report name – date)", "Notifications", "VAT"]],

    if (kind === "number") return ui.number(name, v[name], label, opt);
