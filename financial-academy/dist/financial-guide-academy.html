l do the work."],["Understanding of the need","How well the bidder grasps the objective."],["Work schedule","Whether the timing is realistic."],["Team","The skills of the people proposed."],["Price","In principle at least 20 points, and weighted higher the more standard the service."]],"must":["Weightings, including sub-criteria, must be published and cannot be changed."]}],["Minimum scores",{"lead":"A minimum score can limit who is invited to negotiations or included in a framework contract pool.","must":["Any minimum score must be stated in the tender file.","Without a minimum score, all eligible suppliers up to the announced maximum number must be admitted to the pool."]}]],"warning":"Assessment criteria and their weightings cannot be modified or subdivided once the call for tenders is published.","best":"Keep eligibility requirements proportionate. Lower experience or turnover requirements attract new and innovative suppliers, and you can cap financial dependence instead of demanding a high turnover."},{"name":"Terms & Specifications","title":"Tender Rules, Prices & Contract Terms","lead":"Set the rules for submission, the financial offer format, duration, renewal and legal conditions, and write specifications based on objectives.","source":"Ch. 4.8.4–4.8.12","remember":"Describe the objective, not the means; keep the three non-negotiable clauses.","keyFacts":[["180 days","offer validity"],["3 weeks","minimum international submission period"],["3 months","usual notice period for tacit renewal (minimum 1 month)"]],"example":"A hotel will only sign its own contract terms, which give jurisdiction to national courts. The correct action is to accept the hotel's terms only if they are balanced and include the Council's clauses on disclosure, use of the name and logo, and disputes. If the hotel refuses, the CCM decides and records the decision.","understand":"Tender rules, prices, duration, renewal and conditions fixed in the tender define the future contract and limit later changes.","do":"Complete each part of the act of engagement and tender file deliberately, consulting DLAPIL for non-standard legal conditions.","check":"Deadlines, offer validity, the price format, renewal clause, specific conditions and the three non-negotiable clauses are all in place.","sections":[["Tenderers and submission",{"lead":"Decide who may bid and how offers are submitted, and keep offers valid for 180 calendar days from the deadline.","items":[["Natural persons","Decide whether individuals may bid or only legal persons and consortia."],["Consortia","Members are jointly and severally liable."],["Subcontracting","Always requires Council approval."]],"must":["Late offers are inadmissible.","International calls must allow at least three weeks, with offers sent to cdm@coe.int unless e-procurement is used.","When e-procurement is used, offers received outside the platform are excluded."]}],["Act of engagement and financial offer",{"lead":"The act of engagement holds the supplier and bank details, financial offer, declaration of agreement, signature boxes and legal conditions.","must":["A bidder that fails to complete or sign the act of engagement is normally excluded automatically.","A missing financial offer cannot be completed after opening."],"items":[["Goods and general services","Use deliverable-based units in framework contracts."],["Intellectual services","Use time-based units in framework contracts."]],"tip":"Add the clause allowing an hourly fee to be calculated as the daily fee divided by 8."}],["Prices and revision",{"lead":"Give quantities or estimated volumes and a detailed price table so that offers can be compared.","must":["Any price update or revision must be provided for in the tender, and a revision under such a clause is recorded in a document signed by both parties, not an amendment."],"tip":"Link revisions to a relevant official index with a margin, and avoid exclusion levels (maximum prices) unless there is a strong objective reason such as a donor cap."}],["Duration and renewal",{"lead":"Decide before publication how long the contract lasts and whether it can be renewed.","items":[["Not renewable","The contract ends at its term."],["Renewable by written agreement","Both parties sign a renewal before expiry."],["Renewable tacitly","The contract renews unless a party objects; best for framework contracts and agreements."]],"must":["A one-off contract must have a delivery deadline.","A multi-year contract should last no more than four years, or five in specific circumstances.","The notice period to object to tacit renewal is usually three months and must never be less than one month."]}],["General Conditions and non-negotiable clauses",{"lead":"The General Conditions, called legal conditions in DLAPIL templates, cover VAT, confidentiality, data protection, payment and disputes; three clauses are non-negotiable.","items":[["Disclosure of contract terms","The Council may disclose the terms for audit, governance and transparency."],["Use of the Council's name and logo","The supplier may not use them without permission."],["Disputes","Disputes are settled by arbitration."]],"must":["A supplier's own terms, for example a hotel's, may be accepted only if they are balanced and include the three non-negotiable clauses."],"tip":"Internet purchase terms can be accepted exceptionally under the CCM's documented responsibility."}],["Specific conditions",{"lead":"Technical or large-scale purchases use supplementary general conditions plus specific contractual conditions.","items":[["Intellectual services","Supplementary general conditions for consultancy and similar work."],["Supplies and services","Supplementary general conditions for goods and services."],["Works","Supplementary general conditions for building works."],["IT","Supplementary general conditions for IT purchases."]],"tip":"Add specific conditions such as indices, warranty, penalties or building access with the Procurement Unit's help, and set penalties high enough to be useful but not so high that they discourage bids."}],["Technical specifications",{"lead":"Specify the objective to be achieved, not the means.","items":[["No brand names","Avoid them or add or equivalent."],["Keep content separate","Do not mix administrative and technical content."],["Level the field","Give enough information so that previous suppliers have no advantage."],["Allow variants","Consider variants and avoid over-quality."],["Whole cost","Take account of total cost of ownership, warranty and maintenance."],["Measurable outputs","Define them to support performance monitoring and penalties."]]}]],"warning":"Never accept contract terms without the three non-negotiable clauses (disclosure, name and logo, disputes) unless the CCM takes the documented decision described in the guide.","best":"For framework contracts and agreements, choose tacit renewal. It is far easier to manage than renewal by written agreement, especially with many suppliers."},{"name":"Authorise & Launch","title":"Authorise, Publish & Manage Questions","lead":"Obtain the required approval, invite or publish the call, and handle questions and deadline extensions fairly.","source":"Ch. 4.9.1–4.9.4","remember":"No approval, no launch; same answers to everyone.","keyFacts":[["5 working days","DLAPIL Legal Compliance Review"],["48 h","Tenders Board consultation period"],["48 h","before deadline: last Q&A answer"]],"example":"An EU-funded €90,000 competitive bidding procedure is ready to launch. Because it is extrabudgetary and between €55,000 and €184,000, a Legal Compliance Review is required first. The correct action is to send a Request for LCR to DLAPIL and submit the documents to the CCM only after DLAPIL's visa.","understand":"The approval route depends on the procedure, the value and the funding source: the CCM, the CCM after a DLAPIL Legal Compliance Review, or the Tenders Board.","do":"Submit tender documents for approval through the correct route, then invite at least three suppliers or publish, preferably via e-procurement.","check":"Written approval is on file before launch, and all bidders receive the same answers at the same time.","sections":[["Approval routes",{"lead":"The approval route depends on the procedure and the value.","items":[["Direct award up to €2,000 or €6,000","A memorandum validated by the CCM."],["Exceptional direct award","A memorandum stating specification, cost, justification and supplier, to the CCM below €184,000 or the Tenders Board from €184,000."],["Competitive bidding","The CCM approves the documents in writing."],["International call","The CCM sends the documents and an explanatory note to the Tenders Board."]]}],["Legal Compliance Review",{"lead":"Since 1 February 2025, extrabudgetary-funded competitive bidding and exceptional direct awards between €55,000 and €184,000 need a DLAPIL Legal Compliance Review before CCM approval.","items":[["Submit the form (buyer entity)","Send the request through the DLAPIL request form with the title Request for LCR."],["Attach the documents (buyer entity)","Attach the direct award memorandum or all tender documents."],["Give the mandatory details (buyer entity)","State the procedure, the estimated total expenditure, the funding source and the entities already consulted."],["Review (DLAPIL)","DLAPIL processes complete requests within 5 working days and gives its visa in writing."],["Approve the launch (CCM)","With the DLAPIL visa, the documents go to the CCM, who approves the launch."]],"ordered":true,"tip":"Call-offs under framework agreements are exempt, because they are not a procurement procedure."}],["Tenders Board",{"lead":"The Tenders Board authorises the launch of international calls and validates their results, and is consulted on negotiations, amendments and direct awards.","items":[["Send the request (CCM)","The CCM e-mails the documents and an explanatory memo to the Tenders Board Secretariat."],["Forward to members (Tenders Board Secretariat)","The Secretariat gives members at least 48 hours (two working days) on the Tenders Board SharePoint."],["Answer questions (buyer entity)","The buyer entity answers members' questions on the SharePoint."],["Decide (Tenders Board)","The decision is posted on the SharePoint and sent by e-mail or e-procurement."],["Make changes (buyer entity)","The buyer entity makes any requested changes and the Secretariat validates the final version."]],"ordered":true}],["Invite or publish",{"lead":"Competitive bidding invites suppliers by e-mail, while international calls are published by the Tenders Board Secretariat.","must":["In competitive bidding, the buyer entity must e-mail the tender documents to at least three suppliers and record the reasons if this is impossible.","For international calls, the Tenders Board Secretariat publishes on the CoE website, and the Board may add the OJEU, e-procurement, media or permanent representations."],"items":[["1 January 2026","E-procurement mandatory for international calls."],["1 April 2026","E-procurement mandatory for tenders above €55,000."],["1 January 2027","E-procurement mandatory for all tenders above €2,000 or €6,000."]],"ordered":true}],["Questions and answers",{"lead":"All bidders receive the same answers through a single, anonymised Q&A document.","must":["The tender must state the e-mail address and deadline for questions, using a non-nominative address separate from the one receiving offers.","The buyer entity must distribute the anonymised Q&A document through every channel used to publish or invite.","No answer may be given later than 48 hours before the submission deadline.","Questions received by other channels are not answered, and there is no other contact with bidders during the tender."]}],["Extending the deadline",{"lead":"The submission deadline may be extended only in exceptional circumstances.","must":["An extension must be decided before the deadline expires and approved by the CCM."],"tip":"Consult DLAPIL or the Procurement Unit beforehand."}]],"warning":"Do not answer bidders' questions outside the published Q&A procedure. Every bidder must have access to the same information at the same time.","best":"Publish at the right time: avoid launching during the summer break or setting a Monday-morning deadline, and use the e-procurement link to spread the call on relevant networks."},{"name":"Open & Evaluate","title":"Open, Analyse & Evaluate Bids","lead":"Open offers securely after the deadline and assess them in sequence: admissibility, exclusion, eligibility and award criteria.","source":"Ch. 4.9.5–4.9.8","remember":"Admissible, not excluded, eligible — only then score.","keyFacts":[["2","authorised assessors at least"],["10","maximum score per technical criterion"],["Art. 17.2","clarify, never change, offers"]],"example":"One bidder sent a missing CV late and also left the financial offer blank. The missing CV is minor information and can be clarified. The correct action is to exclude the bid anyway, because a missing financial offer cannot be completed after opening.","understand":"Bids are assessed by at least two authorised staff members, strictly against the criteria published in the tender file.","do":"Record the opening, check admissibility, apply exclusion and eligibility as pass or fail, then score award criteria with written justification.","check":"Every score has an objective written justification, and any red flags or clarification requests are documented.","sections":[["Opening offers",{"lead":"Offers are opened only after the deadline, and receipt and prices are recorded and confirmed by those opening.","items":[["E-procurement (one authorised staff member)","Offers open automatically after the deadline and one authorised staff member of the buyer entity opens them."],["Competitive bidding by e-mail (buyer entity)","At least two authorised staff members of the buyer entity open the offers."],["International call by e-mail (Tenders Board Secretariat)","The Secretariat opens offers sent to cdm@coe.int with an authorised member of the buyer entity and shares the record."]]}],["Admissibility",{"lead":"Check admissibility first, analysing each lot separately.","items":[["Late bids","Inadmissible unless the delay was caused by the Council, for example a system failure."],["Incomplete bids","Inadmissible, although missing minor information may be requested."],["Above the exclusion level","Bids above a published exclusion level are excluded."]]}],["Exclusion and eligibility",{"lead":"Admissible bids are then checked against the exclusion and eligibility criteria, which are pass or fail.","must":["The buyer entity must exclude any bid that fails an exclusion criterion or whose act of engagement is not signed.","With EU funds, the buyer entity must check the EU sanctions list using the WebFOCUS report.","A bid that fails an eligibility criterion is ineligible, and exceeding another criterion does not compensate unless the tender file says so."],"tip":"Where risk requires, ask the selected supplier for criminal record and tax certificates before signing."}],["Award criteria",{"lead":"Only eligible bids are scored, using the published weightings.","items":[["Score technical criteria","Score each one out of 10 with a clear written assessment."],["Apply the weightings","Multiply each score by its published weight."],["Score price","Calculate financial scores against the cheapest offer; if price is the only criterion, the cheapest offer wins."]],"ordered":true,"tip":"Use the DLAPIL and Procurement Unit assessment templates or e-procurement; for Ordinary Budget purchases where all offers exceed the budget, scoring against the budget is good practice."}],["Clarifications",{"lead":"Under Article 17.2 of Rule No. 1395, offers may be clarified only with non-essential information that does not change their main features or distort competition.","must":["Clarification requests must be made in writing, kept on record and reported to the CCM or Tenders Board with the results.","A clarification that would significantly change a bid requires a negotiation round."]}],["Problematic cases",{"lead":"Some bidders and offers need special treatment.","items":[["Current staff","Bids from current staff, or from people employed on the launch date, are excluded."],["Former staff","Assessed case by case."],["Retired staff","Retired staff and those who left under an early departure measure cannot receive new contracts."],["Civil servants","Need their employer's approval and leave and must have no conflict."],["Abnormally low or high offers","Red flags that may be excluded with an explanatory memo."],["Multiple bids","The same bidder may not submit more than one bid."],["Other currencies or fee ranges","May be clarified rather than automatically excluded."]]}],["Fraud indicators",{"lead":"Assessors look for signs of fraud, corruption, collusion or bid rigging.","must":["An assessor who sees any indication of fraud must report it immediately to their manager, copying the Director of the DIO."],"tip":"If the DIO opens an investigation, ask DLAPIL whether to reject the bids without waiting for the outcome."}]],"warning":"A missing or incomplete financial offer, or an unsigned act of engagement, cannot be corrected after opening, and the bid must normally be excluded.","best":"Write a detailed justification for every technical score. Clear analysis makes approval easier and lets you answer later enquiries without disclosing other bidders' information."},{"name":"Negotiate & Award","title":"Negotiate, Award & Notify","lead":"Negotiate where it adds value, obtain the award decision, inform bidders and deal with unsuccessful procedures and complaints.","source":"Ch. 4.9.9–4.9.14","remember":"Sign with the winner first, then notify the others within 15 days.","keyFacts":[["15 days","to notify unsuccessful bidders"],["7 days","for bidders to enquire"],["30 days","to complain to the Tenders Board"]],"example":"An international call produced offers that are all well above budget. The correct action is a memo to the Tenders Board asking either to negotiate with the eligible bidders, to relaunch, or to cancel. The memo must explain why the call failed and justify the chosen option.","understand":"The CCM decides awards for competitive bidding procedures and the Tenders Board decides for international calls, based on the buyer entity's reasoned recommendation.","do":"Seek authorisation before negotiating, submit the analysis and recommendation, then notify successful and unsuccessful bidders in writing.","check":"Unsuccessful bidders are notified within 15 days of the successful notification, with the enquiry procedure explained.","sections":[["Negotiations",{"lead":"Negotiation is possible in all tendering procedures (Rule No. 1395, Articles 20 and 21.8) to improve the offer, agree legal changes or settle final details.","must":["A negotiation must not significantly change the specifications.","The buyer entity must send a memo explaining why, with whom and on what to the CCM (competitive bidding) or the Tenders Board (international call).","The buyer entity must invite all eligible bidders unless exclusion is justified, document everything and get changes confirmed in writing."],"tip":"Involve DLAPIL for legal clauses and DIT or DGS for technical items."}],["Awarding the contract",{"lead":"The CCM decides the award in competitive bidding, and the Tenders Board in international calls.","items":[["Competitive bidding","Submit a reasoned recommendation to the CCM, who decides."],["International call","The CCM validates the memo, assessment tables and recommendation and sends them to the Tenders Board Secretary; the Board scrutinises the analysis and decides."]],"must":["The buyer entity must never select more suppliers than the announced maximum."],"tip":"Auditors expect the CCM to justify repeated use of the same suppliers over a year, supported by a WebFOCUS report."}],["Informing bidders",{"lead":"Sign with the winner first, then tell the others.","items":[["Inform the successful bidder","Notify in writing."],["Sign the contract","Complete signature before telling the others."],["Notify unsuccessful bidders","Within 15 days, in writing, with the reason and the Article 24 enquiry procedure."]],"ordered":true,"must":["Only the winner's amount, name and country may be disclosed to unsuccessful bidders."],"tip":"Results of international calls are published, and e-procurement sends notification letters automatically."}],["Unsuccessful calls",{"lead":"A call is unfruitful if no or too few bids arrive, none meet the criteria, or prices greatly exceed the budget.","items":[["Cancel the purchase","Drop the need."],["Launch a new tender","Restart with revised documents."],["Negotiate directly","Ask to negotiate with a supplier (Articles 18.3 and 21.10)."]],"must":["The CCM (competitive bidding) or the Tenders Board (international call) must decide on a justifying memo, and bidders must be informed in writing."]}],["Discontinuing",{"lead":"A procedure may be discontinued at any time before the award, without giving reasons or paying compensation (Article 18.2).","must":["The CCM decides for competitive bidding and the Tenders Board for international calls, and the buyer entity must inform tenderers in writing."]}],["Enquiries and complaints",{"lead":"Unsuccessful bidders have up to three steps of recourse, none of which suspends the award or the start of the contract.","items":[["Enquiry","Within 7 days of notification; the buyer entity replies without undue delay."],["Complaint to the Tenders Board","Within 30 days; the Board replies within 30 days, and for competitive bidding this decision is final."],["Appeal to an ad hoc review board","International calls only, within 30 days, with a reply within 60 days."]],"ordered":true}]],"warning":"Sign the contract with the selected supplier before notifying unsuccessful bidders, and never disclose details of other bids beyond the winner's amount, name and country.","best":"When only one offer is received, you may still negotiate, but do not tell the bidder that no other bids were received."},{"name":"Contract Signing","title":"Contract Review & Signature","lead":"Complete the final checks and administrative steps so the contract is properly committed in FIMS and countersigned before any work starts.","source":"Ch. 4.10","remember":"PO first, signature second, work third.","keyFacts":[["MSA 4002","create a new supplier in FIMS"],["CCM","signs one-off contracts"],["PO","mandatory before any signature"]],"example":"A consultant offers to start work on Monday, but the contract has not yet been countersigned. The correct action is to raise the PO in FIMS, have the CCM countersign, and send the signed PDF before any work starts.","understand":"A budgetary commitment (PO) is mandatory before the Organisation signs any contract, and no goods or services may be provided before signature.","do":"Check the documents, register new suppliers via MSA 4002, raise the PO, countersign and send the signed copy to the supplier.","check":"The act of engagement is complete, signed by the supplier, unaltered, matches any negotiations, and the PO exists before countersignature.","sections":[["Final review",{"lead":"Check the contract documents carefully before signature.","items":[["Correct documents","They are correct, reflect any negotiated outcome and have not been modified by the supplier."],["Act of engagement","It is complete and signed by the supplier."],["Bank details","The supplier's name and the bank account holder are the same."]]}],["FIMS steps",{"lead":"Set up the supplier and the commitment in FIMS before signing.","items":[["Create the supplier (buyer entity, then TPA)","For a new supplier, the buyer entity submits MSA 4002 and TPA processes it."],["Raise the purchase order (buyer entity)","Create the PO in FIMS."],["Countersign (CCM)","The CCM countersigns only after the commitment exists."]],"ordered":true,"must":["The commitment in FIMS must be made before the internal signature process."]}],["Who signs",{"lead":"Who signs depends on whether the contract is a financial as well as a legal commitment.","items":[["One-off contract","A legal and financial commitment, signed by the CCM unless signature is expressly delegated."],["Framework contract or agreement","Only a legal commitment unless it includes a minimum purchase, so a duly authorised person may sign it, although CCM signature is advisable."]],"must":["Each selected supplier must sign the contract.","The buyer entity must enter the applicable VAT requirements in the invoicing table, as instructed by Protocol."]}],["Countersign and send",{"lead":"Countersign with a wet-ink or electronic signature, then send and archive.","items":[["Countersign","A scanned act of engagement signed by the supplier can be countersigned electronically by the CCM."],["Send","E-mail a signed PDF copy to the contact named in the contract, or post a paper copy if requested."],["Archive","File the signed documents."]],"ordered":true}],["Contractual documents",{"lead":"The contract is made up of several documents.","items":[["Act of engagement or contract","The signed core document."],["Terms of reference","The description of the need."],["Other Council documents","Such as technical specifications."],["Supplier's tender","The selected offer."]],"must":["If supplier documents contain internet links, the buyer entity must download those pages on the date of signature and add them to the file."]}],["Share the contract",{"lead":"Once signed, a framework contract or agreement can be shared so colleagues with similar needs can use it.","tip":"Add it to the Organisation's database with help from the Procurement Unit."}]],"warning":"Never let a supplier start work, or sign any contract, before a PO has been raised in FIMS and the Organisation has signed.","best":"Save copies of any web pages referred to in the contract on the date of signature, in case the supplier later changes its conditions."},{"name":"Contract Management","title":"Deadlines, Amendments, Orders & Renewal","lead":"Manage the contract actively: track deadlines, amend correctly, accept deliverables, order within thresholds and renew or end the contract on time.","source":"Ch. 5.1–5.6","remember":"Amend before expiry; never change scope; watch the ceiling.","keyFacts":[["€184,000","ceiling for competitive bidding framework contracts"],["10%","call-off increase the CCM may authorise"],["3","unjustified call-off refusals before removal"]],"example":"A framework contract awarded through competitive bidding has reached €150,000 in orders, with more training sessions planned. The correct action is to contact DLAPIL immediately and prepare an international public call for tenders, approved by the Tenders Board, before spending exceeds €184,000.","understand":"The buyer entity monitors execution, and amendments may change how the contract is managed but never its main purpose, scope, volume or nature.","do":"Track deadlines, sign orders and call-offs through the CCM, monitor cumulative spending and document every change in writing.","check":"Cumulative spending stays below the threshold of the original procedure, and every extension or amendment is agreed before expiry.","sections":[["Deadline management",{"lead":"The delivery deadline differs from the contract end date, which also covers acceptance, payment and warranty.","must":["A deadline extension must be legitimate, must not jeopardise the project, must be agreed before the original deadline expires, and counts as an amendment.","When a deadline is missed, the CCM decides whether to apply penalties, reduce payment, terminate or set a new deadline."],"tip":"Set realistic deadlines, use reminders and contact the provider before the deadline."}],["Amendments",{"lead":"A contract can be amended only while it is in force, with both parties' agreement, and without distorting the original competition.","tip":"Typical amendments change deadlines, contact details, supplier name or bank details.","items":[["Get CCM agreement (buyer entity)","Obtain the CCM's written agreement before proposing the amendment."],["Propose the amendment (buyer entity)","By e-mail with the standard wording and the CCM in copy, or by a document, stating which provisions are supplemented or replaced."],["Confirm (supplier)","The supplier agrees by return e-mail or signs the document."]],"ordered":true,"must":["Call-off amendments up to 10% of the original value need CCM authorisation, and above 10% the buyer entity must consult DLAPIL."]}],["Accepting deliverables",{"lead":"Accept deliverables in writing after checking them against the contract specifications.","must":["A refusal of deliverables must be sent to the supplier with reasons; a second refusal may be treated as a breach.","The acceptance certificate must be attached to the payment order validated by the CCM."],"tip":"For events, keep photographs and signed attendance sheets."}],["Orders under framework contracts",{"lead":"Each order identifies the right supplier and fixes concrete deliverables, a deadline and a lump-sum price.","items":[["Identify the supplier","Apply the ranking or pooling rules in the contract."],["Issue the order form","State concrete deliverables, a deadline and a lump-sum price, but not the number of days."],["Raise the PO","Create it in FIMS."],["CCM signs last","The CCM signs after the PO has been raised."]],"ordered":true,"must":["Spending under a competitive bidding framework contract must not exceed €184,000; if it might, the buyer entity must contact DLAPIL immediately, and the remedy is an international call approved by the Tenders Board."]}],["Call-offs under framework agreements",{"lead":"Each call-off is a mini-competition among the preselected suppliers, evaluated on the published award criteria.","must":["The buyer entity must send each call-off with terms of reference and a deadline, without revealing the other suppliers' identities.","Call-offs above €184,000 must go to the Tenders Board, and the CCM signs each call-off."],"items":[["Non-participation","A supplier that fails to justify non-participation more than three times may be removed."],["Above-market prices","After three call-offs with all tenders more than 20% above market price, the Council may tender outside the agreement."]]}],["Termination and renewal",{"lead":"Contracts end by mutual consent, by unilateral termination as a last resort, or continue by renewal.","items":[["Mutual consent","Both parties agree in writing to end the contract."],["Unilateral termination","Only for breach where no negotiated solution can be found, after consulting DLAPIL, with all exchanges in writing."],["Renewal by written agreement","Completed before expiry, separately with each supplier, with the CCM's agreement."]]}]],"warning":"Exceeding €184,000 under a framework contract awarded through competitive bidding is a severe breach of the rules. If there is any risk of this, launch an international public call.","best":"Use the Procurement Unit's Excel tracking tables to follow every order or call-off against the contract ceiling, and tell the Tenders Board Secretary early if an announced budget will be significantly exceeded."},{"name":"Contract Execution & Payment","title":"Invoices, Payments & VAT","lead":"Make sure invoices are correct, paid on time to the right account, and that VAT and delivery terms are settled before signature.","source":"Ch. 5.7 & 5.10","remember":"Right invoice, right account, VAT settled before signing.","keyFacts":[["60 days","default payment term"],["€5,000","maximum per card purchase"],["DAP","recommended Incoterm for goods"]],"example":"A French supplier asks to be paid in 90 days in exchange for a lower price. French law prohibits payment terms longer than 60 days net. The correct action is to refuse 90 days and, if different terms are needed, agree them with TPA and write them into the contract.","understand":"Each directorate receives and validates invoices, TPA pays them by bank transfer in euros, and VAT must be clarified before signing.","do":"Check each invoice against the contract and acceptance certificate, apply the agreed payment terms and follow Protocol's VAT exemption procedures.","check":"The invoice meets all formal requirements, the payee account belongs to the supplier, and the VAT regime is correct.","sections":[["Invoicing requirements",{"lead":"An invoice must contain specific information before it can be paid.","items":[["Date and letterhead","Dated, on the supplier's letterhead."],["Addressee","The Council of Europe, with the department on the second line."],["Supplier details","Name, address and VAT number if any."],["Invoice number","A unique reference."],["Deliverables and fees","The deliverables and the contract fees."],["Amounts","Sub-totals and total in the contract currency."],["Payment modalities","Any agreed terms."]],"must":["An invoice with an intra-EU VAT number must include the exemption wording referring to Articles 143 and 151 of Council Directive 2006/112/EC."]}],["Payment requirements",{"lead":"Unless agreed otherwise, the payment term is 60 days from receipt of the invoice or execution of the contract, whichever is later.","must":["Payment must be made within the contract deadline to the bank account named in the contract, which must be held by the supplier.","For French suppliers, French law prohibits payment terms longer than 60 days net or 45 days end of month."]}],["Payment schedules",{"lead":"Staged payments must be set out in the tender file and contract.","items":[["At order","For example 10% for works."],["During execution","For example 80%."],["On completion","For example 10%."]],"ordered":true,"must":["Shorter terms in exchange for a discount must be approved by TPA and written into the contract."],"tip":"Immediate payment is only for exceptional, justified cases, and TPA's minimum lead time is about 10 days."}],["Bank cards and internet purchases",{"lead":"Payments are normally by bank transfer in euros, with cards, cheques or cash only as exceptions.","items":[["Raise a PO","Create the purchase order in FIMS."],["Ask TPA for the card","TPA provides the card number."]],"ordered":true,"must":["A card payment must not exceed €5,000 per purchase, and card spending must not exceed €30,000 per month for the whole Organisation."],"tip":"For internet purchases, consider the public prices procedure below €10,000; the supplier's terms may be accepted under the CCM's documented responsibility."}],["Incoterms",{"lead":"For goods, Incoterms define who organises and insures transport and from what point.","tip":"Use DAP (Delivered at Place) to a Council of Europe address so the supplier is responsible until delivery, and contact Protocol for details."}],["VAT",{"lead":"Goods and services for the Council's official use may be exempt from VAT, with separate procedures for goods and for services.","must":["With a new supplier, the buyer entity must establish its VAT status and the exact nature of the purchase to determine the place of taxation."],"tip":"Protocol is the point of contact for all VAT questions."}]],"warning":"Always clarify VAT before signing and sending the contract or order form, and never pay into an account not held by the supplier named in the contract.","best":"When suppliers need cash flow, such as in works or IT, set out a payment schedule in the tender file. It encourages more candidates to bid."},{"name":"Performance & Filing","title":"Supplier Performance, Follow-up & Archiving","lead":"Assess how suppliers perform, use the lessons for the next tender, and keep a complete, audit-ready file.","source":"Ch. 5.8–5.9, 4.11 & Ch. 6","remember":"Evaluate, learn, archive — ten years.","keyFacts":[["10 years","retention of contractual documents"],["1–10","typical performance score scale"],["3 years","optional exclusion for past failures"]],"example":"At the end of a printing contract, deliveries were repeatedly late. Poor performance alone does not stop the supplier from bidding again. The correct action is to record the evaluation and add clear delivery targets linked to penalties in the next tender.","understand":"Performance follow-up improves future tenders, and complete archives support audits; poor past performance alone does not exclude a supplier.","do":"Assess suppliers during and at the end of the contract, and archive all procurement documents for 10 years.","check":"The file holds the tender documents, all bids, assessments, negotiations, memos, contract and amendments.","sections":[["Supplier performance",{"lead":"Evaluate the supplier against the agreed deadlines, quality and service, during the contract and at the end.","items":[["Quality","Whether deliverables meet the specifications."],["Responsiveness","How quickly the supplier reacts."],["Ethics and CSR","Conduct and social responsibility."],["On-time delivery","Whether deadlines are met."],["Cost control","Whether costs stay within the contract."],["Innovation","Whether the supplier proposes improvements."]],"tip":"Use a questionnaire scored, for example, from 1 (very poor) to 10 (very good); the Procurement Unit has templates and can help set it up before the tender."}],["Using the results",{"lead":"Poor past performance does not in itself prevent a supplier from bidding again.","tip":"The optional exclusion criterion covers suppliers who failed contractual obligations in the past three years, leading to refused payment or termination; build lessons such as clear targets linked to penalties into the next tender."}],["Procurement follow-up",{"lead":"The DGA Procurement Unit monitors performance through KPIs and maps purchases using e-procurement and FIMS data.","tip":"Extract data for your CCM or directorate through WebFOCUS reports; procurement categories help define strategies for intellectual services, works and IT."}],["Archiving",{"lead":"Keep all contract documents for 10 years.","items":[["Tender documents","The published or sent tender package."],["All bids","Every offer received."],["Exchanges with suppliers","All correspondence."],["Negotiation records","Memos and confirmed changes."],["Assessments","Scoring tables and reports."],["Contract and amendments","The signed contract and any changes."],["Memos","Internal approvals and justifications."]],"tip":"Each directorate keeps its files, usually in DMS; the buyer entity keeps execution documents such as acceptance separately, and TPA keeps invoices and payment requests."}],["E-procurement and resources",{"lead":"The e-procurement platform, developed by DIT and supported by the Procurement Unit, centralises the tender process and keeps a full audit trail.","items":[["Publication","Calls are published on the platform."],["Q&A","Questions and answers are handled centrally."],["Opening","Offers open automatically."],["Assessment","Scoring is done on the platform."],["Notification","Letters are sent automatically."]],"tip":"Training on Procurement optimisation and e-procurement gives Super-User status; see also the intranet Procurement page, the DLAPIL and Tenders Board pages and the free internet suppliers portal."}],["Social networks",{"lead":"Social networks can be used to promote calls and source suppliers.","must":["While a call is in progress, staff involved should not be openly connected with likely bidders or share or like their posts."]}]],"warning":"Missing documents in the file, such as justifications for direct awards, assessments or proof of notification, are a recurring audit finding. Archive everything for 10 years.","best":"Carry out an end-of-contract assessment before retendering, and draft the new tender documents to fix the weaknesses it identifies."}]},"grants":{"phases":[["Frame the grant",["Foundations","Principles","Procedure","Roles"]],["Design the call",["Criteria","Costs","Call"]],["Select",["Submission","Eligibility Check","Evaluation","Complaints"]],["Agree & close",["Agreement","Filing"]]],"stages":[{"name":"Foundations","title":"What a grant is and when Rule 1374 applies","lead":"A grant finances a project, a specified action or a grantee's operations to advance the Organisation's values. Rule 1374 implements Article 43 bis of the Financial Regulations for every grant procedure.","source":"Financial Regulations Art. 43 bis · Rule 1374","remember":"Two purposes, both required: help the grantee, advance the Organisation.","keyFacts":[["2","cumulative purposes of every grant"],["Art. 43 bis","Financial Regulations basis, implemented by Rule 1374"],["12 months","normal maximum for an operational grant agreement"]],"example":"A programme wants to fund a human rights NGO's annual running costs. The NGO's goals and the Council's values are both served, so a grant fits, but as an operational grant. Correct action: plan an operational grant agreement of no more than twelve consecutive months.","understand":"A grant must both help the grantee attain its own objectives and advance the Organisation's values or policies; the two conditions are cumulative.","do":"Confirm that both purposes are met and decide whether you are financing a project-related grant or an operational grant.","check":"Every staff member involved in the award process has completed the staff member declaration of interest.","sections":[["Purpose of a grant",{"lead":"A grant serves two cumulative purposes; if either is missing, a grant is not the right instrument.","items":[["Grantee purpose","It assists the grantee in attaining its own goals or objectives."],["Organisation purpose","It fulfils a more general objective of advancing the Organisation's values or policies."]],"ordered":false,"must":["Every grant must meet both purposes at the same time."]}],["Legal basis and scope",{"lead":"Grants are foreseen by Article 43 bis of the Financial Regulations and implemented by Rule 1374.","items":[["Ordinary Budget","Grants financed from the Organisation's own budget."],["Voluntary Contributions","Grants financed from voluntary contributions by member states or others."],["Donor agreements","Grants financed under Grant Agreements with external donors."]],"ordered":false,"must":["Rule 1374 applies to every grant procedure, whatever the source of funding."]}],["Two types of grant",{"lead":"A grant finances either a project or a grantee's running costs, whatever the grantee's status, public or private, legal or natural person.","items":[["Project-related grant","Finances a project or a specified action."],["Operational grant","Finances a given grantee's operational expenditure."]],"ordered":false,"must":["An operational grant should not normally give rise to a grant agreement of more than twelve consecutive months."]}],["Grant or procurement",{"lead":"Co-financing is the characteristic feature that distinguishes a grant from a service contract.","items":[["Grant","The grantee co-finances the action from its own or third-party resources."],["Service contract","No service contract may give rise to co-financing by the service supplier."]],"ordered":false,"tip":"If the Council would pay the full cost of a service it needs, use the procurement rules instead."}],["Declaration of interest",{"lead":"Staff involved in a grant award process declare their interests before taking part.","must":["Every staff member involved in a procurement or grant award process must complete the staff member declaration of interest."],"tip":"Complete the declaration before taking part in any step of the procedure."}],["How the guide is organised",{"lead":"The guide follows the numbering of Rule 1374, and each template carries the number of the article it implements.","tip":"Template G14.1, for example, implements Article 14.1."}]],"warning":"Both purposes of a grant are mandatory and cumulative; a financing that only serves the grantee, or only the Organisation, is not a grant.","best":"Record at the outset why the action meets both purposes; this justification will also anchor the objectives of the call."},{"name":"Principles","title":"The six general principles of Rule 1374","lead":"Article 2 sets six principles that apply to every grant: transparency, non-retroactivity, co-financing, non-cumulative awards, no profit and non-discrimination.","source":"Rule 1374 · Art. 2","remember":"Count the whole procedure budget; never let the Council pay everything.","keyFacts":[["€15,000","total procedure budget triggering a call"],["5 × €10,000","= €50,000, so a call is required"],["3","strict exceptions to publication"]],"example":"A department plans five grants of €10,000 to local youth NGOs and suggests five direct awards. The reference figure is the €50,000 total, which passes the threshold. Correct action: launch a call for proposals and require each grantee to co-finance.","understand":"The principles govern every decision in the procedure, and breaching one can invalidate an award or make costs ineligible.","do":"Test the planned grant against each of the six principles before designing the call.","check":"The €15,000 threshold has been measured against the total estimated budget of the procedure, not the amount per grantee.","sections":[["The six principles at a glance",{"lead":"Article 2 sets six general principles that apply to every grant procedure.","items":[["2.1 Transparency","Procedures of €15,000 or more require a published call for proposals."],["2.2 Non-retroactivity","The action must not already be completed when the agreement is signed."],["2.3 Co-financing","The Council never finances the entire cost."],["2.4 Non-cumulative awards","One Council grant per project, action or operational grantee."],["2.5 No profit","Total funding cannot exceed the agreed budgeted expenses."],["2.6 Non-discrimination","Applicants are treated equally unless a difference is objectively justified."]],"ordered":false}],["Transparency and the €15,000 threshold",{"lead":"All grant award procedures of €15,000 or more require, in principle, a published call for proposals.","items":[["Reference figure","The threshold refers to the total estimated budget of the procedure, not the amount per grantee."],["Worked example","Five grants of €10,000 make €50,000, so the threshold is passed and a call is required."]],"ordered":false,"must":["Above the threshold, any exception to publication must be interpreted strictly."]}],["Exceptions to publication",{"lead":"Only three situations may justify not publishing a call once the €15,000 threshold is met.","items":[["1. Unforeseeable emergency","An emergency beyond the awarding entity's control, of such magnitude that a call cannot be carried out."],["2. Grantee characteristics","The grantee's nature makes a call impossible, for example an international organisation acting alone in a given field."],["3. Predetermined action","The action is described in terms leaving no scope for a call, for instance partners approved by a donor and contractually predetermined."]],"ordered":false}],["Non-retroactivity",{"lead":"The action financed must not already be completed when the agreement is signed.","items":[["Completed before signature","Not allowed: non-retroactivity precludes signature."],["Started before signature","Allowed but not recommended, provided eligible costs were incurred only after the closing date for proposals."],["Starts after signature","The best possible practice."]],"ordered":false,"must":["Eligible costs must not be incurred before the closing date for submission of proposals.","The grant agreement must state precisely the beginning and end of the implementation period."]}],["Co-financing",{"lead":"The Council must not finance the entire cost of the action, the project or the grantee's operations.","items":[["Own or third-party funds","Financial resources of the grantee or of other funders."],["Human resources","Staff time contributed by the grantee."],["Contributions in kind","Moveable or immoveable, tangible or intangible assets."],["Income generated","Income generated by the action or project itself."]],"ordered":false,"must":["The grantee must contribute to financing the action from resources other than the Council grant."]}],["Non-cumulative awards and no profit",{"lead":"Each action receives only one Council grant, and its total funding cannot exceed the agreed budget.","items":[["One grant only","The Council awards only one grant to a given project, action or operational grantee."],["No double funding","A grant may not finance part of an action already financed by other means."],["Complementary sources allowed","Several funders may each finance different parts of the action."],["No profit","Total funding above the agreed budgeted expenses would be overfunding and breach the no-profit principle."]],"ordered":false}],["Non-discrimination",{"lead":"A difference in treatment of applicants in comparable situations is discriminatory unless it has an objective and reasonable justification.","items":[["Protected grounds","Gender, disability, age, colour, language, religion, belief, marital or parental status, opinions, national, social or ethnic origin, national minority, wealth, birth, citizenship, sexual orientation or any other situation."],["Legal persons","The principle applies to legal persons and their representatives, for example regarding place of establishment."],["Justification test","The difference must pursue a legitimate aim with proportionate means."]],"ordered":false,"tip":"Restricting a call to applicants in one town is justified when the call aims to build civil society capacity in that town."}]],"warning":"The €15,000 threshold applies to the total estimated budget of the procedure; splitting it into smaller grants does not avoid a call for proposals.","best":"Plan the agreement so that implementation begins after signature; it is the cleanest way to respect non-retroactivity."},{"name":"Procedure","title":"Choosing the route: direct award or call for proposals","lead":"The total estimated budget decides the route: below €15,000 a grant may be awarded directly; from €15,000 a competitive call for proposals is the rule.","source":"Rule 1374 · Art. 2.1.2, 2.1.3, 9","remember":"Below €15,000 you may award directly; from €15,000, call.","keyFacts":[["< €15,000","direct award, Template G9.2A (Art. 2.1.2)"],["≥ €15,000","competitive call for proposals"],["G9.2B","exceptional direct award, duly justified (Art. 2.1.3)"]],"example":"A project needs a single €12,000 grant to a regional ombudsman network. The total procedure budget is below €15,000. Correct action: the Commitments Officer adopts a G9.2A decision, which also appoints the Co-ordinator, and signs the agreement.","understand":"Direct award below €15,000 (Art. 2.1.2) needs only Template G9.2A; €15,000 or more requires a competitive call unless exceptional circumstances apply (Art. 2.1.3).","do":"Calculate the total procedure budget, select the route and open the matching decision template.","check":"Any direct award of €15,000 or more carries a duly justified Commitments Officer decision attached to the commitment request.","sections":[["Direct award below €15,000",{"lead":"Under Article 2.1.2, a procedure with a total budget below €15,000 may be awarded without a call for proposals.","items":[["Adopt G9.2A","The Commitments Officer adopts the direct award decision; it also appoints the Co-ordinator."],["Sign the agreement","The grant agreement is signed with the grantee."]],"ordered":true}],["Competitive procedure from €15,000",{"lead":"From €15,000 the principle is a competitive call for proposals, run in eight steps.","items":[["Appoint the Co-ordinator","Template G3.1."],["Publish the call","Draft, approve and publish the call (G8.1A or G8.1B, with G8.2)."],["Answer questions","Publish the questions and answers to all potential applicants."],["Appoint the Evaluation Committee","Template G13.1, with declarations of absence of conflicts of interest (G13.4)."],["Open proposals","Record the opening in G11.1."],["Assess","Eligibility report, individual scores and consensus report (G14.1, G14.3, G14.4)."],["Decide","The Commitments Officer adopts the award decision (G14.6)."],["Notify","Send the letters to applicants (G14.8, G14.9A, G14.9B)."]],"ordered":true}],["Exceptional direct award from €15,000",{"lead":"Under Article 2.1.3, a grant of €15,000 or more cannot be awarded without a call unless exceptional circumstances occur.","items":[["Adopt G9.2B","The Commitments Officer adopts a duly justified decision, which also appoints the Co-ordinator."],["Sign the agreement","The grant agreement is signed with the grantee."]],"ordered":true,"must":["The Commitments Officer must justify the decision with reference to Article 2.1.3.","The justified decision must be attached to the request for commitment of funds (engagement de dépenses)."]}],["Who decides",{"lead":"Only the competent Commitments Officer, or a representative by written delegation, can decide on a direct award.","tip":"The procedural guarantees for direct award are set out in Article 9 of the Rule."}]],"warning":"A direct award of €15,000 or more is an exception that must be strictly justified under Article 2.1.3; an unreasoned G9.2B decision does not meet the Rule.","best":"Use the G3.1TAB follow-up table from the start of a competitive procedure to track each step and template."},{"name":"Roles","title":"Who is responsible: Commitments Officer, Co-ordinator, Evaluation Committee","lead":"The Commitments Officer is responsible for the whole grant award procedure, appoints a Co-ordinator and an Evaluation Committee, and may delegate in writing.","source":"Rule 1374 · Art. 3","remember":"The Commitments Officer decides; the Co-ordinator runs; the Committee evaluates.","keyFacts":[["a–k","Commitments Officer responsibilities in Art. 3.1"],["G3.1","appoints the Co-ordinator"],["G13.1","appoints the Evaluation Committee"],["Art. 31 FR","conditions for written delegation"]],"example":"A Head of Department wants a cost centre manager to run a grant procedure on his behalf. Delegation is possible within his administrative entity. Correct action: delegate in writing under Article 31 of the Financial Regulations, then appoint the Co-ordinator with G3.1.","understand":"Article 3.1 assigns eleven responsibilities (a to k) to the Commitments Officer, from deciding on direct award to recovering funds.","do":"Have the Commitments Officer formally appoint the Co-ordinator with Template G3.1 and the Evaluation Committee with Template G13.1.","check":"Any delegation is in writing, to a cost centre manager in the same administrative entity, under Article 31 of the Financial Regulations.","sections":[["The three actors",{"lead":"The Commitments Officer decides, the Co-ordinator runs the procedure and the Evaluation Committee evaluates.","items":[["Commitments Officer","Responsible for every aspect of the procedure listed in Article 3.1."],["Co-ordinator","A staff member responsible for the smooth running of the procedure, appointed with G3.1."],["Evaluation Committee","Evaluates proposals; appointed with G13.1 under Article 13."]],"ordered":false}],["Commitments Officer responsibilities (a to k)",{"lead":"Article 3.1 gives the Commitments Officer eleven responsibilities covering the procedure from start to finish.","items":[["a) Direct award","Decide whether the direct award conditions of Article 2.1 are met; Article 9 sets the guarantees."],["b) Approve the call","Approve the call, its publication means and submission arrangements, and ensure it complies with the Rule."],["c) Appoint the Co-ordinator","Formally appoint a staff member to plan and organise receipt and evaluation of applications (G3.1)."],["d) Appoint the Committee","Appoint the Evaluation Committee, whose membership and prerogatives are set by Article 13 (G13.1)."],["e) Award","Decide on the award under Articles 9.2, 14.5 and 14.7."],["f) Inform applicants","Inform applicants of the decision under Articles 14.8 and 14.9."],["g) Sign the agreement","Sign the grant agreement, consulting DLAPIL on adapting the model to donor conditions or national law."],["h) Confidentiality","Decide not to publish certain results if, and only if, the grantee's vital interests are potentially threatened (Art. 2.1.4)."],["i) Suspend","Suspend the agreement for unavoidable circumstances, political context or management reasons such as delays."],["j) Terminate","Terminate the agreement where difficulties make it necessary, after consulting DLAPIL."],["k) Reduce or recover","Reduce grant amounts or recover them in full or in part, for instance where expenses are ineligible."]],"ordered":false}],["Preparing the call",{"lead":"The department concerned prepares the call, and the Commitments Officer checks it before approval.","items":[["Criteria","The call clearly specifies exclusion, eligibility and weighted award criteria, which cannot change after publication."],["Publication","The call is published so as to achieve its objectives (Art. 8.2)."],["Content","The call meets every requirement of Article 8.3."]],"ordered":false,"tip":"Use the G8.3 quality control checklist as a communication tool between the Commitments Officer and the drafters."}],["Delegation",{"lead":"The Commitments Officer may delegate the Article 3.1 responsibilities to a cost centre manager in his or her administrative entity.","must":["Any delegation of Commitments Officer responsibilities must be in writing and follow Article 31 of the Financial Regulations."]}]],"warning":"Only the competent Commitments Officer, or a written delegate, may decide on direct award, the award decision, suspension, termination or recovery.","best":"Use the G8.3 checklist as a communication tool between the Commitments Officer and the drafters of the call."},{"name":"Criteria","title":"Exclusion, eligibility and award criteria","lead":"Each category of criteria has its own purpose: exclusion checks legal prerequisites, eligibility checks the applicant's capacity, award criteria evaluate the proposal itself.","source":"Rule 1374 · Art. 4–5","remember":"Exclude, then check capacity, then score the proposal; never change criteria.","keyFacts":[["3","criteria categories applied in sequence"],["Weighted","every award criterion, shown in the call"],["Art. 5.4","published criteria and weights are unalterable"]],"example":"After publishing a call, the team realises one award criterion is weighted too heavily. Changing it would breach the unalterable character of criteria. Correct action: evaluate with the published weighting, or let the procedure end and launch a new call.","understand":"Criteria are applied in sequence: excluded applicants are not assessed further, and only eligible applicants are scored against weighted award criteria.","do":"Define clear exclusion grounds, threshold-based eligibility criteria and weighted award criteria, each with its supporting documents, in the call.","check":"Every criterion is reasonable, proportionate, relevant and verifiable, and every award criterion carries a published weighting.","sections":[["Three categories, in sequence",{"lead":"Each category of criteria has its own purpose, and an applicant must pass each one before the next is applied.","items":[["1. Exclusion","Checks legal prerequisites, such as no criminal sentence linked to the applicant's activity."],["2. Eligibility","Checks the applicant's capacity to implement the project."],["3. Award","Evaluates the proposal itself."]],"ordered":true}],["Exclusion grounds",{"lead":"Applicants who cannot guarantee compliance with the exclusion criteria are excluded and not assessed further.","must":["The call must define the exclusion criteria.","Each applicant must sign a declaration on exclusion criteria at submission (G4.1.2A to G4.1.2E).","The grant agreement must oblige grantees to report any change of situation affecting the exclusion criteria for its full duration."]}],["Eligibility criteria",{"lead":"Eligibility criteria examine the applicant's capacity to implement the project, not the proposal itself.","items":[["Financial capacity","The applicant's financial means."],["Human capacity","The applicant's staff and human resources."],["Experience","The applicant's relevant experience."]],"ordered":false,"must":["Each eligibility criterion must set a precise threshold; applicants below it are not examined against the award criteria."]}],["Award criteria",{"lead":"Award criteria evaluate the proposal as such, and apply only to applicants who passed exclusion and eligibility.","must":["Each award criterion must be relevant, verifiable and weighted.","The call must show the weighting of every award criterion and list the documents used to verify it."],"tip":"Give each award criterion weighted sub-criteria so applicants understand what is required."}],["Objectivity of criteria",{"lead":"All criteria must be clearly formulated and founded on objective arguments.","items":[["Reasonable and proportionate","Criteria must not unduly restrict access, nor be so specific or vague that they favour or disadvantage applicants."],["Relevant","Each criterion has a cause and effect link with the project's goals, which are defined first."],["Verifiable","The call lists the documents used to verify each criterion, such as certified financial reports."]],"ordered":false}],["Unalterable criteria",{"lead":"Published criteria are unalterable; this is a fundamental principle of Article 5.4.","must":["Nobody may alter published criteria or their weighting, under any circumstances, for the entire duration of the procedure."]}]],"warning":"Once the call is published, no criterion or weighting may be changed for any reason; draft them carefully before approval.","best":"Define the project's goals first, then derive each eligibility criterion from them so the link is explicit."},{"name":"Costs","title":"Eligible and ineligible costs","lead":"The grant ceiling is set on the basis of estimated eligible costs, which must meet seven conditions; certain costs are always ineligible.","source":"Rule 1374 · Art. 6–7","remember":"Necessary, in budget, in period, on record; indirect costs max 7%.","keyFacts":[["7%","maximum indirect eligible costs"],["a–g","conditions for direct eligible costs"],["a–h","costs that are always ineligible"]],"example":"An applicant's budget includes buying an office building, interest on a loan and 10% overheads. Land and buildings and interest are ineligible, and indirect costs cannot exceed 7%. Correct action: remove both items and cap indirect costs at no more than 7%.","understand":"Only costs meeting all Article 6.2 conditions are eligible; indirect costs are capped at 7% and Article 7.1 lists costs that are never eligible.","do":"Build the estimated budget from eligible costs only and state the grant ceiling and any indirect cost rate in the agreement.","check":"Every budgeted cost appears in the estimated overall budget and falls within the implementation period defined to the day.","sections":[["Grant ceiling",{"lead":"The maximum grant amount is based on the estimated eligible costs, which must meet Article 6.2.","must":["The grant agreement must state the maximum amount of the grant."]}],["Direct eligible costs (a to g)",{"lead":"A direct cost is eligible only if it meets all seven conditions of Article 6.2.","items":[["a) Necessary","Strictly necessary for implementing the action, or for the grantee's operations in an operational grant."],["b) Sound management","Consistent with sound financial management, best value for money and cost-effectiveness."],["c) Within the period","Actually incurred by the grantee during the implementation period defined to the day in the agreement."],["d) Identifiable and verifiable","Recorded in the grantee's accounts under its applicable accounting standards."],["e) Tax and social law","Compliant with applicable tax and social security legislation."],["f) Documented","Backed by originals or certified copies, certified generally by the grantee's treasurer."],["g) In the budget","Indicated in the estimated overall budget, including for operational grants."]],"ordered":false}],["Indirect eligible costs",{"lead":"Indirect costs may be eligible only if planned from the start, and never above 7% of the total.","must":["The call must state the precise percentage of indirect costs, and the agreement must make it contractual.","Indirect costs must never exceed 7% of the total (Art. 6.3)."]}],["Ineligible costs (a to h)",{"lead":"Article 7.1 lists eight costs that are never eligible, for reasons of principle or legal and financial certainty.","items":[["a) Other financing","Expenditure financed by other sources (non-cumulative awards)."],["b) Prior debts","Debts and provisions for losses or debts incurred before the award."],["c) Outside the period","Costs incurred outside the implementation period in the agreement."],["d) Unrelated","Expenditure unrelated to the project or action."],["e) Interest","Interest owed, which is never necessary to implement an action."],["f) Land and buildings","Purchase of land and buildings, completely excluded."],["g) Exchange losses","Currency exchange losses, which the grantee must guard against, for example with an account in a specific currency."],["h) Loans","Loans to third parties, given the risks involved."]],"ordered":false}],["Renovation work",{"lead":"Renovation costs are excluded unless directly related to the project or action.","must":["Where renovation is directly related to the action, the action description must specify its extent precisely."]}],["Other ineligible costs",{"lead":"The Article 7.1 list is not exhaustive and may be supplemented.","items":[["Donor needs","Extra items required by a donor of extra-budgetary resources."],["Procedure needs","Other requirements specific to the procedure in question."]],"ordered":false}]],"warning":"Indirect costs may never exceed 7% of the total, and a cost not shown in the estimated budget cannot be eligible.","best":"Define the implementation period to the exact day in the agreement, since cost eligibility depends on it."},{"name":"Call","title":"Drafting and publishing the call for proposals","lead":"A public call for proposals must reach the target public and contain everything applicants need to submit a complete application.","source":"Rule 1374 · Art. 8","remember":"Objectives first; website always; answers for everyone.","keyFacts":[["a–j","mandatory elements of a call (Art. 8.3)"],["G8.1A / G8.1B","call template for BO-VC / EU funds"],["G8.3","quality control checklist"]],"example":"A call targets NGOs in one member state and is only on the Council website. The website is mandatory but not enough to reach that public. Correct action: add a local newspaper notice referring to the full call online and inform the Permanent Delegation.","understand":"Article 8.3 lists ten mandatory elements (a to j) of a call, and publication on the Organisation's website is an absolute prerequisite.","do":"Draft the call with G8.1A or G8.1B and the G8.2 application form, check it with G8.3, then publish it widely.","check":"All replies to questions are published to all potential applicants by the same means as the call.","sections":[["Templates",{"lead":"Use the standard call and application form templates matching the funding source.","items":[["G8.1A","Call for proposals for the Ordinary Budget or Voluntary Contributions."],["G8.1B","Call for proposals for EU funds."],["G8.2A / G8.2B","Application form, used for all competitive procedures."]],"ordered":false,"must":["Drafters may adapt the application form but must keep the substance of Sections 1 to 3 and leave the declaration and signature in Sections 12 and 13 unchanged."]}],["Mandatory content (a to j)",{"lead":"Article 8.3 lists ten elements that every call for proposals must contain.","items":[["a) Objectives","The aims of the action; formulating them is the first stage of any procedure."],["b) Co-financing","The required level of co-financing, preferably as a percentage of the estimated budget."],["c) Submission arrangements","Ways to send proposals, supporting documents, deadline and the consequences of non-compliance."],["d) Contact e-mail","A departmental address for written questions, with languages, question deadline and how replies are published."],["e) Indicative dates","When applicants will learn the outcome and when agreements should be signed."],["f) Timetable","The indicative timetable for implementing the action."],["g) Exclusion and eligibility","The criteria and the supporting documents each applicant must submit."],["h) Award criteria","The criteria, their weighting and their supporting documents."],["i) Number of grantees","The number of potential grantees and the total value of the grants."],["j) Agreement terms","Terms based on the model: payment arrangements, any financial guarantees and any specific clauses."]],"ordered":false,"tip":"Create a dedicated e-mail address for the procedure rather than using a staff member's personal address."}],["Legal opinion",{"lead":"DLAPIL systematically verifies the submission arrangements when asked for a legal opinion on the draft call.","must":["Drafters must agree any specific clause for the agreement with DLAPIL before it is published with the call."],"tip":"Request a legal opinion before publication, especially where financial guarantees such as a deposit or bank guarantee are stipulated."}],["Means of publication",{"lead":"The means of publication must first and foremost reach the target public.","items":[["Organisation's website","Mandatory, but not sufficient on its own."],["Local newspaper","A notice referring to the full call on the website, useful for calls limited to certain member states."],["Social networks","A useful extra channel, in wording suited to the procedure."],["Permanent Delegations","Informing them suits calls limited to one or several member states."]],"ordered":false,"must":["Every published document must comply with data protection rules."]}],["Questions and answers",{"lead":"Under non-discrimination, replies must reach all potential applicants, including those who did not ask.","items":[["Collect","Gather all questions into a single document."],["Merge and filter","Merge identical questions; omit irrelevant ones and those answered in the call."],["Publish","Publish the document by the same means as the call."]],"ordered":true}]],"warning":"Any specific clause to be added to the model agreement must be agreed with DLAPIL and published in the draft agreement with the call.","best":"Create a dedicated e-mail address for the procedure rather than using a staff member's personal address."},{"name":"Submission","title":"Submission, receipt and opening of proposals","lead":"Submission conditions are strict and applied uniformly; proposals are opened only after the deadline, by the Co-ordinator with an Evaluation Committee member.","source":"Rule 1374 · Art. 10–11","remember":"Never open early, never open alone, never alter a proposal.","keyFacts":[["2 people","Co-ordinator plus an Evaluation Committee member at opening"],["G11.1","report on opening of proposals"],["Force majeure","must be proved by the late applicant"]],"example":"Ten proposals arrive and the Co-ordinator is keen to start before the deadline. Opening early would require cancelling the whole procedure. Correct action: wait for the deadline, open with a Committee member, number each proposal and record it in G11.1.","understand":"Opening proposals before the deadline, or altering their content after receipt, breaches transparency and non-discrimination.","do":"Open proposals after the deadline with an Evaluation Committee member present, number each one and record it in Template G11.1.","check":"Each proposal includes an estimated budget and information on other sources of financing.","sections":[["Submission conditions",{"lead":"Dispatch arrangements, closing date and supporting documents are strict requirements applied uniformly to all applicants.","must":["The Co-ordinator must apply the consequences of non-compliance stated in the call stringently."]}],["Late proposals",{"lead":"Whether a late proposal is examined depends on how the call certifies the dispatch date or time.","items":[["Proof of dispatch","The postmark, delivery stamp or e-mail time decides whether a proposal was on time."],["Force majeure","An applicant claiming unavoidable circumstances must prove force majeure."],["Co-ordinator","Gives reasons in the draft report on exclusion and eligibility."],["Evaluation Committee","States in the consensus report whether force majeure is proven."]],"ordered":true,"tip":"State in the call how the dispatch date and time are established."}],["Estimated budget and other financing",{"lead":"The budget and funding information in each proposal make the key financial principles workable.","items":[["Estimated budget","Used to assess feasibility, calculate co-financing and determine eligible expenditure."],["Other sources of financing","Crucial for applying co-financing and non-cumulative awards."]],"ordered":false,"must":["Each proposal must include an estimated budget; costs outside it cannot be eligible."]}],["Two-stage evaluation",{"lead":"For highly technical files, a concept note can test the fundamentals before shortlisted applicants submit a detailed proposal.","items":[["Stage 1: concept note","Checks the essential features of each proposal."],["Stage 2: detailed proposal","Shortlisted applicants develop the technical detail."]],"ordered":true,"must":["Unsuccessful applicants at either stage are informed only after the Commitments Officer's final award decision."],"tip":"Avoid two stages for files with little technical content; decide case by case."}],["Personal data",{"lead":"Data protection rules apply throughout the procedure, including implementation of the agreement.","must":["The grant agreement must contain a clause on the conditions of publication of data; the model agreement includes one."]}],["Opening and numbering",{"lead":"Proposals are opened only after the deadline, by two people, and recorded in Template G11.1.","items":[["Wait for the deadline","Opening early should lead to cancellation of the whole procedure."],["Open with a witness","The Co-ordinator opens the proposals with a member of the Evaluation Committee."],["Number and record","Each proposal receives an identification number in the G11.1 report."]],"ordered":true,"must":["The Co-ordinator must never open proposals alone.","Nobody may alter the content of a proposal once the Secretariat has received it."]}]],"warning":"Never open proposals before the deadline or alone; either breach can require cancellation of the procedure.","best":"State in the call how the dispatch date and time are established, so late proposals can be decided objectively."},{"name":"Eligibility Check","title":"Checking exclusion and eligibility; the Evaluation Committee","lead":"The Co-ordinator prepares a draft report on exclusion and eligibility for an Evaluation Committee whose members must be free of conflicts of interest.","source":"Rule 1374 · Art. 12–13","remember":"Clarify, never improve: requests must not change a proposal's substance.","keyFacts":[["≥ 1","staff member on every Evaluation Committee"],["G13.4","conflict of interest declaration, all members"],["G13.5","confidentiality declaration, external members only"]],"example":"An applicant's financial statement page was badly scanned. This is a technical error, not a substantive change. Correct action: ask for that page only by a fixed date, and evaluate on available elements if it does not arrive.","understand":"The Co-ordinator checks signed exclusion declarations and eligibility thresholds; requests for information may clarify a proposal but never change its substance.","do":"Prepare the draft G14.1 report and send it with copies of all proposals to the Evaluation Committee members.","check":"Every Committee member has signed G13.4, and external members have also signed the G13.5 confidentiality declaration.","sections":[["Co-ordinator's draft report",{"lead":"The Co-ordinator checks exclusion and eligibility and records the conclusions in a draft G14.1 report.","items":[["Check exclusion","Confirm each applicant has duly signed the solemn declaration on exclusion criteria."],["Check eligibility","Verify each applicant meets every eligibility threshold."],["Write the draft","Enter conclusions and comments in the draft G14.1 report."],["Transmit","Send the draft with a copy of all proposals to the Evaluation Committee members."]],"ordered":true}],["Requests for further information",{"lead":"A request may clarify a proposal but never change its substance.","items":[["Administrative details","Allowed: details without effect on the outcome, such as personal data or an unselected option."],["Technical errors","Allowed: a badly scanned page or a plainly outdated document version."],["Substantive changes","Not allowed: non-administrative additions are excluded and may trigger a fraud investigation."]],"ordered":false,"must":["The Co-ordinator must give the applicant a specified date; if nothing arrives, the evaluation proceeds on the elements available.","The Co-ordinator must ensure the process is transparent and non-discriminatory."]}],["Committee composition",{"lead":"The Commitments Officer appoints the Evaluation Committee with Template G13.1.","must":["Each Evaluation Committee must include at least one staff member."],"tip":"Appoint a majority of staff members, ideally only staff; this is recommended but not binding."}],["External members",{"lead":"Members from outside the Secretariat allow co-operation with donors or beneficiary state authorities and bring technical expertise.","must":["External members must undertake in writing that they have no conflict of interest and will abide by the rules.","External members must sign the declaration of confidentiality (G13.5); staff are already bound by Article 26 of the Staff Regulations."]}],["Responsibilities and conflicts of interest",{"lead":"Each member undertakes on appointment to act in line with Article 13.3; the Vademecum (G13.2) explains the role.","items":[["G13.4 declaration","Every member declares the absence of conflicts of interest."],["Presumed conflicts","Article 13.4 lists cases where a conflict is irrebuttably presumed."],["Other conflicts","The list is not exhaustive; other situations may also be conflicts."]],"ordered":false,"must":["A member in a presumed conflict of interest must withdraw or be excluded from the Committee."]}]],"warning":"A presumed conflict of interest under Article 13.4 cannot be rebutted; the member must withdraw or be excluded from the Committee.","best":"Appoint a Committee made up mainly or entirely of staff members to avoid disputes over interpreting the Rule."},{"name":"Evaluation","title":"Evaluating proposals and deciding the award","lead":"The Committee adopts the eligibility report, members score proposals individually, the Co-ordinator compiles a consensus report and the Commitments Officer decides.","source":"Rule 1374 · Art. 14","remember":"Score 0–5, average equally, all sign, Commitments Officer reasons.","keyFacts":[["0–5","score scale per award criterion"],["15 days","max calendar days to inform unsuccessful applicants"],["7 days","minimum enquiry period in the letter"],["G14.6","Commitments Officer award decision"]],"example":"The consensus report for a media freedom call is signed by all members, but one recommended budget looks unreasonable. The Commitments Officer must verify cost, aims and available funds. Correct action: ask the Committee to amplify its report before adopting a reasoned G14.6 decision.","understand":"Members score each award criterion from 0 to 5 with comments; the consensus report averages scores equally and is adopted w
