  --good: #1e7a60; --good-soft: #e3f2ec; --warn: #a3650c; --warn-soft: #f9eedb; --risk: #b3443a; --risk-soft: #f8e6e4;
  --m1: #2a5299; --m2: #1e7a60; --m3: #a67c2d; --m4: #6a4f9f; --m5: #23708a; --m6: #b3443a; --m7: #5d6b2f; --m8: #8a4b6e;

  --e1: 0 1px 0 rgba(13, 22, 38, .03), 0 1px 3px rgba(13, 22, 38, .06);
  --e2: 0 1px 2px rgba(13, 22, 38, .04), 0 10px 28px -10px rgba(13, 22, 38, .16);
  --e3: 0 2px 8px rgba(13, 22, 38, .06), 0 30px 70px -20px rgba(13, 22, 38, .3);
  --r-sm: 8px; --r: 12px; --r-lg: 18px; --r-xl: 24px;
  --ease: cubic-bezier(.2, .7, .2, 1); --dur: .18s;
  --side: 248px; --top: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #090d14; --bg-2: #0c1119; --panel: #10161f; --panel-2: #131a25;
  --ink: #ecebe6; --ink-2: #c7cbd3; --muted: #8b93a1; --faint: #5c6473; --line: #1f2633; --line-2: #2c3544;
  --night: #0e1d38; --night-2: #142a52;
  --brass: #d4b072; --brass-2: #e3c58e; --brass-soft: #241e12;
  --accent: #9db5e6; --accent-2: #b8cbf0; --accent-soft: #162036; --accent-ink: #0a0f18;
  --good: #5cc4a5; --good-soft: #0f241d; --warn: #e0ac5c; --warn-soft: #271d0e; --risk: #ec8a80; --risk-soft: #2b1614;
  --m1: #8fabe3; --m2: #5cc4a5; --m3: #d4b072; --m4: #b29de6; --m5: #66b7d1; --m6: #ec8a80; --m7: #b5c47a; --m8: #d79bbd;
  --e1: 0 0 0 1px rgba(255, 255, 255, .02), 0 1px 2px rgba(0, 0, 0, .5);
  --e2: 0 0 0 1px rgba(255, 255, 255, .03), 0 12px 30px -12px rgba(0, 0, 0, .7);
  --e3: 0 0 0 1px rgba(255, 255, 255, .04), 0 30px 70px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #090d14; --bg-2: #0c1119; --panel: #10161f; --panel-2: #131a25;
  --ink: #ecebe6; --ink-2: #c7cbd3; --muted: #8b93a1; --faint: #5c6473; --line: #1f2633; --line-2: #2c3544;
  --night: #0e1d38; --night-2: #142a52;
  --brass: #d4b072; --brass-2: #e3c58e; --brass-soft: #241e12;
  --accent: #9db5e6; --accent-2: #b8cbf0; --accent-soft: #162036; --accent-ink: #0a0f18;
  --good: #5cc4a5; --good-soft: #0f241d; --warn: #e0ac5c; --warn-soft: #271d0e; --risk: #ec8a80; --risk-soft: #2b1614;
  --m1: #8fabe3; --m2: #5cc4a5; --m3: #d4b072; --m4: #b29de6; --m5: #66b7d1; --m6: #ec8a80; --m7: #b5c47a; --m8: #d79bbd;
  --e1: 0 0 0 1px rgba(255, 255, 255, .02), 0 1px 2px rgba(0, 0, 0, .5);
  --e2: 0 0 0 1px rgba(255, 255, 255, .03), 0 12px 30px -12px rgba(0, 0, 0, .7);
  --e3: 0 0 0 1px rgba(255, 255, 255, .04), 0 30px 70px -20px rgba(0, 0, 0, .8);
  color-scheme: dark;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--top) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "ss03"; text-rendering: optimizeLegibility; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2 { font-family: var(--serif); font-weight: 600; letter-spacing: -.012em; }
h3, h4 { letter-spacing: -.012em; font-weight: 600; }
a { color: inherit; }
button { font: inherit; color: inherit; }
::selection { background: color-mix(in srgb, var(--brass) 30%, transparent); }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- shell ---------- */
.top { position: sticky; top: 0; z-index: 30; height: var(--top); display: flex; align-items: center; gap: 16px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; width: calc(var(--side) - 20px); flex: none; }
.mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--night); color: #fff; font: 700 12.5px var(--sans); letter-spacing: -.02em; box-shadow: inset 0 -2px 0 var(--brass-2), var(--e1); }
.brand b { display: block; font-size: 14px; line-height: 1.2; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); }
.search { flex: 1; max-width: 560px; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); cursor: pointer; box-shadow: var(--e1); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease); }
.search:hover { border-color: var(--line-2); box-shadow: var(--e2); }
.search span { flex: 1; text-align: left; font-size: 14px; }
kbd { font: 600 11px var(--mono); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); }
.top-actions { margin-left: auto; display: flex; gap: 8px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { border-color: var(--line-2); }
.stuck-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 11px; border: 1px solid color-mix(in srgb, var(--brass) 40%, var(--line)); background: var(--brass-soft); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; }
.stuck-btn:hover { border-color: var(--brass); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.layout { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: calc(100vh - var(--top)); }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; padding: 18px 12px; border-right: 1px solid var(--line); }
.side h6 { margin: 18px 12px 6px; font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.side a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-size: 14px; font-weight: 500; transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }
.side a:hover { background: var(--bg-2); color: var(--ink); }
.side a[aria-current="page"] { background: var(--panel); color: var(--ink); box-shadow: var(--e1); font-weight: 600; }
.side a[aria-current="page"] svg { color: var(--brass); }
.side a em { margin-left: auto; font: 600 11px var(--mono); font-style: normal; color: var(--faint); }
.side .meter { margin: 18px 8px 0; padding: 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--e1); }
.side .meter small { display: block; font-size: 12px; color: var(--muted); }
.side .meter b { font-size: 22px; letter-spacing: -.02em; }
.main { min-width: 0; padding: 28px clamp(16px, 4vw, 48px) 80px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.narrow { max-width: 820px; margin: 0 auto; }
.view { animation: in .28s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
.tabbar { display: none; }

/* ---------- typography blocks ---------- */
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font: 600 11px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
.eyebrow::before { content: ""; width: 18px; height: 1.5px; background: currentColor; border-radius: 2px; }
.head { margin-bottom: 26px; }
.head h1 { margin-top: 10px; font-size: clamp(30px, 3.6vw, 42px); line-height: 1.1; }
.head p { margin-top: 10px; max-width: 64ch; color: var(--ink-2); font-size: 16px; }
.h2 { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin: 40px 0 14px; }
.h2 h2 { font-size: 24px; line-height: 1.2; }
.h2 p { margin-top: 4px; color: var(--muted); font-size: 14px; }
.h2 a { font-size: 13.5px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }

/* ---------- surfaces ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--e1); }
.pad { padding: 22px; }
a.card, .lift { text-decoration: none; color: inherit; transition: box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
a.card:hover, .lift:hover { box-shadow: var(--e2); border-color: var(--line-2); transform: translateY(-2px); }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

.night { position: relative; isolation: isolate; overflow: hidden; color: var(--night-ink); border-radius: var(--r-xl);
  background: radial-gradient(55% 90% at 100% 0%, rgba(212, 176, 114, .22), transparent 60%), radial-gradient(50% 80% at 0% 100%, rgba(70, 110, 200, .28), transparent 65%), linear-gradient(160deg, var(--night-2), var(--night) 60%, #081124);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), 0 30px 70px -32px rgba(8, 17, 36, .75); }
.night::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .6; background-image: repeating-radial-gradient(circle at 94% 6%, transparent 0 22px, rgba(212, 176, 114, .1) 22px 23px); -webkit-mask-image: radial-gradient(60% 90% at 94% 6%, #000, transparent 75%); mask-image: radial-gradient(60% 90% at 94% 6%, #000, transparent 75%); }
.night::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(212, 176, 114, .65), transparent); }
.night .eyebrow { color: var(--brass-2); }
.night h1, .night h2, .night h3 { color: #fff; }
.night p { color: var(--night-muted); }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 11px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer; transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), var(--e1); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, #000); }
.btn.brass { background: linear-gradient(180deg, var(--brass-2), var(--brass)); border-color: var(--brass); color: #1b1408; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 8px 20px -10px rgba(166, 124, 45, .8); }
.btn.ghost-night { background: rgba(255, 255, 255, .06); border-color: rgba(255, 255, 255, .18); color: #fff; }
.btn.ghost-night:hover { border-color: var(--brass-2); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--line); }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.risk { background: var(--risk-soft); color: var(--risk); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.good { background: var(--good); } .dot.warn { background: var(--warn); } .dot.none { background: var(--line-2); }

/* ---------- home ---------- */
.hero { padding: clamp(28px, 4vw, 48px); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 36px; align-items: center; }
.hero h1 { margin-top: 14px; font-size: clamp(34px, 4.6vw, 54px); line-height: 1.04; letter-spacing: -.02em; max-width: 15ch; }
.hero h1 em { font-style: italic; color: var(--brass-2); }
.hero p.lead { margin-top: 16px; font-size: 17px; line-height: 1.6; max-width: 52ch; }
.hero .row { margin-top: 26px; }
.glass { padding: 20px; border-radius: var(--r-lg); background: linear-gradient(160deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .03)); border: 1px solid rgba(255, 255, 255, .14); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1); backdrop-filter: blur(10px); }
.glass small { display: block; font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); }
.glass b { display: block; margin-top: 8px; font-size: 18px; color: #fff; }
.glass p { margin-top: 4px; font-size: 13.5px; }
.glass .bar { margin-top: 14px; }
.glass a { display: inline-block; margin-top: 14px; color: var(--brass-2); font-weight: 600; text-decoration: none; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--night-line); }
.stats div + div { padding-left: 22px; border-left: 1px solid var(--night-line); }
.stats b { display: block; font: 600 32px var(--serif); color: #fff; letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.stats span { font-size: 12.5px; color: var(--night-muted); }

.level { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.level button { display: grid; gap: 6px; text-align: left; padding: 18px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel); cursor: pointer; box-shadow: var(--e1); transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease); }
.level button:hover { box-shadow: var(--e2); transform: translateY(-2px); }
.level button[aria-pressed="true"] { border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 18%, transparent), var(--e2); }
.level b { font-size: 15.5px; }
.level span { font-size: 13.5px; color: var(--muted); }
.level i { font: 600 11px var(--mono); font-style: normal; color: var(--brass); }

.path { position: relative; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: 22px; overflow: hidden; }
.path::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--c); opacity: .9; }
.path .ico { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 12%, var(--panel)); color: var(--c); }
.path h3 { font-size: 18px; margin-top: 4px; }
.path p { font-size: 14px; color: var(--ink-2); }
.path .meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 8%, transparent); overflow: hidden; }
.night .bar { background: rgba(255, 255, 255, .12); }
.bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--c, var(--accent)), color-mix(in srgb, var(--c, var(--accent)) 60%, var(--brass-2))); transition: width .6s var(--ease); }

/* knowledge map */
.kmap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kcell { display: grid; gap: 10px; padding: 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); text-decoration: none; box-shadow: var(--e1); transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease), border-color var(--dur) var(--ease); }
.kcell:hover { box-shadow: var(--e2); transform: translateY(-2px); border-color: var(--line-2); }
.kcell header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.kcell b { font-size: 14.5px; }
.kcell small { font-size: 12px; color: var(--muted); }
.ring { --p: 0; --c: var(--accent); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), color-mix(in srgb, var(--ink) 8%, transparent) 0); flex: none; }
.ring::after { content: attr(data-v); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); font: 600 11.5px var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); }
.kcell .state { font-size: 12px; font-weight: 600; }
.state.good { color: var(--good); } .state.warn { color: var(--warn); } .state.none { color: var(--faint); }

.review { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.review b { font-size: 14.5px; } .review p { font-size: 13px; color: var(--ink-2); }
.review .badge { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--warn); color: #fff; font-weight: 700; }

.tasks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.task { position: relative; display: grid; gap: 6px; align-content: start; padding: 18px; min-height: 132px; }
.task .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(145deg, var(--night-2), var(--night)); color: var(--brass-2); box-shadow: inset 0 -2px 0 rgba(212, 176, 114, .7); }
.task b { margin-top: 8px; font-size: 14.5px; }
.task span { font-size: 13px; color: var(--muted); }
.task u { position: absolute; right: 16px; top: 18px; text-decoration: none; color: var(--faint); transition: color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.task:hover u { color: var(--brass); transform: translateX(3px); }

/* ---------- tour ---------- */
.flow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0; margin: 8px 0 26px; position: relative; }
.flow::before { content: ""; position: absolute; left: calc(50% / var(--n)); right: calc(50% / var(--n)); top: 21px; height: 2px; background: var(--line-2); }
.flow .fill { position: absolute; left: calc(50% / var(--n)); top: 21px; height: 2px; width: calc((100% - 100% / var(--n)) * var(--f)); background: linear-gradient(90deg, var(--brass), var(--brass-2)); transition: width .5s var(--ease); }
.flow button { position: relative; display: grid; justify-items: center; gap: 8px; padding: 0 4px; border: 0; background: none; cursor: pointer; text-align: center; }
.flow button i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--line-2); font: 600 13px var(--sans); font-style: normal; color: var(--muted); transition: all var(--dur) var(--ease); }
.flow button span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.flow button.done i { border-color: var(--brass); color: var(--brass); }
.flow button.on i { background: var(--night); border-color: var(--night); color: var(--brass-2); box-shadow: 0 0 0 5px color-mix(in srgb, var(--brass) 20%, transparent); }
.flow button.on span { color: var(--ink); font-weight: 600; }
.coin { width: 14px; height: 14px; border-radius: 50%; position: absolute; top: 15px; left: calc(50% / var(--n) - 7px + (100% - 100% / var(--n)) * var(--f)); background: radial-gradient(circle at 35% 30%, #f6e2b4, var(--brass)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brass) 20%, transparent), 0 4px 10px rgba(166, 124, 45, .5); transition: left .5s var(--ease); pointer-events: none; }
.tour-card { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 0; overflow: hidden; }
.tour-card .l { padding: 30px; }
.tour-card .r { padding: 30px; background: var(--panel-2); border-left: 1px solid var(--line); display: grid; gap: 16px; align-content: start; }
.tour-card h2 { font-size: 30px; margin-top: 10px; }
.tour-card .q { margin-top: 6px; font: italic 500 18px var(--serif); color: var(--brass); }
.tour-card p.body { margin-top: 14px; font-size: 16px; color: var(--ink-2); }
.kv small { display: block; font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.kv p { margin-top: 4px; font-size: 14.5px; }

/* ---------- lesson ---------- */
.lesson-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.crumbs { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.crumbs a { text-decoration: none; color: var(--muted); } .crumbs a:hover { color: var(--ink); }
.steps-mini { display: flex; gap: 4px; }
.steps-mini a { width: 22px; height: 6px; border-radius: 3px; background: var(--line-2); }
.steps-mini a.done { background: var(--brass); }
.steps-mini a.on { background: var(--accent); width: 34px; }
.lesson-head h1 { font-size: clamp(30px, 3.4vw, 40px); line-height: 1.12; margin-top: 12px; }
.lesson-head .lead { margin-top: 12px; font-size: 17px; color: var(--ink-2); max-width: 66ch; }
.lesson-head .row { margin-top: 14px; }
.sentence { margin-top: 24px; padding: 26px 28px; }
.sentence small { font: 600 10.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brass-2); }
.sentence b { display: block; margin-top: 8px; font: 500 clamp(20px, 2.2vw, 25px)/1.35 var(--serif); color: #fff; }
.prereq { margin-top: 18px; padding: 16px 18px; border-radius: var(--r); background: var(--panel-2); border: 1px dashed var(--line-2); }
.prereq h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.prereq .row { margin-top: 10px; }
.prereq a.chip { text-decoration: none; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.trio > div { padding: 18px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--e1); }
.trio small { display: flex; align-items: center; gap: 8px; font: 600 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--c); }
.trio small i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); font: 700 11px var(--mono); font-style: normal; }
.trio p { margin-top: 10px; font-size: 14.5px; color: var(--ink-2); }
.example { margin-top: 18px; display: grid; grid-template-columns: auto 1fr; gap: 16px; padding: 20px 22px; border-radius: var(--r-lg); background: var(--brass-soft); border: 1px solid color-mix(in srgb, var(--brass) 25%, transparent); }
.example .tag { font: 600 10.5px var(--sans); letter-spacing: .16em; color: var(--brass); padding-top: 4px; writing-mode: vertical-rl; transform: rotate(180deg); }
.example p { font: 400 16.5px/1.6 var(--serif); color: var(--ink); }
.figs { display: grid; grid-template-columns: repeat(var(--n, 3), minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.fig { padding: 18px; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--e1); }
.fig b { display: block; font: 600 26px/1.1 var(--serif); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.fig span { display: block; margin-top: 6px; font-size: 13px; color: var(--muted); }
.fig details { margin-top: 10px; font-size: 13.5px; color: var(--ink-2); }
.fig summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 12.5px; list-style: none; }
.fig summary::-webkit-details-marker { display: none; }
.fig details p { margin-top: 8px; }
.fig details p + p { color: var(--muted); }

.deep { margin-top: 30px; }
.acc { border-top: 1px solid var(--line); }
.acc:last-child { border-bottom: 1px solid var(--line); }
.acc > button { width: 100%; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 18px 4px; border: 0; background: none; cursor: pointer; text-align: left; }
.acc > button i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-2); font: 600 12px var(--mono); font-style: normal; color: var(--muted); }
.acc.read > button i { background: var(--good-soft); color: var(--good); }
.acc > button b { font-size: 16px; }
.acc > button span { display: block; font-size: 13.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.acc > button svg { transition: transform var(--dur) var(--ease); color: var(--faint); }
.acc[open-state="1"] > button svg { transform: rotate(180deg); }
.acc .body { display: none; padding: 0 4px 22px 46px; }
.acc[open-state="1"] .body { display: block; animation: in .25s var(--ease); }
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.items div { padding: 14px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.items b { display: block; font-size: 14px; }
.items span { display: block; margin-top: 4px; font-size: 13.5px; color: var(--ink-2); }
.musts { margin-top: 12px; display: grid; gap: 8px; padding: 0; list-style: none; }
.musts li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.musts li::before { content: "§"; font: 700 14px var(--serif); color: var(--accent); }
.tip { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--good-soft); font-size: 14px; color: var(--ink); }
.tip::before { content: "Good practice · "; font-weight: 600; color: var(--good); }
.pitfalls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
.pitfalls > div { padding: 18px; border-radius: var(--r-lg); }
.pitfalls .bad { background: var(--risk-soft); }
.pitfalls .ok { background: var(--good-soft); }
.pitfalls h4 { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.pitfalls .bad h4 { color: var(--risk); } .pitfalls .ok h4 { color: var(--good); }
.pitfalls p { margin-top: 8px; font-size: 14.5px; }

/* quiz */
.quiz { margin-top: 30px; padding: 26px; }
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.quiz h3 { margin-top: 12px; font: 600 21px/1.35 var(--serif); letter-spacing: -.01em; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: var(--panel); text-align: left; cursor: pointer; font-size: 15px; transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.opt:hover:not([disabled]) { border-color: var(--accent); transform: translateX(2px); }
.opt i { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--bg-2); font: 600 12px var(--mono); font-style: normal; color: var(--muted); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right i { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--risk); background: var(--risk-soft); }
.opt.wrong i { background: var(--risk); color: #fff; }
.feedback { margin-top: 16px; padding: 16px 18px; border-radius: var(--r); font-size: 14.5px; animation: in .25s var(--ease); }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--risk-soft); }
.feedback b { display: block; margin-bottom: 4px; }
.feedback .row { margin-top: 12px; }
.hint { margin-top: 12px; font-size: 13.5px; color: var(--muted); }
.hint button { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 34px; padding-top: 22px; border-top: 1px solid var(--line); }
.lesson-nav a { display: grid; gap: 2px; text-decoration: none; padding: 14px 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); min-width: 0; max-width: 48%; box-shadow: var(--e1); }
.lesson-nav a:hover { border-color: var(--line-2); box-shadow: var(--e2); }
.lesson-nav a small { font-size: 12px; color: var(--muted); }
.lesson-nav a b { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lesson-nav a.next { margin-left: auto; text-align: right; }
.complete { margin-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-radius: var(--r-lg); }
.complete b { font-size: 15.5px; } .complete p { font-size: 13.5px; }

/* path page */
.phase { margin-top: 26px; }
.phase h3 { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.phase h3 i { font: 600 11px var(--mono); font-style: normal; color: var(--brass); }
.lessons { margin-top: 10px; display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px; padding: 14px 18px; }
.lrow .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-2); font: 600 12.5px var(--sans); color: var(--muted); }
.lrow.done .n { background: var(--good); border-color: var(--good); color: #fff; }
.lrow b { font-size: 15px; } .lrow span { display: block; font-size: 13px; color: var(--muted); }
.lrow em { font-style: normal; font-size: 12px; color: var(--faint); white-space: nowrap; }

/* practice / check */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filters a { display: inline-flex; align-items: center; text-decoration: none;  height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.filters a[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; }
.progress-dots { display: flex; gap: 5px; }
.progress-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.progress-dots i.c { background: var(--good); } .progress-dots i.w { background: var(--risk); } .progress-dots i.on { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.result { padding: clamp(26px, 4vw, 40px); text-align: left; }
.result h2 { font-size: 32px; margin-top: 12px; }

/* tools */
.sim { padding: 28px; }
.sim-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.sim-val { font: 600 clamp(36px, 5vw, 52px)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; }
.sim-val small { font: 500 14px var(--sans); color: var(--muted); margin-left: 8px; letter-spacing: 0; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; background: transparent; margin-top: 18px; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--m2) 0 var(--a), var(--m1) var(--a) var(--b), var(--m3) var(--b)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--m2) 0 var(--a), var(--m1) var(--a) var(--b), var(--m3) var(--b)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px; border-radius: 50%; background: var(--panel); border: 3px solid var(--night); box-shadow: var(--e2); cursor: grab; }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--panel); border: 3px solid var(--night); box-shadow: var(--e2); cursor: grab; }
.ticks { position: relative; height: 34px; font-size: 11.5px; color: var(--muted); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ticks span::before { content: ""; display: block; width: 1px; height: 8px; margin: 0 auto 4px; background: var(--line-2); }
.seg { display: inline-flex; padding: 4px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
.seg button { height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--e1); }
.routes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; }
.route { padding: 20px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--panel); opacity: .5; filter: saturate(.4); transition: all .3s var(--ease); }
.route.on { opacity: 1; filter: none; border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent), var(--e2); transform: translateY(-3px); }
.route small { font-size: 12px; color: var(--muted); }
.route h3 { margin-top: 6px; font-size: 18px; color: var(--c); }
.route dl { margin: 14px 0 0; display: grid; gap: 10px; }
.route dt { font: 600 10.5px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.route dd { margin: 2px 0 0; font-size: 14px; }
.verdict { margin-top: 18px; padding: 16px 20px; border-radius: var(--r); background: var(--accent-soft); font-size: 15px; }
.verdict b { color: var(--accent); }
.notes { margin-top: 12px; display: grid; gap: 8px; padding: 0; list-style: none; }
.notes li { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); font-size: 13.5px; }

/* glossary + terms */
.gl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gl div { padding: 16px 18px; border-radius: var(--r); background: var(--panel); border: 1px solid var(--line); }
.gl b { font: 600 17px var(--serif); } .gl em { font-style: normal; font-size: 13px; color: var(--muted); margin-left: 8px; }
.gl p { margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.term { border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: help; text-decoration: underline dotted color-mix(in srgb, var(--brass) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
.pop { position: fixed; z-index: 60; max-width: 320px; padding: 14px 16px; border-radius: var(--r); background: var(--night); color: var(--night-ink); box-shadow: var(--e3); font-size: 13.5px; animation: in .15s var(--ease); }
.pop b { display: block; color: var(--brass-2); font-size: 13px; }
.pop p { margin-top: 4px; color: var(--night-ink); }

/* stuck */
.stuck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stuck a { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 16px; padding: 18px 20px; }
.stuck .ico { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--brass-soft); color: var(--brass); }
.stuck b { font-size: 15px; } .stuck span { display: block; font-size: 13px; color: var(--muted); }

/* ---------- palette ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(6, 10, 18, .45); backdrop-filter: blur(3px); display: grid; justify-items: center; align-items: start; padding: 10vh 16px 16px; animation: fade .15s var(--ease); }
@keyframes fade { from { opacity: 0; } }
.palette { width: min(680px, 100%); max-height: 76vh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; border-radius: var(--r-lg); background: var(--panel); box-shadow: var(--e3); border: 1px solid var(--line); animation: in .2s var(--ease); }
.palette header { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--line); }
.palette input { flex: 1; height: 58px; border: 0; outline: 0; background: none; font: 400 17px var(--sans); color: var(--ink); }
.palette .res { overflow: auto; padding: 8px; }
.palette footer { display: flex; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.answer { margin: 6px 6px 10px; padding: 16px 18px; border-radius: var(--r); background: var(--night); color: var(--night-ink); }
.answer small { font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--brass-2); }
.answer p { margin-top: 6px; font-size: 15px; }
.answer p b { color: #fff; }
.grp { margin: 10px 10px 4px; font: 600 10.5px var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); }
.hit { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; text-decoration: none; }
.hit .k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-2); color: var(--muted); }
.hit b { display: block; font-size: 14px; font-weight: 600; }
.hit span { display: block; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit[aria-selected="true"] { background: var(--accent-soft); }
.hit[aria-selected="true"] .k { background: var(--accent); color: var(--accent-ink); }
.empty { padding: 28px; text-align: center; color: var(--muted); font-size: 14px; }
mark { background: color-mix(in srgb, var(--brass) 28%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 70; transform: translateX(-50%); padding: 12px 18px; border-radius: 12px; background: var(--night); color: #fff; font-size: 14px; box-shadow: var(--e3); animation: in .2s var(--ease); }
.foot { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) { .tasks, .kmap { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  :root { --top: 56px; }
  .layout { grid-template-columns: 1fr; }
  .side { display: none; }
  .brand { width: auto; }
  .brand small, .search kbd, .stuck-btn span { display: none; }
  .search span { font-size: 13.5px; }
  .main { padding: 20px 16px 96px; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--panel) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 6px 0; font-size: 10.5px; font-weight: 600; text-decoration: none; color: var(--muted); border-radius: 10px; }
  .tabbar a[aria-current="page"] { color: var(--ink); }
  .tabbar a[aria-current="page"] svg { color: var(--brass); }
  .hero-grid, .tour-card, .g2, .g3, .routes, .gl, .stuck, .pitfalls, .trio { grid-template-columns: 1fr; }
  .tour-card .r { border-left: 0; border-top: 1px solid var(--line); }
  .level { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); row-gap: 18px; }
  .stats div:nth-child(3) { padding-left: 0; border-left: 0; }
  .figs { grid-template-columns: 1fr; }
  .flow span { display: none; }
  .acc .body { padding-left: 4px; }
  .sim-in { grid-template-columns: 1fr; }
  .lrow { grid-template-columns: auto 1fr auto; } .lrow em { display: none; }
}
@media (max-width: 520px) { .tasks, .kmap, .g4 { grid-template-columns: 1fr; } .task { min-height: 0; } .lesson-nav { flex-direction: column; } .lesson-nav a { max-width: none; } .complete { flex-direction: column; align-items: flex-start; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media print { .top, .side, .tabbar, .quiz, .lesson-nav, .complete { display: none !important; } .layout { display: block; } body { background: #fff; } .night { background: #0c1a33 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

/* ---------- fixes ---------- */
#view:focus, #view:focus-visible { outline: none; }
.side { padding-bottom: 28px; }
.side .meter { overflow: visible; }
.chip.termchip { cursor: help; }
.chip.termchip:hover { border-color: var(--brass); }
.search { min-width: 0; }
@media (max-width: 900px) {
  .top { gap: 8px; padding: 0 12px; }
  .brand > span:last-child { display: none; }
  .top-actions { gap: 6px; }
  .stuck-btn { width: 40px; padding: 0; justify-content: center; }
  .steps-mini { display: none; }
}
.search span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- modern product type (no editorial serif) ---------- */
:root { --serif: var(--sans); }
h1, h2 { font-weight: 700; letter-spacing: -.032em; }
.head h1, .lesson-head h1 { letter-spacing: -.035em; }
.hero h1 { font-weight: 750; letter-spacing: -.04em; line-height: 1.02; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--brass-2), #f3dcae); -webkit-background-clip: text; background-clip: text; color: transparent; }
.h2 h2 { font-size: 21px; letter-spacing: -.025em; }
.stats b, .fig b, .sim-val { font-weight: 700; letter-spacing: -.035em; }
.sentence b { font-weight: 600; letter-spacing: -.02em; }

<script type="application/json" id="data">{"paths":{"procurement":{"phases":[["Prepare",["Foundations","Roles & Funding","Market & Suppliers","Define the Need","Contract Types","Thresholds & Procedure"]],["Run the procedure",["Tender Design","Terms & Specifications","Authorise & Launch","Open & Evaluate","Negotiate & Award","Contract Signing"]],["Manage the contract",["Contract Management","Contract Execution & Payment","Performance & Filing"]]],"stages":[{"name":"Foundations","title":"Principles, Legal Bases & Ethics","lead":"Understand the rules that govern every Council of Europe purchase and the ethical standards expected of everyone involved. Confirm that procurement, not a grant, is the right instrument.","source":"Ch. 1.1–1.3","remember":"Buying for our own needs means procurement: compete, disclose, refuse gifts.","keyFacts":[["Rule No. 1395","procedure rules (20 June 2019)"],["31 January","annual declaration of interests due"],["0","value of gifts you may accept"]],"example":"A project team wants to pay an NGO to run its own awareness campaign that also promotes Council of Europe values. Because the NGO pursues its own objectives and only costs are covered, this is a grant, not procurement. The correct action is to use a grant agreement under Rule No. 1374, not a tender.","understand":"Every purchase of works, goods or services to meet the Organisation's own needs is procurement and must follow one of the procedures in Rule No. 1395.","do":"Check that the activity is a purchase rather than financial assistance, and apply the six procurement principles throughout the procedure.","check":"Your annual declaration of interests is filed and no conflict of interest, gift or privileged contact with potential bidders exists.","sections":[["Legal bases",{"lead":"Three instruments set the rules for every Council of Europe purchase, and DLAPIL templates replace the older model contracts.","items":[["Financial Regulations, Articles 40 to 43","Set out the three types of contract, the three main procedures and the role of the Tenders Board."],["Rule No. 1395 of 20 June 2019","Details each procedure, from preparing the tender file to signing the contract. An annotated version is on the Tenders Board's web page."],["Instructions No. 59 and No. 60","Cover consultants' contracts and outsourcing contracts respectively and remain relevant as background."]],"must":["Buyer entities should use the DLAPIL templates instead of the model contracts in Instructions No. 59 and No. 60, and should not use the model invoice."]}],["The six principles",{"lead":"Six principles from Rule No. 1395 guide every procurement procedure: competition is the norm and direct award the exception.","items":[["Periodic competition","Competitive procedures are launched at regular intervals so that other suppliers also have the chance to compete."],["Objectivity","The buyer entity acts without partiality, bias or outside influence, with neutral tender documents and impartial scoring."],["Transparency","Criteria and rules are available to all tenderers, results are published and reasons for the award are given on request."],["Non-exclusivity","The Council avoids recurring, exclusive relationships with suppliers and contracts of excessive length."],["Equal treatment","All tenderers follow the same rules and receive the same information at each stage."],["Non-discrimination","Tenderers in a comparable situation are not treated differently because they belong to a particular group, especially in the conditions for taking part."]]}],["Grants v. procurement",{"lead":"Buying for the Organisation's own needs is procurement; financing a grantee's own project is a grant.","items":[["Procurement contract","Used whenever the Organisation buys works, goods or services for its own needs, whatever the contractor's status. The price includes a profit margin and there are no reporting requirements."],["Grant agreement","Used when the Organisation gives financial assistance to a grantee for the grantee's own project (Article 43 bis of the Financial Regulations and Rule No. 1374). It covers part of the grantee's costs and requires extensive reporting."]]}],["Values and ethics",{"lead":"Everyone involved in procurement follows the Code of Conduct and the Purchasing Code of Ethics (25 October 2005), and the Council has a no-gift policy.","items":[["Avoid conflicts of interest","Do not take part in a procedure where your own interests could conflict with the Council's."],["Keep tenders confidential","Do not disclose the content of offers."],["Keep professional relationships","Maintain professional, respectful and trusting relationships with suppliers."],["Apply objective criteria","Select suppliers on objective and impartial criteria."],["Refuse all benefits","Refuse any benefit, gift or solicitation from suppliers, whatever its value."]],"must":["Secretariat members involved in procurement must submit a declaration of interests every year by the end of January, or within one month of a change (Rule No. 1282)."]}],["Fraud and reporting",{"lead":"Suspected fraud, corruption or other wrongdoing is reported at once under the Speak Up Policy.","must":["Staff must report suspected fraud, corruption or other wrongdoing immediately to the DIO.","Staff must not give potential bidders privileged technical or financial information before the call is public.","Buyer entities must not write specifications restrictively to discourage competition."]}],["Audits and risks",{"lead":"Four kinds of auditor examine procurement, and non-compliance creates institutional, financial, ethical, reputational and operational risks.","items":[["DIO","Internal audit checks compliance and performance."],["External auditor","Certifies the accounts and may carry out performance audits."],["European Union","Audits actions it funds."],["Donor-mandated auditors","Third-party auditors appointed by donors."]],"must":["The Ordinary Budget must cover any ineligible expenditure that donors reclaim after a non-compliant procedure."],"tip":"Auditors look at transparency, competition, thresholds, reasons for direct awards, validation workflows, declarations of interest and archiving, so keep these well documented."}]],"warning":"When non-compliant procedures are funded by extrabudgetary resources, the donor can declare the expenditure ineligible and demand a refund, which is then charged to the Ordinary Budget.","best":"Use the procurement principles as a guiding thread at every stage. When in doubt on an ethics question, consult the Ethics Officer before contacting a supplier."},{"name":"Roles & Funding","title":"Actors, Funding & Types of Purchases","lead":"Know who prepares, validates, controls and supports each step, and how the funding source and type of purchase affect the procedure.","source":"Ch. 2.1–2.5","remember":"Operations prepare, the CCM validates, the Tenders Board controls above €184,000.","keyFacts":[["€184,000","Tenders Board competence"],["€55,000–€184,000","DLAPIL review (extrabudgetary)"],["48 h","Procurement Unit first response"]],"example":"A field office plans a €40,000 IT equipment purchase for a ministry under an EU-funded project. IT purchases need DIT approval. The correct action is to request permission via MSA 1002, check the budget line, and appoint authorised staff members in writing before launch.","understand":"Procurement is decentralised: each MAE buys for its own needs, keeping operational functions separate from validation and financial management functions.","do":"Identify your CCM, appoint authorised staff members in writing and contact DLAPIL, the Procurement Unit or specialist directorates early.","check":"Authorised staff members are designated in writing by the CO or CCM before they open or assess offers.","sections":[["Segregation of duties",{"lead":"Each MAE runs its own procurement, with operational functions kept separate from validation and financial functions.","items":[["Operational functions","Defining needs, drafting tender documents and assessing deliverables."],["Validation and financial functions","Budgetary verification, PO validation and transfers."]],"must":["Each MAE must ensure that the same person does not perform both operational and validation functions."],"tip":"Roles follow the Financial Management Framework, the general delegation framework CM/Res(2023)1 and each MAE's delegations."}],["Buyer entity and authorised staff",{"lead":"The buyer entity runs the whole process, from forecasting the need to executing the contract.","must":["Only authorised staff members designated by the CO or CCM may open offers, assess offers and negotiate (Rule No. 1395, Article 3.2.d)."],"tip":"Delegate this authority in writing, at the latest when the CCM approves the tender documents, using the standard e-mail paragraph."}],["Control and validation bodies",{"lead":"Four bodies control and validate procurement decisions.","items":[["CO","Authorises expenditure and usually delegates to CCMs."],["CCM","Validates the choice of procedure, tender files, awards and contracts, assisted by an ACCM and a FOMA."],["Tenders Board","Ensures compliance for all contracts above €184,000 excluding VAT, decides on the scope and publication of international calls and scrutinises bid analyses."],["DIO","Audits and investigates."]]}],["Support services",{"lead":"Four services support buyer entities with legal, practical, Board and payment matters.","items":[["DLAPIL","Handles all legal questions, provides templates and training and, since 1 February 2025, performs the Legal Compliance Review for extrabudgetary-funded procedures between €55,000 and €184,000."],["DGA Procurement Unit","Gives non-legal support such as market analysis, sourcing, e-procurement and analysis tables, answering within 48 hours at procurement@coe.int."],["Tenders Board Secretariat","Checks files before they go to the Board."],["TPA","Registers suppliers in FIMS and pays invoices."]]}],["Funding sources",{"lead":"Procurement is funded either from the Ordinary Budget or from extrabudgetary resources.","items":[["Budgetary resources","Come from the four-year Programme and Budget with a biennial cycle; procurement is planned on forecasts per budget line approved by the CO."],["Extrabudgetary resources","Include EU funds under joint programmes and voluntary contributions, earmarked or non-earmarked, including the Human Rights Trust Fund."]],"must":["In co-operation projects, procurement must match the approved description of the action and budget, which can be difficult to amend."]}],["Types of purchases",{"lead":"Some types of purchase carry specific rules or need approval from a specialist directorate.","items":[["Intellectual services","Knowledge-based, non-recurrent creations of the mind that always raise intellectual property issues."],["Communication","Purchases need DC approval."],["IT","Purchases need DIT approval (MSA 1002), and cloud deliverables require the Cloud Checklist."],["Works on buildings","Go through DGS."],["Travel and accommodation","Booked directly for participants, they are outside Rule No. 1395 (Article 7); bought through an agency, they are not."]],"must":["Buyer entities must avoid disguised employment, for example by not giving consultants full-time or part-time workloads, CoE e-mail addresses or equipment."]}],["AI and co-operation projects",{"lead":"Suppliers declare their use of AI, and co-operation projects follow specific planning roles.","must":["Suppliers must declare any use of AI in the DLAPIL AI questionnaire, which is saved with the file.","Any difference between national and international consultants may only be based on expertise or language skills, never on nationality or residence."],"items":[["DPC","Co-ordinates programming and extrabudgetary resources."],["External offices","Prepare forecasts that the CCM validates."]]}]],"warning":"Authority for authorised staff members must be delegated in writing by the CO or CCM before any opening, assessment or negotiation task is performed.","best":"Check with the DPC or the Procurement Unit whether a framework contract or framework agreement already covers events, translation, interpretation, transport or printing in the country concerned."},{"name":"Market & Suppliers","title":"Market Analysis & Supplier Sourcing","lead":"Study the market and identify capable suppliers before drafting the tender, so that the call attracts enough good-quality offers.","source":"Ch. 4.2–4.3","remember":"Source widely, share nothing in advance.","keyFacts":[["3","suppliers minimum in competitive bidding"],["50,000+","suppliers already in FIMS"],["Art. 5","CEI is not a procurement procedure"]],"example":"A team always invites the same three consultants for gender-equality training. Auditors would see this as a breach of periodic competition. The correct action is to publish a call for expressions of interest and use the shortlist it produces for the next call for tenders.","understand":"Market analysis and sourcing increase competition, reveal innovative solutions and risks, and support periodic competition and non-discrimination.","do":"Use internal and external sources, existing contracts, the suppliers database and, where useful, a call for expressions of interest.","check":"No potential bidder has received information that would give them an advantage in the future procedure.","sections":[["Why analyse the market",{"lead":"A market analysis is essential when the goods, services or works have not been bought before.","items":[["Find new suppliers","Identifies suppliers beyond the usual ones."],["Fit the market","Helps tender documents match what the market offers."],["Reveal alternatives","Brings out alternative or innovative proposals."],["Highlight risks and opportunities","Shows what could go wrong or be improved."]],"tip":"Analyse the market before a direct award too, to check that better suppliers or solutions are not available."}],["Sources",{"lead":"Use sources that match the type of purchase, plus the Council's own records.","items":[["Works, goods and technical services","Trade journals, chambers of commerce, embassies, catalogues and end users."],["Intellectual consultancy","Academic platforms such as researchgate.net, academia.edu and scholar.google.com, specialised journals, professional associations and LinkedIn."],["Internal sources","Existing contracts lists, previous lists of invitees and market studies supported by the Procurement Unit."]]}],["Procurement strategy",{"lead":"A good strategy produces diverse offers, a proportionate workload and the best value for money.","items":[["Lots","Divide the contract into lots to widen competition."],["Framework contracts","Use them for recurring needs."],["Sharing","Share existing contracts with other entities."]],"must":["Buyer entities must make sure that SMEs and not-for-profit, minority-owned, women-owned and disability-inclusive suppliers are not excluded."]}],["Identifying new suppliers",{"lead":"FIMS holds over 50,000 suppliers but few new ones are added, so the same suppliers often bid.","must":["In a competitive bidding procedure, the buyer entity must invite at least three suppliers (Rule No. 1395, Article 21.2)."],"tip":"Choose the invitees through targeted sourcing, not a passive internet search, so that you receive three good-quality bids rather than just meeting the rule."}],["Call for expressions of interest",{"lead":"A CEI (Rule No. 1395, Article 5) is not a procurement procedure but a tool to list potential suppliers for future procedures.","items":[["Where to publish","The CoE website, e-procurement, the OJEU or social networks."],["No obligation to invite","There is no need to invite every listed supplier or to justify not inviting someone."],["No obligation to tender","There is no need to launch a call afterwards."]],"tip":"External auditors strongly recommend CEIs for consultancy."}],["Suppliers database",{"lead":"The Procurement Unit's intranet holds an optional shared suppliers database by category, approved by the Data Protection Officer.","must":["Registering a contracted supplier in FIMS requires an MSA 4002 processed by TPA."],"tip":"The Council does not use blocklists, but an optional exclusion criterion covers suppliers who failed contractual obligations with the Council in the previous three years."}]],"warning":"When meeting potential suppliers, never share information about a future call for tenders that could give them an advantage. Consult DLAPIL or the Procurement Unit if in doubt.","best":"Carry out the market study first and then the CEI, and include the CEI's results in the market study. The Procurement Unit can also consult the NPIO network of 40+ international organisations."},{"name":"Define the Need","title":"Define & Group Procurement Needs","lead":"Anticipate and describe the need precisely over the whole period of reference, grouping similar needs into as few procedures as possible.","source":"Ch. 4.4","remember":"Plan backwards from the deadline; one procedure per type of need.","keyFacts":[["2 years","Ordinary Budget period of reference"],["Whole project","incl. extensions for project-based needs"],["3 weeks","minimum publication for international calls"]],"example":"A project expects 12 expert reports over its three-year life. Buying them one at a time would artificially split the need. The correct action is to estimate all 12 reports over the full project duration, including possible extensions, and run a single procedure.","understand":"A clearly defined need over the correct period of reference determines the type of contract, the threshold and the procedure.","do":"Plan backwards from the delivery date, group similar needs for the whole project or budget cycle, and consult the relevant in-house experts.","check":"All foreseeable similar needs for the period of reference are covered, ideally by one procedure per type of need.","sections":[["Plan early",{"lead":"Identify needs as early as possible and build a reverse schedule from the required completion date.","items":[["Tenders Board approval","Allow time for the Board to authorise the launch and the results."],["Publication","Allow at least three weeks for international calls."],["VAT exemption","Allow time for the exemption procedures."]],"tip":"A procedure may be launched before the project formally starts if the tender documents state that the contract will only be awarded once it begins."}],["Key questions",{"lead":"Answer a set of questions about the need before drafting anything.","items":[["Deliverable and frequency","What is expected and how often is it needed?"],["Budget and threshold","What is the estimated overall budget and which threshold applies?"],["Existing contracts","Does an existing transversal contract already cover the need?"],["Specific requirements","Payment terms, delivery time, penalties and language."],["Total cost of ownership","Consider the whole cost, not only the purchase price."]]}],["Consult in-house expertise",{"lead":"Specialist directorates confirm the need is not already covered in-house and help validate the approach.","items":[["DGS","Works and buildings."],["DIT","IT goods or services."],["DC","Communication."],["ITEM","Multimedia."]],"must":["The buyer entity must consult the relevant directorate before tendering."]}],["Co-operation projects",{"lead":"Co-operation projects can buy project by project or for a whole sector.","items":[["Project-based approach","Covers the needs of one project for its full duration, including possible extensions."],["Sector-based approach","Covers common needs of several projects or a sector; it requires a framework contract or agreement and an international public call for tenders."]],"must":["Under a sector-based approach, each order or call-off must be issued within one project, and the relevant CCMs must be consulted during drafting and informed of the results before any order is placed."]}],["Ordinary Budget",{"lead":"For Ordinary Budget purchases, consider the whole two-year budget cycle and cover similar needs with a minimum number of procedures.","must":["Buyer entities must not repeat one-off purchases to meet a structural need."],"tip":"Ad hoc procedures for unforeseeable needs remain possible."}]],"warning":"Last-minute purchases can only be justified in exceptional circumstances where the urgency is not attributable to the buyer entity.","best":"Use a reverse schedule, working back from the completion date, to set milestones and a realistic start date for the procedure."},{"name":"Contract Types","title":"One-off, Framework Contract or Framework Agreement","lead":"Choose the contract type that matches how well defined and how repetitive the need is. The contract type does not determine the procedure.","source":"Ch. 3","remember":"Fixed need: one-off. Repeating units: framework contract. Variable: framework agreement.","keyFacts":[["4 years","maximum duration (5 exceptionally)"],["3","minimum suppliers per framework agreement lot"],["2–3 months","maximum run-on after end date"]],"example":"A project needs a cybercrime trainer repeatedly, in one-hour, half-day and full-day formats, in Strasbourg or online. The volume is unknown but the units can be defined. The correct action is a framework contract with a price list per format and a pooling system for consultants.","understand":"Use a one-off contract for defined, non-recurring needs, a framework contract for recurring unit-based needs, and a framework agreement for variable or complex needs.","do":"Match the need to the contract type and decide the ordering system (ranking or pooling) or the call-off rules before launch.","check":"The contract type fits the need, its duration does not exceed four years (five exceptionally), and it does not overlap existing contracts.","sections":[["Choosing the three types",{"lead":"A contract is not a procedure: the procedure depends on value, while the type of contract depends on the need.","items":[["One-off contract","Use when the need is quantifiable, definable and very unlikely to recur. One supplier (possibly a consortium); no orders, as price, specifications and quantities are fixed; lasts until both parties complete their obligations and cannot be renewed; control: a delivery deadline per deliverable, signed by the CCM."],["Framework contract","Use when the need can be defined as units and recurs often but cannot be fully quantified. One supplier (simple) or several (multiple, ranked or pooled); the buyer entity issues order forms at fixed unit prices; maximum four years, five exceptionally; control: the CCM signs each order after the PO is raised."],["Framework agreement","Use when the need is regular but variable, uncertain or complex. At least three suppliers per lot; each need goes to a call-off (mini-competition) approved by the CCM; maximum four years, five exceptionally; control: the CCM signs each call-off, and call-offs above €184,000 go to the Tenders Board."]]}],["One-off contracts",{"lead":"A one-off contract is made with a single supplier, possibly a consortium, and may be split into lots.","must":["A one-off contract must define the price, specifications and quantities.","A one-off contract must state a delivery deadline for each deliverable and cannot be renewed.","Buyer entities must not use repeated one-off contracts for the same need, as this is prohibited artificial splitting."],"tip":"A one-off contract lasts until both parties have completed their obligations."}],["Framework contracts",{"lead":"A framework contract fixes unit prices for defined items or time-based units, and the Council is not obliged to buy.","items":[["Simple","One supplier."],["Multiple with ranking","Orders go to suppliers in ranked order; recommended for goods and general services."],["Multiple with pooling","The buyer chooses a supplier for each order, justified in a note approved by the CCM; better for intellectual services."]],"must":["A multiple framework contract tender must state whether ranking or pooling applies.","Under a framework contract, only listed items can be ordered, and no order can be created after the end date."]}],["Framework agreements",{"lead":"A framework agreement creates a pool of at least three suppliers per lot, selected on competence without price competition.","items":[["Select the pool","Choose at least three suppliers per lot on competence."],["Approve each call-off","The CCM approves each call-off before publication."],["Run the mini-competition","Each need is put out to a call-off among the pool."]],"ordered":true,"must":["Any call-off with a single value above €184,000 must go to the Tenders Board."],"tip":"Framework agreements are rarely recommended for estimated expenditure below €184,000, because each need requires a mini-competition."}],["Duration and sharing",{"lead":"Framework contracts and agreements have no minimum duration but should not exceed four years, or five exceptionally, to respect non-exclusivity.","must":["Orders or call-offs must be created before the end date and usually run no more than two to three months afterwards.","In projects, delivery must fall within the implementation period."],"tip":"Framework contracts and agreements concluded through an international call are available to all Council of Europe entities; one-off contracts are not."}]],"warning":"Once the tender is published, the ordering method (ranking, pooling, rota or quotas) cannot be changed, so define it carefully in the tender documents.","best":"Keep the number of suppliers in a multiple framework contract reasonable. Dividing the estimated budget by the number of consultants shows whether each supplier's expected turnover is credible."},{"name":"Thresholds & Procedure","title":"Calculate the Threshold & Choose the Procedure","lead":"Estimate the total value of the need to determine whether a direct award, a competitive bidding procedure or an international public call for tenders applies.","source":"Ch. 4.5–4.7","remember":"Total foreseeable value decides the procedure — never split.","keyFacts":[["€2,000 / €6,000","direct award ceiling (goods / intellectual)"],["€184,000","international public call and Tenders Board"],["€10,000","public prices purchase ceiling"]],"example":"A team estimates €170,000 for translations over four years, but the project may be extended. The value is close to €184,000 and could exceed it. The correct action is to launch an international public call for tenders from the start, because the Tenders Board cannot approve a launch retroactively.","understand":"The threshold is the estimated total value of the need, excluding VAT, over the full contract life, including renewals, lots and all orders or call-offs.","do":"Calculate per need, not per supplier or year, and choose the procedure matching the value and funding source.","check":"No need has been split artificially, and if the value may approach €184,000, an international public call for tenders is chosen.","sections":[["Calculating the threshold",{"lead":"The threshold is set by the total estimated value before VAT over the full life of the contract, not per year.","items":[["Full duration","Include all renewals, tranches and options (works)."],["All lots","Add the value of every lot."],["All orders or call-offs","Include every possible order or call-off."],["Multiple contracts","Calculate the value regardless of the number of suppliers."],["Percentage-based fees","Use the total value of the service contract."]]}],["Direct award",{"lead":"A direct award is a contract without competition, allowed only below small amounts or in exceptional cases.","items":[["Low value","Up to €2,000 (goods, general services, works) or €6,000 (intellectual services), on a memorandum to the CCM justified by the supplier's expertise (Rule No. 1395, Article 22.4)."],["Unforeseen urgency","Urgency not attributable to the buyer (Financial Regulations Article 40.3.c, Rule Article 22.1.a)."],["Technical requirements","Only one supplier can meet the technical need."],["Considerations of fact or law","Facts or legal rights make competition impossible."]],"must":["The CCM decides on exceptional direct awards below €184,000, and the Tenders Board decides from €184,000.","Extrabudgetary-funded direct awards from €55,000 to €184,000 must first receive a DLAPIL Legal Compliance Review."]}],["Competitive bidding procedure",{"lead":"Competitive bidding applies between €2,000 (or €6,000) and €184,000, under the sole responsibility of the CCM.","must":["The buyer entity must invite at least three suppliers, or nine for a multiple framework contract with a pool of three.","Extrabudgetary-funded competitive bidding procedures from €55,000 to €184,000 must receive a Legal Compliance Review.","If all offers exceed €184,000, the buyer entity must cancel the procedure and launch an international call."]}],["International public call for tenders",{"lead":"An international call applies when the total value is estimated to exceed €184,000, or if there is even a slight risk of reaching it.","must":["The Tenders Board must authorise the launch, on request from the CCM with a summary memo to the Tenders Board Secretary.","An international call must allow at least three weeks for submission.","The Tenders Board cannot approve a launch retroactively."]}],["Other procedures",{"lead":"Two further procedures exist for hard-to-define needs and small purchases.","items":[["Competitive dialogue","For needs where the technical solution is hard to define, or a proof of concept. It uses a descriptive document, a published notice and rounds of discussion that may eliminate bidders; the Tenders Board validates the results."],["Public prices comparison","Under Article 21.2 of Rule No. 1395, a competitive bidding purchase below €10,000 excluding VAT may compare the public prices of three or more suppliers instead of inviting tenders."]],"must":["Screenshots of the compared public prices must be archived."]}],["Purchases for third parties",{"lead":"Goods or services for project beneficiaries are bought only through one-off contracts, by competitive bidding or international call depending on value.","items":[["Tender file","DLAPIL tailor-made version, available on request."],["Tripartite contract","Signed by the Council, the supplier and the beneficiary."],["Tripartite act of acceptance","Ownership transfers to the beneficiary when it is signed."],["Declaration of agreement","Completes the set of templates."]],"tip":"Consult DIT on IT requirements."}],["Specific risks",{"lead":"Three practices can push a purchase into the wrong procedure.","items":[["Artificial splitting","Dividing purchases without objective reason to stay below thresholds; it is prohibited and a red flag for fraud."],["Underestimating expenditure","If a later procedure covers needs that could have been included earlier, the threshold is calculated on the combined amount."],["Contract amendments","Amendments may push the total above the original threshold."]]}]],"warning":"Never split requirements or shorten contract terms to stay below a threshold. Artificial splitting is prohibited and treated as a red flag for fraud.","best":"If the estimate is close to €184,000 or may grow through extensions, amendments or other directorates using the contract, launch an international public call for tenders from the outset."},{"name":"Tender Design","title":"Tender File, Lots & Assessment Criteria","lead":"Build the tender package and set the exclusion, eligibility and award criteria that will decide the outcome.","source":"Ch. 4.8.1–4.8.3","remember":"Publish the criteria once; never change them afterwards.","keyFacts":[["20 points","minimum weight for price, in principle"],["Out of 10","score per technical criterion"],["15–35%","bid as a share of turnover"]],"example":"A tender for a 1,000-person conference asks for prior experience organising events. That criterion is too vague to assess. The correct action is to require proven experience of events of comparable size, with a list of references as the supporting document.","understand":"The tender file and act of engagement are mandatory for competitive procedures, and the criteria cannot be changed once the call is published.","do":"Download fresh DLAPIL templates and set clear, proportionate eligibility criteria and weighted award criteria.","check":"Criteria are objective, measurable and non-discriminatory, eligibility and award criteria do not overlap, and all weightings are published.","sections":[["Tender package and templates",{"lead":"The tender package contains at least the tender file and the act of engagement, built from a fresh DLAPIL template.","items":[["Tender file","The terms of reference and the tender rules."],["Act of engagement","A ready-to-sign contract containing bidders' statutory declarations."]],"must":["Buyer entities must always download a new DLAPIL template, chosen by procedure, contract type, lots and language.","Documents published in two languages must state which version prevails, and machine translations must carry the standard disclaimer."],"tip":"DGA and EDQM have their own templates."}],["Division into lots",{"lead":"Lots split a tender into separate competitions in the same call, increasing competition and letting specialised suppliers bid.","must":["Lots may only be used if each lot can be awarded to a different supplier.","The procedure is determined by the total value of all lots."],"tip":"Avoid overlapping lots, and do not use lots when a single supplier is needed."}],["Exclusion criteria",{"lead":"The exclusion criteria in Appendix I to Rule No. 1395 apply to every purchase and cannot be deleted or changed, only supplemented.","items":[["Criminal convictions","Final judgment for participation in a criminal organisation, corruption, fraud, money laundering, terrorist financing or offences, child labour or trafficking in human beings."],["Insolvency","Bankruptcy, liquidation, insolvency or a similar procedure."],["Professional misconduct","A final judgment for an offence affecting professional integrity or serious misconduct."],["Unpaid taxes or contributions","Failure to pay social security contributions, taxes and dues."],["Shell companies","An entity created to circumvent tax, social or other legal obligations."],["Mismanagement of funds","Involvement in mismanagement of Council of Europe or public funds."],["Conflict of interest","Being, or appearing to be, in a conflict of interest."],["Retired staff","Retired staff and staff who left under an early departure scheme."],["Current staff","People employed by the Council now or on the launch date."],["Past contract failure (optional)","Failure to fulfil a Council contract in the previous three years leading to refused payment or termination."],["Restrictive measures","UN Security Council or EU restrictive measures, including those on a legal person's owners or executives."]],"tip":"The signed declaration of agreement in DLAPIL acts of engagement serves as the declaration; e-procurement users confirm it online."}],["Eligibility criteria",{"lead":"Eligibility criteria set the minimum financial, economic, technical or professional capacity needed to perform the contract.","must":["Each eligibility criterion must be clear, objective, verifiable, proportionate and answerable with yes or no, with a defined supporting document."],"items":[["Vague terms","Do not use words such as sufficient or relevant."],["Council-only experience","Do not require experience limited to Council of Europe projects."],["Over-prescription","Do not set overly prescriptive requirements."],["Nationality","Do not require a nationality."]],"tip":"As a guide, the bid should represent between 15% and 35% of the bidder's turnover."}],["Award criteria",{"lead":"Award criteria score quality and price to find the best value for money, and must not repeat eligibility criteria.","items":[["Methodology","How the bidder wil
