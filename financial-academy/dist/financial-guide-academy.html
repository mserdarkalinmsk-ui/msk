hen all members sign.","do":"Run individual scoring with G14.3, compile the G14.4 consensus report and submit it for the Commitments Officer's reasoned G14.6 decision.","check":"Unsuccessful applicants are informed in writing no later than 15 calendar days after the successful ones.","sections":[["Evaluation steps",{"lead":"Evaluation runs from the eligibility report to the Commitments Officer's reasoned decision.","items":[["Adopt the G14.1 report","The Committee adopts the exclusion and eligibility report, possibly by electronic consultation."],["Score individually","Each member completes G14.3 for each eligible proposal."],["Compile the consensus","The Co-ordinator averages scores in the G14.4 consensus report."],["Sign","All members sign the consensus report to adopt it."],["Decide","The Commitments Officer adopts a reasoned G14.6 decision."]],"ordered":true,"must":["The Co-ordinator must keep a paper or electronic copy of any electronic consultation.","Only applicants declared eligible may be evaluated against the award criteria."]}],["Scoring scale (0 to 5)",{"lead":"Each member scores every award criterion or sub-criterion from 0 to 5, with coherent explanatory comments.","items":[["0 Fails","Fails the criterion or cannot be assessed because information is missing."],["1 Poor","Approached superficially or with intrinsic weaknesses."],["2 Satisfactory","Generally meets the criterion but with intrinsic weaknesses."],["3 Good","Largely meets the criterion despite some shortcomings."],["4 Very good","Very largely meets the criterion with few shortcomings."],["5 Excellent","Fulfils every aspect; any shortcomings are minor."]],"ordered":false}],["Consensus report",{"lead":"The Co-ordinator averages the scores, giving equal weight to each evaluator, in the G14.4 consensus report.","items":[["Total funds","The total amount of funds concerned by the procedure."],["Successful applicants","The list of successful applicants and selected proposals."],["Unsuccessful applicants","The list of unsuccessful applicants."]],"ordered":false,"must":["All Committee members must sign the consensus report before it is adopted."],"tip":"If scores diverge too widely, talk to the evaluators or convene the Committee to reach a common position."}],["Commitments Officer decision",{"lead":"The Commitments Officer must give reasons, for example by endorsing the attached consensus report without reservation (G14.6).","items":[["Aims","The selected project pursues the aims stated in the call."],["Cost and content","The project's cost and content appear reasonable."],["Funds","Funds are available to finance the project."]],"ordered":false,"must":["The Commitments Officer must decide only on a reasoned and documented consensus report, and ask the Committee to amend or amplify it otherwise."]}],["Unsuccessful call",{"lead":"After an unsuccessful call the Commitments Officer may award no grant or launch a new call, recorded in Template G14.7A.","items":[["No proposal received","The Commitments Officer may decide without prior action by the Committee."],["No proposal meets the criteria","The Commitments Officer decides only after the Committee has analysed the proposals."]],"ordered":false}],["Informing applicants",{"lead":"The Commitments Officer informs all applicants of the outcome in writing.","items":[["Successful (G14.8)","Inform promptly; the Rule sets no deadline."],["Excluded or ineligible (G14.9A)","Within 15 calendar days of the successful applicants."],["Not selected (G14.9B)","Within 15 calendar days of the successful applicants."]],"ordered":false,"must":["The Commitments Officer must inform unsuccessful applicants no later than 15 calendar days after the successful ones.","Each letter to an unsuccessful applicant must explain how to enquire and give a cut-off date of at least 7 calendar days."],"tip":"Inform all applicants on the same day and direct their questions to the Co-ordinator."}]],"warning":"The 15 calendar day deadline for informing unsuccessful applicants is imperative, and the letter must state a cut-off date for enquiries of at least 7 calendar days.","best":"Send all successful and unsuccessful letters on the same day and direct questions to the Co-ordinator."},{"name":"Complaints","title":"Enquiries, complaints and allegations","lead":"Unsuccessful applicants must first enquire, may then complain within 30 calendar days, and complaints go to the Co-ordinator and, failing a manifest error, to the Review Board.","source":"Rule 1374 · Art. 15–16","remember":"Enquire first, complain within 30 days, about the evaluation only.","keyFacts":[["30 days","calendar days to lodge a complaint after the enquiry reply"],["30 days","for the Review Board to meet after receipt"],["3","Review Board members: Auditor, DLAPIL, Treasurer"]],"example":"An unsuccessful NGO complains that its complete proposal was rejected as incomplete. That is a manifest error. Correct action: the Co-ordinator alerts the Evaluation Committee, which reassesses and recommends measures to the Commitments Officer.","understand":"A complaint is admissible only if it contests how the proposal was examined; it cannot challenge the wording of the criteria unless they breach Article 2.","do":"Reply to enquiries in writing with G15.2, screen complaints for manifest error and transmit the rest to the Review Board without delay.","check":"Time limits are counted in calendar days from midnight after the triggering act, extended to the next working day if needed.","sections":[["Route of a challenge",{"lead":"An unsuccessful applicant enquires first, may then complain, and the complaint is screened before any Review Board.","items":[["Enquiry","The applicant asks in writing why it was not selected."],["Reply","The Co-ordinator replies in writing with G15.2."],["Complaint","The applicant complains within 30 calendar days of the reply."],["Manifest error check","The Co-ordinator screens the complaint immediately."],["Review Board","Without a manifest error, the Board examines the complaint."],["Decision","The Commitments Officer decides on measures (G15.7B)."]],"ordered":true}],["Enquiries and replies",{"lead":"Reasons for non-selection are given promptly and in writing, not by telephone.","items":[["Complaint procedure","How to lodge a complaint."],["Inadmissible complaints","Which complaints will not be accepted."],["Address","Where to send a complaint."]],"ordered":false,"must":["The Co-ordinator must check that each enquiry arrived within the deadline (at least 7 days) stated in the letter.","The G15.2 reply must explain the complaint procedure and state the address for complaints."]}],["Lodging a complaint",{"lead":"A complaint is admissible only if it contests how the proposal was examined.","items":[["Prior enquiry","An enquiry must precede the complaint."],["Deadline","Within 30 calendar days of notification of the reply to the enquiry."],["References","The call reference and the proposal's identification number."],["Content","Full particulars of the grievances and all necessary documents."]],"ordered":false,"must":["The Co-ordinator must declare inadmissible (G15.3A) any complaint about the wording of criteria, unless they breach Article 2.","The Co-ordinator must request missing documents in writing (G15.3B) within a stated reasonable time."]}],["Calculating time limits",{"lead":"Time limits run in calendar days from midnight on the day after the triggering act.","items":[["Start","A reply notified at 11 am on the 2nd starts the clock at midnight on the 3rd."],["Counting","Saturdays, Sundays and public holidays count."],["End","A deadline falling on a non-working day moves to the next working day."]],"ordered":true}],["Manifest error check",{"lead":"A manifest error is a gross or clear error in interpreting the facts or in the procedure, such as rejecting a complete proposal as incomplete.","items":[["Co-ordinator","Examines the complaint immediately and alerts the Committee if an error is found."],["Evaluation Committee","Reassesses the proposal and recommends measures."],["Commitments Officer","Decides the measures to redress the error."]],"ordered":true}],["Review Board",{"lead":"Without a manifest error, the complaint goes to a Review Board that checks the evaluation but cannot redo it.","items":[["Members","Representatives of the internal Auditor, the Director of Legal Advice and Public International Law and the Treasurer, none involved in the evaluation."],["Timing","Meets within 30 calendar days of receiving the complaint."],["Scope","Checks that criteria were applied coherently and without discrimination."],["Outcome","May recommend a fresh evaluation by reasoned opinion (G15.7A); the Commitments Officer decides (G15.7B)."]],"ordered":false,"must":["The Co-ordinator must send the complaint and all evaluation documents to the Review Board without delay."]}],["Fraud, corruption and misconduct",{"lead":"The complaints procedure only reviews evaluation errors and is not an inquiry into misconduct.","items":[["Internal Auditor","May receive allegations of fraud, corruption or misconduct."],["Directorate General of Administration","May receive the same allegations and acts under Rule 1327."]],"ordered":false}]],"warning":"Complaints contesting anything other than the examination of the proposal are inadmissible, and the Review Board may not substitute its own evaluation.","best":"Keep every evaluation document on file so the complete record can be sent to the Review Board at once."},{"name":"Agreement","title":"Drafting, signing and amending the grant agreement","lead":"A written grant agreement is imperative; it is based on the DLAPIL model but must be adapted to the context, the proposal and the donor's requirements.","source":"Rule 1374 · Art. 17","remember":"Always in writing; amend management details, never the total amount.","keyFacts":[["Written","grant agreement is imperative"],["G17.2A / G17.2B","model agreement for BO-VC / EU funds"],["G17.3","amendment template"]],"example":"A grantee asks to change its bank details and add €5,000 to the grant. Bank details are a management matter, but the total amount must not increase. Correct action: amend the bank details in writing with G17.3 or e-mail and refuse the increase.","understand":"The agreement must contain a description of the action, an estimated budget, the implementation period, reporting obligations and a limit on third-party liability.","do":"Adapt Template G17.2A or G17.2B with its annexes, consulting DLAPIL where needed, and have the Commitments Officer sign it.","check":"The estimated budget total equals the grant amount and the implementation period does not pre-date the proposal deadline.","sections":[["Written agreement",{"lead":"A verbal agreement not put into writing is contrary to the Rule.","must":["The parties must sign a written grant agreement."]}],["Model agreement",{"lead":"The DLAPIL model is only a basis and must be adapted to the context, the proposal and any donor requirements.","items":[["G17.2A","Agreement for the Ordinary Budget or Voluntary Contributions."],["G17.2B","Agreement for EU funds."],["G17.2C","Guidance on how to prepare an agreement."]],"ordered":false,"must":["An agreement financed by extra-budgetary resources must reflect the donor's requirements, notably on visibility and eligibility of costs."],"tip":"Consult DLAPIL for a legal opinion on the terms."}],["Content",{"lead":"Every agreement, including for operational grants, sets out the action, the budget, the grantee's obligations and the implementation period.","items":[["Description of the action","Preferably in an annex, including any purchases or sub-grants the grantee will make."],["Estimated budget","Itemised in an annex (G17.2D), with a total equal to the grant amount."],["Reporting obligations","Narrative and financial reporting, using model reports (G17.2E or G17.2F)."],["Implementation period","Defined precisely, since cost eligibility depends on it."]],"ordered":false,"must":["The implementation period must never pre-date the deadline for proposals."],"tip":"Use the budget annex structure as the framework for financial reporting."}],["Amendments",{"lead":"An amendment can use any written format that unambiguously shows both parties' consent.","items":[["By e-mail","Obtain the authorised staff member's agreement first and copy him or her; list the change and ask the grantee to confirm by return."],["By signed document","Both parties sign a document (G17.3) setting out the change."],["Allowed changes","Management matters such as deadlines, contact details or bank details."],["Forbidden changes","Any increase in the total grant amount or change that distorts the initial conditions."]],"ordered":false,"must":["Every amendment must reference the agreement and state which provisions are supplemented or cancelled and replaced."]}],["Third-party liability",{"lead":"The model agreement G17.2A already limits the Organisation's third-party liability.","must":["Every grant agreement must contractually limit the Organisation's third-party liability."]}],["Grants in Ukraine",{"lead":"Grants implemented in Ukraine need an extra security and safety document.","items":[["G17.2H","Annex V on security and safety."],["G17.4","Addendum on security and safety."]],"ordered":false}]],"warning":"An amendment must never increase the total grant amount or alter conditions in a way that creates unequal treatment between applicants.","best":"Use the estimated budget annex structure as the framework for the grantee's financial reporting."},{"name":"Filing","title":"Record-keeping, interpretation and templates","lead":"The initiating department keeps the complete file, the Rule is interpreted in good faith, and the templates must be completed and cleaned before use.","source":"Rule 1374 · Art. 18–20","remember":"Keep everything, from Co-ordinator appointment to final supporting documents.","keyFacts":[["Initiating department","keeps the full grant file"],["Art. 19","good-faith interpretation of the Rule"],["[XX]","options and comments to delete before sending"]],"example":"At closure, a project team holds evaluation sheets but the grantee's validated receipts sit with another unit. The whole file belongs with the initiating department. Correct action: gather all documents up to validation of the supporting documents and file them per the document management table.","understand":"All documents from the Co-ordinator's appointment to validation of the supporting documents must be kept by the department that initiated the procedure.","do":"File every procedure document in line with your entity's document management table and finalise templates before sending them.","check":"Comments, blue highlighting and bracketed [XX] options have been removed from every template sent to third parties.","sections":[["Storage of documents",{"lead":"The department that initiated the procedure keeps the complete grant file.","items":[["From","The appointment of the Co-ordinator."],["To","Validation of the supporting documents certifying proper use of the grant."]],"ordered":false,"must":["Each entity's document management table must reflect this record-keeping requirement."]}],["Interpretation",{"lead":"The Rule is interpreted in good faith under Article 19, keeping in mind its spirit and the principles in its Preamble.","must":["Staff should consult DLAPIL on any ad hoc situation, as changing the forms may create a discrepancy with the Rule."],"tip":"Use the guide and its appendices for all award procedures; misuse may lead to an administrative inquiry."}],["Using the templates",{"lead":"Templates contain parts to complete, multiple-choice options and drafting comments.","items":[["Complete","Fill in every element before sending to third parties."],["Clean","Delete comments, blue highlighting and bracketed [XX] options."],["Red parts","Parts for the applicant or grantee are marked in red."]],"ordered":true}]],"warning":"Altering the standard forms risks departing from the Rule; consult DLAPIL before any ad hoc change.","best":"Open the G3.1TAB follow-up table at the start and file each document as the step is completed."}]}},"briefs":{"po-file":{"title":"Prepare a PO file","lead":"Build a complete, signature-ready and audit-ready purchase order file for the selected service type.","remember":"No activity starts before the PO is issued and documents are countersigned.","understand":"The PO is the commitment that allows work to start, so it must rest on confirmed budget, a valid supplier route and the correct signatures.","do":"Confirm the budget, the PMM activity ID and the supplier in FIMS, prepare the contractual package, obtain prior CCM approval and submit the complete file so that the ACCM can create the PO.","check":"The PO has been issued, the contract was signed and dated after the PO and before delivery, the countersigned documents have been returned to the supplier and the issued PO is kept in the file.","figures":[["2 weeks","Submission lead time","Submit the PO request at least two weeks before the scheduled start date to leave enough time for approval."],["PMM ID","PO prerequisite","No PO can be raised without the PMM project and/or activity ID, and no PO can be raised before the supplier exists in FIMS."],["€55k–€184k","Legal review band","Procurements in the €55,000 to €184,000 band should follow the applicable legal and procurement review route."]]},"payment-file":{"title":"Prepare a payment file","lead":"Continue the control trail from the PO stage and build a finance-ready payment file.","remember":"Pay only for completed, accepted work that matches the approved contractual basis.","understand":"A payment closes the trail opened at PO stage, so it must match the same contract, supplier and approval route.","do":"Confirm completion with a signed Certificate of Acceptance of Work or Payment Request Memorandum, match the invoice to the PO and contract, complete the PMM synopsis and obtain CCM approval before the file goes to the Treasurer.","check":"The payment file is complete, the ACCM has recorded the CCM approval, discrepancies are resolved and the payment evidence is archived until settlement.","figures":[["60 days","Default payment term","The default payment term is 60 days from receipt of the invoice or execution, whichever is later, unless the contract sets other terms."]]},"year-end":{"title":"Year-end closing","lead":"Check delivery dates, complete payment files, follow up suppliers and finalise POs when the expenditure is fully recorded.","remember":"Only delivery by 31 December 2026 counts as 2026 expenditure.","understand":"Expenditure must be charged to the financial year in which the goods were delivered or the services were rendered.","do":"Review open POs, follow up suppliers for missing invoices and send complete payment files to Finance as soon as they are ready.","check":"All 2026 expenditure is recorded in FIMS and the Fiche PO shows it under Amount billed or Invoices before the PO is finalised.","figures":[["31/12/2026","Delivery cut-off","Only goods delivered and services rendered by 31 December 2026 can be included in 2026 expenditure."]]},"petty-cash":{"title":"Petty cash","lead":"Use petty cash only for small-value operational needs, within the authorised limit, with a clear supporting file.","remember":"Get CCM approval before spending, and keep each invoice paid by petty cash at or below €50.","understand":"Petty cash is a small-value exception, so it must not replace the normal procurement or payment route.","do":"Check each invoice against the €50 limit, obtain CCM approval, let the ACCM issue the PO and send the request to DPFL, which transfers the approved amount to a local bank account.","check":"Every cash advance has a signed cash transfer form, cash is kept in a lockable box, and each invoice is supported by evidence of its link to the project, such as the activity, date and place, or for taxis the traveller, purpose and why public transport was not used.","figures":[["€50","Per invoice","Invoices paid by petty cash must not exceed €50 each; above that, use the normal purchasing and payment route."],["Lockable box","Cash custody","Every staff member who receives a cash advance signs a cash transfer form and keeps the cash in a lockable box."]]},"filing":{"title":"Filing and audit trail","lead":"Keep project, procurement and financial records easy to find, easy to verify and ready for review.","remember":"Store every approval and document with the transaction it supports.","understand":"A complete and traceable file shows why each action was taken, who approved it and how it was executed.","do":"File decision, approval and execution evidence in the DMS project folder, using clear names, dates and references, and keep project documentation electronically and physically.","check":"Final PDF evidence and its editable source are kept together and every file can be found and verified.","figures":[["10 years","Retention period","Project documentation, including deliverables and supporting documents, must remain easy to retrieve for audit for ten years after the end of the project."]]},"foma":{"title":"FOMA workflows","lead":"Controlled handover workflows and financial guidance for day-to-day field-office operations.","remember":"Each file moves to the next role only after its control is complete.","understand":"Field-office files pass between the requester or Project Team, ACCM, RFO and CCM, and each role has its own control.","do":"Choose the workflow, complete your stage and hand the file over to the next role in the route.","check":"Each stage has been controlled and the file has reached the final validation or the donor route where required.","figures":[]},"foma/reports":{"title":"Financial reporting","lead":"Prepare and reconcile the project's current financial position and retain a controlled reporting package.","remember":"Reconcile spent and committed figures to the source data before finalising.","understand":"The financial report gives a clear and traceable picture of the project's current financial position for review and validation.","do":"Build the report from the correct data, reconcile it, apply the JP or VC structure and complete the reporting controls.","check":"No unexplained discrepancy, broken formula or unsupported figure remains, and the final report is archived with its evidence.","figures":[["Quarterly","Reporting frequency","Quarterly financial reporting is required."],["Once a year","Forecast in the report","At least once per year, the report should include actual and forecast expenditure for the coming year."]]},"foma/forecast":{"title":"Forecast and budget revision","lead":"Plan future expenditure, revise the budget and identify the applicable route.","remember":"Assess the ±25% threshold per Budget Heading, not the project total.","understand":"The size of each Budget Heading variation and any contractual change decide whether a revision follows the Notification or Addendum route.","do":"Prepare the FORECAST working sheet, collect the Project Team input, then review the variations and decide the route.","check":"Formulas are intact, the Project Team input is consistent and the route decision is documented.","figures":[["±25%","Budget Heading threshold","For a Joint Programme, a variation within ±25% at Budget Heading level follows Notification, and a variation above ±25% follows Addendum."]]},"foma/addendum":{"title":"Addendum workflow","lead":"Prepare a Joint Programme Addendum package from the latest financial report and forecast.","remember":"Changes to total cost, duration or scope always require an Addendum.","understand":"An Addendum amends the donor-approved contractual budget, so it needs a clean, validated and justified package.","do":"Confirm the route, prepare the revised budget, collect the Project Team justification and build the clean donor package.","check":"The Addendum is signed by both parties, the revised budget is uploaded to PMM and all project records are aligned.","figures":[["±25%","Addendum trigger","Where any relevant Budget Heading of a Joint Programme exceeds ±25%, the Addendum route applies."]]},"vat":{"title":"VAT procedures","lead":"Clarify VAT before signature, check it at PO and invoice stage, and keep the VAT trail.","remember":"Clarify VAT before signing the contract or order form.","understand":"VAT exemption is a privilege of the Council of Europe, and staff must follow the procedures carefully and meet the deadlines for requesting exemption certificates.","do":"Establish the supplier's VAT status and place of taxation, request any exemption certificate through MSA form 9215 within the deadlines, check the invoice particulars and pay to the contractual bank account.","check":"The invoice matches the agreed VAT treatment and the VAT correspondence is filed in the DMS with the invoice and payment evidence.","figures":[["MSA 9215","Exemption certificate form","All requests for VAT exemption certificates go through MSA form 9215 and its SLA, which help departments submit correct files and limit the risk of rejection by the French authorities."],["€5,000","Single card purchase","A single card purchase is limited to €5,000, and card payments remain exceptions."],["€30,000","Monthly card limit","The Organisation-wide monthly card limit is €30,000; larger amounts should preferably be paid by transfer."],["60 days","Default payment term","The default payment term is 60 days from receipt of the invoice or execution, whichever is later, unless the contract sets other terms."]]},"events":{"title":"Events and GDD","lead":"Manage event finance from the call-off to the payment file, including budget reconciliation and exchange-rate evidence.","remember":"Document every budget change and keep CCM approval for significant ones.","understand":"The final event budget often differs from the initial one, so each change must be explained and supported in the payment file.","do":"Run the call-off, submit the Event Management PO, collect delivery evidence and compare the final budget with the initial one.","check":"The payment file holds the signed final budget, CCM approval e-mails for significant changes and exchange-rate evidence where needed.","figures":[]}},"quizzes":{"procurement":[{"level":1,"type":"tf","q":"A staff member involved in a procedure may accept a small gift from a bidder, provided its value is modest.","options":["True","False"],"answer":1,"explain":"The value of gifts you may accept is zero: under the Council of Europe's no-gift policy, staff involved in procedures cannot receive any gifts or hospitality, regardless of value.","hint":"Think about the exact gift value the guide allows.","stage":"Foundations"},{"level":1,"type":"mc","q":"From what estimated value (excl. VAT) must an international public call for tenders be used?","options":["€55,000","€100,000","€184,000","€250,000"],"answer":2,"explain":"From €184,000 the international public call for tenders applies and the Tenders Board is competent.","hint":"It is also the Tenders Board threshold.","stage":"Thresholds & Procedure"},{"level":1,"type":"tf","q":"Paying an NGO to run its own project that also promotes Council of Europe values is a grant, not procurement.","options":["True","False"],"answer":0,"explain":"Procurement means buying for the Organisation's own needs. Covering the costs of a third party's own objectives is a grant under Rule No. 1374.","hint":"Whose needs and objectives are being served?","stage":"Foundations"},{"level":1,"type":"mc","q":"What is the direct award ceiling for intellectual services?","options":["€2,000","€6,000","€10,000","€55,000"],"answer":1,"explain":"Low-value direct award is allowed up to €2,000 for goods, general services and works, and €6,000 for intellectual services, on a memorandum validated by the CCM (Art. 22.4).","hint":"Intellectual services have a higher ceiling than goods.","stage":"Thresholds & Procedure"},{"level":2,"type":"mc","q":"In a competitive bidding procedure, how many suppliers must at least be invited?","options":["Two","Three","Five","Nine"],"answer":1,"explain":"At least three suppliers must be invited (nine for a multiple framework contract with a pool of three). The CCM is responsible for the procedure.","hint":"The same number as the minimum suppliers per framework agreement lot.","stage":"Authorise & Launch"},{"level":2,"type":"tf","q":"A competitive bidding purchase below €10,000 excl. VAT may compare the public prices of three or more suppliers instead of inviting tenders.","options":["True","False"],"answer":0,"explain":"Article 21.2 of Rule No. 1395 allows a public prices comparison below €10,000; screenshots of the prices compared must be archived.","hint":"Look for the public prices purchase ceiling.","stage":"Thresholds & Procedure"},{"level":2,"type":"mc","q":"What is the maximum duration of a framework contract or framework agreement?","options":["Two years","Three years","Four years (five exceptionally)","Unlimited, if renewed tacitly"],"answer":2,"explain":"Framework contracts and agreements should not exceed four years, or five exceptionally, to respect non-exclusivity and periodic competition.","hint":"Periodic competition limits how long one supplier can be locked in.","stage":"Contract Types"},{"level":2,"type":"mc","q":"How long must contractual and procurement documents be retained?","options":["3 years","5 years","7 years","10 years"],"answer":3,"explain":"All procurement documents must be archived for 10 years to support audits.","hint":"Evaluate, learn, archive...","stage":"Performance & Filing"},{"level":3,"type":"mc","q":"A project needs a trainer repeatedly in defined formats (one hour, half day, full day), but the total volume is unknown. Which contract type fits?","options":["One-off contract","Framework contract with a price list per unit","Framework agreement with call-offs","Grant agreement"],"answer":1,"explain":"Recurring, unit-based needs that cannot be fully quantified suit a framework contract with fixed unit prices; the CCM signs each order after the PO is raised.","hint":"The units can be defined, only the quantity is unknown.","stage":"Contract Types"},{"level":3,"type":"tf","q":"An extrabudgetary-funded competitive bidding procedure of €90,000 can be submitted directly to the CCM for approval.","options":["True","False"],"answer":1,"explain":"Since 1 February 2025, extrabudgetary procedures between €55,000 and €184,000 need a DLAPIL Legal Compliance Review before the CCM approves the launch.","hint":"Check the funding source and the €55,000 mark.","stage":"Authorise & Launch"},{"level":3,"type":"mc","q":"What must exist before the Organisation signs any contract?","options":["An acceptance certificate","A budgetary commitment (PO) in FIMS","The supplier's first invoice","A Tenders Board opinion"],"answer":1,"explain":"A PO is mandatory before signature, and no goods or services may be provided before the CCM countersigns: PO first, signature second, work third.","hint":"The budget must be committed first.","stage":"Contract Signing"},{"level":3,"type":"scenario","q":"What should the evaluation committee do with this bid?","scenario":"In a €70,000 competitive bidding procedure, one bidder's offer arrives without one expert's CV and with the financial offer left blank. The other bids are complete.","options":["Ask the bidder to send the CV and the financial offer","Ask only for the missing CV and score the bid","Exclude the bid, since a missing financial offer cannot be completed after opening","Score the technical part and estimate the price"],"answer":2,"explain":"Under Art. 17.2 offers can be clarified but never changed. A missing CV may be clarified, but a missing financial offer would change the bid, so it is excluded.","hint":"Clarifying versus changing an offer.","stage":"Open & Evaluate"},{"level":4,"type":"scenario","q":"Which approach is correct?","scenario":"A project expects 12 expert reports over its three-year life, each worth about €18,000. The manager proposes buying them one by one through separate competitive bidding procedures.","options":["Accept: each report is below €184,000","Run one competitive bidding procedure for the first year only","Estimate all 12 reports over the whole project (≈€216,000) and launch an international public call","Use direct award for each report as intellectual services"],"answer":2,"explain":"The threshold is the total foreseeable value of the need over the whole project, including extensions; splitting it to avoid the €184,000 route is forbidden and the Tenders Board is competent.","hint":"Calculate per need, not per order or year.","stage":"Define the Need"},{"level":4,"type":"scenario","q":"What is the safest procedure choice?","scenario":"A team estimates €170,000 of translation services over four years under a voluntary contribution. The project is likely to be extended for a further year.","options":["Competitive bidding now, and ask the Tenders Board later if needed","International public call for tenders from the start","Competitive bidding with an LCR, then amend the contract","Two consecutive competitive bidding procedures"],"answer":1,"explain":"With a likely extension, the value may exceed €184,000; the Tenders Board cannot approve a launch retroactively, so an international call is needed from the outset.","hint":"Include possible extensions in the estimate.","stage":"Thresholds & Procedure"},{"level":4,"type":"scenario","q":"What should the buyer entity do now?","scenario":"A framework contract awarded through competitive bidding has reached €150,000 in orders. More training sessions worth about €50,000 are planned for next year.","options":["Ask the CCM to authorise a 10% increase","Keep ordering, as the ceiling applies per year","Contact DLAPIL and prepare an international call approved by the Tenders Board before spending exceeds €184,000","Sign an amendment raising the contract ceiling"],"answer":2,"explain":"A framework contract awarded by competitive bidding cannot exceed €184,000 in total; amendments may never change its volume, so a new international call is required.","hint":"The ceiling applies to cumulative spending.","stage":"Contract Management"},{"level":4,"type":"tf","q":"If urgent needs arise because a team planned late, it may justify an exceptional direct award on grounds of urgency.","options":["True","False"],"answer":1,"explain":"Urgency justifies direct award only when it is unforeseen and not attributable to the buyer entity; the CCM (or the Tenders Board from €184,000) decides.","hint":"Whose fault is the urgency?","stage":"Thresholds & Procedure"},{"level":5,"type":"order","q":"Put the steps for an extrabudgetary-funded €120,000 competitive bidding procedure in the correct order.","options":["CCM approves the tender documents","Launch: invite at least three suppliers, preferably via e-procurement","Send a Request for LCR to DLAPIL","Prepare the tender file and act of engagement from fresh DLAPIL templates","DLAPIL issues its visa (within about 5 working days)"],"answer":[3,2,4,0,1],"explain":"Between €55,000 and €184,000 on extrabudgetary funds, the LCR comes before CCM approval, and no procedure is launched without approval.","hint":"No approval, no launch; legal check before the CCM.","stage":"Authorise & Launch"},{"level":5,"type":"order","q":"Order the closing steps of an international public call for tenders.","options":["Notify unsuccessful bidders within 15 days","Tenders Board decides the award","Sign the contract with the winner after the PO is raised","Assessors score bids and the buyer entity submits a reasoned recommendation"],"answer":[3,1,2,0],"explain":"The Tenders Board awards international calls on the buyer entity's reasoned recommendation; you sign with the winner first, then notify the others within 15 days.","hint":"Sign with the winner first, then notify the others.","stage":"Negotiate & Award"},{"level":5,"type":"scenario","q":"What is the correct next step?","scenario":"An international call for €300,000 of event services, funded by the EU, produced three eligible offers, all well above the budget. The project still needs the services within six months.","options":["Negotiate prices directly with the cheapest bidder","Award to the cheapest bidder and reduce the scope in the contract","Send a memo to the Tenders Board explaining the failure and asking to negotiate, relaunch or cancel","Switch to a competitive bidding procedure under the CCM"],"answer":2,"explain":"Negotiation needs prior authorisation: for an international call the Tenders Board decides, on a memo justifying why the call failed and the option chosen.","hint":"Seek authorisation before negotiating.","stage":"Negotiate & Award"},{"level":5,"type":"scenario","q":"How should the buyer entity respond?","scenario":"Two days before the deadline of a €200,000 call, a bidder asks whether a lower minimum turnover would be accepted. Another bidder asks privately what an unclear specification means.","options":["Lower the turnover requirement for everyone and answer the second bidder privately","Refuse to change the criteria, and publish clarifications to all bidders no later than 48 hours before the deadline","Extend the deadline after it expires to allow new criteria","Answer each bidder individually by phone"],"answer":1,"explain":"Published criteria can never be changed; clarifications are allowed but must be given to all bidders equally, with the last answer at least 48 hours before the deadline.","hint":"Same answers to everyone; criteria are fixed once published.","stage":"Terms & Specifications"}],"grants":[{"level":1,"type":"tf","q":"A grant must both help the grantee attain its own objectives and advance the Council of Europe's values or policies.","options":["True","False"],"answer":0,"explain":"Under Rule 1374 the two purposes are cumulative: support for the grantee's goals and advancement of the Organisation's values or policies.","hint":"Are the two purposes alternatives or both required?","stage":"Foundations"},{"level":1,"type":"mc","q":"Which instrument does Rule 1374 implement?","options":["Article 43 bis of the Financial Regulations","Rule 1395 on procurement","The Staff Regulations","The Statute of the Council of Europe, Article 1"],"answer":0,"explain":"Grants are provided for by Article 43 bis of the Financial Regulations, which Rule 1374 implements.","hint":"Think of the Financial Regulations.","stage":"Foundations"},{"level":1,"type":"tf","q":"Rule 1374 applies only to grants financed from the Ordinary Budget.","options":["True","False"],"answer":1,"explain":"Rule 1374 applies to all grant procedures whatever the source of funding: Ordinary Budget, Voluntary Contributions and agreements with external donors.","hint":"Consider voluntary contributions and EU funds.","stage":"Foundations"},{"level":1,"type":"mc","q":"From what total estimated budget does a grant award procedure in principle require a call for proposals?","options":["€ 5,000","€ 10,000","€ 15,000","€ 50,000"],"answer":2,"explain":"Procedures of € 15,000 or more require, in principle, a competitive call for proposals (Rule 1374, Art. 2.1); below that a direct award with Template G9.2A is possible.","hint":"The same figure separates G9.2A from the competitive route.","stage":"Procedure"},{"level":2,"type":"mc","q":"Which principle requires the grantee to finance part of the action from its own or third-party resources?","options":["Non-cumulative awards","Co-financing","No profit","Transparency"],"answer":1,"explain":"The co-financing principle (Art. 2.3) means the Council does not fund the whole cost; it also distinguishes grants from service contracts.","hint":"It expresses the grantee's ownership of the action.","stage":"Principles"},{"level":2,"type":"tf","q":"Under the non-cumulative awards principle, the Council may award two different grants to the same project if each finances a different part of it.","options":["True","False"],"answer":1,"explain":"Art. 2.4 allows only one Council grant per project or action, even where the financed parts are complementary.","hint":"Count the Council grants, not the cost lines.","stage":"Principles"},{"level":2,"type":"mc","q":"Who reviews a complaint first, to check for a manifest error?","options":["The Review Board","The Commitments Officer","The Co-ordinator","The internal Auditor alone"],"answer":2,"explain":"Under Art. 15.4 the Co-ordinator makes an immediate preliminary examination for manifest error before any referral to the Review Board.","hint":"The person best able to grasp the file quickly.","stage":"Roles"},{"level":2,"type":"mc","q":"Who sits on the Review Board?","options":["Members of the Evaluation Committee","The Co-ordinator and Commitments Officer","Representatives of the internal Auditor, the Director of Legal Advice (DLAPIL) and the Treasurer","The Secretary General's private office"],"answer":2,"explain":"Art. 15.6: the Review Board comprises representatives of the internal Auditor, DLAPIL and the Treasurer, none involved in the contested evaluation.","hint":"Independence from the evaluation is key.","stage":"Roles"},{"level":3,"type":"mc","q":"What is the maximum share of indirect eligible costs in a grant?","options":["5% of the total","7% of the total","10% of the total","No ceiling if stated in the call"],"answer":1,"explain":"Art. 6.3 caps indirect costs at 7% of the total; the percentage must be stated in the call and made contractual in the agreement.","hint":"A single-digit ceiling.","stage":"Costs"},{"level":3,"type":"mc","q":"Which of the following is an ineligible cost?","options":["Staff costs directly needed for the project","Debts incurred before the grant was awarded","Travel within the implementation period, shown in the budget","Indirect costs at 5% stated in the agreement"],"answer":1,"explain":"Art. 7.1 lists debts and provisions for losses incurred before the award as ineligible, applying Art. 6.2 a) and non-retroactivity.","hint":"Look for the cost that predates the award.","stage":"Costs"},{"level":3,"type":"mc","q":"Which template is used for a call for proposals funded by EU funds?","options":["G8.1A","G8.1B","G9.2B","G17.2B"],"answer":1,"explain":"G8.1A is for the Ordinary Budget or Voluntary Contributions; G8.1B is the call template for EU funds (Art. 8).","hint":"B variants usually concern EU funds.","stage":"Call"},{"level":3,"type":"mc","q":"A grant financed by the EU is awarded. Which agreement template do you use?","options":["G17.2A","G17.2B","G8.1B","G9.2A"],"answer":1,"explain":"G17.2B is the grant agreement for EU funds; G17.2A is the grant agreement for the Ordinary Budget (BO) or Voluntary Contributions (VC). G8.1B is the call template and G9.2A the direct-award template.","hint":"Agreement templates are numbered G17; B variants concern EU funds.","stage":"Agreement"},{"level":4,"type":"scenario","q":"Which procedure applies?","scenario":"A department plans to award four grants of € 6,000 each to local NGOs for a youth campaign. The officer proposes four direct awards with Template G9.2A because each grant is under € 15,000.","options":["Fine: each award is below € 15,000","A call for proposals is required in principle: the € 24,000 total budget is what counts","Use G9.2B for each grant","Split into two procedures of € 12,000"],"answer":1,"explain":"The € 15,000 threshold refers to the total estimated budget of the procedure, not the amount per grantee (Art. 2.1), so a call (G8.1A) is required in principle.","hint":"Which figure is compared with the threshold?","stage":"Procedure"},{"level":4,"type":"scenario","q":"Can these costs be accepted?","scenario":"The call closed on 1 March and the agreement is signed on 1 May. The grantee started work on 15 April and claims costs incurred from 15 February, before the closing date.","options":["Yes, all costs since the project started","Only costs incurred after the closing date for submission; the February costs are ineligible","No: the project started before signature, so no grant can be signed","Yes, if the Commitments Officer approves in writing"],"answer":1,"explain":"Non-retroactivity (Art. 2.2.2) allows a project already begun at signature, but eligible costs cannot predate the closing date for proposals.","hint":"Separate the start of work from the date costs were incurred.","stage":"Principles"},{"level":4,"type":"scenario","q":"What is the issue with this request?","scenario":"An association asks for an operational grant to cover its running costs from January of one year to June of the next, i.e. 18 consecutive months, in a single agreement.","options":["None: operational grants have no duration limit","Operational grant agreements should not normally exceed twelve consecutive months","It must be turned into a service contract","It is allowed only if indirect costs exceed 7%"],"answer":1,"explain":"Rule 1374 states operational grants should not normally give rise to agreements longer than twelve consecutive months; G17.2A would cover a 12-month period.","hint":"Check the normal maximum duration for operational grants.","stage":"Foundations"},{"level":4,"type":"scenario","q":"Is this request for further information acceptable?","scenario":"During the eligibility check, the Co-ordinator asks an applicant to clarify a figure in its budget. The applicant replies with a revised budget adding a new activity and a higher co-financing rate, which would raise its score.","options":["Yes, clarification requests may improve proposals","Only the clarification may be taken into account; the substantive changes must be disregarded","Yes, if all applicants are offered the same chance","The proposal must be excluded automatically"],"answer":1,"explain":"Requests for further information must not alter a proposal's content; substantive changes breach non-discrimination (Art. 11–12, report on G14.1).","hint":"Clarify versus modify.","stage":"Eligibility Check"},{"level":5,"type":"order","q":"Put these steps of a competitive grant procedure (€ 15,000 or more) in the correct order.","options":["Opening of proposals (G11.1)","Appointment of the Co-ordinator (G3.1)","Decision of the Commitments Officer (G14.6)","Publication of the call for proposals (G8.1A/B)","Assessment by the Evaluation Committee (G14.1/G14.3/G14.4)"],"answer":[1,3,0,4,2],"explain":"The guide's summary: Co-ordinator (G3.1), call (G8.1A/B), questions, Evaluation Committee, opening (G11.1), assessment (G14.x), CCM decision (G14.6), then notification.","hint":"Someone must run the procedure before anything is published.","stage":"Procedure"},{"level":5,"type":"order","q":"Put the steps of the enquiry and complaint route of an unsuccessful applicant in order.","options":["Complaint lodged within 30 calendar days of the reply to the enquiry","Review Board examines the complaint and issues an opinion (G15.7)","Enquiry within the deadline stated in letter G14.9A/B (minimum 7 days)","Co-ordinator's preliminary check for manifest error"],"answer":[2,0,3,1],"explain":"Art. 15: an enquiry must precede a complaint; the Co-ordinator checks for manifest error first, and only otherwise refers it to the Review Board (opinion G15.7).","hint":"No complaint without a prior enquiry.","stage":"Complaints"},{"level":5,"type":"scenario","q":"How should this amendment request be handled?","scenario":"Halfway through a € 40,000 project grant under G17.2A, the grantee asks by email to extend the deadline by two months and to raise the grant to € 48,000 to cover unexpected price rises.","options":["Accept both through a G17.3 amendment","The extension may be agreed in writing (e.g. G17.3 or email); the increase in the total amount must be refused","Refuse both: grant agreements can never be amended","Accept the increase, as it is below 20%"],"answer":1,"explain":"Art. 17.3: amendments may cover management aspects such as deadlines, but the total amount must not be increased, to avoid distorting the original competition.","hint":"Management details versus the conditions of the award.","stage":"Agreement"},{"level":5,"type":"scenario","q":"What is the correct handling of this complaint?","scenario":"An unsuccessful applicant, after receiving the reply to its enquiry, complains that one published award criterion was worded unfairly. It does not challenge how its proposal was examined.","options":["Refer it to the Review Board for a fresh evaluation","Declare it inadmissible (G15.3A): only the way the proposal was examined can be contested","Ask the Evaluation Committee to reweight the criterion","Forward it to the internal Auditor as an allegation of misconduct"],"answer":1,"explain":"Under Art. 15.3 a complaint against the wording of published criteria, rather than their application, is inadmissible (Template G15.3A); published criteria cannot be altered.","hint":"What may a complaint actually contest?","stage":"Complaints"}]},"scenarios":[{"cat":"procurement","level":"basic","title":"€1,800 general services","q":"Which route is the normal starting point?","opts":["Direct Award","Competitive Bidding","International Public Call"],"correct":0,"feedback":"The amount is within the low-value direct-award limit for goods/general services/works. Always assess the full foreseeable need rather than splitting it."},{"cat":"procurement","level":"basic","title":"€5,500 intellectual service","q":"Which route is the normal starting point?","opts":["Direct Award","Competitive Bidding","International Public Call"],"correct":0,"feedback":"Intellectual services remain within the low-value direct-award limit up to €6,000. The full foreseeable need must still be assessed."},{"cat":"procurement","level":"basic","title":"€72,000 consultancy · extrabudgetary funding","q":"Which procurement route should you expect?","opts":["Direct Award","Competitive Bidding + applicable Legal Compliance Review","International Public Call"],"correct":1,"feedback":"The value is above the low-value limit and below the international threshold. In the applicable extrabudgetary/mixed-funding band, the additional legal-compliance control forms part of the route."},{"cat":"procurement","level":"advanced","title":"Three related purchases of €1,900 each","q":"Can the need be treated as three separate low-value procurements?","opts":["Yes, each invoice is below €2,000","No, assess the full foreseeable procurement need","Yes, if different staff request them"],"correct":1,"feedback":"Thresholds are based on the full foreseeable procurement need, not invoice-by-invoice or requester-by-requester."},{"cat":"procurement","level":"advanced","title":"€190,000 foreseeable need","q":"Which procedure should be planned?","opts":["Competitive Bidding","International Public Call for Tenders","Direct Award with justification"],"correct":1,"feedback":"At or above the €184,000 threshold, the international public-call route applies."},{"cat":"procurement","level":"advanced","title":"Bid missing a non-essential item","q":"What is the safest next step when the missing information is genuinely non-essential?","opts":["Automatically reject","Use clarification without changing the offer","Let the bidder submit a new price"],"correct":1,"feedback":"Clarification can address non-essential missing information, but it must not alter the substance of the submitted offer."},{"cat":"forecast","level":"basic","title":"JP · one Budget Heading changes by +12%","q":"What is the formal route after the forecast review?","opts":["Notification","Addendum","No forecast needed"],"correct":0,"feedback":"For a Joint Programme, a relevant Budget Heading/subtotal variation within ±25% follows the Notification route."},{"cat":"forecast","level":"basic","title":"JP · one Budget Heading moves by +28%","q":"What formal route follows the forecast review?","opts":["Notification","Addendum","No formal action"],"correct":1,"feedback":"For a Joint Programme, assess the relevant Budget Heading/subtotal. A movement beyond ±25% follows the Addendum route."},{"cat":"forecast","level":"basic","title":"JP · all relevant Budget Headings remain within ±25%","q":"What is the formal route?","opts":["Notification","Addendum","Direct Award"],"correct":0,"feedback":"The forecast is still prepared; the formal route is Notification when all relevant subtotal variations remain within the threshold."},{"cat":"forecast","level":"advanced","title":"Forecast includes an extension of the project","q":"Which route governs?","opts":["Notification","Addendum","No formal route"],"correct":1,"feedback":"An extension is a contractual change and follows the Addendum route."},{"cat":"forecast","level":"advanced","title":"Forecast changes total project cost","q":"Which route governs?","opts":["Notification","Addendum","Only an internal email"],"correct":1,"feedback":"A change in total cost requires the Addendum route."},{"cat":"forecast","level":"advanced","title":"Multiple changes: +10% reallocation plus project extension","q":"How should the package be handled?","opts":["Separate Notification and Addendum packages","One consolidated exercise; Addendum route governs","Ignore the reallocation"],"correct":1,"feedback":"Use one consolidated revised-budget exercise. If any selected change directly requires an Addendum, the Addendum route governs the package."},{"cat":"grant","level":"basic","title":"Grant procedure · total budget €12,000","q":"What is the normal starting route?","opts":["Direct Award","Competitive Call","International Tender"],"correct":0,"feedback":"Below €15,000, the grant procedure starts with the Direct Award route."},{"cat":"grant","level":"basic","title":"Grant procedure · total budget €18,000","q":"Which route should be used as the starting point?","opts":["Below-threshold Direct Award","Competitive Call","Petty Cash"],"correct":1,"feedback":"The threshold is assessed on the total procedure budget. At €18,000 the Competitive Call route is the normal starting point unless a permitted exception applies."},{"cat":"grant","level":"basic","title":"Grant threshold question","q":"Which amount determines the route?","opts":["Amount per individual grantee","Total procedure budget","First instalment only"],"correct":1,"feedback":"The relevant threshold is the total budget of the grant procedure, not the amount awarded to each individual grantee."},{"cat":"grant","level":"advanced","title":"€22,000 grant with a permitted exception","q":"Which route can apply when the exception is properly supported?","opts":["Exceptional Direct Award","Petty Cash","Procurement Competitive Bidding"],"correct":0,"feedback":"At or above €15,000, a permitted and properly justified exception can lead to the Exceptional Direct Award route."},{"cat":"grant","level":"advanced","title":"Evaluation begins before eligibility is checked","q":"What should be corrected?","opts":["Nothing","Apply the gates in sequence before award scoring","Score price first"],"correct":1,"feedback":"Evaluation should preserve the required sequence and traceability: admissibility/exclusion/eligibility controls before the award assessment as applicable."},{"cat":"grant","level":"advanced","title":"Grant activity already completed before signature","q":"What is the core concern?","opts":["Non-retroactivity / implementation-period compliance","Only exchange rate","Only procurement threshold"],"correct":0,"feedback":"The financed action should not already be completed; implementation timing must match the permitted period set in the grant arrangement."},{"cat":"yearend","level":"basic","title":"Service delivered in December · invoice arrives in January","q":"Which year-end issue should be assessed?","opts":["Ignore until payment","Accrual / correct-year recognition","Record as next-year delivery"],"correct":1,"feedback":"The key question is when the service was delivered/rendered, not when cash is paid. The delivered portion belongs to the correct financial year and may require an accrual."},{"cat":"yearend","level":"basic","title":"Goods delivered in January","q":"Should this be recorded as prior-year expenditure?","opts":["Yes, if the PO was created earlier","No, delivery is in the new year","Yes, if supplier invoiced in December"],"correct":1,"feedback":"The financial year follows delivery/performance. A January delivery is not prior-year expenditure."},{"cat":"yearend","level":"basic","title":"2026 delivery and invoice available","q":"When can the PO be finalised?","opts":["Only after cash payment","Once expenditure is recorded and the billed/invoice status is checked","Never before March"],"correct":1,"feedback":"Finalisation is linked to the expenditure being recorded in FIMS/Fiche PO and the billing/invoice status being checked; it does not require waiting for cash payment."},{"cat":"yearend","level":"advanced","title":"Cross-year service · invoice covers both years","q":"What is the correct approach?","opts":["Charge the full invoice to the earlier year","Split according to the service/delivery periods","Charge everything to payment year"],"correct":1,"feedback":"Allocate the expenditure according to when the service was rendered. The later-year share follows the applicable prepaid/CCA treatment where relevant."},{"cat":"yearend","level":"advanced","title":"Cross-year service · no invoice at closing","q":"What should be accrued?","opts":["The full future contract value","Only the portion delivered/rendered in the closing year","Nothing"],"correct":1,"feedback":"Only the part delivered/rendered in the closing year is accrued. The later-year portion is not a prior-year provision."},{"cat":"yearend","level":"advanced","title":"Annual-budget PO for next-year delivery","q":"What is the operational direction?","opts":["Keep everything as prior-year expenditure","Close/finalise the prior-year PO as appropriate and arrange the new-year PO","Pay before delivery"],"correct":1,"feedback":"For annual-budget treatment, next-year delivery requires the appropriate new-year PO/treatment rather than being charged to the closing year."},{"cat":"payment","level":"basic","title":"Invoice received but no delivery/acceptance evidence","q":"Is the payment file ready?","opts":["Yes, invoice is sufficient","No, confirm delivery/acceptance first","Yes if supplier is known"],"correct":1,"feedback":"A payment file needs evidence that the goods/services/deliverables were received and accepted, not only the invoice."},{"cat":"payment","level":"basic","title":"PO request has no contractual/procurement basis","q":"What should happen before the PO is created?","opts":["Create the PO anyway","Complete the applicable procurement/contract basis","Ask the supplier to invoice"],"correct":1,"feedback":"The PO must be supported by the applicable procurement and contractual basis before financial commitment is completed."},{"cat":"payment","level":"basic","title":"Payment follows an approved PO","q":"Does the approval route restart from zero?","opts":["Yes, always","No, payment continues from the established contractual/PO basis and adds payment controls","Only for known suppliers"],"correct":1,"feedback":"Payment should remain linked to the approved contractual and PO trail; it adds delivery, invoice and payment checks rather than rebuilding the whole case."},{"cat":"payment","level":"advanced","title":"Invoice amount differs from contract / PO","q":"What is the first control?","opts":["Pay and correct later","Reconcile the invoice against the contractual and PO basis","Ignore small differences"],"correct":1,"feedback":"Resolve mismatches before payment. The invoice, accepted delivery and contractual/PO basis should align or be formally explained and corrected."},{"cat":"payment","level":"advanced","title":"Supplier bank details changed just before payment","q":"What is the safer approach?","opts":["Use the email immediately","Verify the change through the controlled supplier/bank-data process before payment","Split the payment"],"correct":1,"feedback":"A late bank-detail change is a payment-risk flag and should be independently verified through the controlled process before funds are released."},{"cat":"payment","level":"advanced","title":"Work starts before contract signature","q":"What is the control issue?","opts":["None if the supplier agrees","The contract should be in place before work starts, with the budgetary commitment/PO arranged as required","Only filing is affected"],"correct":1,"feedback":"The operational sequence should establish the contract and required budgetary commitment before execution starts."},{"cat":"reporting","level":"basic","title":"Starting a financial report","q":"What is the best first focus?","opts":["Current financial position and reconciliation","Future procurement only","Grant evaluation"],"correct":0,"feedback":"A financial report starts from the current financial position: gather the data, reconcile and structure the report before finalising."},{"cat":"reporting","level":"basic","title":"Report figures do not reconcile","q":"What should happen before finalisation?","opts":["Submit and explain later","Resolve the reconciliation difference","Move the difference to forecast"],"correct":1,"feedback":"A report should be reconciled before it is structured and finalised. Unexplained differences weaken reliability and the audit trail."},{"cat":"reporting","level":"basic","title":"Future expenditure needs to be revised","q":"Which companion process is relevant?","opts":["Forecast / Budget Revision","Petty Cash","Mission Claim"],"correct":0,"feedback":"Reporting explains where the project is now; forecast/budget revision addresses where expenditure is going and what needs to change."},{"cat":"reporting","level":"advanced","title":"A correction changes forecast figures after review","q":"What should happen?","opts":["Keep the old route decision automatically","Correct the figures and reassess the formal route if the change affects it","Delete the forecast"],"correct":1,"feedback":"When comments change figures, return to the working file, correct it and reassess the Notification/Addendum route if thresholds or contractual changes are affected."},{"cat":"reporting","level":"advanced","title":"Working forecast file is still with Project Team","q":"Should the working file already be sent to DPC HQ?","opts":["Yes","No, wait until the working cycle is completed and the clean package is prepared","Only if under 25%"],"correct":1,"feedback":"Keep the working file within the internal review cycle until it returns and the clean version is prepared for the applicable final route."},{"cat":"reporting","level":"advanced","title":"VC at AP level","q":"Is donor acceptance automatically required for the budget revision?","opts":["Yes in every VC","No, AP-level VC does not automatically require donor acceptance","Only below 25%"],"correct":1,"feedback":"For AP-level VC, donor acceptance is not automatically required. Specific earmarked arrangements can have a different contractual requirement."},{"cat":"mission","level":"basic","title":"Mission has not yet been authorised","q":"Should travel be treated as ready to proceed?","opts":["Yes, expense claim can fix it later","No, complete the Mission Order / authorisation route first","Only if travel is cheap"],"correct":1,"feedback":"The mission workflow starts with authorisation. The later Expense Claim reimburses actual eligible expenses; it does not replace prior authorisation."},{"cat":"mission","level":"basic","title":"Mission is completed","q":"What is the next connected workflow?","opts":["Start a new Mission Order","Prepare the Expense Claim with supporting evidence","Procurement evaluation"],"correct":1,"feedback":"After the mission takes place, the process moves to the Expense Claim and reimbursement evidence."},{"cat":"mission","level":"basic","title":"Expense claim lacks travel evidence","q":"Is the file complete?","opts":["Yes","No, add the supporting travel/expense evidence","Only approval matters"],"correct":1,"feedback":"The claim should be supported by the relevant travel and expense evidence so the reimbursement trail is complete."},{"cat":"mission","level":"advanced","title":"Mission details change after authorisation","q":"What is the safest approach?","opts":["Ignore the change","Document and obtain the required update/approval before relying on the changed arrangement","Only change the expense claim"],"correct":1,"feedback":"Material changes should remain traceable and follow the applicable update/approval route rather than appearing for the first time at reimbursement stage."},{"cat":"mission","level":"advanced","title":"Expense is claimed with no link to the authorised mission","q":"What is the core control?","opts":["Check the link, eligibility and supporting evidence before reimbursement","Pay if amount is small","Move it to petty cash"],"correct":0,"feedback":"The claim should reconcile to the authorised mission and be supported by eligible, traceable evidence."},{"cat":"mission","level":"advanced","title":"Mission file is approved but evidence is stored separately","q":"What improves audit readiness?","opts":["Keep approvals and expense evidence linked in one traceable file trail","No action","Delete duplicate references"],"correct":0,"feedback":"Audit readiness improves when authorisation, execution evidence, claim, approvals and reimbursement can be followed as one connected trail."},{"cat":"filing","level":"basic","title":"Procurement file is complete except the approval evidence","q":"Is the audit trail complete?","opts":["Yes, the contract is enough","No, approval evidence is part of the decision trail","Only invoice matters"],"correct":1,"feedback":"A complete file shows not only the final contract but also who checked/approved the route and when."},{"cat":"filing","level":"basic","title":"Final record location","q":"Where should the final record live?","opts":["Only in personal email","In the controlled DMS/project-file location with a traceable structure","On a local desktop only"],"correct":1,"feedback":"The final record should be maintained in the controlled project/DMS location so the evidence trail remains accessible and auditable."},{"cat":"filing","level":"basic","title":"Decision trail","q":"What evidence should explain why a route was chosen?","opts":["Decision / justification evidence","Only payment confirmation","Only supplier marketing material"],"correct":0,"feedback":"The file should preserve the reasoning for the route or decision, together with the resulting approvals and execution evidence."},{"cat":"filing","level":"advanced","title":"Tender file has evaluation scores but no conflict-of-interest declarations","q":"What is missing?","opts":["Nothing","A key integrity/control part of the evaluation trail","Only a payment document"],"correct":1,"feedback":"Evaluation files should preserve the integrity trail, including the relevant declarations, authorisations and assessment record."},{"cat":"filing","level":"advanced","title":"Contract was amended but only the original contract is filed","q":"What should be added?","opts":["The amendment, its justification/approval and related correspondence","Nothing","Only the new invoice"],"correct":0,"feedback":"The file should show the complete contractual history, including amendments, supporting reasoning, approvals and execution evidence."},{"cat":"filing","level":"advanced","title":"Audit asks how an amount moved from decision to payment","q":"What should the file make possible?","opts":["A traceable chain from decision → approval → contract/PO → delivery → invoice → payment","Only the final bank transaction","Only the tender notice"],"correct":0,"feedback":"An audit-ready file lets a reviewer follow the full evidence chain without reconstructing it from disconnected sources."}],"glossary":[["ACCM","Finance support role","Checks financial and file completeness, supports the budgetary commitment and creates the PO or mission order when the file is ready."],["AoE","Act of Engagement","Contractual document signed by the supplier/consultant, used with the Order Form (e.g. for direct awards)."],["AWP","Activities Work Plan","Approved plan of activities. Once approved, it allows limited flexibility above the activity budget; it should cover the implementation period and be reviewed periodically."],["CCA","Prepaid expense","The part of a split 2026–2027 service charged to the next year under the year-end allocation table."],["CCM","Commitments Officer","Exercises expenditure and procurement approval within the applicable delegation; validates POs, authorises negotiation in competitive bidding, approves petty cash before spending."],["DLAPIL","Legal compliance review","Provides the Legal Compliance Review required before CCM approval for extrabudgetary or mixed funding from €55,000 to below €184,000, and advises on changes to legal contractual clauses."],["DMS","Document Management System","Where the project file is organised: contract documents, activities, POs, signed and editable versions together."],["FA","Framework agreement","Pool of preselected suppliers; each specific need is awarded through a mini-competition (call-off). Generally up to 4 years."],["FC","Framework contract","Recurring need with definable units and fixed unit prices; orders are placed with order forms. Generally up to 4 years."],["FIMS","Financial system","System where expenditure is recorded; check “Amount billed” / “Invoices” on the Fiche PO before finalising a PO."],["JP","Joint Programme","Jointly funded programme. A Budget Heading variation above ±25%, or a change in total cost, duration or scope, requires an Addendum."],["OB","Ordinary Budget","Organisation's regular budget. Petty cash invoices may not exceed €50 each."],["PO","Purchase order","Financial commitment. No activity should start until the PO is opened, signatures are collected and the provider holds the countersigned documents."],["ToR","Terms of Reference","Specification of the requirement: context, objective, deliverables, timing and technical requirements."],["VC","Voluntary Contribution","Voluntary funding; budget revisions follow the VC route, with donor acceptance where funding is earmarked."],["XB","Extrabudgetary funding","Funding outside the Ordinary Budget. From €55,000 it adds a Legal Compliance Review before CCM approval."],["Addendum","Formal contract amendment","Contractual revision of a JP budget/agreement requiring external acceptance before implementation."],["Notification","Formal notification route","JP budget change route where every relevant Budget Heading stays within ±25% and no contractual element changes."],["Budget Heading","Budget subtotal","Grouping of budget lines (e.g. 1 Human resources, 2 Travel). The ±25% test is applied at this level, not to the project total."],["Tenders Board","Governance body","Authorises launch, negotiation and award for international public calls for tenders (≥ €184,000)."]],"limits":{"lowGoods":2000,"lowIntellectual":6000,"legalReview":55000,"international":184000,"publicPrices":10000,"grant":15000,"heading":25},"lifecycle":[{"title":"Financial Reporting","question":"Where are we now?","lead":"Establish the current financial position before making any forward-looking decision.","learn":"Actual expenditure, commitments and the current reporting position.","output":"Up-to-date Financial Report","next":"Continue to Forecast","action":"openFomaAdvanced('Forecast')"},{"title":"Forecast","question":"Where will we be at project end?","lead":"Build the expected financial position using actual, committed and planned expenditure.","learn":"Staff, office and activity expenditure through the remaining implementation period.","output":"Forecast at Completion","next":"Open Forecast workflow","action":"openFomaAdvanced('Forecast')"},{"title":"Variance & Review","question":"Does the current budget still work?","lead":"Compare the forecast with the approved/current budget before deciding whether a change is necessary.","learn":"Savings, pressure points, overspend risk and movements between Budget Headings.","output":"Variance picture / change need","next":"Review proposed changes","action":"openForecastAtPage('start')"},{"title":"Change Assessment","question":"What needs to change?","lead":"Identify all changes together rather than treating each one as an isolated process.","learn":"Reallocation, new budget line, total-cost change, extension and scope/objective change.","output":"Consolidated change assessment","next":"Assess change & route","action":"openForecastAtPage('start')"},{"title":"Decision","question":"Does it require formal action?","lead":"Determine the applicable formal route only after the revised financial picture is clear.","learn":"JP route logic and the separate VC funding/acceptance route.","output":"No action / Notification / Addendum / VC route","next":"Open route decision","action":"openForecastAtPage('route')"},{"title":"Prepare & Submit","question":"What do I need to prepare?","lead":"Turn the confirmed route into a complete donor-facing package and send it through the correct validation chain.","learn":"Revised Budget, Variation, justification, Budget Proposal, validation and submission.","output":"Validated formal package","next":"Open completion steps","action":"openForecastAtPage('finalise')"},{"title":"Update & Follow-up","question":"What happens afterwards?","lead":"Close the change by updating the project baseline and records used for the next reporting cycle.","learn":"PMM, Delegation Letter, Fiche Staff and retained approval evidence.","output":"Updated project baseline","next":"Return to reporting cycle","action":"setFinancialReportTab('Workflow')"}],"concepts":[{"icon":"FR","tone":"blue","title":"Financial Report","q":"Where are we now?","definition":"The controlled view of the project’s current financial position, built from actual expenditure, commitments and the available financial information.","purpose":"Establish a reliable baseline before any forward-looking planning or budget change is introduced.","when":"Use the latest reconciled Financial Report as the starting point for the Forecast & Budget Revision exercise.","output":"Up-to-date, controlled Financial Report"},{"icon":"↗","tone":"green","title":"Forecast","q":"Where are we going?","definition":"The forward-looking financial picture that combines the current position with expected expenditure for the remaining implementation period.","purpose":"Estimate where the project is expected to finish financially and identify future funding pressures, savings or implementation needs.","when":"Prepare it after the current financial position is established and before the formal route is determined.","output":"Reviewed FORECAST working file"},{"icon":"Δ","tone":"amber","title":"Budget Revision","q":"What needs to change?","definition":"The controlled revision of the approved budget structure or figures when implementation no longer fits the current financial plan.","purpose":"Translate identified implementation changes into a revised budget that can be reviewed, justified and formally processed.","when":"Use it when the Forecast identifies reallocations, new budget lines, total-cost changes, an extension or changes in scope, purpose or objectives.","output":"Revised Budget + Variation / Budget Proposal package"},{"icon":"→","tone":"violet","title":"Formal Route","q":"What happens after review?","definition":"The formal action required once the revised budget and proposed changes have been reviewed.","purpose":"Determine the applicable approval, acceptance and documentation route for the revised project budget.","when":"For Joint Programmes, route logic leads to Notification or Addendum; for Voluntary Contributions, the applicable donor-acceptance route is used.","output":"Confirmed Notification / Addendum / VC route"}],"factNotes":{"procurement":{"Foundations":{"0":{"what":"The Council applies a no-gift policy: staff involved in procurement or grants cannot receive any gifts or hospitality from current or prospective contractors, whatever their value.","why":"Accepting even a small gift breaches the Code of Conduct and can lead to disciplinary sanctions and tainted procedures.","ref":"1.1.2"},"Rule No. 1395":{"what":"Rule No. 1395 of 20 June 2019 complements the Financial Regulations and lays down the details of every procurement procedure, from tender file to contract signature.","why":"All Council of Europe purchases must follow one of its procedures; an annotated version on the Tenders Board page answers recurring questions.","ref":"1.1.1"},"31 January":{"what":"Staff involved in procurement must submit a declaration of interests each year by the end of January, or within one month of any change or of taking up duties.","why":"The declaration (Rule No. 1282) is checked in audits and protects you and the procedure from conflict-of-interest challenges.","ref":"1.1.2"}},"Roles & Funding":{"€184,000":{"what":"The Tenders Board ensures compliance with the competitive tendering rules for all contracts exceeding €184,000 excluding VAT.","why":"Above this amount the Board must authorise the procedure beforehand; it cannot approve an international call retroactively.","ref":"2.2.2"},"€55,000–€184,000":{"what":"Since 1 February 2025, competitive bidding and direct award procedures funded wholly or partly by extrabudgetary funds between €55,000 and €184,000 excl. VAT need a DLAPIL Legal Compliance Review.","why":"The CCM or Commitments Officer may only approve the launch once the review is completed, so plan for it in your timetable.","ref":"2.2.2"},"48 h":{"what":"The Procurement Unit (procurement@coe.int) operates a 48-hour service level for providing an initial response to queries.","why":"Contact them early: a first answer comes within two days, but complex advice may take longer than your deadlines allow.","ref":"2.2.3"}},"Market & Suppliers":{"3":{"what":"In a competitive bidding procedure the buyer entity must invite at least three potential suppliers to submit an offer (Rule 1395, Article 21.2).","why":"The three must be meaningful candidates able to deliver good bids; inviting suppliers just to reach the number defeats competition.","ref":"4.3.2"},"50,000+":{"what":"FIMS already holds over 50,000 supplier entries, but the renewal rate of active suppliers is very low.","why":"Relying only on known suppliers limits competition; actively look for new bidders through market research and CEIs.","ref":"4.3.1"},"Art. 5":{"what":"Under Article 5 of Rule 1395 a call for expressions of interest seeks interest from capable suppliers and is explicitly not a procurement procedure.","why":"A CEI only builds a list of potential suppliers; a contract still requires a proper procurement procedure afterwards.","ref":"4.3.2"}},"Define the Need":{"2 years":{"what":"For Ordinary Budget purchases, needs should be assessed over the whole two-year budget cycle when defining the requirement and threshold.","why":"Splitting similar needs across the cycle risks applying the wrong threshold and procedure.","ref":"4.4"},"Whole project":{"what":"For co-operation projects, foreseeable similar needs must be assessed over the whole project duration, including possible project extensions.","why":"Ignoring extensions can push spending above the threshold of the procedure used, a serious breach of the rules.","ref":"4.4"},"3 weeks":{"what":"Under an international public call for tenders, the submission deadline cannot be shorter than three weeks from publication.","why":"Higher-threshold procedures also need several validations, so build this minimum publication time into your planning.","ref":"4.6.3"}},"Contract Types":{"3":{"what":"Framework agreements are always multiple, and a minimum of three suppliers per lot (or per agreement without lots) is recommended.","why":"Fewer suppliers undermines the mini-competition that m
